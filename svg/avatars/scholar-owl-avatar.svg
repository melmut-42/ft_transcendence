<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 734 748" role="img" aria-labelledby="owl-title owl-description">
  <title id="owl-title">Scholar owl avatar</title>
  <desc id="owl-description">A warm brown owl wearing round blue glasses, a graduation cap, a rust-colored bow tie, and a diamond-patterned golden vest, inside a brown and gold circular frame.</desc>
