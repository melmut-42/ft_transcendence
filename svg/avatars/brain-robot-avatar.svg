<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 715 702" role="img" aria-labelledby="brain-robot-title brain-robot-description">
  <title id="brain-robot-title">Glass-dome brain robot avatar</title>
  <desc id="brain-robot-description">A silver robot with luminous cyan eyes and circuitry, a turquoise brain under a transparent glass dome, and a teal circular frame.</desc>
