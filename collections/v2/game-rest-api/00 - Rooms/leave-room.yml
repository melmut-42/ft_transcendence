http:
  method: DELETE
  url: "{{baseUrl}}/api/{{gameApiVersion}}/rooms/{{roomId}}/members/me"
  headers: []
docs: |-
  # Leave room

  ## Purpose and preconditions

  Removes the authenticated member in every room status. Leaving during `IN_GAME` never assigns an automatic loss. The server instead checks whether both teams still contain at least one Spymaster and one Operative.

  ## Request parameters

  | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |
  | --- | --- | ---: | --- | --- | ---: | --- | --- |
  | `room_id` | path | yes | integer | positive | no | Room to leave | `1001` |
  | `ft_session` cookie | request cookie | yes | string | active JWT access credential | no | Departing member | set by Register/Login |

  ## Success and state changes

  `204 No Content` clears the user's active room.

  - **`WAITING` / `COUNTDOWN` / `POST_GAME`:** emits `room.player.left`; countdown is cancelled when a participating departure invalidates start conditions.
  - **`IN_GAME`:** a spectator departure has no gameplay effect. A participant departure keeps play running if both teams remain valid. Otherwise it emits `game.staffing.required`, preserves game state, changes phase to `PAUSED_FOR_PLAYERS`, and starts a 120-second deadline for each deficient team. If staffing is restored, `game.staffing.restored` resumes play. Deadline expiry emits `game.cancelled` with `INSUFFICIENT_PLAYERS`, no winner, and no statistics update.
  - **Empty room:** the room remains active with `host_user_id:null` for 300 seconds. A join cancels closure; otherwise `room.closed` is emitted internally at `close_at` and the code becomes reusable.

  In every branch, the departing member immediately loses access to the Chat v2 `ROOM` channel. `game.ended` also removes ROOM access from every remaining member entering `POST_GAME`. Stored messages remain retained but inaccessible.

  ## Errors

  `401 UNAUTHORIZED`, `404 ROOM_NOT_FOUND`, `403 NOT_ROOM_MEMBER`. `IN_GAME` is not an error case. Errors do not change membership.
examples:
  - name: Success - Member leaves waiting room
    request: {url: "{{baseUrl}}/api/{{gameApiVersion}}/rooms/1001/members/me", method: DELETE, headers: [], params: [], body: {mode: none}}
    response: {status: 204, headers: [], body: {type: text, data: ""}}
  - name: Success - Host leaves and ownership transfers
    request: {url: "{{baseUrl}}/api/{{gameApiVersion}}/rooms/1001/members/me", method: DELETE, headers: [], params: [], body: {mode: none}}
    response: {status: 204, headers: [], body: {type: text, data: ""}}
  - name: Success - Leave during IN_GAME rechecks staffing
    request: {url: "{{baseUrl}}/api/{{gameApiVersion}}/rooms/1001/members/me", method: DELETE, headers: [], params: [], body: {mode: none}}
    response: {status: 204, headers: [], body: {type: text, data: ""}}
  - name: Error - Not a room member
    request: {url: "{{baseUrl}}/api/{{gameApiVersion}}/rooms/1001/members/me", method: DELETE, headers: [], params: [], body: {mode: none}}
    response: {status: 403, headers: [{name: Content-Type, value: application/json}], body: {type: json, data: '{"error":{"code":"NOT_ROOM_MEMBER","message":"User 47 is not a member of room 1001.","details":{"room_id":1001,"user_id":47}}}'}}
