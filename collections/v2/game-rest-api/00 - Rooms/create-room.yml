info:
  name: Create room
  type: http
  seq: 1
  tags: [rooms, smoke]
http:
  method: POST
  url: "{{baseUrl}}/api/{{gameApiVersion}}/rooms"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "max_players": 8
      }
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201 && res.body && res.body.data) {
          bru.setVar("roomId", String(res.body.data.room_id));
        }
    - type: tests
      code: |-
        test("creator is joined as unconfigured host", function () {
          expect(res.status).to.equal(201);
          expect(res.body.data.status).to.equal("WAITING");
          expect(res.body.data.players[0].is_host).to.equal(true);
          expect(res.body.data.players[0].team).to.equal(null);
          expect(res.body.data.players[0].role).to.equal(null);
          expect(res.body.data.players[0].ready).to.equal(false);
          expect(res.body.data.players[0].state).to.equal("IN_LOBBY");
          expect(res.body.data.room_code).to.match(/^[A-Z0-9]{6}$/);
        });
docs: |-
  # Create room

  ## Purpose and preconditions

  Creates a `WAITING` room, joins the authenticated creator, and makes that member host. The user must not already belong to any active room.

  ## Request parameters

  | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |
  | --- | --- | ---: | --- | --- | ---: | --- | --- |
  | `ft_session` cookie | request cookie | yes | string | active JWT access credential | no | Creating user | set by Register/Login |
  | `Accept` | header | yes | string | `application/json` | no | Requested response media type | `application/json` |
  | `max_players` | body | no | integer | `4..8`, default `8` | no | Room capacity | `8` |

  The body is optional; an empty or absent body creates a room with `max_players: 8`. Passwords, timers, and custom boards are not contract features.

  ## Response fields

  | Field | Type | Required | Nullable | Allowed values | Description |
  | --- | --- | ---: | ---: | --- | --- |
  | `data.room_id` | integer | yes | no | positive | Internal room ID, used as the WebSocket/REST path key |
  | `data.room_code` | string | yes | no | `^[A-Z0-9]{6}$`, unique among active rooms | Human-shareable join code shown in the Join Room UI |
  | `data.status` | string enum | yes | no | `WAITING` | Initial lifecycle state |
  | `data.host_user_id` | integer | yes | no | creator ID | Current host |
  | `data.player_count` | integer | yes | no | `1` | Current membership count |
  | `data.max_players` | integer | yes | no | `4..8` | Room capacity; joins are rejected once `player_count` reaches it |
  | `data.startable` | boolean | yes | no | `false` | Full start predicate result |
  | `data.players[]` | array<object> | yes | no | one creator | Members in join order |
  | `data.players[].user_id` | integer | yes | no | positive | Member ID |
  | `data.players[].username` | string | yes | no | username rule | Member username |
  | `data.players[].avatar_url` | string | yes | no | same-origin URL | Current avatar for lobby rendering |
  | `data.players[].team` | enum or null | yes | yes | `RED`, `BLUE`, `null` | Temporary team |
  | `data.players[].role` | enum or null | yes | yes | `SPYMASTER`, `OPERATIVE`, `null` | Temporary role |
  | `data.players[].ready` | boolean | yes | no | `false` | Readiness |
  | `data.players[].state` | string enum | yes | no | `IN_LOBBY` | Recipient-independent member lifecycle state |
  | `data.players[].is_host` | boolean | yes | no | `true` | Host marker |
  | `data.players[].joined_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Used for host transfer |
  | `data.game` | object or null | yes | yes | `null` | No game before countdown completes |
  | `data.created_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Room creation time |

  ## State changes and events

  Sets the user's `active_room_id` and durably records an outbox event keyed by `room_id`. Channel Service consumes it and idempotently provisions exactly one Chat v2 `ROOM` channel. Room creation does not roll back when Chat infrastructure is temporarily unavailable; the outbox retries until delivery. The frontend treats room chat as provisioning until `chat.channel.available` arrives or the channel appears in `GET /api/v2/channels`. There is no client create-room-channel request. Repeated delivery for the same `room_id` returns the same channel and never creates a duplicate.

  `room_code` is generated server-side, is not reused while the room is active, and is the value shown to the room creator to share for Join Room. See `Lookup room by code` for how another client resolves it back to `room_id`.

  ## Errors

  `401 UNAUTHORIZED`; `409 ALREADY_IN_ROOM`; `422 VALIDATION_ERROR` when `max_players` is not an integer in `4..8`. None creates a room.
examples:
  - name: Success - Newly created room
    request: {url: "{{baseUrl}}/api/{{gameApiVersion}}/rooms", method: POST, headers: [], params: [], body: {mode: none}}
    response:
      status: 201
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "data": {
              "room_id": 1001,
              "room_code": "ABCD12",
              "status": "WAITING",
              "host_user_id": 42,
              "player_count": 1,
              "max_players": 8,
              "startable": false,
              "players": [
                {
                  "user_id": 42,
                  "username": "player_one",
                  "team": null,
                  "role": null,
                  "ready": false,
                  "state": "IN_LOBBY",
                  "is_host": true,
                  "joined_at": "2026-09-10T08:41:00Z"
                }
              ],
              "game": null,
              "created_at": "2026-09-10T08:41:00Z"
            }
          }
  - name: Error - Already in room
    request: {url: "{{baseUrl}}/api/{{gameApiVersion}}/rooms", method: POST, headers: [], params: [], body: {mode: none}}
    response:
      status: 409
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "ALREADY_IN_ROOM",
              "message": "User 42 already belongs to active room 1001.",
              "details": {
                "room_id": 1001
              }
            }
          }
  - name: Error - Unauthorized
    request: {url: "{{baseUrl}}/api/{{gameApiVersion}}/rooms", method: POST, headers: [], params: [], body: {mode: none}}
    response:
      status: 401
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "UNAUTHORIZED",
              "message": "A valid active session is required.",
              "details": {}
            }
          }
