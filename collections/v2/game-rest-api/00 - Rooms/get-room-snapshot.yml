info:
  name: Get room snapshot
  type: http
  seq: 3
  tags: [rooms, snapshot]
http:
  method: GET
  url: "{{baseUrl}}/api/{{gameApiVersion}}/rooms/{{roomId}}"
  headers:
    - name: Accept
      value: application/json
runtime:
  scripts:
    - type: tests
      code: |-
        test("returns canonical room vocabulary", function () {
          expect(res.status).to.equal(200);
          expect(["WAITING", "COUNTDOWN", "IN_GAME", "POST_GAME"]).to.include(res.body.data.status);
          expect(res.body.data.room_id).to.equal(Number(bru.getVar("roomId")));
          expect(res.body.data.room_code).to.match(/^[A-Z0-9]{6}$/);
        });
docs: |-
  # Get room snapshot

  ## Purpose

  Returns the server-authoritative, recipient-specific room and optional game state. It is used after navigation or reconnect recovery; realtime changes continue over WebSocket.

  ## Preconditions and request parameters

  The room must exist and the authenticated user must be a current member.

  | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |
  | --- | --- | ---: | --- | --- | ---: | --- | --- |
  | `room_id` | path | yes | integer | positive | no | Requested room | `1001` |
  | `ft_session` cookie | request cookie | yes | string | active JWT access credential | no | Determines access and projection | set by Register/Login |
  | `Accept` | header | yes | string | `application/json` | no | Requested response media type | `application/json` |

  ## Room response fields

  | Field | Type | Required | Nullable | Allowed values | Description |
  | --- | --- | ---: | ---: | --- | --- |
  | `data.room_id` | integer | yes | no | positive | Room ID shared with WebSocket |
  | `data.room_code` | string | yes | no | `^[A-Z0-9]{6}$` | Human-shareable code; remains available after reload |
  | `data.status` | string enum | yes | no | `WAITING`, `COUNTDOWN`, `IN_GAME`, `POST_GAME` | Lifecycle state; `CLOSED` has no remaining member who could read this endpoint |
  | `data.host_user_id` | integer or null | yes | yes | member user ID or `null` | Null only during the 300-second empty-room window |
  | `data.player_count` | integer | yes | no | `>= 1` for accessible room | Current members |
  | `data.max_players` | integer | yes | no | `4..20` | Room capacity; participants and spectators count |
  | `data.turn_timer_seconds` | integer or null | yes | yes | `null`, `60`, `90`, `120`; `null` means no limit | Per-turn time limit (`workspace.yml`, Room Settings) |
  | `data.language` | string | yes | no | `en` | Word-pack language |
  | `data.startable` | boolean | yes | no | `true`, `false` | Complete start predicate, not merely all-ready |
  | `data.countdown.seconds_remaining` | integer | conditional | no | `0..3` | Present only in `COUNTDOWN` |
  | `data.players[]` | array<object> | yes | no | one or more | Members in join order |
  | `data.players[].user_id` | integer | yes | no | positive | Member ID |
  | `data.players[].username` | string | yes | no | username rule | Username |
  | `data.players[].avatar_url` | string | yes | no | same-origin URL | Current avatar for lobby/game rendering |
  | `data.players[].team` | enum or null | yes | yes | `RED`, `BLUE`, `null` | Temporary team; null until selected |
  | `data.players[].role` | enum | yes | no | `SPYMASTER`, `OPERATIVE`, `SPECTATOR` | Always `SPECTATOR` on initial membership |
  | `data.players[].ready` | boolean | yes | no | `true`, `false` | Confirms current selections; selection change resets false |
  | `data.players[].state` | string enum | yes | no | `IN_LOBBY`, `IN_GAME`, `POST_GAME` | Per-member lifecycle; may differ between members after a completed game |
  | `data.players[].is_host` | boolean | yes | no | `true`, `false` | Exactly one true in non-empty room |
  | `data.players[].joined_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Membership order |
  | `data.game` | object or null | yes | yes | game object or `null` | Non-null for an active game or when this recipient is still `POST_GAME`; shared room status may already be `WAITING` |
  | `data.created_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Room creation time |

  ## Game response fields

  | Field | Type | Required | Nullable | Allowed values | Description |
  | --- | --- | ---: | ---: | --- | --- |
  | `data.game.game_id` | integer | yes when game exists | no | positive | Match ID |
  | `data.game.status` | string enum | yes when game exists | no | `IN_PROGRESS`, `GAME_FINISHED`, `GAME_CANCELLED` | Game lifecycle, separate from room status |
  | `data.game.starting_team` | enum | yes | no | `RED`, `BLUE` | Team owning 9 cards and first clue |
  | `data.game.current_turn.team` | enum | yes | no | `RED`, `BLUE` | Active team |
  | `data.game.current_turn.phase` | enum | yes | no | `WAITING_FOR_CLUE`, `GUESSING`, `PAUSED_FOR_PLAYERS`, `GAME_OVER` | Round phase |
  | `data.game.current_turn.clue.word` | string | conditional | no | normalized one word, `1..30` chars | Present in `GUESSING`; final clue may remain in `GAME_OVER` |
  | `data.game.current_turn.clue.number` | integer | conditional | no | `1..9` | Clue number `N` |
  | `data.game.current_turn.guesses_remaining` | integer or null | yes | yes | `0..10`, or `null` | `N+1` at clue acceptance; null while waiting for clue |
  | `data.game.current_turn.deadline_at` | `string<date-time>` or null | yes | yes | ISO 8601 UTC, or `null` | Turn timer deadline; `null` with no limit, while paused, and in `GAME_OVER` (`workspace.yml`, Turn Timer) |
  | `data.game.score.red` | integer | yes | no | `0..9` | Revealed RED cards (either team may start with 9 — see workspace.yml Game Rules) |
  | `data.game.score.blue` | integer | yes | no | `0..9` | Revealed BLUE cards (either team may start with 9 — see workspace.yml Game Rules) |
  | `data.game.board[]` | array<object> | yes | no | exactly 25 unique cards | Fixed board order |
  | `data.game.board[].card_id` | integer | yes | no | `1..25` unique | Slot identifier; carries zero affiliation information (`workspace.yml`, Card ID invariant) — the fixture example's `card_id`↔color pattern is illustrative only, not a rule |
  | `data.game.board[].word` | string | yes | no | fixture word | Visible to both roles |
  | `data.game.board[].revealed` | boolean | yes | no | `true`, `false` | Reveal state |
  | `data.game.board[].color` | enum or null | yes | yes | `RED`, `BLUE`, `NEUTRAL`, `ASSASSIN`, `null` | Null only for unrevealed cards hidden from an Operative; Spymasters always receive color |
  | `data.game.winner` | enum or null | yes | yes | `RED`, `BLUE`, `null` | Non-null only after terminal result |
  | `data.game.end_reason` | enum or null | yes | yes | `ALL_TEAM_CARDS_REVEALED`, `ASSASSIN_REVEALED`, `INSUFFICIENT_PLAYERS`, `null` | Terminal cause; cancellation has no winner |
  | `data.game.staffing` | object | conditional | no | per-team missing roles/deadlines | Present in `PAUSED_FOR_PLAYERS`; the same shape as `game.staffing.required.payload.staffing`, so a reconnect restores the shutdown countdown |
  | `data.game.started_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Board creation/start time |
  | `data.game.finished_at` | `string<date-time>` or null | yes | yes | ISO 8601 UTC or `null` | Terminal time |
  | `data.post_game` | object | conditional | no | deadline and pending members | Present while any current member remains `POST_GAME`; omitted otherwise |
  | `data.post_game.deadline_at` | `string<date-time>` | conditional | no | ISO 8601 UTC | Common absolute decision deadline |
  | `data.post_game.pending_user_ids[]` | array<integer> | conditional | no | current room members | Members still viewing the completed result |
  | `data.last_game` | object | conditional | no | completed game summary | Present in an `IN_LOBBY` recipient's lobby projection after at least one completed match |
  | `data.last_game.game_id` | integer | conditional | no | positive | Previous match ID |
  | `data.last_game.status` | enum | conditional | no | `GAME_FINISHED` | Previous game lifecycle state |
  | `data.last_game.winner` | enum | conditional | no | `RED`, `BLUE` | Winning team |
  | `data.last_game.loser` | enum | conditional | no | `RED`, `BLUE` | Losing team |
  | `data.last_game.end_reason` | enum | conditional | no | `ALL_TEAM_CARDS_REVEALED`, `ASSASSIN_REVEALED`, `INSUFFICIENT_PLAYERS` | Terminal cause |
  | `data.last_game.score` | object | conditional | no | `{red, blue}` | Final revealed-card totals |
  | `data.last_game.finished_at` | `string<date-time>` | conditional | no | ISO 8601 UTC | Previous match end time |
  | `data.empty_since` | `string<date-time>` or null | yes | yes | ISO 8601 UTC | Set while no members remain |
  | `data.close_at` | `string<date-time>` or null | yes | yes | `empty_since + 300s` | Empty-room closure deadline; cleared by a join |

  A snapshot is recipient-specific after game end: an `IN_LOBBY` recipient sees the current lobby plus `last_game`; a `POST_GAME` recipient sees the completed game projection and the same shared deadline. New countdown is forbidden until `pending_user_ids` is empty.

  ## State changes and events

  Read-only and emits nothing. It does not advance countdown or turn state.

  ## Errors and privacy invariant

  `401 UNAUTHORIZED`, `404 ROOM_NOT_FOUND`, `403 NOT_ROOM_MEMBER`, `422 VALIDATION_ERROR`. Errors reveal no room state. The server projects every card for the authenticated viewer; an Operative never receives an unrevealed affiliation.
