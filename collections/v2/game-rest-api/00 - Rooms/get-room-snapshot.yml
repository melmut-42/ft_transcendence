    request: {url: "{{baseUrl}}/api/{{gameApiVersion}}/rooms/1001", method: GET, headers: [], params: [], body: {mode: none}}
    response:
      status: 200
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "data": {
              "room_id": 1001,
              "status": "WAITING",
              "host_user_id": 42,
              "player_count": 1,
              "max_players": 8,
              "turn_timer_seconds": null,
              "language": "en",
              "startable": false,
              "players": [
                {
                  "user_id": 42,
                  "username": "player_one",
                  "team": null,
                  "role": "SPECTATOR",
                  "ready": false,
                  "state": "IN_LOBBY",
                  "is_host": true,
                  "joined_at": "2026-09-10T08:41:00Z"
                }
              ],
              "game": null,
              "created_at": "2026-09-10T08:41:00Z"
            }
          }
