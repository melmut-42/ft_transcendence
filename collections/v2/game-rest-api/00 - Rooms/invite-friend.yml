info:
  name: Invite friend
  type: http
  seq: 6
  tags: [rooms, friends]
http:
  method: POST
  url: "{{baseUrl}}/api/{{gameApiVersion}}/rooms/{{roomId}}/invites"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "user_id": 43
      }
docs: |-
  # Invite friend

  ## Purpose and preconditions

  Sends a live room invitation to a friend. The sender must be a member of the room, the room must be `WAITING` with no pending `POST_GAME` member and below `max_players`, and the recipient must be a friend with no active room and at least one active Chat Gateway v2 socket. Generic presence through only a room socket is not enough because v2 invites are delivered only on `/ws/v2/channels`.

  ## Request parameters

  | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |
  | --- | --- | ---: | --- | --- | ---: | --- | --- |
  | `room_id` | path | yes | integer | positive | no | Room the friend is invited to | `1001` |
  | `ft_session` cookie | request cookie | yes | string | active JWT access credential | no | Inviting member | set by Register/Login |
  | `user_id` | body | yes | integer | positive, a friend, not self | no | Invited user | `43` |

  ## Success behavior

  `202 Accepted`. The Web BFF routes the command to Game Session, which assigns one stable `invite_id` and a short server-configurable delivery deadline (30 seconds in this example), then publishes the transient notification through RabbitMQ. Chat Gateway deduplicates broker redelivery by `invite_id`, drops it after `expires_at`, and fans `room.invite.received` to the recipient's active v2 chat sockets. The response confirms acceptance for live delivery, not rendering by the recipient; a disconnect after the presence check can still lose the transient notification. v2 never duplicates it on `/ws/v1/chat`. Invitations are not stored: there is no pending list, no accept/decline endpoint, and no later application replay. The recipient accepts through the ordinary v2 Join room request, which applies every normal join check.

  | Field | Type | Required | Nullable | Allowed values | Description |
  | --- | --- | ---: | ---: | --- | --- |
  | `data.invite_id` | string | yes | no | unique invitation ID | Idempotency key for broker redelivery of this one REST request |
  | `data.room_id` | integer | yes | no | positive | Room |
  | `data.room_code` | string | yes | no | `^[A-Z0-9]{6}$` | Code shown with the invitation |
  | `data.to_user_id` | integer | yes | no | positive | Invited user |
  | `data.accepted_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Time accepted for asynchronous live delivery |
  | `data.expires_at` | `string<date-time>` | yes | no | ISO 8601 UTC, after `accepted_at` | Broker/gateway delivery deadline; not a reservation of the room seat |

  ## Errors

  | Status | Code | When |
  | --- | --- | --- |
  | `401` | `UNAUTHORIZED` | invalid session |
  | `403` | `NOT_ROOM_MEMBER` | sender is not in the room |
  | `404` | `ROOM_NOT_FOUND` | room absent |
  | `404` | `USER_NOT_FOUND` | recipient absent |
  | `404` | `NOT_FRIENDS` | recipient is not a friend |
  | `409` | `ROOM_NOT_JOINABLE` | room is not `WAITING`, or any member is still `POST_GAME` |
  | `409` | `ROOM_FULL` | `player_count` equals `max_players` |
  | `409` | `USER_OFFLINE` | recipient has no active Chat Gateway v2 socket |
  | `409` | `USER_IN_ROOM` | recipient already belongs to an active room |
  | `422` | `VALIDATION_ERROR` | `user_id` missing, not a positive integer, or the sender's own ID |

  Errors send nothing to the recipient.
examples:
  - name: Success - Invitation accepted for delivery
    request: {url: "{{baseUrl}}/api/{{gameApiVersion}}/rooms/1001/invites", method: POST, headers: [], params: [], body: {mode: json, json: '{"user_id":43}'}}
    response: {status: 202, headers: [{name: Content-Type, value: application/json}], body: {type: json, data: '{"data":{"invite_id":"inv_0010","room_id":1001,"room_code":"ABCD12","to_user_id":43,"accepted_at":"2026-09-10T08:41:10Z","expires_at":"2026-09-10T08:41:40Z"}}'}}
  - name: Error - Friend offline
    request: {url: "{{baseUrl}}/api/{{gameApiVersion}}/rooms/1001/invites", method: POST, headers: [], params: [], body: {mode: json, json: '{"user_id":43}'}}
    response: {status: 409, headers: [{name: Content-Type, value: application/json}], body: {type: json, data: '{"error":{"code":"USER_OFFLINE","message":"User 43 has no active Chat Gateway v2 connection.","details":{"user_id":43}}}'}}
  - name: Error - Friend already in a room
    request: {url: "{{baseUrl}}/api/{{gameApiVersion}}/rooms/1001/invites", method: POST, headers: [], params: [], body: {mode: json, json: '{"user_id":43}'}}
    response: {status: 409, headers: [{name: Content-Type, value: application/json}], body: {type: json, data: '{"error":{"code":"USER_IN_ROOM","message":"User 43 already belongs to an active room.","details":{"user_id":43}}}'}}
  - name: Error - Room full
    request: {url: "{{baseUrl}}/api/{{gameApiVersion}}/rooms/1001/invites", method: POST, headers: [], params: [], body: {mode: json, json: '{"user_id":43}'}}
    response: {status: 409, headers: [{name: Content-Type, value: application/json}], body: {type: json, data: '{"error":{"code":"ROOM_FULL","message":"Room 1001 is full (8 of 8 players).","details":{"room_id":1001,"player_count":8,"max_players":8}}}'}}
