docs: |-
  # Rooms

  Creating joins the creator and assigns host. A room accepts joins in `WAITING` and `COUNTDOWN`, and in `IN_GAME` only while the game is `PAUSED_FOR_PLAYERS`, while capacity remains. Every joiner starts unseated and claims a seat; nobody watches a running match without playing. A user may have one active room. After a game, members independently choose Back to Lobby or Exit during a 60-second post-game window. An empty room remains recoverable for 300 seconds before closure.

  Every room has a capacity, `max_players`, in `4..20` (default `8`). Every member counts, seated or unseated. The host sets it on create and can change it while the room is `WAITING`; it can never drop below `player_count`.

  A room member can invite a friend with `Invite friend`; the transient invite is accepted for delivery through Chat Gateway v2, and accepting it is an ordinary v2 Join.

  A game can start only with at least four configured, ready members; exactly one Spymaster and at least one Operative per `RED` and `BLUE`. REST room snapshots use the same enums and privacy projections as realtime state.

  `Leave room` and logout are legal in every room status. Leaving mid-game as a participant records a leave penalty, rechecks team staffing, and never assigns an immediate loss. A deficient team has a shutdown deadline (120 seconds by default) to regain at least one Spymaster and one Operative; expiry cancels the game without a winner and closes the room. A post-game member who exits or reaches the deadline is removed without affecting the completed result. An empty room closes after 300 seconds, not immediately.
