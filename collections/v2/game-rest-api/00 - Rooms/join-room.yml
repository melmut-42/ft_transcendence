info:
  name: Join room
  type: http
  seq: 2
  tags: [rooms]
http:
  method: POST
  url: "{{baseUrl}}/api/{{gameApiVersion}}/rooms/{{roomId}}/members"
  headers:
    - name: Accept
      value: application/json
docs: |-
  # Join room

  ## Purpose and preconditions

  Adds the authenticated user to a room in `WAITING`, `COUNTDOWN`, or `IN_GAME`. The user must have no active room and capacity must remain. No body is accepted. Every join starts as `team:null`, `role:SPECTATOR`, `ready:false`; state is `IN_LOBBY` before play and `IN_GAME` during play.

  ## Request parameters

  | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |
  | --- | --- | ---: | --- | --- | ---: | --- | --- |
  | `room_id` | path | yes | integer | positive | no | Room to join | `1001` |
  | `ft_session` cookie | request cookie | yes | string | active JWT access credential | no | Joining user | set by Register/Login |
  | `Accept` | header | yes | string | `application/json` | no | Requested response media type | `application/json` |

  ## Response fields

  `201 Created` returns `{data: room_snapshot}`. `player_count` increments atomically. Because every join is a spectator, joining never invalidates countdown, changes staffing, or mutates the board/turn.

  | Field | Type | Required | Nullable | Allowed values | Description |
  | --- | --- | ---: | ---: | --- | --- |
  | `data.room_id` | integer | yes | no | positive | Joined room |
  | `data.room_code` | string | yes | no | `^[A-Z0-9]{6}$` | Human-shareable code for the joined room |
  | `data.status` | string enum | yes | no | `WAITING`, `COUNTDOWN`, `IN_GAME` | Joinable lifecycle state |
  | `data.host_user_id` | integer or null | yes | yes | member ID or `null` | Current host; an empty-room joiner becomes host |
  | `data.player_count` | integer | yes | no | `>= 1` | Count after join; may be one when reviving an empty room |
  | `data.max_players` | integer | yes | no | `4..20` | Room capacity; participants and spectators both count |
  | `data.turn_timer_seconds` | integer or null | yes | yes | unresolved set; `null` means no limit | Per-turn time limit |
  | `data.language` | string | yes | no | unresolved set of lowercase language codes | Word-pack language |
  | `data.startable` | boolean | yes | no | current predicate | A spectator does not alter the predicate |
  | `data.players[]` | array<object> | yes | no | members in join order | Membership snapshot |
  | `data.players[].user_id` | integer | yes | no | positive | Member ID |
  | `data.players[].username` | string | yes | no | username rule | Display name |
  | `data.players[].avatar_url` | string | yes | no | same-origin URL | Current avatar for lobby rendering |
  | `data.players[].team` | enum or null | yes | yes | `RED`, `BLUE`, `null` | Temporary team |
  | `data.players[].role` | enum | yes | no | `SPECTATOR` on join | Later changed atomically through `room.role.select` |
  | `data.players[].ready` | boolean | yes | no | `true`, `false` | Current readiness |
  | `data.players[].state` | string enum | yes | no | `IN_LOBBY`, `IN_GAME` | Mirrors whether the room is pre-game or active |
  | `data.players[].is_host` | boolean | yes | no | `true`, `false` | Host marker |
  | `data.players[].joined_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Membership order |
  | `data.game` | object or null | yes | yes | active role-safe game or `null` | Present for `IN_GAME` joins |
  | `data.created_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Room creation time |

  ## State changes and emitted events

  Sets `active_room_id`, cancels an active empty-room closure timer, assigns host if the room was empty, and emits `room.player.joined` followed by a recipient-safe `room.state`. An in-game spectator receives the Operative-safe board projection and may later claim a legal team role over WebSocket. A join never starts a game by itself.

  ## Errors

  | Status | Code | When | State change |
  | --- | --- | --- | --- |
  | `401` | `UNAUTHORIZED` | invalid session | none |
  | `404` | `ROOM_NOT_FOUND` | room ID absent | none |
  | `409` | `ROOM_NOT_JOINABLE` | state is `POST_GAME` or `CLOSED`; or shared state is `WAITING` but post-game members remain | none |
  | `409` | `ROOM_FULL` | `player_count` already equals `max_players` | none |
  | `409` | `ALREADY_IN_ROOM` | user already has active room, including this one | none |
  | `422` | `VALIDATION_ERROR` | room ID is not positive integer | none |

  ## Invariants

  `player_count` never exceeds `max_players`; the capacity check and insert are atomic. Mid-game joins are always spectators first and therefore cannot obtain hidden Spymaster information before a legal role claim.
examples:
  - name: Success - Join empty-team room
    request: {url: "{{baseUrl}}/api/{{gameApiVersion}}/rooms/1001/members", method: POST, headers: [], params: [], body: {mode: none}}
    response:
      status: 201
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "data": {
              "room_id": 1001,
              "status": "WAITING",
              "host_user_id": 42,
              "player_count": 2,
              "max_players": 8,
              "turn_timer_seconds": null,
              "language": "en",
              "startable": false,
              "players": [
                {
                  "user_id": 42,
                  "username": "player_one",
                  "team": null,
                  "role": "SPECTATOR",
                  "ready": false,
                  "state": "IN_LOBBY",
                  "is_host": true,
                  "joined_at": "2026-09-10T08:41:00Z"
                },
                {
                  "user_id": 43,
                  "username": "red_agent",
                  "team": null,
                  "role": "SPECTATOR",
                  "ready": false,
                  "state": "IN_LOBBY",
                  "is_host": false,
                  "joined_at": "2026-09-10T08:41:20Z"
                }
              ],
              "game": null,
              "created_at": "2026-09-10T08:41:00Z"
            }
          }
  - name: Success - Fifth player joins
    request: {url: "{{baseUrl}}/api/{{gameApiVersion}}/rooms/1001/members", method: POST, headers: [], params: [], body: {mode: none}}
    response:
      status: 201
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "data": {
              "room_id": 1001,
              "status": "WAITING",
              "host_user_id": 42,
              "player_count": 5,
              "max_players": 8,
              "turn_timer_seconds": null,
              "language": "en",
              "startable": false,
              "players": [
                {
                  "user_id": 42,
                  "username": "player_one",
                  "team": "RED",
                  "role": "SPYMASTER",
                  "ready": false,
                  "state": "IN_LOBBY",
                  "is_host": true,
                  "joined_at": "2026-09-10T08:41:00Z"
                },
                {
                  "user_id": 43,
                  "username": "red_agent",
                  "team": "RED",
                  "role": "OPERATIVE",
                  "ready": false,
                  "state": "IN_LOBBY",
                  "is_host": false,
                  "joined_at": "2026-09-10T08:41:20Z"
                },
                {
                  "user_id": 44,
                  "username": "blue_master",
                  "team": "BLUE",
                  "role": "SPYMASTER",
                  "ready": false,
                  "state": "IN_LOBBY",
                  "is_host": false,
                  "joined_at": "2026-09-10T08:41:30Z"
                },
                {
                  "user_id": 45,
                  "username": "blue_agent",
                  "team": "BLUE",
                  "role": "OPERATIVE",
                  "ready": false,
                  "state": "IN_LOBBY",
                  "is_host": false,
                  "joined_at": "2026-09-10T08:41:40Z"
                },
                {
                  "user_id": 46,
                  "username": "extra_red",
                  "team": null,
                  "role": "SPECTATOR",
                  "ready": false,
                  "state": "IN_LOBBY",
                  "is_host": false,
                  "joined_at": "2026-09-10T08:41:50Z"
                }
              ],
              "game": null,
              "created_at": "2026-09-10T08:41:00Z"
            }
          }
  - name: Error - Room not found
    request: {url: "{{baseUrl}}/api/{{gameApiVersion}}/rooms/9999/members", method: POST, headers: [], params: [], body: {mode: none}}
    response: {status: 404, headers: [{name: Content-Type, value: application/json}], body: {type: json, data: '{"error":{"code":"ROOM_NOT_FOUND","message":"Room 9999 was not found.","details":{"room_id":9999}}}'}}
  - name: Error - Countdown already started
    request: {url: "{{baseUrl}}/api/{{gameApiVersion}}/rooms/1001/members", method: POST, headers: [], params: [], body: {mode: none}}
    response: {status: 409, headers: [{name: Content-Type, value: application/json}], body: {type: json, data: '{"error":{"code":"ROOM_NOT_JOINABLE","message":"Room 1001 is not joinable while status is COUNTDOWN.","details":{"room_id":1001,"status":"COUNTDOWN"}}}'}}
  - name: Error - Already in another room
    request: {url: "{{baseUrl}}/api/{{gameApiVersion}}/rooms/1001/members", method: POST, headers: [], params: [], body: {mode: none}}
    response: {status: 409, headers: [{name: Content-Type, value: application/json}], body: {type: json, data: '{"error":{"code":"ALREADY_IN_ROOM","message":"User 46 already belongs to active room 1002.","details":{"room_id":1002}}}'}}
  - name: Error - Room full
    request: {url: "{{baseUrl}}/api/{{gameApiVersion}}/rooms/1001/members", method: POST, headers: [], params: [], body: {mode: none}}
    response: {status: 409, headers: [{name: Content-Type, value: application/json}], body: {type: json, data: '{"error":{"code":"ROOM_FULL","message":"Room 1001 is full (8 of 8 players).","details":{"room_id":1001,"player_count":8,"max_players":8}}}'}}
