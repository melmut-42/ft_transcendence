  content: |-
    # ft_transcendence Game WebSocket Protocol v2

    ## Connection

    Connect to `{{wsUrl}}/ws/{{gameApiVersion}}/rooms/{{roomId}}` with `gameApiVersion=v2`. The session must be active and the user must already belong to the same v2 room through REST. Authentication is never placed in the URL.

    This collection is additive. The original room socket remains unchanged in `WebSocket v1`; chat remains in its own v1/v2 contracts. A client must pair the v2 room REST contract with this v2 socket and must not mix room protocol versions in one session.

    ## Authentication

    Authentication is cookie-only: the HttpOnly, `Secure`, `SameSite=Lax` `ft_session` cookie set by the existing v1 Register/Login/Refresh endpoints is attached automatically on the WebSocket upgrade request. The cookie is the only handshake credential; no authentication header is sent. The upgrade request's `Origin` is validated before the cookie. A user may hold several simultaneous v2 sockets for the same room; they share one logical membership, not one seat per socket. See `00 - Connection & Protocol/connect.yml`.

    A successful room connection receives a recipient-specific `room.state`. Projection depends on both shared room status and the caller's member state, which matters while some members have returned to `WAITING` and others remain `POST_GAME`.

    Invalid session rejects the handshake with HTTP `401`; missing room uses `404`; an authenticated non-member uses `403`. A transport disconnect starts the reconnect grace period. If it expires during `IN_GAME`, membership is removed and team staffing is rechecked. Play continues when both teams remain valid; otherwise `PAUSED_FOR_PLAYERS` starts the deficient team's shutdown deadline (120 seconds by default). If a deadline expires, the room closes and every remaining member returns to the Lobby.

    ## Reconnect (canonical snapshot)

    `room.state` is the authoritative initial/reconnect snapshot. Projection follows the recipient's member state: `IN_GAME` receives the active game; `POST_GAME` receives the completed game and deadline even if the shared room is already `WAITING`; `IN_LOBBY` receives the lobby and `last_game`. Clients apply the fresh snapshot instead of replaying missed events.

    ## Envelopes and ordering

    Client messages are `{ "type", "request_id", "payload" }`. `request_id` is a client-generated unique string of `1..64` visible ASCII characters (a UUID is a good default generator, but any unique string in that length/charset is valid). The server caches the result of a request ID per session for the room lifetime; an identical retry returns the original ack/error and does not repeat mutation. Reuse with different content returns `INVALID_EVENT`. This dedup cache lives in Redis alongside other ephemeral room state (`workspace.yml`, State Ownership).

    Successful commands receive `{ "type": "ack", "request_id", "ok": true, "payload": object }`. Events are `{ "type", "event_id", "room_id", "sent_at", "payload" }`. `event_id` is unique and monotonically increasing within one room stream. Timestamps are ISO 8601 UTC.

    **State mutation source of truth:** an `ack` confirms that the command was received and validated, correlated by `request_id` — it is not the client's primary mutation source, because the paired server event (`room.player.updated`, `game.card.revealed`, etc.) carries the same authoritative values and a client that applied both would double-apply the change. Apply state from server events and snapshots (`room.state`/embedded `game`), and treat the `ack` payload as confirmation/UI feedback (e.g. "your command was accepted") rather than a second write. If a client ever detects a gap in `event_id` ordering, it does not attempt to replay history — it requests/derives a fresh `room.state` snapshot instead (the same recovery path as an ordinary reconnect).

    ## Message and event matrix

    | Type | Direction | Allowed room/phase | Permission | Purpose |
    | --- | --- | --- | --- | --- |
    | `room.team.select` | C to S | `WAITING`, `COUNTDOWN` | existing participant | change team; countdown change cancels |
    | `room.role.select` | C to S | `WAITING`, `COUNTDOWN`, paused `IN_GAME` | member; in `IN_GAME` unseated only | atomically claim `{team, role}` |
    | `room.ready.set` | C to S | `WAITING`, `COUNTDOWN` for false | configured member | toggle readiness |
    | `room.lobby.return` | C to S | member state `POST_GAME` | any member | return independently; first return moves room to `WAITING` |
    | `room.settings.update` | C to S | `WAITING` | host, `IN_LOBBY` | change capacity, turn timer, language |
    | `room.member.kick` | C to S | `WAITING`, `COUNTDOWN`, `IN_GAME`, `POST_GAME` | host | remove any other member; in `IN_GAME` rechecks staffing |
    | `game.clue.submit` | C to S | `IN_GAME / WAITING_FOR_CLUE` | active Spymaster | create clue and guesses |
    | `game.card.guess` | C to S | `IN_GAME / GUESSING` | active Operative | reveal one card |
    | `game.turn.pass` | C to S | `IN_GAME / GUESSING` | active Operative | end team turn |
    | `room.state` | S to C | any non-closed state | recipient projection | full room snapshot |
    | `room.player.joined` | S to C | `WAITING`, `COUNTDOWN`, paused `IN_GAME` | server | unseated membership added |
    | `room.player.left` | S to C | any non-closed state | server | exit, logout, disconnect, kick, account deletion, or timeout; may include host transfer |
    | `room.settings.updated` | S to C | `WAITING` | server | full current settings after a host change |
    | `room.player.returned_to_lobby` | S to C | `POST_GAME` or `WAITING` | server | one member moved from `POST_GAME` to `IN_LOBBY` |
    | `room.post_game.started` | S to C | `POST_GAME` | server | result decision deadline begins |
    | `room.post_game.completed` | S to C | `WAITING` or `CLOSED` | server | no pending post-game members remain |
    | `room.player.updated` | S to C | `WAITING`, `COUNTDOWN`; any status except `CLOSED` for a profile change | server | team, role, ready change; a member's new `username` or `avatar_url` |
    | `room.countdown.started` | S to C | `COUNTDOWN` | server | start at 3 seconds |
    | `room.countdown.tick` | S to C | `COUNTDOWN` | server | remaining `2`, `1`, `0` |
    | `room.countdown.cancelled` | S to C | `WAITING` | server | invariant broke |
    | `game.started` | S to C | `IN_GAME` | recipient projection | complete role-safe game |
    | `game.clue.submitted` | S to C | `IN_GAME / GUESSING` | server | public clue |
    | `game.card.revealed` | S to C | `IN_GAME`, `POST_GAME` | recipient projection | reveal result |
    | `game.score.updated` | S to C | `IN_GAME`, `POST_GAME` | server | revealed team totals |
    | `game.turn.changed` | S to C | `IN_GAME` | server | next team waits for clue |
    | `game.ended` | S to C | `POST_GAME / GAME_OVER` | server | competitive terminal result |
    | `game.staffing.required` | S to C | `IN_GAME / PAUSED_FOR_PLAYERS` | server | shutdown countdown: missing roles, departure, per-team deadline |
    | `game.staffing.restored` | S to C | `IN_GAME` | server | both teams valid; preserved turn resumes |
    | `game.cancelled` | S to C | `IN_GAME` to `CLOSED` | server | no-winner `INSUFFICIENT_PLAYERS` cancellation |
    | `room.closed` | S to C | `CLOSED` | server | room shut down after a staffing deadline; sockets close with `4404` |
    | `game.history.appended` | S to C | `IN_GAME`, `POST_GAME` | server | one new public action-log entry; `room.state` carries the full `game.history` |
    | `ack` | S to C | command-dependent | requester | command accepted |
    | `error` | S to C | any open connection | requester | command rejected |

    ## Countdown and authority

    The server rechecks the full start predicate after every membership, return, team, role, and ready change. Countdown additionally requires every remaining member to be `IN_LOBBY`; pending `POST_GAME` members block it. Completion while valid generates a new game ID and board. There is no host start command.

    ## Privacy projection

    Spymasters receive all 25 colors. Operatives receive `color: null` on unrevealed cards and the true color on revealed cards. The server MUST render events per recipient and MUST NOT broadcast one secret-bearing payload. The full paired examples in `07 - Full State Scenarios` differ only where authorization requires it.

    ## Errors and connection policy

    Action errors normally retain the connection and never mutate room/game state. Room-socket errors are `INVALID_EVENT`, `INVALID_PAYLOAD`, `NOT_ROOM_MEMBER`, `TARGET_NOT_ROOM_MEMBER`, `INVALID_ROOM_STATE`, `NOT_HOST`, `CANNOT_KICK_SELF`, `POST_GAME_PENDING`, `POST_GAME_DEADLINE_EXPIRED`, `TEAM_REQUIRED`, `ROLE_REQUIRED`, `ROLE_CONFLICT`, `NOT_YOUR_TURN`, `ROLE_FORBIDDEN`, `INVALID_CLUE`, `INVALID_CLUE_NUMBER`, `INVALID_CARD`, `CARD_ALREADY_REVEALED`, `NO_GUESSES_REMAINING`, and `GAME_ALREADY_FINISHED`; `POST_GAME_DEADLINE_EXPIRED` completes timeout removal and closes that member's socket with `4403`. All are defined in `06 - Errors/error-catalog.yml`. `UNAUTHORIZED` and account deletion close with `4401`; host kick and post-game timeout close the affected member with `4403`; a staffing shutdown sends `room.closed` and then closes every room socket with `4404`.

    ## Example index

    `01 - Room Lobby` contains independent Back to Lobby, host kick, and post-game timeout events. `03 - Ready & Countdown` contains minimum valid room, countdown, and cancellation. `07 - Full State Scenarios` contains full Spymaster and Operative boards plus the mixed `IN_LOBBY`/`POST_GAME` projection. `04 - Game` contains clue, reveal outcomes, pass, terminal results, and invalid-action cases.
