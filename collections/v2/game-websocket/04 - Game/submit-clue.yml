info:
  name: Submit clue
  type: websocket
  seq: 1
  tags: [action, game]
websocket:
  url: "{{wsUrl}}/ws/{{gameApiVersion}}/rooms/{{roomId}}"
  message:
    - title: Success - Ocean 2
      selected: true
      message:
        type: json
        data: |-
          {
            "type": "game.clue.submit",
            "request_id": "req_0020",
            "payload": {
              "word": "ocean",
              "number": 2
            }
          }
    - title: Success - Space 3
      selected: false
      message:
        type: json
        data: |-
          {
            "type": "game.clue.submit",
            "request_id": "req_0021",
            "payload": {
              "word": " SPACE ",
              "number": 3
            }
          }
    - title: Error - Operative cannot submit
      selected: false
      message:
        type: json
        data: |-
          {
            "type": "game.clue.submit",
            "request_id": "req_0022",
            "payload": {
              "word": "ocean",
              "number": 2
            }
          }
    - title: Error - Wrong team
      selected: false
      message:
        type: json
        data: |-
          {
            "type": "game.clue.submit",
            "request_id": "req_0023",
            "payload": {
              "word": "space",
              "number": 3
            }
          }
    - title: Error - Wrong phase
      selected: false
      message:
        type: json
        data: |-
          {
            "type": "game.clue.submit",
            "request_id": "req_0024",
            "payload": {
              "word": "ocean",
              "number": 2
            }
          }
    - title: Error - Invalid number
      selected: false
      message:
        type: json
        data: |-
          {
            "type": "game.clue.submit",
            "request_id": "req_0025",
            "payload": {
              "word": "ocean",
              "number": 0
            }
          }
    - title: Error - Multiple words
      selected: false
      message:
        type: json
        data: |-
          {
            "type": "game.clue.submit",
            "request_id": "req_0026",
            "payload": {
              "word": "deep ocean",
              "number": 2
            }
          }
    - title: Error - Clue matches a board card (MOON)
      selected: false
      message:
        type: json
        data: |-
          {
            "type": "game.clue.submit",
            "request_id": "req_0027",
            "payload": {
              "word": "moon",
              "number": 2
            }
          }
docs: |-
  # Submit clue

  ## Purpose and preconditions

  Moves the active team from `WAITING_FOR_CLUE` to `GUESSING`. Only that team's `SPYMASTER` may submit. The room must be `IN_GAME` and the game unfinished.

  ## Message and payload parameters

  | Parameter | Location | Required | Type | Allowed values/range | Nullable | Description | Example |
  | --- | --- | ---: | --- | --- | ---: | --- | --- |
  | `room_id` | WebSocket path | yes | integer | positive | no | Connected room | `1001` |
  | `ft_session` cookie | handshake | yes | string | HttpOnly, Secure, active session | no | Sole handshake credential; automatic on same-origin upgrade | set by Register/Login |
  | `type` | envelope | yes | string enum | `game.clue.submit` | no | Operation | `game.clue.submit` |
  | `request_id` | envelope | yes | string | `1..64` visible ASCII, unique | no | Idempotency key | `req_0020` |
  | `payload.word` | payload | yes | string | trim; one non-whitespace word; `1..30` Unicode characters | no | Clue stored in Unicode lowercase | `ocean` |
  | `payload.number` | payload | yes | integer | `1..9` | no | Base guess count `N` | `2` |

  The clue word is trimmed and stored in Unicode lowercase. A clue must not match the word of any board card, revealed or unrevealed, using case-insensitive comparison after trimming. No additional word-list, inflection, or proper-noun restrictions apply. " SPACE " normalizes to "space"; "deep ocean" is invalid.

  ## Success behavior and response

  Request `req_0020` returns:

  ```json
    {
      "type": "ack",
      "request_id": "req_0020",
      "ok": true,
      "payload": {
        "game_id": 5001,
        "current_turn": {
          "team": "RED",
          "phase": "GUESSING",
          "clue": {
            "word": "ocean",
            "number": 2
          },
          "guesses_remaining": 3,
          "deadline_at": null
        }
      }
    }
  ```

  The server emits exactly one event for a unique request:

  ```json
    {
      "type": "game.clue.submitted",
      "event_id": "evt_0142",
      "room_id": 1001,
      "sent_at": "2026-09-10T08:43:30Z",
      "payload": {
        "game_id": 5001,
        "submitted_by_user_id": 42,
        "team": "RED",
        "clue": {
          "word": "ocean",
          "number": 2
        },
        "guesses_remaining": 3,
        "current_turn": {
          "team": "RED",
          "phase": "GUESSING"
        }
      }
    }
  ```

  Retrying identical `req_0020` returns the original ack without a second event or new turn.

  The normalized Space example returns:

  ```json
    {
      "type": "ack",
      "request_id": "req_0021",
      "ok": true,
      "payload": {
        "game_id": 5001,
        "current_turn": {
          "team": "RED",
          "phase": "GUESSING",
          "clue": {
            "word": "space",
            "number": 3
          },
          "guesses_remaining": 4,
          "deadline_at": null
        }
      }
    }
  ```

  It emits `game.clue.submitted` once with `clue.word="space"`, `clue.number=3`, and `guesses_remaining=4`.

  ## Response/event fields

  | Field | Type | Required | Nullable | Allowed values | Description |
  | --- | --- | ---: | ---: | --- | --- |
  | `payload.game_id` | integer | yes | no | positive | Match |
  | `payload.submitted_by_user_id` | integer | event only | no | active Spymaster ID | Actor |
  | `payload.team` | enum | event only | no | `RED`, `BLUE` | Active team |
  | `payload.clue.word` | string | yes | no | normalized rule | Public clue |
  | `payload.clue.number` | integer | yes | no | `1..9` | `N` |
  | `payload.guesses_remaining` | integer | yes | no | `2..10` | Exactly `N+1` at acceptance |
  | `payload.current_turn.phase` | enum | yes | no | `GUESSING` | New phase |
  | `payload.current_turn.deadline_at` | `string<date-time>` or null | yes | yes | ISO 8601 UTC, or `null` | Unchanged turn deadline; a clue does not extend it |

  ## Board-card clue rule

  The request contains only `word` and `number`. Whether a word is accepted depends on the server-side board: a clue is rejected if it matches the word of **any** board card, revealed or unrevealed. The server trims the clue and compares it with each board word in Unicode lowercase; it never rewrites a submitted clue into a different word.

  The example assumes the room is `IN_GAME`, RED is the active team in `WAITING_FOR_CLUE`, and the sender is RED's `SPYMASTER`. `req_0027` (`"moon"`, `2`) returns `INVALID_CLUE` whether `MOON` is revealed or not; `" Moon "` is rejected the same way. The phase stays `WAITING_FOR_CLUE`, no clue is created, no event is broadcast, and the socket stays open.

  ```json
    {
      "type": "error",
      "request_id": "req_0027",
      "error": {
        "code": "INVALID_CLUE",
        "message": "This clue cannot be used because it is one of the words on the board.",
        "details": {
          "field": "payload.word",
          "reason": "WORD_ON_BOARD"
        }
      }
    }
  ```

  `details.reason` tells the client which rule failed: `WORD_ON_BOARD` for a board word, `INVALID_FORMAT` for a missing, empty, too long, or multi-word clue.

  ## Errors and state guarantees

  - `ROLE_FORBIDDEN`: an Operative submits; message `Only the active team's Spymaster may submit a clue.`
  - `NOT_YOUR_TURN`: inactive-team Spymaster submits.
  - `INVALID_ROOM_STATE`: room is not `IN_GAME`.
  - `INVALID_CLUE`: word missing, empty, over 30 characters, contains whitespace, or matches any board card's word using case-insensitive comparison (`details.reason`: `INVALID_FORMAT` or `WORD_ON_BOARD`).
  - `INVALID_CLUE_NUMBER`: number is non-integer or outside `1..9`.
  - `GAME_ALREADY_FINISHED`: phase is `GAME_OVER`.

  Errors keep `WAITING_FOR_CLUE`, create no clue, and keep the socket open.

  ```json
    {
      "type": "error",
      "request_id": "req_0022",
      "error": {
        "code": "ROLE_FORBIDDEN",
        "message": "Only the active team's Spymaster may submit a clue.",
        "details": {
          "required_role": "SPYMASTER"
        }
      }
    }
  ```

  ```json
    {
      "type": "error",
      "request_id": "req_0023",
      "error": {
        "code": "NOT_YOUR_TURN",
        "message": "BLUE cannot submit a clue while RED is the active team.",
        "details": {
          "active_team": "RED"
        }
      }
    }
  ```

  ```json
    {
      "type": "error",
      "request_id": "req_0024",
      "error": {
        "code": "INVALID_ROOM_STATE",
        "message": "A clue can be submitted only during WAITING_FOR_CLUE.",
        "details": {
          "phase": "GUESSING"
        }
      }
    }
  ```

  ```json
    {
      "type": "error",
      "request_id": "req_0025",
      "error": {
        "code": "INVALID_CLUE_NUMBER",
        "message": "payload.number must be an integer from 1 through 9.",
        "details": {
          "field": "payload.number",
          "min": 1,
          "max": 9
        }
      }
    }
  ```

  ```json
    {
      "type": "error",
      "request_id": "req_0026",
      "error": {
        "code": "INVALID_CLUE",
        "message": "payload.word must contain exactly one non-whitespace word.",
        "details": {
          "field": "payload.word",
          "reason": "INVALID_FORMAT"
        }
      }
    }
  ```
