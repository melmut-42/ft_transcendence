info:
  name: Staffing pause and room shutdown
  type: websocket
  seq: 4
  tags: [game, staffing, cancellation, shutdown]
websocket:
  url: "{{wsUrl}}/ws/{{gameApiVersion}}/rooms/{{roomId}}"
settings:
  timeout: 30000
  keepAliveInterval: 20000
docs: |-
  # Staffing pause and room shutdown

  This is a passive event reference. It sends no client command.

  During `IN_GAME`, play may continue only while RED and BLUE each have exactly one `SPYMASTER` and at least one `OPERATIVE`. Unseated members are ignored. A team becomes deficient when it loses its only Spymaster or its last Operative, whether by Leave room, logout, host kick, account deletion, or an expired reconnect grace period. The room then remains `IN_GAME`, the game changes to `PAUSED_FOR_PLAYERS`, and the server preserves the board, score, active team, clue, and remaining guesses.

  Each deficient team owns an independent absolute deadline, 120 seconds by default and server-configurable. A second team becoming deficient later receives its own deadline; it does not reset the first team's timer. Clue, guess, and pass commands return `INVALID_GAME_PHASE` while paused.

  `game.staffing.required` is the start of the shutdown countdown every remaining member sees. `departure` names the member whose removal made the team deficient and why, so the client can explain why the room may close. The server sends no per-second ticks: clients render the remaining time from the absolute `deadline_at`, correcting for clock skew with the event's `sent_at`, and never close the room themselves. A reconnect during the pause receives the same `staffing` object inside `room.state.payload.room.game`.

  | Field | Type | Required | Nullable | Allowed values | Description |
  | --- | --- | ---: | ---: | --- | --- |
  | `payload.game_id` | integer | yes | no | positive | Paused game |
  | `payload.phase` | enum | yes | no | `PAUSED_FOR_PLAYERS` | Game phase after the departure |
  | `payload.staffing.red` / `payload.staffing.blue` | object | yes | no | per-team staffing | One entry per team |
  | `payload.staffing.<team>.missing_roles[]` | array<enum> | yes | no | `SPYMASTER`, `OPERATIVE` | Empty when the team is valid |
  | `payload.staffing.<team>.deadline_at` | `string<date-time>` or null | yes | yes | ISO 8601 UTC | Absolute shutdown deadline; `null` when the team is valid |
  | `payload.departure.user_id` | integer | yes | no | positive | Member whose removal caused this deficiency |
  | `payload.departure.username` | string | yes | no | username rule | Display name for the countdown notice |
  | `payload.departure.team` | enum | yes | no | `RED`, `BLUE` | Team left deficient |
  | `payload.departure.role` | enum | yes | no | `SPYMASTER`, `OPERATIVE` | Role the member held |
  | `payload.departure.reason` | enum | yes | no | `EXITED`, `SESSION_ENDED`, `DISCONNECTED`, `KICKED_BY_HOST`, `ACCOUNT_DELETED` | Why the member was removed |

  ```json
  {
    "type": "game.staffing.required",
    "event_id": "evt_0600",
    "room_id": 1001,
    "sent_at": "2026-09-10T08:46:00Z",
    "payload": {
      "game_id": 5001,
      "phase": "PAUSED_FOR_PLAYERS",
      "staffing": {
        "red": {
          "missing_roles": ["SPYMASTER"],
          "deadline_at": "2026-09-10T08:48:00Z"
        },
        "blue": {
          "missing_roles": [],
          "deadline_at": null
        }
      },
      "departure": {
        "user_id": 42,
        "username": "player_one",
        "team": "RED",
        "role": "SPYMASTER",
        "reason": "EXITED"
      }
    }
  }
  ```

  While the game is `PAUSED_FOR_PLAYERS`, a user may join the room through REST to fill the vacant seat. The new member starts unseated (`team:null`, `role:null`), receives an Operative-safe board, and cannot play until seated. They atomically claim a legal pair with `room.role.select`, for example `{"team":"RED","role":"SPYMASTER"}`. Existing participants cannot switch teams or roles during the game. A team may never have more than one Spymaster. If play resumes while a member is still unseated, the server removes that member with `room.player.left` reason `SEAT_UNAVAILABLE` and closes their room sockets with `4403`; nobody watches a running match without playing.

  When both teams are valid before every active deadline, the countdown stops and the exact preserved turn resumes. A turn timer stopped by the pause resumes with the time it had left, so `current_turn.deadline_at` is the resume time plus that remainder (`workspace.yml`, Turn Timer). Restoring one of two deficient teams clears only that team's deadline; the pause continues until both are valid.

  ```json
  {
    "type": "game.staffing.restored",
    "event_id": "evt_0601",
    "room_id": 1001,
    "sent_at": "2026-09-10T08:46:35Z",
    "payload": {
      "game_id": 5001,
      "restored_teams": ["RED"],
      "current_turn": {
        "team": "RED",
        "phase": "GUESSING",
        "clue": {"word": "ocean", "number": 2},
        "guesses_remaining": 2,
        "deadline_at": null
      }
    }
  }
  ```

  If either team's deadline expires first, the game is cancelled without a winner and the room shuts down. The server emits `game.cancelled`, then `room.closed`, then closes every room socket with `4404`. It clears every remaining membership (`active_room_id` becomes `null`), all temporary room and game state, and ROOM chat access, and releases the room code. No `room.post_game.started` follows and there is no post-game decision window. Clients return every remaining member to the Lobby with a notice built from `room.closed.payload.reason`.

  ```json
  {
    "type": "game.cancelled",
    "event_id": "evt_0602",
    "room_id": 1001,
    "sent_at": "2026-09-10T08:48:00Z",
    "payload": {
      "game_id": 5001,
      "winner": null,
      "loser": null,
      "end_reason": "INSUFFICIENT_PLAYERS",
      "deficient_team": "RED",
      "score": {"red": 2, "blue": 2},
      "room_status": "CLOSED",
      "game_status": "GAME_CANCELLED",
      "phase": "GAME_OVER",
      "finished_at": "2026-09-10T08:48:00Z"
    }
  }
  ```

  ```json
  {
    "type": "room.closed",
    "event_id": "evt_0603",
    "room_id": 1001,
    "sent_at": "2026-09-10T08:48:00Z",
    "payload": {
      "reason": "INSUFFICIENT_PLAYERS",
      "game_id": 5001,
      "deficient_team": "RED",
      "closed_at": "2026-09-10T08:48:00Z"
    }
  }
  ```

  | Field | Type | Required | Nullable | Allowed values | Description |
  | --- | --- | ---: | ---: | --- | --- |
  | `payload.reason` | enum | yes | no | `INSUFFICIENT_PLAYERS` | Why the room closed while members remained |
  | `payload.game_id` | integer | yes | no | positive | Cancelled game |
  | `payload.deficient_team` | enum | yes | no | `RED`, `BLUE` | Team whose deadline expired first |
  | `payload.closed_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Closure time |

  Cancellation is an operational outcome, not a competitive result: it creates no winner, loss, match-history row, or `match.finalized` record. A later REST snapshot or join of the closed room returns `404 ROOM_NOT_FOUND`.
