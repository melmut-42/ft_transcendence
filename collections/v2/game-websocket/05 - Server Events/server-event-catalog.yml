info:
  name: Server event catalog
  type: websocket
  seq: 1
  tags: [server-event, reference]
websocket:
  url: "{{wsUrl}}/ws/{{gameApiVersion}}/rooms/{{roomId}}"
settings:
  timeout: 30000
  keepAliveInterval: 20000
docs: |-
  # Server event catalog

  ## Purpose

  Passive observer and schema reference for canonical server event names. It sends no application message. Command acknowledgements/errors are requester-only; domain events go to connected room members using recipient-safe projection.

  ## Connection parameters

  | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |
  | --- | --- | ---: | --- | --- | ---: | --- | --- |
  | `room_id` | WebSocket path | yes | integer | positive | no | Observed room | `1001` |
  | `ft_session` cookie | handshake | yes | string | HttpOnly, Secure, active session | no | Sole handshake credential; automatic on same-origin upgrade | set by Register/Login |

  ## Common envelope fields

  | Field | Type | Required | Nullable | Allowed values | Description |
  | --- | --- | ---: | ---: | --- | --- |
  | `type` | string enum | yes | no | event matrix below | Event discriminator |
  | `event_id` | string | yes | no | unique, monotonically ordered in room | Resume/order marker |
  | `room_id` | integer | yes | no | positive | Domain room ID |
  | `sent_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Server emission time |
  | `payload` | object | yes | no | type-specific | Event data |

  ## Event payload matrix

  | Type | Required payload fields | Trigger | Projection |
  | --- | --- | --- | --- |
  | `room.state` | `room` | connect, recovery, room mutation | per recipient when game exists |
  | `room.player.joined` | `player`, `host_user_id`, `player_count`, `room_status` | REST join | common |
  | `room.player.left` | membership fields plus `reason`; optional `kicked_by_user_id` | Exit, logout, disconnect expiry, host kick, post-game timeout | common |
  | `room.player.returned_to_lobby` | user, previous game, room/member state | accepted `room.lobby.return` | common |
  | `room.post_game.started` | game ID, deadline, pending users | immediately after `game.ended` or `game.cancelled` | common |
  | `room.post_game.completed` | room status, remaining members | pending set becomes empty | common |
  | `room.settings.updated` | `max_players`, `player_count`, `changed_by_user_id` | host `room.settings.update` | common |
  | `room.player.updated` | `player`, `changed_fields`, `room_status`, `startable` | team, role, ready | common |
  | `room.countdown.started` | `seconds_remaining=3` | full start predicate becomes true | common |
  | `room.countdown.tick` | `seconds_remaining` | server timer | common |
  | `room.countdown.cancelled` | `reason`, `changed_by_user_id` | predicate becomes false | common |
  | `game.started` | `room` containing `game` | valid countdown reaches zero | role-safe board |
  | `game.clue.submitted` | `game_id`, actor, team, clue, guesses, turn | accepted clue | common |
  | `game.card.revealed` | game/card/actor/team/score/turn/result | accepted guess | role-safe board delta |
  | `game.score.updated` | `game_id`, `score`, `changed_color` | RED or BLUE reveal | common |
  | `game.turn.changed` | game ID, previous team, reason, current turn, score | non-terminal turn end | common |
  | `game.ended` | winner, loser, reason, revealed card, score, `room_status=POST_GAME`, `game_status=GAME_FINISHED`, phase, post-game deadline, time | terminal reveal | contains only the revealed terminal card; no hidden-board disclosure |
  | `game.staffing.required` | missing roles and `deadline_at` per deficient team | live composition becomes invalid | common |
  | `game.staffing.restored` | restored teams and resumed turn/phase | both teams become valid before deadlines | role-safe state |
  | `game.cancelled` | null winner/loser, `INSUFFICIENT_PLAYERS`, score, deadline, time | a staffing deadline expires | no match/stat update |

  ## Concrete game events

  ```json
    {
      "type": "game.score.updated",
      "event_id": "evt_0144",
      "room_id": 1001,
      "sent_at": "2026-09-10T08:44:01Z",
      "payload": {
        "game_id": 5001,
        "score": {
          "red": 3,
          "blue": 2
        },
        "changed_color": "RED"
      }
    }
  ```

  ```json
    {
      "type": "game.turn.changed",
      "event_id": "evt_0148",
      "room_id": 1001,
      "sent_at": "2026-09-10T08:44:20Z",
      "payload": {
        "game_id": 5001,
        "previous_team": "RED",
        "reason": "NEUTRAL_CARD_REVEALED",
        "current_turn": {
          "team": "BLUE",
          "phase": "WAITING_FOR_CLUE",
          "clue": null,
          "guesses_remaining": null
        },
        "score": {
          "red": 3,
          "blue": 2
        }
      }
    }
  ```

  ```json
    {
      "type": "game.card.revealed",
      "event_id": "evt_0143",
      "room_id": 1001,
      "sent_at": "2026-09-10T08:44:01Z",
      "payload": {
        "game_id": 5001,
        "card": {
          "card_id": 5,
          "word": "OCEAN",
          "revealed": true,
          "color": "RED"
        },
        "guessed_by_user_id": 43,
        "guessing_team": "RED",
        "score": {
          "red": 3,
          "blue": 2
        },
        "current_turn": {
          "team": "RED",
          "phase": "GUESSING",
          "clue": {
            "word": "ocean",
            "number": 2
          },
          "guesses_remaining": 2
        },
        "winner": null,
        "end_reason": null
      }
    }
  ```

  ## Acknowledgement schema

  Acks are not room events and omit `event_id`, `room_id`, and `sent_at`:

  | Field | Type | Required | Nullable | Allowed values | Description |
  | --- | --- | ---: | ---: | --- | --- |
  | `type` | string enum | yes | no | `ack` | Response discriminator |
  | `request_id` | string | yes | no | echoed request | Correlation/idempotency ID |
  | `ok` | boolean | yes | no | `true` | Acceptance flag |
  | `payload` | object | yes | no | command-specific result | Authoritative post-command values |

  ## Invariants

  A terminal `game.ended` is final for the match and no `game.turn.changed` follows it. The same atomic terminal transition appends an internal `match.finalized` outbox record containing the complete pre-departure roster and timestamps; that integration record is not sent to clients and Stats deduplicates it by `game_id`. An Operative event never leaks any unrelated unrevealed card color, including after `POST_GAME`. Duplicate request IDs do not duplicate domain events.

  ## Insufficient-player cancellation example

  RED remains without a Spymaster until its 120-second staffing deadline expires:

  ```json
    {
      "type": "game.cancelled",
      "event_id": "evt_0190",
      "room_id": 1001,
      "sent_at": "2026-09-10T08:46:30Z",
      "payload": {
        "game_id": 5001,
        "winner": null,
        "loser": null,
        "end_reason": "INSUFFICIENT_PLAYERS",
        "deficient_team": "RED",
        "revealed_card": null,
        "score": {
          "red": 2,
          "blue": 2
        },
        "room_status": "POST_GAME",
        "game_status": "GAME_CANCELLED",
        "phase": "GAME_OVER",
        "post_game_deadline_at": "2026-09-10T08:47:30Z",
        "finished_at": "2026-09-10T08:46:30Z"
      }
    }
  ```
