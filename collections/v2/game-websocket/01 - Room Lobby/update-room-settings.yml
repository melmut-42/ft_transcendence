info:
  name: Update room settings
  type: websocket
  seq: 2
  tags: [action, room]
websocket:
  url: "{{wsUrl}}/ws/{{gameApiVersion}}/rooms/{{roomId}}"
  message:
    - title: Success - Host lowers capacity to 6
      selected: true
      message:
        type: json
        data: |-
          {
            "type": "room.settings.update",
            "request_id": "req_0003",
            "payload": {
              "max_players": 6
            }
          }
    - title: Success - Host sets a 90-second turn timer
      selected: false
      message:
        type: json
        data: |-
          {
            "type": "room.settings.update",
            "request_id": "req_0005",
            "payload": {
              "turn_timer_seconds": 90
            }
          }
    - title: Error - Turn timer outside the allowed set
      selected: false
      message:
        type: json
        data: |-
          {
            "type": "room.settings.update",
            "request_id": "req_0006",
            "payload": {
              "turn_timer_seconds": 45
            }
          }
    - title: Error - Below current player count
      selected: false
      message:
        type: json
        data: |-
          {
            "type": "room.settings.update",
            "request_id": "req_0004",
            "payload": {
              "max_players": 4
            }
          }
    - title: Error - Not host
      selected: false
      message:
        type: json
        data: |-
          {
            "type": "room.settings.update",
            "request_id": "req_0011",
            "payload": {
              "max_players": 8
            }
          }
docs: |-
  # Update room settings

  ## Purpose and preconditions

  Changes the room settings: player capacity, per-turn timer, and word-pack language. Only the current host (the Room Owner) may send it, only while the room is `WAITING`, and only after that host's member state is `IN_LOBBY`. The payload carries at least one of the three fields; an omitted field keeps its current value.

  A new room starts with `max_players: 8`, `turn_timer_seconds: null` and `language: "en"`. What a running turn timer does is defined in `workspace.yml`, Turn Timer.

  ## Message and payload parameters

  | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |
  | --- | --- | ---: | --- | --- | ---: | --- | --- |
  | `room_id` | WebSocket path | yes | integer | positive | no | Connected room | `1001` |
  | `ft_session` cookie | handshake | yes | string | HttpOnly, Secure, active session | no | Sole handshake credential; automatic on same-origin upgrade | set by Register/Login |
  | `type` | envelope | yes | string enum | `room.settings.update` | no | Operation | `room.settings.update` |
  | `request_id` | envelope | yes | string | `1..64` visible ASCII, unique | no | Idempotency key | `req_0003` |
  | `payload.max_players` | payload | no | integer | `4..20` and `>= player_count` | no | New capacity, counting spectators | `6` |
  | `payload.turn_timer_seconds` | payload | no | integer or null | `null`, `60`, `90`, `120`; `null` means no limit | yes | Per-turn time limit | `90` |
  | `payload.language` | payload | no | string | `en` | no | Language of the board's word pack | `en` |

  ## Success, state, and emitted events

  The requester receives an ack, then every member receives `room.settings.updated` followed by `room.state`. Both carry the full current settings, not only the changed fields. Team, role, and readiness do not change.

  ```json
    {
      "type": "ack",
      "request_id": "req_0003",
      "ok": true,
      "payload": {
        "max_players": 6,
        "turn_timer_seconds": null,
        "language": "en",
        "room_status": "WAITING"
      }
    }
  ```

  ```json
    {
      "type": "room.settings.updated",
      "event_id": "evt_0011",
      "room_id": 1001,
      "sent_at": "2026-09-10T08:41:25Z",
      "payload": {
        "max_players": 6,
        "turn_timer_seconds": null,
        "language": "en",
        "player_count": 5,
        "changed_by_user_id": 42
      }
    }
  ```

  | Result field | Type | Required | Nullable | Allowed values | Description |
  | --- | --- | ---: | ---: | --- | --- |
  | `ack.payload.max_players` | integer | yes | no | `4..20` | Accepted capacity |
  | `ack.payload.turn_timer_seconds` | integer or null | yes | yes | `null`, `60`, `90`, `120` | Current per-turn limit |
  | `ack.payload.language` | string | yes | no | `en` | Current word-pack language |
  | `ack.payload.room_status` | enum | yes | no | `WAITING` | Post-command state |
  | `room.settings.updated.payload.max_players` | integer | yes | no | `4..20` | New capacity |
  | `room.settings.updated.payload.turn_timer_seconds` | integer or null | yes | yes | `null`, `60`, `90`, `120` | Current per-turn limit |
  | `room.settings.updated.payload.language` | string | yes | no | `en` | Current word-pack language |
  | `room.settings.updated.payload.player_count` | integer | yes | no | `>= 1` | Current membership |
  | `room.settings.updated.payload.changed_by_user_id` | integer | yes | no | host ID | Actor |

  ## Errors

  - `NOT_HOST`: the sender is a member but not the current host.
  - `INVALID_PAYLOAD`: the payload has none of the three fields; `max_players` is not an integer, outside `4..20`, or below the current `player_count`; or `turn_timer_seconds` is not one of `null`, `60`, `90`, `120`; or `language` is not `en`.
  - `INVALID_ROOM_STATE`: the room is not `WAITING`.
  - `NOT_ROOM_MEMBER`: the session user is outside the room.

  ```json
    {
      "type": "error",
      "request_id": "req_0004",
      "error": {
        "code": "INVALID_PAYLOAD",
        "message": "payload.max_players cannot be lower than the current player count (5).",
        "details": {
          "field": "payload.max_players",
          "min": 5,
          "max": 8
        }
      }
    }
  ```

  ```json
    {
      "type": "error",
      "request_id": "req_0006",
      "error": {
        "code": "INVALID_PAYLOAD",
        "message": "payload.turn_timer_seconds must be one of null, 60, 90, 120.",
        "details": {
          "field": "payload.turn_timer_seconds",
          "allowed": [null, 60, 90, 120]
        }
      }
    }
  ```

  ```json
    {
      "type": "error",
      "request_id": "req_0011",
      "error": {
        "code": "NOT_HOST",
        "message": "Only the host can change room settings.",
        "details": {
          "host_user_id": 42
        }
      }
    }
  ```
