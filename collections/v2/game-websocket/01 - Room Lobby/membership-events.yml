info:
  name: Membership event reference
  type: websocket
  seq: 1
  tags: [server-event, room]
websocket:
  url: "{{wsUrl}}/ws/{{gameApiVersion}}/rooms/{{roomId}}"
settings:
  timeout: 30000
  keepAliveInterval: 20000
docs: |-
  # Membership event reference

  ## Purpose and trigger

  Observes membership changes produced by join, Exit, host kick, disconnect expiry, and post-game timeout. `room.player.joined` occurs only in `WAITING`; `room.player.left` may occur in any non-closed state.

  ## Connection parameters

  | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |
  | --- | --- | ---: | --- | --- | ---: | --- | --- |
  | `room_id` | WebSocket path | yes | integer | positive | no | Observed room | `1001` |
  | `ft_session` cookie | handshake | yes | string | HttpOnly, Secure, active session | no | Sole handshake credential; automatic on same-origin upgrade | set by Register/Login |

  ## Event fields

  | Field | Type | Required | Nullable | Allowed values | Description |
  | --- | --- | ---: | ---: | --- | --- |
  | `type` | string enum | yes | no | `room.player.joined`, `room.player.left` | Membership change |
  | `event_id` | string | yes | no | room-unique | Ordered event ID |
  | `room_id` | integer | yes | no | positive | Affected room |
  | `sent_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Event time |
  | `payload.player` | object | yes | no | member schema | Joined/left identity and temporary selections at change time |
  | `payload.player.user_id` | integer | yes | no | positive | Affected member |
  | `payload.player.username` | string | yes | no | username rule | Affected username |
  | `payload.player.avatar_url` | string | yes | no | same-origin URL | Affected member's current avatar |
  | `payload.player.team` | enum or null | yes | yes | `RED`, `BLUE`, `null` | Temporary team |
  | `payload.player.role` | enum | yes | no | `SPYMASTER`, `OPERATIVE`, `SPECTATOR` | New joins are always `SPECTATOR` |
  | `payload.player.ready` | boolean | yes | no | `true`, `false` | Readiness at change time |
  | `payload.player.state` | enum | yes | no | `IN_LOBBY`, `IN_GAME`, `POST_GAME` | Member lifecycle state at removal/join |
  | `payload.reason` | enum | leave only | no | `EXITED`, `SESSION_ENDED`, `DISCONNECTED`, `POST_GAME_TIMEOUT`, `KICKED_BY_HOST`, `ACCOUNT_DELETED` | Why membership ended; logout is distinct from transport grace expiry |
  | `payload.kicked_by_user_id` | integer | kick only | no | current host ID | Actor for `KICKED_BY_HOST` |
  | `payload.host_user_id` | integer or null | yes | yes | remaining member ID or `null` | Host after change; null only when room closes empty |
  | `payload.player_count` | integer | yes | no | `>= 0` | Membership after change |
  | `payload.room_status` | enum | yes | no | `WAITING`, `COUNTDOWN`, `IN_GAME`, `POST_GAME`, `CLOSED` | State after membership processing |

  ## State behavior and ordering

  Join initializes team/role to null, ready false, and state `IN_LOBBY`. Leave clears the user's active room. Host transfer prefers the earliest-joined `IN_LOBBY` member, otherwise the earliest remaining member. Countdown removal first produces `room.countdown.cancelled`, then `room.player.left`, then `room.state`. A kick additionally closes the target's sockets with `4403`. During `IN_GAME`, a participant's `room.player.left` is followed by `game.staffing.required` when the departure leaves a team deficient. When a staffing deadline closes the room, no per-member `room.player.left` is sent; `room.closed` replaces them.

  ## Concrete events

  ```json
    {
      "type": "room.player.joined",
      "event_id": "evt_0104",
      "room_id": 1001,
      "sent_at": "2026-09-10T08:41:20Z",
      "payload": {
        "player": {
          "user_id": 43,
          "username": "red_agent",
          "team": null,
          "role": "SPECTATOR",
          "ready": false,
          "state": "IN_LOBBY",
          "is_host": false,
          "joined_at": "2026-09-10T08:41:20Z"
        },
        "host_user_id": 42,
        "player_count": 2,
        "room_status": "WAITING"
      }
    }
  ```

  ```json
    {
      "type": "room.player.left",
      "event_id": "evt_0110",
      "room_id": 1001,
      "sent_at": "2026-09-10T08:42:05Z",
      "payload": {
        "player": {
          "user_id": 42,
          "username": "player_one",
          "team": "RED",
          "role": "SPYMASTER",
          "ready": false,
          "state": "IN_LOBBY",
          "is_host": true,
          "joined_at": "2026-09-10T08:41:00Z"
        },
        "reason": "EXITED",
        "host_user_id": 43,
        "player_count": 3,
        "room_status": "WAITING"
      }
    }
  ```

  No client command error applies because the source operation is REST; consult the REST join/leave requests for errors.
