  name: Kick room member
  type: websocket
  seq: 4
  tags: [action, room, host]
websocket:
  url: "{{wsUrl}}/ws/{{gameApiVersion}}/rooms/{{roomId}}"
  message:
    - title: Success - Host kicks member
      selected: true
      message:
        type: json
        data: |-
          {
            "type": "room.member.kick",
            "request_id": "req_0600",
            "payload": {
              "user_id": 44
            }
