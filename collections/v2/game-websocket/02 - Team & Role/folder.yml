docs: |-
  # Team and role

  Every member starts as `team:null`, `role:SPECTATOR`, `ready:false`. To participate, a spectator atomically claims `{team: RED|BLUE, role: SPYMASTER|OPERATIVE}` through `room.role.select`. A team may have exactly one Spymaster and one or more Operatives. Returning to `SPECTATOR` atomically clears team and readiness. During `IN_GAME`, only spectator-to-participant claims are allowed; existing participants cannot switch teams or roles.
