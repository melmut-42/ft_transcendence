info:
  name: Get message history
  type: http
  seq: 3
  tags: [chat, channels, history]
http:
  method: GET
  url: "{{baseUrl}}/api/{{chatApiVersion}}/channels/{{channelId}}/messages?limit=50"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: limit
      value: "50"
    - name: before
      value: ""
      enabled: false
docs: |-
  # Get retained message history

  Returns newest-first cursor pagination for a channel the authenticated user participates in and can currently access. Channel Service obtains a current verdict from User/Auth for `DIRECT` friendship and from Game Session for `ROOM` state; its asynchronous lifecycle projection is not sufficient by itself. For `ROOM`, the requester must be `IN_LOBBY` while its room is `WAITING`/`COUNTDOWN`, or `IN_GAME` while its room is `IN_GAME`. `POST_GAME`, Exit, kick, and timeout revoke ROOM history access.

  ROOM history is additionally bounded by the requester's current room-membership epoch and its sequence-based visibility windows. Join opens the first window after the channel's current monotonic sequence; `game.ended` closes it; Back to Lobby opens another window after the then-current sequence without starting a new membership epoch; Exit, kick, or timeout closes the epoch, and a later rejoin starts a new one. Only messages whose internal sequence falls inside one of the current epoch's visibility windows are returned. This avoids timestamp/clock races, prevents pre-join disclosure, and prevents a late returner from reading lobby messages sent while they were still `POST_GAME`. `limit` defaults to 50 and accepts `1..100`; optional `before` is the opaque `next_cursor` from the previous response.

  Each item contains `message_id`, `channel_id`, `sender_user_id`, `text`, `sent_at`, and `expires_at`. Expired messages are physically deleted by Channel Service and never returned. `data.next_cursor` is nullable.

  Errors: `401 UNAUTHORIZED`, `403 NOT_CHANNEL_MEMBER`, `403 CHANNEL_ACCESS_REVOKED`, `404 CHANNEL_NOT_FOUND`, and `422 VALIDATION_ERROR`. `CHANNEL_ACCESS_REVOKED` means a DIRECT friendship ended or a ROOM participant no longer has an eligible member state.
examples:
  - name: Success - Retained history
    request: {url: "{{baseUrl}}/api/{{chatApiVersion}}/channels/7001/messages?limit=50", method: GET, headers: [], params: [{name: limit, value: "50", enabled: true}], body: {mode: none}}
    response:
      status: 200
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: '{"data":{"messages":[{"message_id":"msg_001","channel_id":7001,"sender_user_id":42,"text":"gg, ready?","sent_at":"2026-09-17T10:00:00Z","expires_at":"2026-10-17T10:00:00Z"}],"next_cursor":null}}'
