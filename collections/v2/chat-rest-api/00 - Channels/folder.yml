docs: |-
  # Chat channels

  Channel metadata and retained message history are served through the Web BFF. The BFF delegates ownership to Channel Service; clients never call Channel Service directly. Live messages use the separate `Chat WebSocket v2` collection.

  Version 2 has two channel types. `DIRECT` is a canonical private conversation between exactly two active friends with no block in either direction; shared-room membership never creates a direct channel. `ROOM` is one common channel created automatically with a room and identified by `room_id`; all currently eligible room members use it.

  ROOM access follows the member state rather than shared room status alone: `IN_LOBBY` can access during `WAITING`/`COUNTDOWN`, and `IN_GAME` can access during `IN_GAME`. `POST_GAME` cannot access. Back to Lobby restores that member's access; Exit, kick, timeout, and room closure remove it. DIRECT access requires an active friendship with no block in either direction. List, history, send, and read-position updates re-evaluate the applicable rule; stored participation alone never grants access. A running match makes the player's channels `READ_ONLY`: history and read-position updates remain available, while sending is rejected until the match pauses or ends.

  Messages are durable for 30 days by default; the deployment may configure the retention period, and every message exposes its exact `expires_at` timestamp. Inactive history remains stored until expiration but cannot be listed or read without current access. A ROOM membership epoch owns one or more visibility windows over the channel's monotonic message sequence. Join opens the first window after the current high-water mark; `game.ended` closes it; Back to Lobby opens a new one; Exit/kick/timeout closes the epoch. History is the union of messages inside those windows. This ordering model—not cross-service wall-clock comparison—prevents both pre-join disclosure and disclosure of messages sent while that member remained `POST_GAME`. ROOM-channel creation and membership synchronization are internal, idempotent Game Session outbox → Channel Service operations, not public client endpoints.

  Read positions are stored in PostgreSQL per `(channel_id, user_id)` for DIRECT and per `(channel_id, user_id, membership_epoch_id)` for ROOM. Channel Service resolves `last_read_message_id` to its internal channel sequence and only advances the position. All of a user's sessions and devices share that position. Back to Lobby keeps the current epoch's position; rejoining starts a new read scope. Messages outside a user's ROOM visibility windows never become readable or read through a higher position. Reading REST responses does not change this state; the client sends the WebSocket `chat.channel.read` command explicitly.

  The caller's `read_state` is `{last_read_message_id, read_at, version}`. An untouched scope has null message/time fields. `version` is a non-negative integer increasing for this channel/user whenever its read position advances or a rejoin resets the scope; it never rolls back across membership epochs. An initial state has version 0. Clients discard older live versions and use REST snapshots to recover missed events. Retention does not reset the stored sequence; the caller's last-read identifier may refer to a message that has since expired.
