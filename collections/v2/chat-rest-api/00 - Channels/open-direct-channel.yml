info:
  name: Open direct channel
  type: http
  seq: 2
  tags: [chat, channels]
http:
  method: POST
  url: "{{baseUrl}}/api/{{chatApiVersion}}/channels/direct"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "peer_user_id": 43
      }
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 || res.status === 201) {
          bru.setVar("channelId", String(res.body.data.channel_id));
        }
docs: |-
  # Open direct channel

  Resolves the canonical private `DIRECT` channel for the authenticated user and `peer_user_id`. Returns `201 Created` when Channel Service creates it and `200 OK` when the friends already have a channel.

  The users must currently be friends. Sharing a lobby or game never authorizes this endpoint; room-wide conversation uses the automatically created `ROOM` channel. If a canonical channel exists after friendship removal, this endpoint does not disclose it and returns `403 NOT_PERMITTED`; restoring friendship makes the same channel resolvable again.

  The response contains `data.channel_id`, `data.type=DIRECT`, `data.peer` (`user_id`, `username`, `avatar_url`, `is_online`), and `data.created_at`.

  A newly created channel publishes `chat.channel.available` with reason `DIRECT_CREATED` to both users' active Chat Gateway sockets. Resolving an already visible channel emits no duplicate event.

  Errors: `401 UNAUTHORIZED`, `403 NOT_PERMITTED`, `404 USER_NOT_FOUND`, and `422 VALIDATION_ERROR`.
examples:
  - name: Success - Existing channel
    request: {url: "{{baseUrl}}/api/{{chatApiVersion}}/channels/direct", method: POST, headers: [{name: Content-Type, value: application/json, enabled: true}], params: [], body: {mode: json, json: '{"peer_user_id":43}'}}
    response: {status: 200, headers: [{name: Content-Type, value: application/json}], body: {type: json, data: '{"data":{"channel_id":7001,"type":"DIRECT","peer":{"user_id":43,"username":"red_agent","avatar_url":"/static/avatars/default/43.svg","is_online":true},"created_at":"2026-09-10T08:00:00Z"}}'}}
