info:
  name: List my channels
  type: http
  seq: 1
  tags: [chat, channels]
http:
  method: GET
  url: "{{baseUrl}}/api/{{chatApiVersion}}/channels"
  headers:
    - name: Accept
      value: application/json
docs: |-
  # List my channels

  Returns the authenticated user's currently accessible `DIRECT` and `ROOM` channels, newest caller-visible activity first. Channel Service obtains a current type-specific authorization verdict from User/Auth or Game Session before producing the list; inaccessible channels are omitted.

  Common fields are `channel_id`, `type` (`DIRECT`, `ROOM`), and nullable `last_message`. A DIRECT item contains `peer` and `room:null`; a ROOM item contains `room` (`room_id`, `room_code`) and `peer:null`. A non-null last message contains `message_id`, `sender_user_id`, `text`, `sent_at`, and `expires_at`. For ROOM, `last_message` and sort position use only the caller's current membership epoch and visibility windows; pre-join and temporarily inaccessible `POST_GAME` messages affect neither preview nor ordering.

  Errors: `401 UNAUTHORIZED` for an invalid session.
examples:
  - name: Success - Direct and room channels
    request: {url: "{{baseUrl}}/api/{{chatApiVersion}}/channels", method: GET, headers: [], params: [], body: {mode: none}}
    response:
      status: 200
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: '{"data":{"channels":[{"channel_id":8001,"type":"ROOM","peer":null,"room":{"room_id":1001,"room_code":"ABCD12"},"last_message":null},{"channel_id":7001,"type":"DIRECT","peer":{"user_id":43,"username":"red_agent","avatar_url":"/static/avatars/default/43.svg","is_online":true},"room":null,"last_message":{"message_id":"msg_001","sender_user_id":42,"text":"gg, ready?","sent_at":"2026-09-17T10:00:00Z","expires_at":"2026-10-17T10:00:00Z"}}]}}'
