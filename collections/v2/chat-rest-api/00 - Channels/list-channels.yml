info:
  name: List my channels
  type: http
  seq: 1
  tags: [chat, channels]
http:
  method: GET
  url: "{{baseUrl}}/api/{{chatApiVersion}}/channels?limit=50"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: limit
      value: "50"
docs: |-
  # List my channels

  Returns the authenticated user's currently accessible `DIRECT` and `ROOM` channels with cursor pagination, newest caller-visible activity first. Channel Service obtains a current type-specific authorization verdict from User/Auth or Game Session before producing the list; inaccessible channels are omitted.

  Optional query parameters are `limit` (`1..100`, default `50`) and opaque `after`. The response contains `data.channels[]` and nullable `data.next_cursor`. Ordering uses caller-visible activity time descending, then `channel_id` descending. The cursor is scoped to the authenticated user.

  Common fields are `channel_id`, `type` (`DIRECT`, `ROOM`), `access`, `access_reason`, nullable `last_message`, the caller's `read_state`, and integer `unread_count`. `access` is `ACTIVE` (read and send) or `READ_ONLY` (read only, while the caller plays a running match); `access_reason` is `GAME_RUNNING` with `READ_ONLY` and `null` otherwise, so a reconnecting client restores the restriction from this list. A DIRECT item contains `peer` and `room:null`; a ROOM item contains `room` (`room_id`, `room_code`) and `peer:null`. A non-null last message contains `message_id`, `sender_user_id`, `text`, `sent_at`, and `expires_at`. For ROOM, `last_message` and sort position use only the caller's current membership epoch and visibility windows; pre-join and temporarily inaccessible `POST_GAME` messages affect neither preview nor ordering.

  `read_state` contains nullable `last_read_message_id`, nullable server timestamp `read_at`, and non-negative integer `version`; both nullable fields are null before the caller advances this scope. `unread_count` counts retained, unexpired messages sent by other users with internal sequence above the caller's read position, after applying current access and ROOM visibility windows. It is a filtered count, never the subtraction of two sequence numbers. The caller's own messages and inaccessible/expired messages are excluded. A read receipt does not change channel activity ordering.

  Errors: `401 UNAUTHORIZED` for an invalid session; `422 VALIDATION_ERROR` for invalid `limit` or cursor.
examples:
  - name: Success - Direct and room channels
    request: {url: "{{baseUrl}}/api/{{chatApiVersion}}/channels?limit=50", method: GET, headers: [], params: [{name: limit, value: "50", enabled: true}], body: {mode: none}}
    response:
      status: 200
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: '{"data":{"channels":[{"channel_id":8001,"type":"ROOM","peer":null,"room":{"room_id":1001,"room_code":"ABCD12"},"access":"ACTIVE","access_reason":null,"last_message":null,"read_state":{"last_read_message_id":null,"read_at":null,"version":0},"unread_count":0},{"channel_id":7001,"type":"DIRECT","peer":{"user_id":43,"username":"red_agent","avatar_url":"/static/avatars/default/43.svg","is_online":true},"room":null,"access":"ACTIVE","access_reason":null,"last_message":{"message_id":"msg_001","sender_user_id":42,"text":"gg, ready?","sent_at":"2026-09-17T10:00:00Z","expires_at":"2026-10-17T10:00:00Z"},"read_state":{"last_read_message_id":null,"read_at":null,"version":0},"unread_count":0}],"next_cursor":null}}'
