docs: |-
  # Chat Gateway

  Auth Service validates the socket session; User Service owns canonical profiles, social notifications, current friendship/block verdicts and presence queries. Channel Service obtains DIRECT authorization from User and ROOM authorization from Game Session. Authenticating a socket is separate from authorizing a channel operation.

  Live chat is an independently deployable gateway, separate from the Game Gateway. The browser connects to the same public origin at `{{chatWsUrl}}/ws/{{chatApiVersion}}/channels`; the reverse proxy routes that path directly to Chat Gateway, so chat traffic does not pass through the Web BFF or Game Gateway.

  Version 2 supports friend-only private `DIRECT` channels and common `ROOM` channels. Exactly one ROOM channel is created automatically when a room is created; joining does not create pairwise direct channels. Channel records, retained history, read positions, inbox/request ledgers, and the transactional outbox belong to chat-service (Channel Service). Chat Gateway authenticates the connection, associates sockets with `user_id` and `session_id`, accepts channel commands, publishes them through RabbitMQ, and fans Channel Service events out to active sockets. Channel Service's own outbox publisher publishes committed events; the Gateway does not access its PostgreSQL tables.

  DIRECT access requires an active friendship with no block in either direction. ROOM access requires the caller to be `IN_LOBBY` during `WAITING`/`COUNTDOWN`, or `IN_GAME` during `IN_GAME`. `game.ended` immediately removes ROOM access from every `POST_GAME` member; Back to Lobby restores it independently. Exit, kick, timeout, and room closure remove it. A running match makes all of the player's channels `READ_ONLY`: sends fail with `CHANNEL_READ_ONLY`, but history and read-position updates remain available. Messages are retained for 30 days by default even while access is inactive, but cannot be read or extended until authorization returns.

  The frontend sends `chat.channel.read` with the last displayed message ID to explicitly acknowledge a visible prefix of its conversation. Channel Service validates access and message visibility, atomically updates read state, command ledger, and outbox, then returns a success ack. The outbox publisher sends `chat.channel.read.updated` through RabbitMQ. User-wide read state synchronizes tabs/devices; ROOM history/read positions stay bounded by current membership epochs and visibility windows. Broker acknowledgement and socket delivery are distinct from user read acknowledgement.
