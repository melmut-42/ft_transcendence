info:
  name: Social events
  type: websocket
  seq: 6
  tags: [server-event, friends, blocking, profile]
websocket:
  url: "{{chatWsUrl}}/ws/{{chatApiVersion}}/channels"
docs: |-
  # Social events

  User/Auth publishes friend request, friendship and profile changes through RabbitMQ, and Chat Gateway delivers them to every active Chat v2 socket of each affected user, including the acting user's other tabs. They are live notifications only: nothing is replayed after a reconnect, so a client reads `GET /api/v1/friends` and `GET /api/v1/friends/requests` again after every `chat.ready` that follows a drop. Each event has a stable `event_id`; Chat Gateway deduplicates broker redelivery.

  | Type | Sent to | When | Payload |
  | --- | --- | --- | --- |
  | `friend.request.received` | recipient and sender | `Send friend request` succeeded | `request` (friend request object, `status: PENDING`) |
  | `friend.request.resolved` | recipient and sender | a pending request was accepted, declined, cancelled by its sender, or cancelled by a block | `request_id`, `from_user_id`, `to_user_id`, `status` (`ACCEPTED`, `DECLINED`, `CANCELLED`), `friend` (`ACCEPTED` only: the other user as a `List friends` entry, from the recipient socket's point of view) |
  | `friend.removed` | both users | a friendship was removed, or suspended by a block | `user_id` (the other user, from the recipient socket's point of view) |
  | `friend.restored` | both users | a suspended friendship became active after the last block was lifted | `friend` (the other user as a `List friends` entry) |
  | `user.profile.updated` | the user, their friends, and the other side of each of their pending friend requests | `Update own profile` changed the username, or `Upload avatar` or `Select avatar preset` changed the avatar | `user_id`, `username`, `avatar_url` (the user's current values after the change) |

  A block is never named in these events: the blocked user sees `friend.removed` and `friend.request.resolved` with `CANCELLED`, exactly as for an ordinary removal or a withdrawn request.

  ```json
  {
    "type": "friend.request.received",
    "event_id": "evt_c040",
    "sent_at": "2026-09-10T08:41:00Z",
    "payload": {
      "request": {
        "request_id": 702,
        "from_user": {"user_id": 46, "username": "extra_red", "avatar_url": "/static/avatars/default/46.svg"},
        "to_user": {"user_id": 42, "username": "player_one", "avatar_url": "/static/avatars/default/42.svg"},
        "status": "PENDING",
        "created_at": "2026-09-10T08:41:00Z"
      }
    }
  }
  ```

  ```json
  {
    "type": "friend.request.resolved",
    "event_id": "evt_c041",
    "sent_at": "2026-09-10T08:42:00Z",
    "payload": {
      "request_id": 702,
      "from_user_id": 46,
      "to_user_id": 42,
      "status": "ACCEPTED",
      "friend": {"user_id": 42, "username": "player_one", "avatar_url": "/static/avatars/default/42.svg", "is_online": true}
    }
  }
  ```

  The event above is the copy user `46` receives: `friend` is the other user, `player_one`. User `42` receives the same event with `friend` set to `extra_red`.

  A client applies `user.profile.updated` wherever it shows that user: the friend list, friend requests, direct-channel peers and chat sender names, and, for the user's own sessions, their own profile. A blocked user receives no `user.profile.updated` for the user who blocked them. Members of the user's active room learn the change from `room.player.updated` on the room socket instead.

  ```json
  {
    "type": "user.profile.updated",
    "event_id": "evt_c043",
    "sent_at": "2026-09-10T08:45:00Z",
    "payload": {
      "user_id": 42,
      "username": "player_one_updated",
      "avatar_url": "/static/avatars/default/42.svg"
    }
  }
  ```

  ```json
  {
    "type": "friend.removed",
    "event_id": "evt_c042",
    "sent_at": "2026-09-10T08:50:00Z",
    "payload": {
      "user_id": 45
    }
  }
  ```
