docs: |-
  # Channel read events

  Chat-service (Channel Service) creates `chat.channel.read.updated` only when a persisted read position advances. The state change, terminal command result, and outgoing event commit in one PostgreSQL transaction. Its outbox publisher publishes the event to RabbitMQ; Chat Gateway consumes it and sends authorized socket notifications. The reader's successful command ack and this event are distinct frames.

  Example: user 43 has displayed user 42's `msg_001` in their DIRECT channel. User 43's other tabs/devices synchronize their own state, and user 42 can refresh history to obtain `read_by:[43]` for this message.

  ```json
  {
    "type": "chat.channel.read.updated",
    "event_id": "evt_cr001",
    "sent_at": "2026-09-17T10:00:05Z",
    "payload": {
      "channel_id": 7001,
      "user_id": 43,
      "read_state": {
        "last_read_message_id": "msg_001",
        "read_at": "2026-09-17T10:00:05Z",
        "version": 1
      }
    }
  }
  ```

  ## Recipients and visibility

  The event is delivered to the reader's currently authorized chat sockets, including other tabs/sessions, and to other currently authorized channel members only when its target message is still retained and visible to that recipient. Channel Service supplies the current authorization verdict before Gateway fan-out. An inactive ROOM member, removed or blocked DIRECT friend, or a user who cannot see the acknowledged message receives no peer receipt. The event's internal ROOM membership epoch must still match the reader's current epoch; stale events from a closed epoch are dropped after rejoin. Read-state snapshots for the new epoch are recovered through REST.

  A ROOM read marker covers only that reader's visibility windows in the current epoch. Recipients must not infer that every channel message before the marker was readable by that reader. History's per-message `read_by` applies both users' access/visibility boundaries and is the authority for displaying group receipts. The marker event can trigger a history refresh; the recipient never compares opaque message IDs lexicographically or subtracts them to derive unread counts.

  ## Redelivery and recovery

  Outbox retries and RabbitMQ redelivery retain the same `event_id`. Gateways suppress duplicate live deliveries where possible; clients deduplicate event IDs and keep the highest `read_state.version` per channel/user. Older/equal state versions never roll a read position back. A repeated command or non-advancing target emits no additional event. This synchronization metadata belongs to a user, not a socket session.

  Missing a live receipt does not lose read state: channel lists and history return persisted snapshots after reconnect. REST GETs are read-only. Unread counts include only visible, retained messages by other users above the viewer's own read position, and never count sequence gaps or temporarily inaccessible ROOM messages. Read state and receipts do not change channel activity ordering or message retention.
