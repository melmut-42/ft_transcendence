websocket:
  url: "{{chatWsUrl}}/ws/{{chatApiVersion}}/channels"
docs: |-
  # Room invite events

  The Web BFF routes the room invitation command to Game Session. Its transient notification is published to RabbitMQ and delivered by Chat Gateway to the recipient's active v2 chat sockets. Each accepted REST request has a stable `invite_id` and delivery `expires_at`; Chat Gateway deduplicates RabbitMQ redelivery before multi-tab fan-out and drops an expired event. Separate REST requests create separate invitation IDs.

  ```json
  {
    "type": "room.invite.received",
    "event_id": "evt_c010",
    "sent_at": "2026-09-10T08:41:10Z",
    "payload": {
      "invite_id": "inv_0010",
      "expires_at": "2026-09-10T08:41:40Z",
      "room_id": 1001,
      "room_code": "ABCD12",
      "from_user": {
        "user_id": 42,
        "username": "player_one"
      }
    }
  }
  ```

  Invitations remain transient notifications and are not chat messages. Accepting uses the normal v2 REST Join room endpoint. If the recipient has no Chat Gateway v2 socket at validation time, the command reports `USER_OFFLINE`. A disconnect after `202 Accepted` may still lose the event because invitations are intentionally not retained or replayed.
