info:
  name: Mark channel read
  type: websocket
  seq: 7
  tags: [action, chat, channels, read-receipts]
websocket:
  url: "{{chatWsUrl}}/ws/{{chatApiVersion}}/channels"
  message:
    - title: Success - Mark displayed direct messages read
      selected: true
      message:
        type: json
        data: |-
          {
            "type": "chat.channel.read",
            "request_id": "req_cr001",
            "payload": {
              "channel_id": 7001,
              "last_read_message_id": "msg_001"
            }
          }
    - title: Success - Mark displayed room messages read
      selected: false
      message:
        type: json
        data: |-
          {
            "type": "chat.channel.read",
            "request_id": "req_cr002",
            "payload": {
              "channel_id": 8001,
              "last_read_message_id": "msg_room001"
            }
          }
    - title: Error - Unknown or inaccessible message
      selected: false
      message:
        type: json
        data: |-
          {
            "type": "chat.channel.read",
            "request_id": "req_cr003",
            "payload": {
              "channel_id": 7001,
              "last_read_message_id": "msg_unknown"
            }
          }
docs: |-
  # Mark channel read

  The frontend sends this command after displaying the target message in an active, visible conversation. It acknowledges the visible prefix through that message, rather than recording a separate row for each message. Loading history, receiving a socket event, publishing a command, or a RabbitMQ acknowledgement does not itself mark anything read. A hidden/background tab must not advance the position merely because it received messages.

  Required fields are `type=chat.channel.read`, a `request_id` of `1..64` visible ASCII characters, positive integer `payload.channel_id`, and non-empty opaque string `payload.last_read_message_id`. The Gateway attaches the authenticated user's identity and session; the client does not choose which user's position to update.

  Chat Gateway validates the envelope and publishes the command to RabbitMQ. Chat-service (Channel Service) checks current channel access: DIRECT requires an active friendship with no block in either direction; ROOM requires an eligible current member state and reconciliation through the current `room_version`. For a new command, it resolves the target ID to its internal channel sequence. An unknown, expired, foreign-channel, pre-join, or otherwise invisible target is `INVALID_PAYLOAD`; no read position advances. A permitted identical retry with a recorded terminal result uses that result even if its target has since expired. The room example requires `msg_room001` to exist inside the user's current membership epoch and visibility windows.

  Read-position updates are permitted with `ACTIVE` or `READ_ONLY` access. A running match blocks sends, not reads or read receipts. `INACTIVE` channels reject the command.

  ## Persistent position

  PostgreSQL stores DIRECT positions per `(channel_id, user_id)` and ROOM positions per `(channel_id, user_id, membership_epoch_id)`. The sequence is internal and monotonically increasing within its scope. The stored position advances to the maximum of the existing position and validated target sequence; an older or equal target succeeds with the already-current state and produces no new read event. `read_at` is server UTC time at advancement, not a client timestamp or an exact timestamp for every earlier message.

  State is shared by all sessions/tabs/devices of the user. ROOM Back to Lobby preserves the epoch's position; Exit/kick/timeout closes that scope, and rejoining initializes a new one. Public `version` monotonically increases per channel/user on advancement and on a scope reset, including across membership epochs. An untouched first scope has `{last_read_message_id:null, read_at:null, version:0}`; a reset scope has null message/time fields and a higher version. Retention never resets the internal sequence; the last-read ID may remain in that user's state after the message expires, without a foreign key requiring the message to be retained.

  ## Transaction, inbox, and outbox

  When the position advances, Channel Service commits the read-state change, the terminal command inbox/request-ledger result, and a `chat.channel.read.updated` outbox event in one PostgreSQL transaction. A new non-advancing command records its terminal result without a state change or extra event. It acknowledges the incoming RabbitMQ delivery and returns the browser-facing success ack only after commit. Channel Service's own outbox publisher publishes the event with a stable `event_id` and waits for a broker publisher confirm. Chat Gateway consumes that event for socket delivery; it does not read Channel Service's database.

  Message-send and read-position commands share the `(sender_user_id, request_id)` ledger. The hash includes command type and normalized payload; retain results for at least 30 days and at least as long as configured message retention. Current channel access is checked on every attempt; the ledger does not grant access. An identical permitted retry returns the original terminal ack/error and emits no duplicate state change. Changing the command type or payload under the same key is `INVALID_EVENT`. A stored ROOM result is fenced to its original membership epoch: replay after rejoining returns `INVALID_EVENT` rather than applying or returning the old epoch's state. Use a new request ID for a command in the new scope. A timeout or `SERVICE_UNAVAILABLE` before a terminal result is recorded is retried with the original ID.

  Sender ack, for a position advancing to `msg_001`:

  ```json
  {
    "type": "ack",
    "request_id": "req_cr001",
    "ok": true,
    "payload": {
      "channel_id": 7001,
      "read_state": {
        "last_read_message_id": "msg_001",
        "read_at": "2026-09-17T10:00:05Z",
        "version": 1
      }
    }
  }
  ```

  A retry can return an older originally-recorded version after another device has advanced the position. Clients must keep their newest version; they do not roll back to an older ack. Read commands do not change channel activity ordering. `unread_count` and per-message `read_by` are authoritative REST projections described in Chat REST v2.

  Errors: `INVALID_EVENT`, `INVALID_PAYLOAD`, `NOT_CHANNEL_MEMBER`, `CHANNEL_ACCESS_REVOKED`, `CHANNEL_NOT_FOUND`, and `SERVICE_UNAVAILABLE`. They correlate to `request_id` and keep the socket open. Invalid/revoked sessions follow the shared `UNAUTHORIZED`/`4401` policy. An error changes no read state, though a terminal failure may be retained in the ledger.

  ```json
  {
    "type": "error",
    "request_id": "req_cr003",
    "error": {
      "code": "INVALID_PAYLOAD",
      "message": "The read target is not a retained message visible in this channel.",
      "details": { "channel_id": 7001 }
    }
  }
  ```
