info:
  name: Connect to Chat Gateway
  type: websocket
  seq: 1
  tags: [connection, chat, gateway]
websocket:
  url: "{{chatWsUrl}}/ws/{{chatApiVersion}}/channels"
settings:
  timeout: 30000
  keepAliveInterval: 20000
docs: |-
  # Connect to Chat Gateway

  Opens one authenticated, per-user realtime connection directly to Chat Gateway. The HttpOnly `ft_session` cookie is the only credential; the gateway validates Origin first, then asks Auth Service to validate the active session through its internal session-validation operation. Admission does not require User, Stats or Game Session data. After upgrade it registers the connection under the authenticated `user_id` and `session_id` in its in-memory socket registry. Multi-tab connections are supported. Disconnect removes this connection; User Service queries the registry over internal REST for current presence. Channel Service separately obtains friendship/block verdicts from User Service for DIRECT access.

  Success is `101 Switching Protocols`. The gateway then emits `chat.ready` with the authenticated `user_id` and `connected_at`. Channel discovery, retained history, unread counts, and read-state snapshots are loaded through the BFF endpoints in `Chat REST v2`; only currently authorized channels are returned, and the socket does not replay history during connection. Reconnecting and fetching history do not mark messages read.

  Handshake failures: `401 UNAUTHORIZED` for an invalid session and `403 ORIGIN_NOT_ALLOWED` for a rejected origin. If the session is explicitly revoked after connection, Chat Gateway emits `UNAUTHORIZED` when possible and closes every local socket associated with that `session_id` with `4401`; notification reaches every Gateway instance and leaves the user's other active sessions open. Ordinary command errors keep the socket open; repeated protocol abuse may close it after an error.
