docs:
  content: |-
    # ft_transcendence Chat WebSocket v2

    Connect through the same public origin at `{{chatWsUrl}}/ws/{{chatApiVersion}}/channels`. The reverse proxy routes this path directly to Chat Gateway; live chat does not pass through the Web BFF.

    Chat Gateway is a separate socket service: it validates the session, keeps an in-memory registry keyed by user/session, publishes incoming commands, and consumes events for multi-tab delivery. Chat-service is Channel Service: it owns channel records, dynamic authorization, command request ledgers/inboxes, persistence, read state, 30-day default retention, and its own transactional outbox publisher. `DIRECT` is limited to active friends (a block suspends it); `ROOM` follows the caller's room/member lifecycle and is inactive in `POST_GAME`. A member of a running match reads but cannot send on any channel (`READ_ONLY`) until the match pauses or ends. The same socket also carries social notifications: room invitations and friend request/friendship changes (`social-events.yml`).

    Client commands use `{type, request_id, payload}`; acks and errors echo `request_id`. Application errors keep the socket open. Explicit session invalidation closes it with `4401`; handshake rejection happens before upgrade; repeated protocol abuse may close it after an error. A transport timeout has no delivery meaning, so clients retry `chat.message.send` or `chat.channel.read` with the same `request_id` and let Channel Service return the original persisted result. Read positions advance only through explicit commands after frontend display; `chat.channel.read.updated` carries committed read state, while REST supplies read/unread snapshots after reconnect.
  type: text/markdown
bundled: false
extensions: {}
