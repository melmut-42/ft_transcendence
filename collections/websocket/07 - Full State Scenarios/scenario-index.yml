  The finished recovery snapshot is paired with the terminal `game.ended` event. Persistent wins/losses update once: users `42,43` gain one win and users `44,45` gain one loss. Team and role remain room-scoped until room lifecycle cleanup. The terminal event reveals card `17`; it never carries unrelated hidden card colors.

  ## Scope boundary

  There is no rematch, spectator, bot, matchmaking, room-password, capacity, kick/ban, custom-board, custom-timer, or chat event protocol in this revision.
