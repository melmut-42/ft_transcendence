  tags: [scenario, reference]
websocket:
  url: "{{wsUrl}}/ws/rooms/{{roomId}}"
  headers:
    - name: X-Session-Id
      value: "{{sessionToken}}"
settings:
  timeout: 30000
  keepAliveInterval: 20000
docs: |-
  # Canonical scenario index

  ## End-to-end reconstruction

  This passive reference maps each required state to its normative example. It sends no message.

  It connects with required positive-integer path `room_id=1001` and required handshake header `X-Session-Id` containing an active opaque member session.

  | Scenario | Fixture transition | Contract location |
  | --- | --- | --- |
  | Newly created room | user `42` creates `1001` | REST `Create room` |
  | Four joined, unconfigured | users `42..45`, all selections null | REST `Get room snapshot` |
  | Teams selected, roles incomplete | users `43` and `45` lack roles | REST `Get room snapshot` |
  | Duplicate Spymaster | user `43` requests RED Spymaster occupied by `42` | WebSocket `Select role` |
  | Roles valid, some unready | user `45` remains false | REST `Get room snapshot` |
  | All four ready | `req_0013` changes user `45` | WebSocket `Set ready` |
  | Countdown | seconds `3`, `2`, `1`, `0` | WebSocket `Countdown event reference` |
  | Countdown cancelled | user `43` changes true to false | WebSocket `Set ready` |
  | Game started | room `IN_GAME`, game `5001`, all 25 cards | `Full IN_GAME role projections` |
  | Clue submitted | RED Spymaster, `ocean / 2`, 3 guesses | WebSocket `Submit clue` |
  | Correct own guess | RED reveals card `5`, score `3-2`, 2 guesses | WebSocket `Guess card` |
  | Neutral guess | RED reveals card `18`, BLUE turn | WebSocket `Guess card` |
  | Opponent guess | RED reveals BLUE card `6`, blue score rises | WebSocket `Guess card` |
  | Assassin | RED reveals card `25`, BLUE wins | WebSocket `Guess card` |
  | Normal victory | card `17` completes RED | WebSocket `Guess card` |
  | Opponent completion | RED reveals card `16`, completes BLUE | WebSocket `Guess card` |
  | Finished game | room `FINISHED`, phase `GAME_OVER`, result event | below |

  ## Finished game snapshot

  This Spymaster-visible state follows the normal RED victory branch. The nine RED cards and five previously found BLUE cards are revealed. Spymasters continue to see the full map; an Operative projection MUST replace the colors of every remaining unrevealed card with `null`, even after `FINISHED`.

