  ## Field requirements

  Every nested field follows the room/game schema documented by REST `Get room snapshot`. `ready` is retained as the frozen start confirmation after game start; it has no post-start mutation semantics. `startable=false` outside `WAITING` even though the starting composition remains valid. `current_turn.clue` and `guesses_remaining` are null in `WAITING_FOR_CLUE`.

  ## State changes, events, and errors

  `game.started` follows the zero tick, sets room `IN_GAME`, creates the board once, and begins with the starting team waiting for clue. It is not a client action and has no action error. If an invariant breaks before board creation, the server cancels countdown instead and neither projection is emitted.
