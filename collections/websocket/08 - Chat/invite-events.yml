docs: |-
  # Room invite events

  ## Purpose

  Passive reference for the invitation delivered on the per-user chat socket after a friend calls REST `Invite friend`. The client sends nothing.

  ## Event

  ```json
    {
      "type": "room.invite.received",
      "event_id": "evt_c010",
      "sent_at": "2026-09-10T08:41:10Z",
      "payload": {
        "room_id": 1001,
        "room_code": "ABCD12",
        "from_user": {
          "user_id": 42,
          "username": "player_one"
        }
      }
    }
  ```

  | Field | Type | Required | Nullable | Allowed values | Description |
  | --- | --- | ---: | ---: | --- | --- |
  | `payload.room_id` | integer | yes | no | positive | Invited room |
  | `payload.room_code` | string | yes | no | `^[A-Z0-9]{6}$` | Code to join with |
  | `payload.from_user.user_id` | integer | yes | no | positive | Inviting friend |
  | `payload.from_user.username` | string | yes | no | username rule | Inviting friend's name |

  ## Client behavior

  Accepting calls REST Join room for `room_id`; that request runs every normal join check, so a room that filled up or started in the meantime returns `ROOM_FULL` or `ROOM_NOT_JOINABLE`. Dismissing needs no request. The invitation is live-only: it is delivered to every open `/ws/chat` socket of the recipient and never stored.
