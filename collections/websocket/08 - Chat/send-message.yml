info:
  name: Send chat message
  type: websocket
  seq: 2
  tags: [action, chat]
websocket:
  url: "{{wsUrl}}/ws/chat"
  headers:
    - name: X-Session-Id
      value: "{{sessionToken}}"
  message:
    - title: Success - Message to friend
      selected: true
      message:
        type: json
        data: |-
          {
            "type": "chat.message.send",
            "request_id": "req_c001",
            "payload": {
              "to_user_id": 43,
              "text": "gg, ready?"
            }
          }
    - title: Error - Not permitted
      selected: false
      message:
        type: json
        data: |-
          {
            "type": "chat.message.send",
            "request_id": "req_c002",
            "payload": {
              "to_user_id": 99,
              "text": "hi"
            }
          }
docs: |-
  # Send chat message

  ## Purpose and preconditions

  Sends one basic-chat message to another user. Server checks permission per User Flow §6: allowed if the sender and `to_user_id` are friends, OR are current members of the same room while that room is `IN_GAME`. Otherwise rejected. No message history/persistence is defined by this contract — basic chat is live-delivery only.

  ## Message and payload parameters

  | Parameter | Location | Required | Type | Allowed values/range | Nullable | Description | Example |
  | --- | --- | ---: | --- | --- | ---: | --- | --- |
  | `X-Session-Id` | handshake header | yes | string | active opaque token | no | Sender identity | `sess_A3redAgent9Kp` |
  | `type` | envelope | yes | string enum | `chat.message.send` | no | Operation | `chat.message.send` |
  | `request_id` | envelope | yes | string | `1..64` visible ASCII, unique | no | Idempotency key | `req_c001` |
  | `payload.to_user_id` | payload | yes | integer | positive, existing user | no | Recipient | `43` |
  | `payload.text` | payload | yes | string | trimmed, `1..500` chars | no | Message body | `gg, ready?` |

  ## Success behavior

  Ack to sender: `{"type":"ack","request_id":"req_c001","ok":true,"payload":{"message_id":"msg_001","to_user_id":43,"sent_at":"2026-09-17T10:00:00Z"}}`. Recipient (if connected to `/ws/chat`) receives:

  ```json
    {
      "type": "chat.message.new",
      "event_id": "evt_c001",
      "sent_at": "2026-09-17T10:00:00Z",
      "payload": {
        "message_id": "msg_001",
        "from_user_id": 42,
        "text": "gg, ready?"
      }
    }
  ```

  ## Errors

  - `NOT_PERMITTED`: neither friends nor sharing an active in-game room.
  - `USER_NOT_FOUND`: `to_user_id` does not exist.
  - `INVALID_PAYLOAD`: missing/empty/over-length text, or non-integer `to_user_id`.

  ```json
    {
      "type": "error",
      "request_id": "req_c002",
      "error": {
        "code": "NOT_PERMITTED",
        "message": "You can only message friends or current in-game room members.",
        "details": {
          "to_user_id": 99
        }
      }
    }
  ```
