info:
  name: Connect to chat stream
  type: websocket
  seq: 1
  tags: [connection, chat]
websocket:
  url: "{{wsUrl}}/ws/chat"
  headers:
    - name: X-Session-Id
      value: "{{sessionToken}}"
settings:
  timeout: 30000
  keepAliveInterval: 20000
docs: |-
  # Connect to chat stream

  ## Authentication (Decision 11 — closed: secure session cookie)

  Same mechanism as the room socket: the browser attaches the HttpOnly `Secure` `ft_session` cookie automatically on the upgrade request; no client-side header code is needed. `X-Session-Id` remains an accepted fallback for non-browser tooling. See `00 - Connection & Protocol/connect.yml` for the full explanation.

  ## Purpose

  One per-user realtime channel for basic chat (User Flow §6), separate from the per-room game socket. Delivers direct messages to/from friends and current room co-members.

  ## Preconditions and handshake parameters

  | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |
  | --- | --- | ---: | --- | --- | ---: | --- | --- |
  | `ft_session` cookie | handshake (browser) | yes* | string | HttpOnly, Secure, active session | no | Primary browser credential | set by Register/Login |
  | `X-Session-Id` | handshake header (non-browser fallback) | yes* | string | active JWT access token | no | Same credential used by REST | `sess_A3redAgent9Kp` |

  \* Exactly one of the two must be present; the cookie takes precedence if both are sent.

  ## Success behavior

  `101 Switching Protocols`, then no initial event — the client sends `chat.message.send` and receives `chat.message.new` for inbound messages.

  ## Failure behavior

  | HTTP status | Code | Condition | Socket opens |
  | --- | --- | --- | --- |
  | `401` | `UNAUTHORIZED` | missing, invalid, revoked, or expired token | no |
