  tags: [connection, chat]
websocket:
  url: "{{wsUrl}}/ws/chat"
settings:
  timeout: 30000
  keepAliveInterval: 20000
docs: |-
  # Connect to chat stream

  ## Authentication (Decision 11 — closed: secure session cookie)

  Same mechanism as the room socket: the client attaches the HttpOnly `Secure` `ft_session` cookie automatically on the upgrade request; no client-side header code is needed, no header exists. `Origin` is validated the same way as the room socket. See `00 - Connection & Protocol/connect.yml` for the full explanation.

  ## Purpose

  One per-user realtime channel for basic chat (User Flow §6), separate from the per-room game socket. Delivers direct messages to/from friends and current room co-members while the shared room is `WAITING`, `COUNTDOWN`, or `IN_GAME`. Opening multiple `/ws/chat` sockets for the same user (multi-tab) is supported — see `08 - Chat/folder.yml`.

  ## Preconditions and handshake parameters

  | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |
  | --- | --- | ---: | --- | --- | ---: | --- | --- |
  | `ft_session` cookie | handshake | yes | string | HttpOnly, Secure, active session | no | Sole handshake credential | set by Register/Login |

  ## Success behavior

  `101 Switching Protocols`, then no initial event — the client sends `chat.message.send` and receives `chat.message.new` for inbound messages.

  ## Failure behavior

  | HTTP status | Code | Condition | Socket opens |
  | --- | --- | --- | --- |
  | `401` | `UNAUTHORIZED` | missing, invalid, revoked, or expired token | no |
