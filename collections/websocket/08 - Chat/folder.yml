docs: |-
  # Chat (basic)

  Minimum contract for the mandatory User Interaction module's basic chat (subject: chat/profile/friends). Basic chat only — Advanced Chat is a separate bonus module, not implemented here, and MUST remain distinguishable from this contract if/when added.

  Permission is not room-only: a friend can be messaged from anywhere, and any room co-member can be messaged without a friend requirement while the room is `WAITING`, `COUNTDOWN`, or `IN_GAME` (any state where the chat widget is mounted, not `IN_GAME` only). Chat is therefore a per-user connection (`/ws/chat`), not a room-scoped one, and the server checks permission (friend OR shared active room) per message. Permission checking and delivery are handled by the Game Session service (`workspace.yml`, Backend Architecture) — chat is small enough not to warrant its own microservice.

  Authenticated the same way as the room socket (`ft_session` cookie only, Origin-validated) — see `00 - Connection & Protocol/connect.yml`. A user may hold multiple open `/ws/chat` sockets (multi-tab); an inbound message is delivered to all of them, and delivery status (`DELIVERED`/`RECIPIENT_OFFLINE`) reflects whether at least one was open at send time.
