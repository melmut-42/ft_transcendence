docs:
  content: |-
    # ❌ Errors

    This folder explains how to observe WebSocket failures at the handshake and action levels.

    ## Envelope shape

    The known shape is:

    ```json
    {
      "event": "error",
      "data": {
        "code": "<backend error code>",
        "message": "<backend error message>"
      }
    }
    ```

    The exact code and message must come from the backend response. Do not add a new error code based on a guessed scenario.

    ## How to test

    1. Open a valid connection when the scenario requires authentication.
    2. Trigger one deliberate handshake or action failure.
    3. Capture the error frame in Bruno.
    4. Verify the code/message and confirm rejected actions did not mutate state or create a successful action log.
