info:
  name: ❌ Errors
  type: folder

docs:
  content: |-
    # ❌ Errors

    This folder is the single WebSocket error reference. It explains the envelope, the error catalog, and how to test handshake and action failures without creating one request per error case.

    ## error_envelope

    The known shape is:

    ```json
    {
      "event": "error",
      "data": {
        "code": "<backend error code>",
        "message": "<backend error message>"
      }
    }
    ```

    The exact code and message must come from the backend response. Do not add a new error code based on a guessed scenario.

    ## error_catalog

    The current verified catalog is intentionally contract-led:

    | Failure area | What to record |
    | --- | --- |
    | Handshake authentication | Whether `session_id` was missing, invalid, or accepted; exact backend code and message |
    | Client action validation | Event name, room/game state, exact backend code, and exact message |
    | Authorization and role checks | Session role, attempted event, exact backend code, and exact message |
    | State and turn checks | Current game state, attempted event, exact backend code, and exact message |

    REST error codes must not be copied into this catalog unless the WebSocket backend returns the same code explicitly. The catalog is incomplete until each code is confirmed by a backend frame or authoritative backend documentation.

    ## How to test

    1. Open `connect` when the scenario requires authentication.
    2. Prepare one deliberate handshake or action failure.
    3. Capture the error frame in Bruno.
    4. Record the exact `event`, `data.code`, and `data.message`.
    5. Confirm rejected actions did not mutate state or create a successful action log.
