websocket:
  url: "{{wsUrl}}/ws?session_id={{session_id}}"
settings:
  timeout: 30000
  keepAliveInterval: 0
docs: |-
  # ⚡ error_envelope

  ## 📝 Overview

  Documents the WebSocket error behavior and known failure vocabulary associated with rejected actions or handshake problems.

  ## 🔌 Connection

  `{{wsUrl}}/ws?session_id={{session_id}}`

  The session is supplied in the `session_id` query parameter. REST's `X-Session-Id` header is not used for the WebSocket handshake.

  ## 📥 Message behavior

  This request sends no outgoing message. Use it to establish a connection or observe incoming frames.

  ## 📤 Expected observation

  Observe the documented error envelope or error code associated with the deliberate failure.

  ## 🧭 Typical workflow

  Open an authenticated connection when required, perform a deliberate test action, and compare the captured frame with the documented envelope.

  ## 🧪 Testing guidance

  Confirm the error event, code, and message, then verify that state remains unchanged.

  > 💡 **Tip**
  >
  > Use the `local` environment, keep session values out of Git, and run one state-changing message at a time.

  ## 📌 Contract boundary

  Event names and the verified `give_clue` example are documented from the known contract. Undocumented client and server payload fields are intentionally left unguessed.
