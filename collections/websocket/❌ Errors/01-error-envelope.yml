info:
  name: "error_envelope"
  type: websocket
  seq: 1
  tags:
    - error
    - observation
websocket:
  url: "{{wsUrl}}/ws?session_id={{session_id}}"
settings:
  timeout: 30000
  keepAliveInterval: 0
docs: |-
  # ⚡ error_envelope

  ## Purpose

  Passive observer for the shared WebSocket error frame.

  ## URL and authentication

  `{{wsUrl}}/ws?session_id={{session_id}}`

  Use a valid session when observing action-level errors. Handshake failures are covered by the Connection folder.

  ## Known envelope

  ```json
  {
    "event": "error",
    "data": {
      "code": "<backend error code>",
      "message": "<backend error message>"
    }
  }
  ```

  ## Message behavior

  This request sends no outgoing message. Trigger one deliberate invalid action or observe a rejected handshake, then compare the captured frame with the envelope shape.

  ## Validation

  Confirm the backend-provided code and message. Do not assume a status code or error vocabulary that was not returned by the backend.
