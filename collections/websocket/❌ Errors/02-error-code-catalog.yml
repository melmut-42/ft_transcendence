websocket:
  url: "{{wsUrl}}/ws?session_id={{session_id}}"
settings:
  timeout: 30000
  keepAliveInterval: 0
docs: |-
  # ⚡ error_code_catalog

  ## Purpose

  Reference point for WebSocket error codes captured from the backend.

  ## Current contract status

  This workspace does not contain a complete verified WebSocket error-code catalog. This request is documentation-only; it does not claim that REST error codes also apply to WebSocket frames.

  ## How to extend it safely

  Add a code only after it is confirmed by a backend response or an authoritative backend contract. Record the event, exact code, exact message, and the state/action that produced it.

  ## Related request

  Use `error_envelope` for the known frame shape and the Connection or Client Actions folders to reproduce a deliberate failure.
