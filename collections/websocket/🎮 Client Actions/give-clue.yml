docs: |-
  # ⚡ give_clue

  ## Purpose

  Documents the client event `give_clue`. This is a spymaster action while the game is waiting for a clue.

  ## URL and authentication

  `{{wsUrl}}/ws?session_id={{session_id}}`

  The session is supplied in the `session_id` query parameter, not the REST `X-Session-Id` header.

  ## Message behavior

  This request contains the verified JSON example and is disabled by default because it changes game state.

  ## Workflow

  Open `connect`, prepare the required room state, select this action only when its preconditions are true, and observe the resulting server event or error frame.

  ## Validation

  Confirm the backend enforces identity, membership, role, turn, and game-state rules. Rejected actions must not mutate state or create a successful action log.

  ## Contract boundary

  Do not infer undocumented fields. Update this request only after the backend protocol confirms the event payload.
