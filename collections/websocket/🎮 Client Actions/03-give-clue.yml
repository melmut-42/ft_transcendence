docs: |-
  # `give_clue`

  Verified client message example:

  ```json
  {
    "event": "give_clue",
    "data": {
      "room_id": 1001,
      "clue": "SPACE",
      "number": 3
    }
  }
  ```

  The message is disabled by default because it is valid only when the game is active, the sender is the spymaster, and the sender has the turn. The server transitions from `WAITING_FOR_CLUE` to `GUESSING` after accepting it.

