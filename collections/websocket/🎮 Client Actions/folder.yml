docs:
  content: |-
    # 🎮 Client Actions

    These requests document client-to-server event names for the shared socket.

    ## Known actions

    `leave_room`, `start_game`, `give_clue`, `reveal_card`, and `end_turn`.

    ## Safe usage

    1. Open `connect` with a valid session.
    2. Prepare the required room, membership, role, turn, and game state.
    3. Select only the action that matches the current state.
    4. Observe the resulting server event or `error` frame.

    `give_clue` is the only action with a verified field-level payload. The other action requests intentionally contain no outgoing message until the backend contract verifies their payloads.
