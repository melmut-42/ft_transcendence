docs: |-
  # Room invite events

  The room invitation command enters through the BFF and Game/Lobby service. Its notification is published to RabbitMQ and delivered by Chat Gateway to the recipient's active sockets.

  ```json
  {
    "type": "room.invite.received",
    "event_id": "evt_c010",
    "sent_at": "2026-09-10T08:41:10Z",
    "payload": {
      "room_id": 1001,
      "room_code": "ABCD12",
      "from_user": {
        "user_id": 42,
        "username": "player_one"
      }
    }
  }
  ```

  Invitations remain transient notifications and are not chat messages. Accepting uses the normal REST Join room endpoint. If the recipient is offline, the invite event is not retained; the REST command reports `USER_OFFLINE`.
