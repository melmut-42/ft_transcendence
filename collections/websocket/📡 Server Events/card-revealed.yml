docs: |-
  # ⚡ card_revealed

  ## Purpose

  Passive observer for the server event `card_revealed`. This is a game action event associated with a processed card reveal.

  ## URL and authentication

  `{{wsUrl}}/ws?session_id={{session_id}}`

  The session is supplied in the `session_id` query parameter. Open `connect` first; this request does not create a second connection workflow.

  ## Message behavior

  No outgoing application message is sent. Watch Bruno's message history for the `card_revealed` frame after the related room or game action.

  ## Payload boundary

  The event name is documented, but no payload fields are added here unless confirmed by the backend contract. Do not treat a guessed payload as an API example.

  ## Validation

  Compare the captured event name and ordering with the action or connection-state change that triggered it. Record unexpected frames for backend investigation.
