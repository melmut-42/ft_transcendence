docs:
  content: |-
    # 📡 Server Events

    These requests are passive observers for server-emitted event names on the shared room/game socket.

    ## Event groups

    - Player lifecycle: `player_joined`, `player_left`, `player_disconnected`, `player_reconnected`.
    - Game lifecycle: `game_started`, `game_finished`.
    - Turn and action flow: `clue_given`, `card_revealed`, `turn_changed`, `game_action_logged`.

    ## Observation workflow

    Open `connect`, prepare the related REST/action state, and watch the event request in Bruno's message history. These requests send no outgoing application message.

    Payload fields are intentionally omitted where the backend contract has not confirmed them. Treat captured server frames as authoritative evidence.
