settings:
  timeout: 30000
  keepAliveInterval: 0
docs: |-
  # ⚡ connect_invalid_session

  ## Purpose

  Tests the handshake with a deliberately invalid session value.

  ## URL and authentication

  `{{wsUrl}}/ws?session_id=invalid-session`

  The literal value is a safe test placeholder and is not a real credential.

  ## Message behavior

  This request sends no application message. Capture the handshake result or error frame returned by the backend.

  ## Validation

  Confirm the backend rejects the invalid session without assuming an undocumented status code or message.
