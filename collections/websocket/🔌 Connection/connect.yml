info:
  name: "connect"
  type: websocket
  seq: 1
  tags:
    - interactive
    - smoke
websocket:
  url: "{{wsUrl}}/ws?session_id={{session_id}}"
settings:
  timeout: 30000
  keepAliveInterval: 0
docs: |-
  # ⚡ connect

  ## Purpose

  Opens the shared WebSocket with the session from the selected Bruno environment.

  ## URL and authentication

  `{{wsUrl}}/ws?session_id={{session_id}}`

  The session is sent as the `session_id` query parameter. It is not sent as the REST `X-Session-Id` header.

  ## Usage

  Run the REST `Enter user` request first, then open this connection. Once connected, observe server events and select a client action only when its documented game-state preconditions are satisfied.

  ## Message behavior

  This request sends no application message. It is the normal authenticated connection scenario.

  ## Validation

  Confirm the handshake succeeds and keep the session value in Bruno's local secret storage.
