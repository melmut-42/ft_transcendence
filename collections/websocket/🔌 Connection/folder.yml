docs:
  content: |-
    # 🔌 WebSocket Connection

    This folder contains the handshake scenarios for the shared room/game socket.

    ## Connection URL

    ```text
    {{wsUrl}}/ws?session_id={{session_id}}
    ```

    Authentication is supplied only through the `session_id` query parameter. REST-protected requests use `X-Session-Id` separately.

    ## Scenarios

    - `connect` — normal connection with a valid local session.
    - `connect_without_session` — deliberate negative handshake without the query parameter.
    - `connect_invalid_session` — deliberate negative handshake with the literal `invalid-session` value.

    These requests send no application message. Inspect the handshake result and capture any server error frame in Bruno.
