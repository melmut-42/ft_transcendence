docs:
  content: |-
    # 🔌 WebSocket Connection

    This folder contains the canonical handshake request for the shared room/game socket.

    ## Connection URL

    ```text
    {{wsUrl}}/ws?session_id={{session_id}}
    ```

    Authentication is supplied only through the `session_id` query parameter. REST-protected requests use `X-Session-Id` separately.

    ## Connection request

    `connect` opens the socket with a valid local session.

    The collection does not keep separate missing-session or invalid-session child requests. Test those handshake failures against the backend only when the required scenario is prepared, and record the returned error using the error_catalog in the WebSocket collection overview.
