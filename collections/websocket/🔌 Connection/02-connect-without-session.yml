  keepAliveInterval: 0
docs: |-
  # ⚡ connect_without_session

  ## Purpose

  Tests the handshake without sending a `session_id` query parameter.

  ## URL and authentication

  `{{wsUrl}}/ws`

  This is a deliberate negative scenario. It must not be used as the normal connection workflow.

  ## Message behavior

  This request sends no application message. Capture the handshake result or error frame returned by the backend.

  ## Validation

  Confirm the backend's unauthorized/missing-session behavior without assuming an undocumented status code or message.
