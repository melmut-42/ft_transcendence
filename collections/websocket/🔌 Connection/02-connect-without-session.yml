  # ⚡ connect_without_session

  ## 📝 Overview

  Establishes or deliberately tests the shared WebSocket handshake for `connect_without_session`. The socket carries room and game events after the transport connection is accepted.

  ## 🔌 Connection

  `{{wsUrl}}/ws`

  No session query parameter is sent; use this only as a negative handshake scenario.

  ## 📥 Message behavior

  This request sends no outgoing message. Use it to establish a connection or observe incoming frames.

  ## 📤 Expected observation

  Observe the handshake, server event, or error frame in Bruno's WebSocket message history.

  ## 🧭 Typical workflow

  Run the REST bootstrap first, populate a valid runtime session when appropriate, and then open the connection. Inspect the handshake result before selecting event or action messages.

  ## 🧪 Testing guidance

  Confirm the handshake outcome and keep session values in local secret storage.

  > 💡 **Tip**
  >
  > Use the `local` environment, keep session values out of Git, and run one state-changing message at a time.

