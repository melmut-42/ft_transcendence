docs: |-
  # Connection and protocol

  Authenticate the handshake with the HttpOnly `ft_session` cookie (browser default, Decision 11) or the `X-Session-Id` header (non-browser fallback); the URL contains only the integer `roomId`. The user must already be a REST room member. The first frame is a role-safe `room.state`. Reconnect replaces local state from a fresh snapshot; ordinary transport disconnect does not itself remove membership.
