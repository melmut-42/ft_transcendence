docs:
  content: |-
    # ⚡ ft_transcendence WebSocket API

    This collection documents the shared room/game WebSocket used by `ft_transcendence`.

    ## Transport and authentication

    ```text
    {{wsUrl}}/ws?session_id={{session_id}}
    ```

    Select the `local` environment. REST creates the temporary session; the WebSocket sends that session in the `session_id` query parameter during the handshake. The WebSocket does not use REST's `X-Session-Id` header.

    ## Collection layout

    - **Connection** — authenticated, missing-session, and invalid-session handshakes.
    - **Client Actions** — known outbound event names; only `give_clue` has a verified payload example.
    - **Server Events** — passive observers for known server event names.
    - **Errors** — the known error envelope shape and guidance for capturing backend error codes.

    ## Recommended workflow

    1. Select `local` and run the REST `Enter user` request.
    2. Open `connect` with the populated `session_id`.
    3. Prepare the required room membership, role, turn, and game state.
    4. Select one client action only when its preconditions are satisfied.
    5. Observe the related server event or error frame in Bruno's message history.

    Do not batch-run this collection. Some requests observe frames, while actions change live game state.

    ## Known client events

    `leave_room`, `start_game`, `give_clue`, `reveal_card`, and `end_turn`.

    ## Known server events

    `player_joined`, `player_left`, `game_started`, `clue_given`, `card_revealed`, `turn_changed`, `player_disconnected`, `player_reconnected`, `game_finished`, and `game_action_logged`.

    ## Contract boundaries

    The `give_clue` request contains the only complete client payload currently verified in this workspace. Other client messages stay disabled until their payloads are confirmed. Server event files document names and observation guidance without inventing payload fields.

    The backend validates identity, membership, role, turn, and game state. Rejected actions must not mutate state or create a successful action log.
