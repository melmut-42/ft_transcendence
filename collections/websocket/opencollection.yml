docs:
  content: |-
    # ft_transcendence WebSocket API

    Connect to `{{wsUrl}}/ws?session_id={{session_id}}`.

    The socket is shared by all room/game events. The server validates identity, membership, role, turn, and game state. Client messages use the event envelope; only the `give_clue` payload is recorded here as a verified field-level example. Other client action fields are deliberately not guessed.
  type: text/markdown
