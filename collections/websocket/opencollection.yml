docs:
  content: |-
    # ⚡ ft_transcendence WebSocket API

    This collection documents the shared room/game WebSocket used by `ft_transcendence`.

    ## Transport and authentication

    ```text
    {{wsUrl}}/ws?session_id={{session_id}}
    ```

    Select the `local` environment. REST creates the temporary session; the WebSocket sends that session in the `session_id` query parameter during the handshake. The WebSocket does not use REST's `X-Session-Id` header.

    ## Collection layout

    - **Connection** — the canonical authenticated handshake.
    - **Client Actions** — known outbound event names; only `give_clue` has a verified payload example.
    - **Server Events** — passive observers for known server event names.
    - **Errors** — the error envelope, catalog guidance, and failure-testing rules.

    ## Recommended workflow

    1. Select `local` and run the REST `Enter user` request.
    2. Open `connect` with the populated `session_id`.
    3. Prepare the required room membership, role, turn, and game state.
    4. Select one client action only when its preconditions are satisfied.
    5. Observe the related server event or error frame in Bruno's message history.

    Do not batch-run this collection. Some requests observe frames, while actions change live game state.

    ## Known client events

    `leave_room`, `start_game`, `give_clue`, `reveal_card`, and `end_turn`.

    ## Known server events

    `player_joined`, `player_left`, `game_started`, `clue_given`, `card_revealed`, `turn_changed`, `player_disconnected`, `player_reconnected`, `game_finished`, and `game_action_logged`.

    ## Errors and error_catalog

    All WebSocket error guidance lives in this collection overview. Error frames use the following envelope:

    ```json
    {
      "event": "error",
      "data": {
        "code": "<backend error code>",
        "message": "<backend error message>"
      }
    }
    ```

    ### Known error codes

    | Code | Description | Scope |
    | --- | --- | --- |
    | `INVALID_ACTION` | The requested client action is not allowed in the current role, turn, or game state. | WebSocket action rejection; confirm the exact backend message in a captured frame. |

    `INVALID_ACTION` is the only WebSocket error code currently named by the workspace contract. No additional WebSocket code is treated as verified until it appears in an authoritative backend response or backend documentation. REST codes such as `INVALID_REQUEST`, `UNAUTHORIZED`, `FORBIDDEN`, `ROOM_NOT_FOUND`, `ROOM_NOT_JOINABLE`, `USER_ALREADY_IN_ROOM`, and `USERNAME_TAKEN` belong to the REST collection and must not be copied into the WebSocket catalog without backend evidence.

    ### Related REST error codes

    These codes are documented here for cross-collection reference only. They are verified REST responses and are not WebSocket error codes:

    | Code | Description | REST meaning |
    | --- | --- | --- |
    | `INVALID_REQUEST` | The submitted request data is invalid. | Username or room-join validation failed. |
    | `USERNAME_TAKEN` | The requested username is already in use. | `POST /users/enter` conflict. |
    | `UNAUTHORIZED` | The request does not contain a valid temporary session. | Protected REST request has no valid `X-Session-Id`. |
    | `FORBIDDEN` | The authenticated user is not allowed to access the room. | Room access was attempted by an outsider. |
    | `ROOM_NOT_FOUND` | The requested room does not exist. | The supplied room ID cannot be resolved. |
    | `ROOM_NOT_JOINABLE` | The room cannot accept another player in its current state. | Join attempted for an in-progress or finished room. |
    | `USER_ALREADY_IN_ROOM` | The user already belongs to a room. | Duplicate room creation or room joining was attempted. |

    ### Error-testing procedure

    1. Open `connect` when the failure scenario requires an authenticated session.
    2. Prepare one deliberate handshake or client-action failure.
    3. Capture the returned frame in Bruno's message history.
    4. Record the exact `event`, `data.code`, and `data.message`.
    5. Confirm a rejected action did not mutate state or create a successful action log.

    ## Contract boundaries

    The `give_clue` request contains the only complete client payload currently verified in this workspace. Other client messages stay disabled until their payloads are confirmed. Server event files document names and observation guidance without inventing payload fields.

    The backend validates identity, membership, role, turn, and game state. Rejected actions must not mutate state or create a successful action log.
bundled: false
extensions: {}
