docs:
  content: |-
    # ft_transcendence WebSocket Protocol

    ## Connection

    Connect to `{{wsUrl}}/ws/rooms/{{roomId}}` (room socket) or `{{wsUrl}}/ws/chat` (per-user chat socket, see `08 - Chat`). The session must be active; for the room socket the user must already belong to the room through REST. Authentication is never placed in the URL.

    ## Authentication

    Authentication is cookie-only: the HttpOnly, `Secure`, `SameSite=Lax` `ft_session` cookie set by Register/Login/Refresh is attached automatically on the WebSocket upgrade request, same-origin, by browser and Bruno alike. The cookie is the only handshake credential; no authentication header is sent. The upgrade request's `Origin` is validated against the deployment's single public origin before the cookie is even checked. The backend then validates the cookie and accepts or rejects (`401`) the upgrade. This applies identically to both sockets. A user may hold several simultaneous sockets for the same room/chat (multi-tab); they share one logical membership, not one seat per socket. See `00 - Connection & Protocol/connect.yml` for the full parameter table.

    A successful connection to the room socket first receives a recipient-safe `room.state` snapshot, which embeds `game` when `room.status` is `IN_GAME` or `FINISHED` — this is the one canonical reconnect/recovery snapshot for the room socket (see Reconnect below); the chat socket sends no initial event.

    Invalid session rejects the handshake with HTTP `401`; missing room uses `404`; an authenticated non-member uses `403`. A transport disconnect never removes room membership immediately — it starts the reconnect grace period (`workspace.yml`, Reconnect Grace Period and Abandonment: 30s `WAITING`/`COUNTDOWN`, 60s `IN_GAME`). Reconnect with the same session within that window obtains a fresh role-safe snapshot with no state loss. If the grace period expires, membership is removed (`WAITING`/`COUNTDOWN`) or the match ends by `PLAYER_FORFEIT` (`IN_GAME`) — see `04 - Game`. If the access token has expired, the client refreshes over REST (`POST /api/auth/refresh`) before reconnecting — the reissued cookie authenticates the new handshake automatically.

    ## Reconnect (canonical snapshot)

    `room.state` is the one authoritative initial/reconnect snapshot for the room socket. It embeds `game` whenever `room.status` is `IN_GAME` or `FINISHED`, so a client never needs a second recovery message type for that case. `game.state` (see the event matrix) is the Game Session-internal payload shape reused inside that embed — not a separate recovery path a client requests independently; a client that has `room.state` never needs to additionally fetch `game.state`. On reconnect, do not attempt to replay missed incremental events — apply the fresh snapshot and discard prior local state.

    ## Envelopes and ordering

    Client messages are `{ "type", "request_id", "payload" }`. `request_id` is a client-generated unique string of `1..64` visible ASCII characters (a UUID is a good default generator, but any unique string in that length/charset is valid). The server caches the result of a request ID per session for the room lifetime; an identical retry returns the original ack/error and does not repeat mutation. Reuse with different content returns `INVALID_EVENT`. This dedup cache lives in Redis alongside other ephemeral room state (`workspace.yml`, State Ownership).

    Successful commands receive `{ "type": "ack", "request_id", "ok": true, "payload": object }`. Events are `{ "type", "event_id", "room_id", "sent_at", "payload" }`. `event_id` is unique and monotonically increasing within one room stream. Timestamps are ISO 8601 UTC.

    **State mutation source of truth:** an `ack` confirms that the command was received and validated, correlated by `request_id` — it is not the client's primary mutation source, because the paired server event (`room.player.updated`, `game.card.revealed`, etc.) carries the same authoritative values and a client that applied both would double-apply the change. Apply state from server events and snapshots (`room.state`/embedded `game`), and treat the `ack` payload as confirmation/UI feedback (e.g. "your command was accepted") rather than a second write. If a client ever detects a gap in `event_id` ordering, it does not attempt to replay history — it requests/derives a fresh `room.state` snapshot instead (the same recovery path as an ordinary reconnect).

    ## Message and event matrix

    | Type | Direction | Allowed room/phase | Permission | Purpose |
    | --- | --- | --- | --- | --- |
    | `room.team.select` | C to S | `WAITING`, `COUNTDOWN` | member | select team; countdown change cancels |
    | `room.role.select` | C to S | `WAITING`, `COUNTDOWN` | member with team | select role; countdown change cancels |
    | `room.ready.set` | C to S | `WAITING`, `COUNTDOWN` for false | configured member | toggle readiness |
    | `game.clue.submit` | C to S | `IN_GAME / WAITING_FOR_CLUE` | active Spymaster | create clue and guesses |
    | `game.card.guess` | C to S | `IN_GAME / GUESSING` | active Operative | reveal one card |
    | `game.turn.pass` | C to S | `IN_GAME / GUESSING` | active Operative | end team turn |
    | `room.state` | S to C | any non-closed state | recipient projection | full room snapshot |
    | `room.player.joined` | S to C | `WAITING` | server | membership added |
    | `room.player.left` | S to C | `WAITING`, `COUNTDOWN`, `FINISHED` | server | membership removed/host transfer |
    | `room.player.updated` | S to C | `WAITING`, `COUNTDOWN` | server | team, role, ready change |
    | `room.countdown.started` | S to C | `COUNTDOWN` | server | start at 3 seconds |
    | `room.countdown.tick` | S to C | `COUNTDOWN` | server | remaining `2`, `1`, `0` |
    | `room.countdown.cancelled` | S to C | `WAITING` | server | invariant broke |
    | `game.started` | S to C | `IN_GAME` | recipient projection | complete role-safe game |
    | `game.state` | S to C | `IN_GAME`, `FINISHED` | recipient projection | recovery snapshot |
    | `game.clue.submitted` | S to C | `IN_GAME / GUESSING` | server | public clue |
    | `game.card.revealed` | S to C | `IN_GAME`, `FINISHED` | recipient projection | reveal result |
    | `game.score.updated` | S to C | `IN_GAME`, `FINISHED` | server | revealed team totals |
    | `game.turn.changed` | S to C | `IN_GAME` | server | next team waits for clue |
    | `game.ended` | S to C | `FINISHED / GAME_OVER` | server | terminal result, incl. `PLAYER_FORFEIT` |
    | `ack` | S to C | command-dependent | requester | command accepted |
    | `error` | S to C | any open connection | requester | command rejected |

    ## Countdown and authority

    The server rechecks the full start predicate after every join, leave, team, role, and ready change. When it first becomes true, the room enters `COUNTDOWN` and emits start plus concrete ticks. Any invalidation emits cancellation and returns to `WAITING`. Completion while still valid generates the 25-card board and enters `IN_GAME`. There is no host start command.

    ## Privacy projection

    Spymasters receive all 25 colors. Operatives receive `color: null` on unrevealed cards and the true color on revealed cards. The server MUST render events per recipient and MUST NOT broadcast one secret-bearing payload. The full paired examples in `07 - Full State Scenarios` differ only where authorization requires it.

    ## Errors and connection policy

    Action errors retain the connection and never mutate room/game state. `INVALID_EVENT`, `INVALID_PAYLOAD`, `NOT_ROOM_MEMBER`, `INVALID_ROOM_STATE`, `TEAM_REQUIRED`, `ROLE_REQUIRED`, `ROLE_CONFLICT`, `NOT_YOUR_TURN`, `ROLE_FORBIDDEN`, `INVALID_CLUE`, `INVALID_CLUE_NUMBER`, `INVALID_CARD`, `CARD_ALREADY_REVEALED`, `NO_GUESSES_REMAINING`, and `GAME_ALREADY_FINISHED` apply to the room socket; `NOT_PERMITTED` and `USER_NOT_FOUND` apply only to the chat socket. All have concrete examples in the action/error folders (see `06 - Errors/error-catalog.yml`). `UNAUTHORIZED` closes the socket with policy code `4401` when the session becomes explicitly invalid after connection (logout, refresh-token-family revocation) — ordinary access-token expiry does not by itself close an already-open socket. There is no WebSocket-level `SESSION_EXPIRED` — refresh credential expiry is a REST-only concept handled by `POST /api/auth/refresh`. The server may close for invalid handshake auth (including `Origin` mismatch), explicit session revocation, or repeated protocol abuse only.

    ## Example index

    `03 - Ready & Countdown` contains minimum valid room, countdown, and cancellation. `07 - Full State Scenarios` contains full Spymaster and Operative boards. `04 - Game` contains clue, own-team continuation, last-guess turn end, own-team victory, opponent turn end, opponent final-card victory, neutral, assassin, pass, and invalid-action cases. `08 - Chat` contains the per-user chat socket's send/receive and permission-error cases.
  type: text/markdown
bundled: false
