docs:
  content: |-
    # ft_transcendence REST API

    ## Transport and session

    Base URL: `{{baseUrl}}` (`http://localhost:3000` locally). JSON requests send `Content-Type: application/json`; JSON responses send the same media type. Protected endpoints require a session, presented as either the HttpOnly `Secure` `ft_session` cookie (set by Register/Login/Refresh, automatic for a browser) or the `X-Session-Id: {{sessionToken}}` header (non-browser fallback). The credential is a short-lived JWT access token; `POST /api/auth/refresh` exchanges the paired long-lived refresh token for a new one. Tokens are never URL parameters.

    ## Response envelopes

    Every non-empty success is `{ "data": value }`. `204 No Content` has no body. Every error is `{ "error": { "code": string, "message": string, "details": object } }`; `details` is always an object and may be empty.

    ## Endpoint matrix

    | Method | Path | Purpose | Auth | Main requirement |
    | --- | --- | --- | --- | --- |
    | `GET` | `/api/health` | Contract/service health | no | none |
    | `POST` | `/api/auth/register` | Create account + issue session pair | no | unique email + username |
    | `POST` | `/api/auth/login` | Issue a new session pair | no | valid email + password |
    | `POST` | `/api/auth/refresh` | Exchange refresh token for new access token | refresh token | unexpired, unrevoked refresh token |
    | `GET` | `/api/auth/session` | Read current session identity | yes | active access token |
    | `DELETE` | `/api/auth/session` | Revoke current session | yes | active access token |
    | `GET` | `/api/users/me` | Own persistent profile | yes | active session |
    | `GET` | `/api/users/{user_id}` | Public persistent profile | yes | user exists |
    | `POST` | `/api/rooms` | Create and host a room | yes | not in active room |
    | `POST` | `/api/rooms/{room_id}/members` | Join a room | yes | `WAITING`, not in active room |
    | `GET` | `/api/rooms/{room_id}` | Role-safe room/game snapshot | yes | room member |
    | `DELETE` | `/api/rooms/{room_id}/members/me` | Leave room | yes | room member; not `IN_GAME` |
    | `GET` | `/api/rooms/lookup/{room_code}` | Resolve room code to room ID | yes | active room with that code |
    | `GET` | `/api/friends` | List friends with snapshot presence | yes | active session |
    | `POST` | `/api/friends` | Add a friend (immediate, mutual) | yes | target user exists, not self |
    | `DELETE` | `/api/friends/{user_id}` | Remove a friend | yes | friendship exists |

    ## Status conventions

    `200` reads/updates; `201` creation/join/add; `204` session deletion or leave/remove; `400` malformed syntax; `401` authentication (`UNAUTHORIZED` for a bad access token, `SESSION_EXPIRED` for a bad refresh token); `403` access; `404` missing entity; `409` uniqueness/lifecycle conflict; `422` field validation; `429` throttling.

    ## Domain and lifetime

    IDs are positive integers, timestamps are ISO 8601 UTC, JSON is snake_case, and enums are UPPER_SNAKE_CASE. Profiles expose persistent wins, losses, level, and match history. Room team, role, readiness, board, clue, turn, and score are temporary. `room_id` always names the same integer domain value used by WebSocket; `room_code` is the human-shareable join code resolved by the lookup endpoint.

    ## REST/WebSocket boundary

    REST bootstraps identity, session refresh, friends, and membership, and returns recoverable snapshots. Team/role/readiness and gameplay mutations are WebSocket-only. The REST room snapshot is server-authoritative and recipient-specific: an Operative never receives unrevealed card colors.

    ## Example index

    - Minimum and invalid waiting rooms: `03 - Rooms/Get room snapshot`
    - Joinability and membership failures: `03 - Rooms/Join room`
    - Complete started-game Operative projection: `03 - Rooms/Get room snapshot`
    - Room-code join preview: `03 - Rooms/Lookup room by code`
    - Countdown and both role projections: WebSocket `07 - Full State Scenarios`
    - Clue and all reveal outcomes: WebSocket `04 - Game`

    ## Environment

    Select `local`. Registration/Login/Refresh store `sessionToken` (access token) and `refreshToken`; registration also stores `userId`; room creation stores `roomId`. The canonical fixtures use users `42` through `47`, room `1001`, and game `5001`.
  type: text/markdown
bundled: false
extensions: {}
