docs:
  content: |-
    # ft_transcendence REST API

    ## Transport and session

    Base URL: `{{baseUrl}}` (`http://localhost:3000` locally). JSON requests send `Content-Type: application/json`; JSON responses send the same media type. Protected endpoints require the `ft_session` cookie (HttpOnly, `Secure`, `SameSite=Lax`, `Path=/`) — sent automatically by a browser, and by Bruno through its cookie jar. There is no header-based credential and no token value in any response body; see `workspace.yml`, Session and Credential Model. `POST /api/auth/refresh` reads the separate `ft_refresh` cookie (`Path=/api/auth/refresh`) and reissues both cookies. Tokens are never URL parameters.

    ## Response envelopes

    Every non-empty success is `{ "data": value }`. `204 No Content` has no body. Every error is `{ "error": { "code": string, "message": string, "details": object } }`; `details` is always an object and may be empty.

    ## Endpoint matrix

    | Method | Path | Purpose | Auth | Main requirement |
    | --- | --- | --- | --- | --- |
    | `GET` | `/api/health` | Contract/service health | no | none |
    | `POST` | `/api/auth/register` | Create account + issue session pair | no | unique email + username |
    | `POST` | `/api/auth/login` | Issue a new session pair | no | valid email + password |
    | `POST` | `/api/auth/refresh` | Exchange refresh token for new access token | refresh token | unexpired, unrevoked refresh token |
    | `GET` | `/api/auth/session` | Read current session identity | yes | active access token |
    | `DELETE` | `/api/auth/session` | Revoke current session (forfeits an `IN_GAME` room first) | yes | active access token |
    | `GET` | `/api/users/me` | Own persistent profile | yes | active session |
    | `PATCH` | `/api/users/me` | Update own profile (`username`) | yes | active session |
    | `POST` | `/api/users/me/avatar` | Upload/replace avatar | yes | active session, valid image |
    | `GET` | `/api/users/me/matches` | Own match history (paginated) | yes | active session |
    | `GET` | `/api/users/{user_id}` | Public persistent profile | yes | user exists |
    | `GET` | `/api/users/search?q=` | Username search for friend discovery | yes | active session |
    | `POST` | `/api/rooms` | Create and host a room | yes | not in active room |
    | `POST` | `/api/rooms/{room_id}/members` | Join a room | yes | `WAITING`, not in active room |
    | `GET` | `/api/rooms/{room_id}` | Role-safe room/game snapshot | yes | room member |
    | `DELETE` | `/api/rooms/{room_id}/members/me` | Leave room (forfeits if `IN_GAME`) | yes | room member |
    | `GET` | `/api/rooms/lookup/{room_code}` | Resolve room code to room ID | yes | active room with that code |
    | `GET` | `/api/friends` | List friends with snapshot presence | yes | active session |
    | `POST` | `/api/friends` | Add a friend (immediate, mutual) | yes | target user exists, not self |
    | `DELETE` | `/api/friends/{user_id}` | Remove a friend | yes | friendship exists |

    ## Status conventions

    `200` reads/updates; `201` creation/join/add; `204` session deletion or leave/remove; `400` malformed syntax; `401` authentication (`UNAUTHORIZED` for a bad access credential, `SESSION_EXPIRED` for a bad refresh credential); `403` access; `404` missing entity; `409` uniqueness/lifecycle conflict; `422` field validation; `429` throttling.

    ## Domain and lifetime

    IDs are positive integers, timestamps are ISO 8601 UTC, JSON is snake_case, and enums are UPPER_SNAKE_CASE. Profiles expose persistent `username`, `avatar_url`, `wins`, `losses`, `level`, and match history. Room team, role, readiness, board, clue, turn, and score are temporary. `room_id` (internal, path key) and `room_code` (`^[A-Z0-9]{6}$`, human-shareable) are distinct and never interchangeable — see `workspace.yml`, Room Identifier Consistency.

    ## REST/WebSocket boundary

    REST bootstraps identity, session refresh, profile/avatar, friends, and membership, and returns recoverable snapshots. Team/role/readiness and gameplay mutations are WebSocket-only. The REST room snapshot is server-authoritative and recipient-specific: an Operative never receives unrevealed card colors. `Leave room` is now legal in every room status, including `IN_GAME` (it forfeits the match — see `workspace.yml`, Room Abandonment).

    ## Example index

    - Minimum and invalid waiting rooms: `03 - Rooms/Get room snapshot`
    - Joinability and membership failures: `03 - Rooms/Join room`
    - Complete started-game Operative projection: `03 - Rooms/Get room snapshot`
    - Room-code join preview: `03 - Rooms/Lookup room by code`
    - Countdown and both role projections: WebSocket `07 - Full State Scenarios`
    - Clue and all reveal outcomes, plus forfeit: WebSocket `04 - Game`

    ## Environment

    Select `local`. Bruno authenticates through its cookie jar exactly like a browser — Register/Login/Refresh set `ft_session`/`ft_refresh` cookies automatically, no variable wiring needed. Registration stores `userId`; room creation stores `roomId`. The canonical fixtures use users `42` through `47`, room `1001`, and game `5001`.
  type: text/markdown
bundled: false
extensions: {}
