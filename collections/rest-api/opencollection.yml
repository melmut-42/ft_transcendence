docs:
  content: |-
    # 🌐 ft_transcendence REST API

    Welcome to the HTTP side of the `ft_transcendence` API. 🚀 This collection is a practical reference for onboarding, smoke testing, regression checks, and investigating the room lifecycle without guessing at undocumented endpoints.

    ## 🎯 What this collection covers

    - 👤 Temporary username entry and session creation through `POST /users/enter`
    - ➕ Room creation through `POST /rooms`
    - 🔗 Room joining through `POST /rooms/join`
    - 📊 Authoritative room snapshots through `GET /rooms/:room_id`
    - ✅ Successful response examples and ❌ contract-level error scenarios

    ## 🌍 Before you send a request

    1. Start the backend on `http://localhost:3000`.
    2. Select the workspace-level `local` environment.
    3. Run `Enter user` to create the host session. Set `guest_session_id` manually when testing the prepared guest join scenario.
    4. Run `Create room as host` to populate `room_id` for the remaining smoke flow.

    The base URL comes from `{{baseUrl}}`. Protected requests send `X-Session-Id`; this is temporary session authentication, not password, JWT, or production identity management. 🔐

    ## 🧭 Recommended workflow

    `Enter user` → `Create room as host` → `Get room state` → `Join room` → `Get room state`

    Runtime scripts chain the host session and room identifier between requests. `Join room` uses the prepared `guest_session_id` and is intentionally manual. Native examples group the known success and error outcomes under each endpoint.

    ## 📤 Reading responses

    Room responses are authoritative snapshots. Room states include `WAITING`, `READY`, `IN_PROGRESS`, and `FINISHED`; a room needs four players before the host can start a game through the shared WebSocket. Review the native response examples on each request before exercising a manual scenario.

    > ⚠️ **Prepared-state scenarios**
    >
    > Outsider access and in-progress/finished-room tests require IDs and sessions prepared outside the default smoke flow. Do not replace the documented placeholders with real secrets in Git.

    ## 🔖 Version

    This collection is version `1.1.0`. The version tracks the documented workspace structure and coverage, not a new backend API release.
  type: text/markdown
bundled: false
