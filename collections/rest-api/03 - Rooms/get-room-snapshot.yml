      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {"data":{"room_id":1001,"status":"WAITING","host_user_id":42,"player_count":4,"startable":false,"players":[{"user_id":42,"username":"player_one","team":null,"role":null,"ready":false,"is_host":true,"joined_at":"2026-09-10T08:41:00Z"},{"user_id":43,"username":"red_agent","team":null,"role":null,"ready":false,"is_host":false,"joined_at":"2026-09-10T08:41:20Z"},{"user_id":44,"username":"blue_master","team":null,"role":null,"ready":false,"is_host":false,"joined_at":"2026-09-10T08:41:30Z"},{"user_id":45,"username":"blue_agent","team":null,"role":null,"ready":false,"is_host":false,"joined_at":"2026-09-10T08:41:40Z"}],"game":null,"created_at":"2026-09-10T08:41:00Z"}}
