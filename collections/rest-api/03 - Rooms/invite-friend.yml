info:
  name: Invite friend
  type: http
  seq: 6
  tags: [rooms, friends]
http:
  method: POST
  url: "{{baseUrl}}/api/rooms/{{roomId}}/invites"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "user_id": 43
      }
docs: |-
  # Invite friend

  ## Purpose and preconditions

  Sends a live room invitation to a friend. The sender must be a member of the room, the room must be `WAITING` and below `max_players`, and the recipient must be a friend who is online and has no active room.

  ## Request parameters

  | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |
  | --- | --- | ---: | --- | --- | ---: | --- | --- |
  | `room_id` | path | yes | integer | positive | no | Room the friend is invited to | `1001` |
  | `ft_session` cookie | request cookie | yes | string | active JWT access credential | no | Inviting member | set by Register/Login |
  | `user_id` | body | yes | integer | positive, a friend, not self | no | Invited user | `43` |

  ## Success behavior

  `201 Created`. The recipient's open `/ws/chat` sockets receive `room.invite.received` (see WebSocket `08 - Chat/invite-events.yml`). Invitations are not stored: there is no pending list, no accept/decline endpoint, and no redelivery. The recipient accepts by joining the room with the ordinary Join room request, which applies every normal join check.

  | Field | Type | Required | Nullable | Allowed values | Description |
  | --- | --- | ---: | ---: | --- | --- |
  | `data.room_id` | integer | yes | no | positive | Room |
  | `data.room_code` | string | yes | no | `^[A-Z0-9]{6}$` | Code shown with the invitation |
  | `data.to_user_id` | integer | yes | no | positive | Invited user |
  | `data.sent_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Delivery time |

  ## Errors

  | Status | Code | When |
  | --- | --- | --- |
  | `401` | `UNAUTHORIZED` | invalid session |
  | `403` | `NOT_ROOM_MEMBER` | sender is not in the room |
  | `404` | `ROOM_NOT_FOUND` | room absent |
  | `404` | `USER_NOT_FOUND` | recipient absent |
  | `404` | `NOT_FRIENDS` | recipient is not a friend |
  | `409` | `ROOM_NOT_JOINABLE` | room is not `WAITING` |
  | `409` | `ROOM_FULL` | `player_count` equals `max_players` |
  | `409` | `USER_OFFLINE` | recipient has no open WebSocket connection |
  | `409` | `USER_IN_ROOM` | recipient already belongs to an active room |
  | `422` | `VALIDATION_ERROR` | `user_id` missing, not a positive integer, or the sender's own ID |

  Errors send nothing to the recipient.
examples:
  - name: Success - Invitation delivered
    request: {url: "{{baseUrl}}/api/rooms/1001/invites", method: POST, headers: [], params: [], body: {mode: json, json: '{"user_id":43}'}}
    response: {status: 201, headers: [{name: Content-Type, value: application/json}], body: {type: json, data: '{"data":{"room_id":1001,"room_code":"ABCD12","to_user_id":43,"sent_at":"2026-09-10T08:41:10Z"}}'}}
  - name: Error - Friend offline
    request: {url: "{{baseUrl}}/api/rooms/1001/invites", method: POST, headers: [], params: [], body: {mode: json, json: '{"user_id":43}'}}
    response: {status: 409, headers: [{name: Content-Type, value: application/json}], body: {type: json, data: '{"error":{"code":"USER_OFFLINE","message":"User 43 is not online.","details":{"user_id":43}}}'}}
  - name: Error - Friend already in a room
    request: {url: "{{baseUrl}}/api/rooms/1001/invites", method: POST, headers: [], params: [], body: {mode: json, json: '{"user_id":43}'}}
    response: {status: 409, headers: [{name: Content-Type, value: application/json}], body: {type: json, data: '{"error":{"code":"USER_IN_ROOM","message":"User 43 already belongs to an active room.","details":{"user_id":43}}}'}}
  - name: Error - Room full
    request: {url: "{{baseUrl}}/api/rooms/1001/invites", method: POST, headers: [], params: [], body: {mode: json, json: '{"user_id":43}'}}
    response: {status: 409, headers: [{name: Content-Type, value: application/json}], body: {type: json, data: '{"error":{"code":"ROOM_FULL","message":"Room 1001 is full (8 of 8 players).","details":{"room_id":1001,"player_count":8,"max_players":8}}}'}}
