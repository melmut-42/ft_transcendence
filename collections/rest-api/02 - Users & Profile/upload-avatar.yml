info:
  name: Upload avatar
  type: http
  seq: 4
  tags: [profile]
http:
  method: POST
  url: "{{baseUrl}}/api/users/me/avatar"
  headers:
    - name: Accept
      value: application/json
  body:
    type: multipartForm
    data:
      - name: avatar
        type: file
        value: []
docs: |-
  # Upload avatar

  ## Purpose and preconditions

  Completes the Standard User Management contract's avatar requirement. Requires an active session.

  ## Request parameters

  | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |
  | --- | --- | ---: | --- | --- | ---: | --- | --- |
  | `ft_session` cookie | request cookie | yes | string | active JWT access credential | no | Authenticates the owner | set by Register/Login |
  | `avatar` | multipart body | yes | file | `image/jpeg`, `image/png`, `image/webp`; `<= 2 MiB`; square recommended, server crops/resizes | no | New avatar image | `avatar.png` |

  MIME type and size are validated server-side from the actual file bytes, never trusted from the client-declared `Content-Type` alone. A user with no uploaded avatar renders a deterministic default derived from `user_id` (no upload step required to have *an* avatar).

  ## Success behavior and response fields

  `200 OK` replaces any previous uploaded avatar (the old file is deleted) and returns the new `avatar_url`, which then appears on own-profile, public-profile, friends-list, and room-member payloads.

  | Field | Type | Required | Nullable | Allowed values | Description |
  | --- | --- | ---: | ---: | --- | --- |
  | `data.avatar_url` | string | yes | no | URL | New avatar location |

  ## Errors

  | Status | Code | When |
  | --- | --- | --- |
  | `401` | `UNAUTHORIZED` | invalid session |
  | `422` | `INVALID_IMAGE` | wrong MIME type, corrupt file, or over 2 MiB |
examples:
  - name: Success - Avatar replaced
    request: {url: "{{baseUrl}}/api/users/me/avatar", method: POST, headers: [], params: [], body: {mode: none}}
    response:
      status: 200
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "data": {
              "avatar_url": "https://{{baseUrl}}/static/avatars/uploaded/42.webp"
            }
          }
  - name: Error - Invalid image
    request: {url: "{{baseUrl}}/api/users/me/avatar", method: POST, headers: [], params: [], body: {mode: none}}
    response:
      status: 422
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: '{"error":{"code":"INVALID_IMAGE","message":"Avatar must be image/jpeg, image/png, or image/webp under 2 MiB.","details":{}}}'
