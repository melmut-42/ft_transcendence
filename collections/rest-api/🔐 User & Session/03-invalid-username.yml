info:
  name: Enter invalid username
  type: http
  seq: 2
  tags:
    - negative

http:
  method: POST
  url: "{{baseUrl}}/users/enter"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "ab"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("rejects an invalid username", function() {
          expect(res.status).to.equal(400);
          expect(res.body.error.code).to.equal("INVALID_REQUEST");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 400 INVALID_REQUEST
    request:
      url: "{{baseUrl}}/users/enter"
      method: "POST"
      headers:
        - name: "Content-Type"
          value: "application/json"
          enabled: true
        - name: "Accept"
          value: "application/json"
          enabled: true
      params: []
      body:
        mode: json
        json: |-
          {
            "username": "ab"
          }
    response:
      status: 400
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "INVALID_REQUEST"
            }
          }

docs: |-
  # 📥 Enter invalid username

  ## 📝 Overview

  Creates a temporary username-based session that subsequent room requests can reuse. This is the workspace bootstrap step; it is not password registration or JWT login.

  ## 📍 Endpoint

  `POST {{baseUrl}}/users/enter`

  ## 🔐 Authentication

  No existing session is required. A successful response creates a temporary session for later protected requests.

  ## 📦 Request body

  The request sends JSON. Use the fields already present in the request editor; do not replace runtime placeholders with committed secrets.

  ```json
  {
    "username": "ab"
  }
  ```

  ## 📤 Response scenarios

  - `400` — 400 INVALID_REQUEST

  Review the native example body for the complete response shape.

  ## 🧭 Typical workflow

  Run this request before protected room requests. Its runtime script saves the session and user identifiers for the rest of the workspace.

  ## 🧪 Testing guidance

  This is a deliberate negative scenario. Keep its prepared inputs intact and verify both the HTTP status and the contract error code.

  > 💡 **Tip**
  >
  > Use the `local` environment and inspect the native response examples before sending a state-changing request.


  ## 🧩 Workspace metadata

  Tags: negative.

  The request documentation describes the known contract only. If the backend changes, update the route, scripts, tests, and native examples together.
