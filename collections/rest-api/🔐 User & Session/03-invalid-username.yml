info:
  name: "Enter invalid username"
  type: http
  seq: 3
  tags:
    - negative
http:
  method: POST
  url: "{{baseUrl}}/users/enter"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "ab"
      }
runtime:
  scripts:
    - type: tests
      code: |-
        test("rejects an invalid username", function() {
          expect(res.status).to.equal(400);
          expect(res.body.error.code).to.equal("INVALID_REQUEST");
        });
examples:
  - name: "400 INVALID_REQUEST"
    response:
      status: 400
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "INVALID_REQUEST"
            }
          }
docs: |-
  # Invalid username

  Expected response: `400 INVALID_REQUEST`. Usernames must contain 3–24 letters, digits, or underscores.
