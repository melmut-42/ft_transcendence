info:
  name: "Enter guest user"
  type: http
  seq: 2
  tags:
    - smoke
    - bootstrap
http:
  method: POST
  url: "{{baseUrl}}/users/enter"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "{{guest_username}}"
      }
runtime:
  scripts:
    - type: before-request
      code: |-
        const suffix = Date.now().toString(36);
        bru.setVar("guest_username", "guest_" + suffix);
    - type: after-response
      code: |-
        if (res.status === 201 && res.body && res.body.session) {
          bru.setVar("guest_session_id", String(res.body.session.session_id));
        }
    - type: tests
      code: |-
        test("creates a second temporary user session", function() {
          expect(res.status).to.equal(201);
          expect(res.body.user.username).to.be.a("string");
          expect(res.body.session.session_id).to.be.a("number");
          expect(res.body.active_room).to.equal(null);
        });
examples:
  - name: "201 Created"
    response:
      status: 201
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "user": { "user_id": 43, "username": "player_two" },
            "session": { "session_id": 7002, "expires_at": 1788883200 },
            "active_room": null
          }
docs: |-
  # Enter guest user

  Creates a second temporary session for the room join flow. It stores the returned session as `guest_session_id`.
