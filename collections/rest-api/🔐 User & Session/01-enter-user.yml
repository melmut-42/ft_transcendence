info:
  name: "Enter user"
  type: http
  seq: 1
  tags:
    - smoke
    - bootstrap
http:
  method: POST
  url: "{{baseUrl}}/users/enter"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "{{user_username}}"
      }
runtime:
  scripts:
    - type: before-request
      code: |-
        const suffix = Date.now().toString(36);
        bru.setVar("user_username", "user_" + suffix);
    - type: after-response
      code: |-
        if (res.status === 201 && res.body && res.body.session) {
          bru.setVar("session_id", String(res.body.session.session_id));
          bru.setVar("user_session_id", String(res.body.session.session_id));
          bru.setVar("user_id", String(res.body.user.user_id));
        }
    - type: tests
      code: |-
        test("creates a temporary user session", function() {
          expect(res.status).to.equal(201);
          expect(res.body.user.username).to.be.a("string");
          expect(res.body.session.session_id).to.be.a("number");
          expect(res.body.active_room).to.equal(null);
        });
docs: |-
  # 📥 Enter user

  ## 📝 Overview

  Creates a temporary username-based session that subsequent room requests can reuse. This is the workspace bootstrap step; it is not password registration or JWT login.

  ## 📍 Endpoint

  `POST {{baseUrl}}/users/enter`

  ## 🔐 Authentication

  No existing session is required. A successful response creates a temporary session for later protected requests.

  ## 📦 Request body

  The request sends JSON. Use the fields already present in the request editor; do not replace runtime placeholders with committed secrets.

  ```json
  {
    "username": "{{user_username}}"
  }
  ```

  ## 📤 Response scenarios

  - `201` — 201 Created

  Review the native example body for the complete response shape.

  ## 🧭 Typical workflow

  Run this request before protected room requests. Its runtime script saves the session and user identifiers for the rest of the workspace.

  ## 🧪 Testing guidance

  Use the native response example as a quick contract reference, then run the request against a local backend when the required variables are populated.

  > 💡 **Tip**
  >
  > Use the `local` environment and inspect the native response examples before sending a state-changing request.


  ## 🧩 Workspace metadata

  Tags: smoke, bootstrap.

  The request documentation describes the known contract only. If the backend changes, update the route, scripts, tests, and native examples together.
examples:
  - name: "201 Created"
    request:
      url: "{{baseUrl}}/users/enter"
      method: "POST"
      headers:
        - name: "Content-Type"
          value: "application/json"
          enabled: true
        - name: "Accept"
          value: "application/json"
          enabled: true
      params: []
      body:
        mode: json
        json: |-
          {
            "username": "{{user_username}}"
          }
    response:
      status: 201
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "user": { "user_id": 42, "username": "player_one" },
            "session": { "session_id": 7001, "expires_at": 1788883200 },
            "active_room": null
          }
