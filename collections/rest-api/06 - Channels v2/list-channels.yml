info:
  name: List my channels
  type: http
  seq: 1
  tags: [chat, channels]
http:
  method: GET
  url: "{{baseUrl}}/api/{{chatApiVersion}}/channels"
  headers:
    - name: Accept
      value: application/json
docs: |-
  # List my channels

  Returns the authenticated user's direct conversations, newest activity first. Channel Service supplies this data through the BFF.

  `data.channels[]` contains `channel_id`, `type` (`DIRECT`), `peer` (`user_id`, `username`, `avatar_url`, `is_online`), and `last_message` (nullable). A non-null last message contains `message_id`, `sender_user_id`, `text`, `sent_at`, and `expires_at`.

  Errors: `401 UNAUTHORIZED` for an invalid session.
examples:
  - name: Success - One direct channel
    request: {url: "{{baseUrl}}/api/{{chatApiVersion}}/channels", method: GET, headers: [], params: [], body: {mode: none}}
    response:
      status: 200
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: '{"data":{"channels":[{"channel_id":7001,"type":"DIRECT","peer":{"user_id":43,"username":"red_agent","avatar_url":"/static/avatars/default/43.svg","is_online":true},"last_message":{"message_id":"msg_001","sender_user_id":42,"text":"gg, ready?","sent_at":"2026-09-17T10:00:00Z","expires_at":"2026-10-17T10:00:00Z"}}]}}'
