docs: |-
  # Chat channels

  Channel metadata and retained message history are served through the Web BFF. The BFF delegates ownership to Channel Service; clients never call Channel Service directly. Live messages use the separate Chat Gateway WebSocket documented in `WebSocket/09 - Chat Gateway v2`.

  Version 2 models every one-to-one conversation as one canonical `DIRECT` channel. A pair of users cannot have duplicate direct channels. Messages are durable for 30 days by default; the deployment may configure the retention period, and every message exposes its exact `expires_at` timestamp.
