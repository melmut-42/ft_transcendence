info:
  name: Open direct channel
  type: http
  seq: 2
  tags: [chat, channels]
http:
  method: POST
  url: "{{baseUrl}}/api/{{chatApiVersion}}/channels/direct"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "peer_user_id": 43
      }
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 || res.status === 201) {
          bru.setEnvVar("channelId", res.body.data.channel_id);
        }
docs: |-
  # Open direct channel

  Resolves the canonical `DIRECT` channel for the authenticated user and `peer_user_id`. Returns `201 Created` when Channel Service creates it and `200 OK` when it already exists. The users must be friends or current members of the same active room. The response contains `data.channel_id`, `data.type`, `data.peer`, and `data.created_at`.

  Errors: `401 UNAUTHORIZED`, `403 NOT_PERMITTED`, `404 USER_NOT_FOUND`, and `422 VALIDATION_ERROR`.
examples:
  - name: Success - Existing channel
    request: {url: "{{baseUrl}}/api/{{chatApiVersion}}/channels/direct", method: POST, headers: [{name: Content-Type, value: application/json, enabled: true}], params: [], body: {mode: json, json: '{"peer_user_id":43}'}}
    response: {status: 200, headers: [{name: Content-Type, value: application/json}], body: {type: json, data: '{"data":{"channel_id":7001,"type":"DIRECT","peer":{"user_id":43,"username":"red_agent"},"created_at":"2026-09-10T08:00:00Z"}}'}}
