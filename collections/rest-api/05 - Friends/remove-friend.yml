info:
  name: Remove friend
  type: http
  seq: 3
  tags: [friends]
http:
  method: DELETE
  url: "{{baseUrl}}/api/friends/43"
  headers:
docs: |-
  # Remove friend

  ## Purpose

  Removes an existing friendship both ways.

  ## Request parameters

  | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |
  | --- | --- | ---: | --- | --- | ---: | --- | --- |
  | `user_id` | path | yes | integer | positive | no | Friend to remove | `43` |
  | `ft_session` cookie | request cookie | yes | string | active JWT access credential | no | Requesting identity | set by Register/Login |

  ## Success and errors

  `204 No Content` on success. `401 UNAUTHORIZED` for invalid session; `404 NOT_FRIENDS` when no friendship exists.
examples:
  - name: Success - Remove red_agent
    request: {url: "{{baseUrl}}/api/friends/43", method: DELETE, headers: [], params: [], body: {mode: none}}
    response: {status: 204, headers: [], body: {type: text, data: ""}}
  - name: Error - Not friends
    request: {url: "{{baseUrl}}/api/friends/9999", method: DELETE, headers: [], params: [], body: {mode: none}}
    response: {status: 404, headers: [{name: Content-Type, value: application/json}], body: {type: json, data: '{"error":{"code":"NOT_FRIENDS","message":"User 9999 is not a friend.","details":{"user_id":9999}}}'}}
