docs: |-
  # Error and state examples

  Cross-endpoint REST taxonomy and canonical room lifecycle index. Endpoint files remain authoritative for applicability; this folder prevents unrelated errors from being attached to every request.

  ## Error envelope

  ```json
    {
      "error": {
        "code": "ROOM_NOT_FOUND",
        "message": "Room 9999 was not found.",
        "details": {
          "room_id": 9999
        }
      }
    }
  ```

  | HTTP | Code | Concrete message example | Applicable operations |
  | ---: | --- | --- | --- |
  | `422` | `INVALID_EMAIL` | `email must be a valid email address.` | register |
  | `422` | `INVALID_USERNAME` | `Username must match ^[A-Za-z0-9_]{3,20}$.` | register |
  | `422` | `INVALID_PASSWORD` | `password must be at least 8 characters.` | register |
  | `409` | `EMAIL_TAKEN` | `Email 'player.one@example.com' is already registered.` | register |
  | `409` | `USERNAME_TAKEN` | `Username 'player_one' is already registered.` | register |
  | `401` | `INVALID_CREDENTIALS` | `Email or password is incorrect.` | login |
  | `401` | `SESSION_EXPIRED` | `The refresh token is invalid or expired. Log in again.` | refresh |
  | `401` | `UNAUTHORIZED` | `A valid active session is required.` | every other protected endpoint |
  | `404` | `USER_NOT_FOUND` | `User 9999 was not found.` | public profile, add friend |
  | `409` | `ALREADY_FRIENDS` | `User 43 is already a friend.` | add friend |
  | `404` | `NOT_FRIENDS` | `User 9999 is not a friend.` | remove friend |
  | `404` | `ROOM_NOT_FOUND` | `Room 9999 was not found.` | join, get, leave, lookup |
  | `409` | `ROOM_NOT_JOINABLE` | `Room 1001 is not joinable while status is COUNTDOWN.` | join |
  | `409` | `ALREADY_IN_ROOM` | `User 46 already belongs to active room 1002.` | create, join |
  | `403` | `NOT_ROOM_MEMBER` | `User 47 is not a member of room 1001.` | get, leave |
  | `422` | `INVALID_IMAGE` | `Avatar must be image/jpeg, image/png, or image/webp under 2 MiB.` | upload avatar |
  | `400` or `422` | `VALIDATION_ERROR` | `user_id must be a positive integer.` | malformed JSON or field/path validation |
  | `429` | `RATE_LIMITED` | `Too many registration attempts; retry after 60 seconds.` | throttled operation |

  Malformed JSON uses `400 VALIDATION_ERROR`; syntactically valid values that fail field constraints use `422 VALIDATION_ERROR`, except the more specific `INVALID_EMAIL`/`INVALID_USERNAME`/`INVALID_PASSWORD`/`INVALID_IMAGE`. `SESSION_EXPIRED` is distinct from `UNAUTHORIZED`: it means the refresh credential itself is dead and the user must log in again, not merely that a request needs to retry after refreshing. Every error keeps state unchanged. **`Leave room` no longer returns `409 INVALID_ROOM_STATE` for `IN_GAME`** — leaving (or logging out) during `IN_GAME` now succeeds and triggers forfeit (`workspace.yml`, Room Abandonment); `INVALID_ROOM_STATE` is still used for the WebSocket room/game action errors documented in `06 - Errors/error-catalog.yml`.

  ## State example index

  `Get room snapshot` contains new, four-player unconfigured, incomplete-role, valid-role/unready, full `IN_GAME` Operative, missing-room, and forbidden-access examples. WebSocket scenario docs contain all-ready, countdown, cancellation, Spymaster `IN_GAME`, every reveal branch (including `PLAYER_FORFEIT`), and finished state.
