info:
  name: Get current session
  type: http
  seq: 4
  tags: [identity]
http:
  method: GET
  url: "{{baseUrl}}/api/auth/session"
  headers:
    - name: Accept
      value: application/json
docs: |-
  # Get current session

  ## Purpose and preconditions

  Resolves the `ft_session` credential (from Register, Login, or Refresh) to its user and current room membership, derived live from Game Session's authoritative membership index (`workspace.yml`, State Ownership) — never a stale cached value. A valid unexpired `ft_session` cookie is required; this is also the endpoint frontend route recovery calls on bootstrap to decide which screen to show (Routing Recovery).

  ## Request parameters

  | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |
  | --- | --- | ---: | --- | --- | ---: | --- | --- |
  | `ft_session` cookie | request cookie | yes | string | active JWT access credential | no | Shared REST/WebSocket credential | set by Register/Login |
  | `Accept` | header | yes | string | `application/json` | no | Requested response media type | `application/json` |

  ## Success and response fields

  `200 OK` returns the authenticated identity without reissuing a token.

  | Field | Type | Required | Nullable | Allowed values | Description |
  | --- | --- | ---: | ---: | --- | --- |
  | `data.user.user_id` | integer | yes | no | positive | Authenticated user |
  | `data.user.username` | string | yes | no | username rule | Stored display username |
  | `data.active_room_id` | integer or null | yes | yes | positive or `null` | Current live room membership (from Game Session's membership index), never a permanent profile field |
  | `data.session_expires_at` | `string<date-time>` | yes | no | ISO 8601 UTC | `ft_session` expiry |

  ## State changes, events, and errors

  Read-only; no event. Missing, invalid, revoked, or expired `ft_session` returns `401 UNAUTHORIZED` and an empty details object — the frontend should attempt `POST /api/auth/refresh` before treating this as a full logout.
examples:
  - name: Success - No active room
    request: {url: "{{baseUrl}}/api/auth/session", method: GET, headers: [{name: Accept, value: application/json, enabled: true}], params: [], body: {mode: none}}
    response:
      status: 200
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "data": {
              "user": {
                "user_id": 42,
                "username": "player_one"
              },
              "active_room_id": null,
              "session_expires_at": "2026-09-10T09:10:01Z"
            }
          }
  - name: Success - Active room
    request: {url: "{{baseUrl}}/api/auth/session", method: GET, headers: [{name: Accept, value: application/json, enabled: true}], params: [], body: {mode: none}}
    response:
      status: 200
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "data": {
              "user": {
                "user_id": 42,
                "username": "player_one"
              },
              "active_room_id": 1001,
              "session_expires_at": "2026-09-10T09:10:01Z"
            }
          }
  - name: Error - Invalid session
    request: {url: "{{baseUrl}}/api/auth/session", method: GET, headers: [{name: Accept, value: application/json, enabled: true}, {name: Cookie, value: "ft_session=invalid", enabled: true}], params: [], body: {mode: none}}
    response:
      status: 401
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "UNAUTHORIZED",
              "message": "A valid active session is required.",
              "details": {}
            }
          }
