docs: |-
  # Identity

  Registered-account identity: email + username + password (subject Ch. III–IV, mandatory). OAuth is a deferred module — not implemented in this contract for now. Guest-first is cancelled — there is no anonymous identity. Email is the login identifier; username is the public display name. Both are trimmed and case-insensitively unique; password is hashed + salted server-side and never returned or logged.

  Registration and login each issue a two-cookie session pair (Decision 6 — closed: JWT + refresh tokens; Decision 11 — closed: cookie transport): `ft_session` (HttpOnly, `Secure`, `SameSite=Lax`, `Path=/`, short-lived JWT access credential) and `ft_refresh` (HttpOnly, `Secure`, `SameSite=Lax`, `Path=/api/auth/refresh`, long-lived opaque refresh credential, single-use/rotated). No token value is ever returned in a JSON response body, and there is no `X-Session-Id` header or any other credential path — every client, browser or non-browser, authenticates through these two cookies. Bruno uses its cookie jar the same way a browser does.

  `POST /api/auth/refresh` reads `ft_refresh` only, rotates it, and reissues both cookies without forcing the user to log in again. `DELETE /api/auth/session` (logout) revokes both credentials and clears both cookies, regardless of room membership — if the user is `IN_GAME`, it forfeits that match first (see `workspace.yml`, Room Abandonment). Neither endpoint deletes the user or their statistics. Full model, including expiry/revocation semantics and refresh-token-reuse detection: `workspace.yml`, Session and Credential Model.
