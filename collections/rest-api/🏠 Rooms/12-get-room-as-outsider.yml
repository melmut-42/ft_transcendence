info:
  name: "Get room as outsider"
  type: http
  seq: 12
  tags:
    - manual
    - negative
http:
  method: GET
  url: "{{baseUrl}}/rooms/:room_id"
  params:
    - name: room_id
      value: "{{room_id}}"
      type: path
  headers:
    - name: X-Session-Id
      value: "{{outsider_session_id}}"
    - name: Accept
      value: application/json
runtime:
  scripts:
    - type: tests
      code: |-
        test("forbids a non-member from reading a room", function() {
          expect(res.status).to.equal(403);
          expect(res.body.error.code).to.equal("FORBIDDEN");
        });
examples:
  - name: "403 FORBIDDEN"
    request:
      url: "{{baseUrl}}/rooms/:room_id"
      method: "GET"
      headers:
        - name: "X-Session-Id"
          value: "{{outsider_session_id}}"
          enabled: true
        - name: "Accept"
          value: "application/json"
          enabled: true
      params:
        - name: "room_id"
          value: "{{room_id}}"
          type: "path"
          enabled: true
      body:
        mode: none
    response:
      status: 403
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "FORBIDDEN"
            }
          }
docs: |-
  # 📥 Get room as outsider

  ## 📝 Overview

  Retrieves the authoritative room snapshot for the path parameter `room_id`. Access depends on the authenticated user's membership and authorization.

  ## 📍 Endpoint

  `GET {{baseUrl}}/rooms/:room_id`

  ## 🔐 Authentication

  A valid temporary session is required in `X-Session-Id`. The selected environment supplies the value at runtime.

  ## 📦 Request body

  No request body is required for this request.

  ## 📤 Response scenarios

  - `403` — 403 FORBIDDEN

  Review the native example body for the complete response shape.

  ## 🧭 Typical workflow

  Run after `room_id` and a suitable session are available. Use the manual outsider request only with a session that is not a room member.

  ## 🧪 Testing guidance

  This is a deliberate negative scenario. Keep its prepared inputs intact and verify both the HTTP status and the contract error code.

  > 💡 **Tip**
  >
  > Use the `local` environment and inspect the native response examples before sending a state-changing request.

  > ⚠️ **Prepared state required**
  >
  > This scenario depends on a prepared session or room state. It is not part of the default smoke flow.

  ## 🧩 Workspace metadata

  Tags: manual, negative.

  The request documentation describes the known contract only. If the backend changes, update the route, scripts, tests, and native examples together.
