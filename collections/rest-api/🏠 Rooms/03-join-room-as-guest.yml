info:
  name: "Join room as guest"
  type: http
  seq: 3
  tags:
    - smoke
    - rooms
http:
  method: POST
  url: "{{baseUrl}}/rooms/join"
  headers:
    - name: X-Session-Id
      value: "{{guest_session_id}}"
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "room_id": {{room_id}}
      }
runtime:
  scripts:
    - type: tests
      code: |-
        test("joins the waiting room", function() {
          expect(res.status).to.equal(200);
          expect(res.body.room_id).to.equal(Number(bru.getVar("room_id")));
          expect(res.body.players).to.be.an("array");
        });
docs: |-
  # Join room

  A user may join a room in `WAITING` or `READY`. The room needs four players before it can start.

  Expected errors include `400 INVALID_REQUEST`, `401` for a missing/invalid session, `404 ROOM_NOT_FOUND`, `409 ROOM_NOT_JOINABLE` for `IN_PROGRESS` or `FINISHED`, and `422 USER_ALREADY_IN_ROOM`.

examples:
  - name: "200 OK — joined room"
    response:
      status: 200
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "room_id": 1001,
            "status": "WAITING",
            "host": { "user_id": 42, "username": "player_one" },
            "players": [
              { "user_id": 42, "username": "player_one", "role": "HOST", "connection_status": "CONNECTED" },
              { "user_id": 43, "username": "player_two", "role": "OPERATIVE", "connection_status": "CONNECTED" }
            ],
            "minimum_players": 4,
            "game": null
          }
