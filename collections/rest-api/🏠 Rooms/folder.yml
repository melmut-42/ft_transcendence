docs:
  content: |-
    # 🏠 Rooms

    This folder covers the room lifecycle after a temporary user session exists. 🏠 Requests create rooms, join rooms, retrieve authoritative state, and exercise membership and state restrictions.

    ## 📊 What the responses represent

    The backend returns the authoritative room snapshot, including the room ID, lifecycle status, host role, players, connection status, minimum player count, and game state when those fields are part of the known response. A user can belong to only one room at a time.

    ## 🧭 Recommended flow

    1. 🔐 Run `Enter user` and retain the generated session.
    2. ➕ Run `Create room as host`; the response chains `room_id`.
    3. 📤 Retrieve the room with `Get room state`.
    4. 👤 Set a prepared `guest_session_id`, then run `Join room`.
    5. 📊 Retrieve the room again with `Get room state`.

    The grouped native examples on these requests cover missing sessions, invalid IDs, duplicate membership, forbidden access, and non-joinable room states.

    > ⚠️ **State sensitivity**
    >
    > Manual examples such as outsider access and in-progress/finished-room joins require prepared sessions or room IDs. Do not treat their placeholders as automatically runnable smoke tests.

    ## 🧪 Testing focus

    Review the endpoint-level native examples for `201`, `200`, `400`, `401`, `403`, `404`, `409`, and `422` outcomes, and confirm that the error code—not only the HTTP status—matches the contract.
  type: text/markdown
