          value: "application/json"
          enabled: true
      params:
        - name: "room_id"
          value: "2147483647"
          type: "path"
          enabled: true
      body:
        mode: none
    response:
      status: 404
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "ROOM_NOT_FOUND"
            }
          }
