info:
  name: "Get room state"
  type: http
  seq: 2
  tags:
    - smoke
    - rooms
http:
  method: GET
  url: "{{baseUrl}}/rooms/:room_id"
  params:
    - name: room_id
      value: "{{room_id}}"
      type: path
  headers:
    - name: X-Session-Id
      value: "{{user_session_id}}"
    - name: Accept
      value: application/json
runtime:
  scripts:
    - type: tests
      code: |-
        test("returns the authoritative room snapshot", function() {
          expect(res.status).to.equal(200);
          expect(res.body.room_id).to.equal(Number(bru.getVar("room_id")));
          expect(res.body.status).to.be.oneOf(["WAITING", "READY", "IN_PROGRESS", "FINISHED"]);
          expect(res.body.players).to.be.an("array");
        });
docs: |-
  # 📥 Get room state

  ## 📝 Overview

  Retrieves the authoritative room snapshot for the path parameter `room_id`. Access depends on the authenticated user's membership and authorization.

  Every room requires exactly four players before the host can start the game.

  ## 📍 Endpoint

  `GET {{baseUrl}}/rooms/:room_id`

  ## 🔐 Authentication

  A valid temporary session is required in `X-Session-Id`. The selected environment supplies the value at runtime.

  ## 📦 Request body

  No request body is required for this request.

  ## 📤 Response Scenarios

  | Status | Response / Error | Description |
  |--------|------------------|-------------|
  | `200` | `OK` | The authoritative room snapshot was returned for the authenticated user. |
  | `401` | `Unauthorized` | The request was rejected because the user does not have a valid temporary session in `X-Session-Id`. |
  | `403` | `FORBIDDEN` | The authenticated user is not allowed to access this room, typically because they are not an authorized member. |
  | `404` | `ROOM_NOT_FOUND` | The requested room does not exist for the supplied `room_id`; verify the identifier before retrying. |

  Review the native example body for the complete response shape.

  ## 📊 Verified response fields

  The saved `200` example verifies the waiting-room snapshot below. Populated game-state fields are not available in this repository, so no started or finished game schema is invented here.

  | Field | Type | Example / values | Description |
  |-------|------|------------------|-------------|
  | `room_id` | Integer | `1001` | Identifier of the requested room. |
  | `status` | String | `WAITING` | Current lifecycle state in the saved example. |
  | `host` | Object | `{ "user_id": 42, "username": "player_one" }` | User who owns the host role. |
  | `players` | Array | One player in the saved example. | Current room membership snapshot. |
  | `players[].user_id` | Integer | `42` | Identifier of a room member. |
  | `players[].username` | String | `player_one` | Username of a room member. |
  | `players[].role` | String | `HOST` | Role assigned to the member in the saved example. |
  | `players[].connection_status` | String | `CONNECTED` | Connection state shown for the member. |
  | `game` | `null` | `null` | No game object is present in the saved waiting-room example. |

  ## 🧭 Typical workflow

  Run after `room_id` and a suitable session are available. Use the prepared guest session when validating membership, and use an outsider session only for the forbidden-access scenario.

  ## 🧪 Testing guidance

  Use the native response example as a quick contract reference, then run the request against a local backend when the required variables are populated.

  > 💡 **Tip**
  >
  > Use the `local` environment and inspect the native response examples before sending a state-changing request.


  ## 🧩 Workspace metadata

  Tags: smoke, rooms.

  The request documentation describes the known contract only. If the backend changes, update the route, scripts, tests, and native examples together.
examples:
  - name: "200 OK — authoritative snapshot"
    request:
      url: "{{baseUrl}}/rooms/:room_id"
      method: "GET"
      headers:
        - name: "X-Session-Id"
          value: "{{user_session_id}}"
          enabled: true
        - name: "Accept"
          value: "application/json"
          enabled: true
      params:
        - name: "room_id"
          value: "{{room_id}}"
          type: "path"
          enabled: true
      body:
        mode: none
    response:
      status: 200
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "room_id": 1001,
            "status": "WAITING",
            "host": { "user_id": 42, "username": "player_one" },
            "players": [
              { "user_id": 42, "username": "player_one", "role": "HOST", "connection_status": "CONNECTED" }
            ],
            "game": null
          }
  - name: "401 Unauthorized"
    request:
      url: "{{baseUrl}}/rooms/:room_id"
      method: "GET"
      headers:
        - name: "X-Session-Id"
          value: "{{user_session_id}}"
          enabled: false
        - name: "Accept"
          value: "application/json"
          enabled: true
      params:
        - name: "room_id"
          value: "{{room_id}}"
          type: "path"
          enabled: true
      body:
        mode: none
    response:
      status: 401
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "UNAUTHORIZED"
            }
          }
  - name: "403 FORBIDDEN"
    request:
      url: "{{baseUrl}}/rooms/:room_id"
      method: "GET"
      headers:
        - name: "X-Session-Id"
          value: "{{outsider_session_id}}"
          enabled: true
        - name: "Accept"
          value: "application/json"
          enabled: true
      params:
        - name: "room_id"
          value: "{{room_id}}"
          type: "path"
          enabled: true
      body:
        mode: none
    response:
      status: 403
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "FORBIDDEN"
            }
          }
  - name: "404 ROOM_NOT_FOUND"
    request:
      url: "{{baseUrl}}/rooms/:room_id"
      method: "GET"
      headers:
        - name: "X-Session-Id"
          value: "{{user_session_id}}"
          enabled: true
        - name: "Accept"
          value: "application/json"
          enabled: true
      params:
        - name: "room_id"
          value: "2147483647"
          type: "path"
          enabled: true
      body:
        mode: none
    response:
      status: 404
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "ROOM_NOT_FOUND"
            }
          }
