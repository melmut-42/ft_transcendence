info:
  name: "Join finished room"
  type: http
  seq: 14
  tags:
    - manual
    - negative
http:
  method: POST
  url: "{{baseUrl}}/rooms/join"
  headers:
    - name: X-Session-Id
      value: "{{outsider_session_id}}"
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "room_id": {{prepared_finished_room_id}}
      }
runtime:
  scripts:
    - type: tests
      code: |-
        test("rejects joining a finished room", function() {
          expect(res.status).to.equal(409);
          expect(res.body.error.code).to.equal("ROOM_NOT_JOINABLE");
        });
examples:
  - name: "409 ROOM_NOT_JOINABLE"
    request:
      url: "{{baseUrl}}/rooms/join"
      method: "POST"
      headers:
        - name: "X-Session-Id"
          value: "{{outsider_session_id}}"
          enabled: true
        - name: "Content-Type"
          value: "application/json"
          enabled: true
        - name: "Accept"
          value: "application/json"
          enabled: true
      params: []
      body:
        mode: json
        json: |-
          {
            "room_id": {{prepared_finished_room_id}}
          }
    response:
      status: 409
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "ROOM_NOT_JOINABLE"
            }
          }
docs: |-
  # 📥 Join finished room

  ## 📝 Overview

  Attempts to add the authenticated user to the room identified by `room_id`. The response reflects whether the room exists, is joinable, and does not already contain the user.

  ## 📍 Endpoint

  `POST {{baseUrl}}/rooms/join`

  ## 🔐 Authentication

  A valid temporary session is required in `X-Session-Id`. The selected environment supplies the value at runtime.

  ## 📦 Request body

  The request sends JSON. Use the fields already present in the request editor; do not replace runtime placeholders with committed secrets.

  ```json
  {
    "room_id": {{prepared_finished_room_id}}
  }
  ```

  ## 📤 Response scenarios

  - `409` — 409 ROOM_NOT_JOINABLE

  Review the native example body for the complete response shape.

  ## 🧭 Typical workflow

  Run after a user session and room ID are available. A successful join can be followed by room-state retrieval and WebSocket observation.

  ## 🧪 Testing guidance

  This is a deliberate negative scenario. Keep its prepared inputs intact and verify both the HTTP status and the contract error code.

  > 💡 **Tip**
  >
  > Use the `local` environment and inspect the native response examples before sending a state-changing request.

  > ⚠️ **Prepared state required**
  >
  > This scenario depends on a prepared session or room state. It is not part of the default smoke flow.

  ## 🧩 Workspace metadata

  Tags: manual, negative.

  The request documentation describes the known contract only. If the backend changes, update the route, scripts, tests, and native examples together.
