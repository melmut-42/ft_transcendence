info:
  name: "Create room without session"
  type: http
  seq: 5
  tags:
    - negative
http:
  method: POST
  url: "{{baseUrl}}/rooms"
  headers:
    - name: X-Session-Id
      value: "{{host_session_id}}"
      disabled: true
    - name: Accept
      value: application/json
runtime:
  scripts:
    - type: tests
      code: |-
        test("rejects a protected request without a session header", function() {
          expect(res.status).to.equal(401);
        });
examples:
  - name: "401 Unauthorized"
    response:
      status: 401
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "UNAUTHORIZED"
            }
          }
docs: |-
  # Missing session

  The `X-Session-Id` header is intentionally disabled. Expected response: `401` with a message that a valid `X-Session-Id` is required.
