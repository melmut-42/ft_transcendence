info:
  name: "Create room as host"
  type: http
  seq: 1
  tags:
    - smoke
    - rooms
http:
  method: POST
  url: "{{baseUrl}}/rooms"
  headers:
    - name: X-Session-Id
      value: "{{user_session_id}}"
    - name: Accept
      value: application/json
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201 && res.body && res.body.room_id !== undefined) {
          bru.setVar("room_id", String(res.body.room_id));
        }
    - type: tests
      code: |-
        test("creates a waiting room", function() {
          expect(res.status).to.equal(201);
          expect(res.body.status).to.equal("WAITING");
          expect(res.body.host.user_id).to.be.a("number");
          expect(res.body.players).to.be.an("array");
          expect(res.body.minimum_players).to.equal(4);
        });
docs: |-
  # 📥 Create room as host

  ## 📝 Overview

  Creates a room for the authenticated user. The backend assigns the host role in the returned room snapshot and the runtime script stores `room_id` for the next requests.

  Every room requires exactly four players. The returned `minimum_players` field is always `4`; it is informational and is not a configurable request option.

  ## 📍 Endpoint

  `POST {{baseUrl}}/rooms`

  ## 🔐 Authentication

  A valid temporary session is required in `X-Session-Id`. The selected environment supplies the value at runtime.

  ## 📦 Request body

  No request body is required for this request.

  ## 📤 Response scenarios

  - `201` — 201 Created — waiting room
  - `401` — Unauthorized
  - `409` — USER_ALREADY_IN_ROOM

  Review the native example body for the complete response shape.

  ## 🧭 Typical workflow

  Run after the user-entry flow. On success, continue with room-state retrieval, joining, or the documented negative room scenarios.

  ## 🧪 Testing guidance

  Use the native response example as a quick contract reference, then run the request against a local backend when the required variables are populated.

  > 💡 **Tip**
  >
  > Use the `local` environment and inspect the native response examples before sending a state-changing request.


  ## 🧩 Workspace metadata

  Tags: smoke, rooms.

  The request documentation describes the known contract only. If the backend changes, update the route, scripts, tests, and native examples together.
examples:
  - name: "201 Created — waiting room"
    request:
      url: "{{baseUrl}}/rooms"
      method: "POST"
      headers:
        - name: "X-Session-Id"
          value: "{{user_session_id}}"
          enabled: true
        - name: "Accept"
          value: "application/json"
          enabled: true
      params: []
      body:
        mode: none
    response:
      status: 201
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "room_id": 1001,
            "status": "WAITING",
            "host": { "user_id": 42, "username": "player_one" },
            "players": [
              { "user_id": 42, "username": "player_one", "role": "HOST", "connection_status": "CONNECTED" }
            ],
            "minimum_players": 4,
            "game": null
          }
  - name: "401 Unauthorized"
    request:
      url: "{{baseUrl}}/rooms"
      method: "POST"
      headers:
        - name: "X-Session-Id"
          value: "{{user_session_id}}"
          enabled: false
        - name: "Accept"
          value: "application/json"
          enabled: true
      params: []
      body:
        mode: none
    response:
      status: 401
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "UNAUTHORIZED"
            }
          }
  - name: "409 USER_ALREADY_IN_ROOM"
    request:
      url: "{{baseUrl}}/rooms"
      method: "POST"
      headers:
        - name: "X-Session-Id"
          value: "{{user_session_id}}"
          enabled: true
        - name: "Accept"
          value: "application/json"
          enabled: true
      params: []
      body:
        mode: none
    response:
      status: 409
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "USER_ALREADY_IN_ROOM"
            }
          }
