info:
  name: "Create room as host"
  type: http
  seq: 1
  tags:
    - smoke
    - rooms
http:
  method: POST
  url: "{{baseUrl}}/rooms"
  headers:
    - name: X-Session-Id
      value: "{{user_session_id}}"
    - name: Accept
      value: application/json
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201 && res.body && res.body.room_id !== undefined) {
          bru.setVar("room_id", String(res.body.room_id));
        }
    - type: tests
      code: |-
        test("creates a waiting room", function() {
          expect(res.status).to.equal(201);
          expect(res.body.status).to.equal("WAITING");
          expect(res.body.host.user_id).to.be.a("number");
          expect(res.body.players).to.be.an("array");
        });
docs: |-
  # 📥 Create room as host

  ## 📝 Overview

  Creates a room for the authenticated user. The backend assigns the host role in the returned room snapshot and the runtime script stores `room_id` for the next requests.

  Every room requires exactly four players before the host can start the game.

  ## 📍 Endpoint

  `POST {{baseUrl}}/rooms`

  ## 🔐 Authentication

  A valid temporary session is required in `X-Session-Id`. The selected environment supplies the value at runtime.

  ## 📦 Request body

  No request body is required for this request.

  ## 📤 Response Scenarios

  | Status | Response / Error | Description |
  |--------|------------------|-------------|
  | `201` | `Created` | The room was successfully created and is now available in the waiting state. |
  | `401` | `Unauthorized` | The request was rejected because the user does not have a valid temporary session in `X-Session-Id`. |
  | `409` | `USER_ALREADY_IN_ROOM` | The room was not created because the authenticated user is already associated with an existing room. |

  Review the native example body for the complete response shape.

  ## 📊 Verified response fields

  The saved `201` example verifies these fields for a newly created waiting room:

  | Field | Type | Example / values | Description |
  |-------|------|------------------|-------------|
  | `room_id` | Integer | `1001` | Identifier assigned to the new room. |
  | `status` | String | `WAITING` | The room is waiting for the remaining players. |
  | `host` | Object | `{ "user_id": 42, "username": "player_one" }` | User who created the room and owns the host role. |
  | `players` | Array | One player in the saved example. | Current room membership snapshot. |
  | `players[].user_id` | Integer | `42` | Identifier of a room member. |
  | `players[].username` | String | `player_one` | Username of a room member. |
  | `players[].role` | String | `HOST` | Role assigned to the member in the saved example. |
  | `players[].connection_status` | String | `CONNECTED` | Connection state shown for the member. |
  | `game` | `null` | `null` | No game object is present while the room is waiting. |

  ## 🧭 Typical workflow

  Run after the user-entry flow. On success, continue with room-state retrieval, joining, or the documented negative room scenarios.

  ## 🧪 Testing guidance

  Use the native response example as a quick contract reference, then run the request against a local backend when the required variables are populated.

  > 💡 **Tip**
  >
  > Use the `local` environment and inspect the native response examples before sending a state-changing request.


  ## 🧩 Workspace metadata

  Tags: smoke, rooms.

  The request documentation describes the known contract only. If the backend changes, update the route, scripts, tests, and native examples together.
examples:
  - name: "201 Created — waiting room"
    request:
      url: "{{baseUrl}}/rooms"
      method: "POST"
      headers:
        - name: "X-Session-Id"
          value: "{{user_session_id}}"
          enabled: true
        - name: "Accept"
          value: "application/json"
          enabled: true
      params: []
      body:
        mode: none
    response:
      status: 201
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "room_id": 1001,
            "status": "WAITING",
            "host": { "user_id": 42, "username": "player_one" },
            "players": [
              { "user_id": 42, "username": "player_one", "role": "HOST", "connection_status": "CONNECTED" }
            ],
            "game": null
          }
  - name: "401 Unauthorized"
    request:
      url: "{{baseUrl}}/rooms"
      method: "POST"
      headers:
        - name: "X-Session-Id"
          value: "{{user_session_id}}"
          enabled: false
        - name: "Accept"
          value: "application/json"
          enabled: true
      params: []
      body:
        mode: none
    response:
      status: 401
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "UNAUTHORIZED"
            }
          }
  - name: "409 USER_ALREADY_IN_ROOM"
    request:
      url: "{{baseUrl}}/rooms"
      method: "POST"
      headers:
        - name: "X-Session-Id"
          value: "{{user_session_id}}"
          enabled: true
        - name: "Accept"
          value: "application/json"
          enabled: true
      params: []
      body:
        mode: none
    response:
      status: 409
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "USER_ALREADY_IN_ROOM"
            }
          }
