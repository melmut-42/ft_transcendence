info:
  name: "Get room without session"
  type: http
  seq: 10
  tags:
    - negative
http:
  method: GET
  url: "{{baseUrl}}/rooms/:room_id"
  params:
    - name: room_id
      value: "{{room_id}}"
      type: path
  headers:
    - name: X-Session-Id
      value: "{{user_session_id}}"
      disabled: true
    - name: Accept
      value: application/json
runtime:
  scripts:
    - type: tests
      code: |-
        test("rejects a protected room read without a session", function() {
          expect(res.status).to.equal(401);
        });
examples:
  - name: "401 Unauthorized"
    response:
      status: 401
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "UNAUTHORIZED"
            }
          }
docs: |-
  # 📥 Get room without session

  ## 📝 Overview

  Retrieves the authoritative room snapshot for the path parameter `room_id`. Access depends on the authenticated user's membership and authorization.

  ## 📍 Endpoint

  `GET {{baseUrl}}/rooms/:room_id`

  ## 🔐 Authentication

  A valid temporary session is required in `X-Session-Id`. The selected environment supplies the value at runtime.

  ## 📦 Request body

  No request body is required for this request.

  ## 📤 Response scenarios

  - `401` — 401 Unauthorized

  Review the native example body for the complete response shape.

  ## 🧭 Typical workflow

  Run after `room_id` and a suitable session are available. Use the manual outsider request only with a session that is not a room member.

  ## 🧪 Testing guidance

  This is a deliberate negative scenario. Keep its prepared inputs intact and verify both the HTTP status and the contract error code.

  > 💡 **Tip**
  >
  > Use the `local` environment and inspect the native response examples before sending a state-changing request.


  ## 🧩 Workspace metadata

  Tags: negative.

