info:
  name: Send friend request
  type: http
  seq: 2
  tags: [friends]
http:
  method: POST
  url: "{{baseUrl}}/api/{{apiVersion}}/friends/requests"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "user_id": 43
      }
docs: |-
  # Send friend request

  ## Purpose

  Asks another user to become a friend. Friendship needs the recipient's acceptance (`Accept friend request`); until then the request is `PENDING` and the sender sees the relationship `REQUEST_SENT`. The relationship rules are in `workspace.yml`, Friends, Presence, and Chat Scope.

  ## Request parameters

  | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |
  | --- | --- | ---: | --- | --- | ---: | --- | --- |
  | `ft_session` cookie | request cookie | yes | string | active JWT access credential | no | Requesting identity (the sender) | set by Register/Login |
  | `user_id` | body | yes | integer | positive, existing user, not self | no | Recipient | `43` |

  ## Success behavior

  `201 Created` returns the new request. The check and the insert are one atomic operation per user pair, so two simultaneous requests between the same users create at most one pending request.

  | Field | Type | Required | Nullable | Allowed values | Description |
  | --- | --- | ---: | ---: | --- | --- |
  | `data.request_id` | integer | yes | no | positive | Request identity |
  | `data.from_user.user_id` | integer | yes | no | positive | Sender |
  | `data.from_user.username` | string | yes | no | username rule | Sender's display name |
  | `data.from_user.avatar_url` | string | yes | no | URL | Sender's avatar |
  | `data.to_user.user_id` | integer | yes | no | positive | Recipient |
  | `data.to_user.username` | string | yes | no | username rule | Recipient's display name |
  | `data.to_user.avatar_url` | string | yes | no | URL | Recipient's avatar |
  | `data.status` | string enum | yes | no | `PENDING` | Always pending on creation |
  | `data.created_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Creation time |

  The recipient's Chat v2 sockets receive `friend.request.received` with the same request; the sender's other sockets receive it too, so every open tab shows Request Sent.

  ## Errors

  | Status | Code | When |
  | --- | --- | --- |
  | `401` | `UNAUTHORIZED` | invalid session |
  | `403` | `RELATIONSHIP_BLOCKED` | either user blocks the other; the message never says which |
  | `404` | `USER_NOT_FOUND` | `user_id` does not exist |
  | `409` | `ALREADY_FRIENDS` | an active friendship exists |
  | `409` | `REQUEST_ALREADY_SENT` | the sender already has a pending request to this user |
  | `409` | `REQUEST_ALREADY_RECEIVED` | this user already has a pending request to the sender; accept or decline that one |
  | `422` | `VALIDATION_ERROR` | `user_id` missing, not a positive integer, or equal to the sender |
examples:
  - name: Success - Request red_agent
    request: {url: "{{baseUrl}}/api/{{apiVersion}}/friends/requests", method: POST, headers: [{name: Content-Type, value: application/json, enabled: true}], params: [], body: {mode: json, json: '{"user_id":43}'}}
    response:
      status: 201
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "data": {
              "request_id": 701,
              "from_user": {
                "user_id": 42,
                "username": "player_one",
                "avatar_url": "https://{{baseUrl}}/static/avatars/default/42.svg"
              },
              "to_user": {
                "user_id": 43,
                "username": "red_agent",
                "avatar_url": "https://{{baseUrl}}/static/avatars/default/43.svg"
              },
              "status": "PENDING",
              "created_at": "2026-09-10T08:40:00Z"
            }
          }
  - name: Error - Request already sent
    request: {url: "{{baseUrl}}/api/{{apiVersion}}/friends/requests", method: POST, headers: [], params: [], body: {mode: json, json: '{"user_id":43}'}}
    response: {status: 409, headers: [{name: Content-Type, value: application/json}], body: {type: json, data: '{"error":{"code":"REQUEST_ALREADY_SENT","message":"A friend request to user 43 is already pending.","details":{"user_id":43,"request_id":701}}}'}}
  - name: Error - Blocked
    request: {url: "{{baseUrl}}/api/{{apiVersion}}/friends/requests", method: POST, headers: [], params: [], body: {mode: json, json: '{"user_id":45}'}}
    response: {status: 403, headers: [{name: Content-Type, value: application/json}], body: {type: json, data: '{"error":{"code":"RELATIONSHIP_BLOCKED","message":"You cannot send a friend request to this user.","details":{"user_id":45}}}'}}
  - name: Error - Self request
    request: {url: "{{baseUrl}}/api/{{apiVersion}}/friends/requests", method: POST, headers: [], params: [], body: {mode: json, json: '{"user_id":42}'}}
    response: {status: 422, headers: [{name: Content-Type, value: application/json}], body: {type: json, data: '{"error":{"code":"VALIDATION_ERROR","message":"You cannot send a friend request to yourself.","details":{"field":"user_id"}}}'}}
