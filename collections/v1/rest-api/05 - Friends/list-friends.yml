info:
  name: List friends
  type: http
  seq: 1
  tags: [friends]
http:
  method: GET
  url: "{{baseUrl}}/api/{{apiVersion}}/friends?limit=50&offset=0"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: limit
      value: "50"
    - name: offset
      value: "0"
docs: |-
  # List friends

  ## Purpose

  Returns the authenticated user's active friendships with live online/offline presence (a friendship suspended by a block in either direction is not listed), for the Profile popup, which shows friend count, friend list and online/offline state.

  ## Request parameters

  | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |
  | --- | --- | ---: | --- | --- | ---: | --- | --- |
  | `ft_session` cookie | request cookie | yes | string | active JWT access credential | no | Requesting identity | set by Register/Login |
  | `Accept` | header | yes | string | `application/json` | no | Requested response media type | `application/json` |
  | `limit` | query | no | integer | `1..100`, default `50` | no | Maximum friends in this page | `50` |
  | `offset` | query | no | integer | `>= 0`, default `0` | no | Number of ordered friends to skip | `0` |

  ## Response fields

  | Field | Type | Required | Nullable | Allowed values | Description |
  | --- | --- | ---: | ---: | --- | --- |
  | `data.friend_count` | integer | yes | no | `>= 0` | Total friends |
  | `data.limit` | integer | yes | no | `1..100` | Applied page size |
  | `data.offset` | integer | yes | no | `>= 0` | Applied offset |
  | `data.has_more` | boolean | yes | no | `true`, `false` | Whether another page exists |
  | `data.friends[].user_id` | integer | yes | no | positive | Friend's user ID |
  | `data.friends[].username` | string | yes | no | username rule | Friend's display name |
  | `data.friends[].avatar_url` | string | yes | no | URL | Friend's avatar |
  | `data.friends[].is_online` | boolean | yes | no | `true`, `false` | Live presence — at least one open authenticated connection (`workspace.yml`, Presence), not merely a request-time snapshot |

  ## Errors

  Friends are ordered case-insensitively by `username`, then `user_id`. Presence does not affect ordering. `401 UNAUTHORIZED` covers an invalid session; invalid `limit` or `offset` returns `422 VALIDATION_ERROR`. Read-only; no event.
examples:
  - name: Success - Two friends
    request: {url: "{{baseUrl}}/api/{{apiVersion}}/friends?limit=50&offset=0", method: GET, headers: [], params: [{name: limit, value: "50", enabled: true}, {name: offset, value: "0", enabled: true}], body: {mode: none}}
    response:
      status: 200
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "data": {
              "friend_count": 2,
              "limit": 50,
              "offset": 0,
              "has_more": false,
              "friends": [
                {
                  "user_id": 43,
                  "username": "red_agent",
                  "avatar_url": "https://{{baseUrl}}/static/avatars/default/43.svg",
                  "is_online": true
                },
                {
                  "user_id": 44,
                  "username": "blue_master",
                  "avatar_url": "https://{{baseUrl}}/static/avatars/default/44.svg",
                  "is_online": false
                }
              ]
            }
          }
