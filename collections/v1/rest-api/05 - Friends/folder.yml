docs: |-
  # Friends

  Contract for the mandatory User Interaction module's friends feature (subject: chat/profile/friends). Friendship follows an explicit request workflow: Add Friend sends a request (`Send friend request`), the sender sees Request Sent, and the users become friends only when the recipient accepts (`Accept friend request`); declining creates no friendship, and the sender may cancel a request until it is answered (`Cancel friend request`). User/Auth owns every relationship state and decides each action atomically per user pair (`workspace.yml`, Friends, Presence, and Chat Scope). Blocking suspends a friendship and cancels pending requests (`06 - Blocking`). Online status is live presence (workspace.yml, Presence): at least one open authenticated connection, read fresh on every REST call (not push-updated over REST, but never a stale request-time-only snapshot either). Friend discovery beyond add-by-user_id uses `Search users`.
