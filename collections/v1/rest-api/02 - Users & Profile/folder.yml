docs: |-
  # Users and profiles

  User Service (`user-service`) owns the canonical username, avatar, profiles, social relationships, reports and the account-deletion coordinator. Auth Service (`auth-service`) separately owns credentials, login email, OAuth links, account identity and sessions. User validates protected requests with Auth and reads the owner's email/account creation time from Auth when composing the private profile. Statistics and match history come from Stats; current room linkage comes from Game Session. Username/avatar changes originate from User's transactional outbox and are propagated to Chat Gateway and Game Session. See `workspace.yml`, Auth and User Service Boundary.

  Profiles contain persistent identity and statistics: `wins`, `losses`, `level`, and supported match summaries. The own profile also carries `penalty_points`. This folder also holds self-service account deletion and reporting another user. Temporary room team, role, readiness, score, board, clue, and turn never become account fields. The own profile may show the live `(active_room_id, active_room_api_version)` pair; public profiles omit session and active-room data.
