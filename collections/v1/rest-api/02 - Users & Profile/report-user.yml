info:
  name: Report user
  type: http
  seq: 9
  tags: [profile, moderation]
http:
  method: POST
  url: "{{baseUrl}}/api/{{apiVersion}}/users/44/reports"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "reason": "HARASSMENT",
        "details": "Insulting messages in the room chat.",
        "room_id": 1001
      }
docs: |-
  # Report user

  ## Purpose and preconditions

  Reports another user for moderation (`workspace.yml`, User Reports). Requires an active session. The client offers it from another player's Profile pop-up; it never offers it on the user's own profile. The reported user is not notified.

  ## Request parameters

  | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |
  | --- | --- | ---: | --- | --- | ---: | --- | --- |
  | `ft_session` cookie | request cookie | yes | string | active JWT access credential | no | Reporter | set by Register/Login |
  | `user_id` | path | yes | integer | positive, existing user, not self | no | Reported user | `44` |
  | `reason` | body | yes | string enum | `HARASSMENT`, `CHEATING`, `OFFENSIVE_USERNAME`, `SPAM`, `OTHER` | no | Report category | `HARASSMENT` |
  | `details` | body | no | string | `0..500` characters after trimming | no | Free-text description | `Insulting messages in the room chat.` |
  | `room_id` | body | no | integer | positive | yes | Room where it happened, for context; not validated against current membership | `1001` |

  ## Success behavior

  `201 Created` stores the report.

  | Field | Type | Required | Nullable | Allowed values | Description |
  | --- | --- | ---: | ---: | --- | --- |
  | `data.report_id` | integer | yes | no | positive | Stored report |
  | `data.reported_user_id` | integer | yes | no | positive | Reported user |
  | `data.reason` | enum | yes | no | reason values above | Stored category |
  | `data.created_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Filing time |

  ## Errors

  | Status | Code | When |
  | --- | --- | --- |
  | `401` | `UNAUTHORIZED` | invalid session |
  | `404` | `USER_NOT_FOUND` | the target does not exist |
  | `409` | `ALREADY_REPORTED` | the reporter already reported this user within the server-configured window (24 hours in examples); `details.retry_after_seconds` says when a new report is accepted |
  | `422` | `CANNOT_REPORT_SELF` | the target is the reporter |
  | `422` | `VALIDATION_ERROR` | `reason` missing or outside the enum, `details` longer than 500 characters, or `room_id` not a positive integer |
  | `429` | `RATE_LIMITED` | throttled |

  Every error stores nothing.
examples:
  - name: Success - Report filed
    request: {url: "{{baseUrl}}/api/{{apiVersion}}/users/44/reports", method: POST, headers: [{name: Content-Type, value: application/json, enabled: true}], params: [], body: {mode: json, json: '{"reason":"HARASSMENT","details":"Insulting messages in the room chat.","room_id":1001}'}}
    response:
      status: 201
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "data": {
              "report_id": 9001,
              "reported_user_id": 44,
              "reason": "HARASSMENT",
              "created_at": "2026-09-10T08:50:00Z"
            }
          }
  - name: Error - Already reported
    request: {url: "{{baseUrl}}/api/{{apiVersion}}/users/44/reports", method: POST, headers: [], params: [], body: {mode: json, json: '{"reason":"SPAM"}'}}
    response: {status: 409, headers: [{name: Content-Type, value: application/json}], body: {type: json, data: '{"error":{"code":"ALREADY_REPORTED","message":"You already reported user 44 recently.","details":{"user_id":44,"retry_after_seconds":82800}}}'}}
  - name: Error - Cannot report self
    request: {url: "{{baseUrl}}/api/{{apiVersion}}/users/42/reports", method: POST, headers: [], params: [], body: {mode: json, json: '{"reason":"OTHER"}'}}
    response: {status: 422, headers: [{name: Content-Type, value: application/json}], body: {type: json, data: '{"error":{"code":"CANNOT_REPORT_SELF","message":"You cannot report yourself.","details":{"user_id":42}}}'}}
