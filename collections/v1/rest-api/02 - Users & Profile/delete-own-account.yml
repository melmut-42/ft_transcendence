info:
  name: Delete own account
  type: http
  seq: 8
  tags: [profile, account]
http:
  method: DELETE
  url: "{{baseUrl}}/api/{{apiVersion}}/users/me"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "confirm_username": "player_one"
      }
docs: |-
  # Delete own account

  ## Purpose and preconditions

  Permanently deletes the signed-in user's own account (`workspace.yml`, Account Deletion). Requires an active session. The user confirms by sending their current username, so a stray request cannot delete an account. The action cannot be undone. It works for password and Google accounts alike.

  ## Request parameters

  | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |
  | --- | --- | ---: | --- | --- | ---: | --- | --- |
  | `ft_session` cookie | request cookie | yes | string | active JWT access credential | no | Account to delete | set by Register/Login |
  | `confirm_username` | body | yes | string | equals the current username, compared case-insensitively after trimming | no | Typed confirmation | `player_one` |

  ## Success, state changes, and events

  `204 No Content`. In one operation the server:

  1. Removes the user from any active room as a departure with reason `ACCOUNT_DELETED`. In a Game v2 room this emits `room.player.left` and rechecks staffing during `IN_GAME` (possibly `game.staffing.required`); no leave penalty is recorded. In a v1 `IN_GAME` room it applies the v1 `PLAYER_FORFEIT`.
  2. Deletes the credentials, the Google link, the profile and avatar, every friendship, the user's DIRECT channels and their messages, and the user's penalty points.
  3. Keeps other players' finalized match records; the deleted participant appears there as `user_id: null`, `username: "deleted_user"`.
  4. Revokes every session and refresh-token family of the user, clears `ft_session` and `ft_refresh`, and closes every open socket of the user with `4401`.

  The email and username become available for new registrations. The client clears all private state and returns to Landing.

  ## Errors

  | Status | Code | When |
  | --- | --- | --- |
  | `401` | `UNAUTHORIZED` | invalid session |
  | `422` | `CONFIRMATION_MISMATCH` | `confirm_username` is missing or differs from the current username |
  | `429` | `RATE_LIMITED` | throttled |

  Every error leaves the account unchanged.
examples:
  - name: Success - Account deleted
    request: {url: "{{baseUrl}}/api/{{apiVersion}}/users/me", method: DELETE, headers: [{name: Content-Type, value: application/json, enabled: true}], params: [], body: {mode: json, json: '{"confirm_username":"player_one"}'}}
    response:
      status: 204
      headers:
        - {name: Set-Cookie, value: "ft_session=; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=0"}
        - {name: Set-Cookie, value: "ft_refresh=; HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth/refresh; Max-Age=0"}
      body: {type: text, data: ""}
  - name: Error - Confirmation mismatch
    request: {url: "{{baseUrl}}/api/{{apiVersion}}/users/me", method: DELETE, headers: [{name: Content-Type, value: application/json, enabled: true}], params: [], body: {mode: json, json: '{"confirm_username":"player_two"}'}}
    response: {status: 422, headers: [{name: Content-Type, value: application/json}], body: {type: json, data: '{"error":{"code":"CONFIRMATION_MISMATCH","message":"confirm_username must match your current username.","details":{"field":"confirm_username"}}}'}}
