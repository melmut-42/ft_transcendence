docs: |-
  # Identity

  Registered-account identity: email + username + password (subject Ch. III–IV, mandatory). Accounts authenticate with email + password or with Google sign-in (`oauth-google-authorize.yml`, `oauth-google-callback.yml`); every identity is a registered account — there is no anonymous identity. Email is the login identifier; username is the public display name. Both are trimmed and case-insensitively unique; password is hashed + salted server-side and never returned or logged.

  Registration and login each issue a two-cookie session pair — a JWT access credential plus a refresh credential, both carried as cookies: `ft_session` (HttpOnly, `Secure`, `SameSite=Lax`, `Path=/`, short-lived JWT access credential) and `ft_refresh` (HttpOnly, `Secure`, `SameSite=Lax`, `Path=/api/v1/auth/refresh`, long-lived opaque refresh credential, single-use/rotated). No token value is ever returned in a JSON response body, and no authentication header or other credential path exists — every client, browser or non-browser, authenticates through these two cookies. Bruno uses its cookie jar the same way a browser does.

  `POST /api/v1/auth/refresh` reads `ft_refresh` only, rotates it, and reissues both cookies without forcing the user to log in again. `DELETE /api/v1/auth/session` (logout) revokes both credentials and clears both cookies, regardless of room membership — if the user is `IN_GAME`, it forfeits that match first (see `workspace.yml`, Room Abandonment). Neither endpoint deletes the user or their statistics; account deletion is `DELETE /api/v1/users/me` (`02 - Users & Profile/delete-own-account.yml`). Google sign-in ends in the same two-cookie session pair as Login. Full model, including expiry/revocation semantics and refresh-token-reuse detection: `workspace.yml`, Session and Credential Model.
