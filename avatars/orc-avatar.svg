<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 691 702" role="img" aria-labelledby="orc-title orc-description">
  <title id="orc-title">Orc warrior avatar</title>
  <desc id="orc-description">An olive green orc with a stern expression, ivory tusks, a horned iron and leather helmet, and spiked red shoulder armor, inside a bronze and dark red circular frame.</desc>
