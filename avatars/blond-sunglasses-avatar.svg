<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 762 756" role="img" aria-labelledby="blond-avatar-title blond-avatar-description">
  <title id="blond-avatar-title">Blond sunglasses avatar</title>
  <desc id="blond-avatar-description">A smiling character with swept, spiky blond hair, black reflective sunglasses, and a charcoal hoodie with white drawstrings, inside a purple circular frame with a blue and violet background.</desc>
