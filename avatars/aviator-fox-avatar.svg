<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 722" role="img" aria-labelledby="aviator-fox-title aviator-fox-description">
  <title id="aviator-fox-title">Aviator fox avatar</title>
  <desc id="aviator-fox-description">A smiling orange fox with a cream muzzle and chest, large brown eyes, and bronze aviator goggles with blue lenses, inside a brown and bronze circular frame on a coral red background.</desc>
