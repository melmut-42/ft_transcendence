<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 744 687" role="img" aria-labelledby="cyborg-cat-title cyborg-cat-description">
  <title id="cyborg-cat-title">Cyborg cat avatar</title>
  <desc id="cyborg-cat-description">An orange tabby with a cream muzzle, glowing red eyes, a steel half-mask and armored torso, framed by orange and yellow rings on a golden background.</desc>
