# Local development only: PostgreSQL plus the user-service.
# Run from backend/user-service:  docker compose up --build
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: change-me-local-only
      POSTGRES_DB: user
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - user-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d user"]
      interval: 3s
      timeout: 3s
      retries: 20

  user-service:
    build:
      context: ..
      dockerfile: user-service/Dockerfile
    environment:
      PORT: "8080"
      APP_ENV: development
      DATABASE_URL: postgres://user:change-me-local-only@postgres:5432/user?sslmode=disable
      MIGRATE_ON_START: "true"
      INTERNAL_API_TOKEN: change-me-local-only-token
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  user-postgres-data:
