<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 715 710" role="img" aria-labelledby="punk-title punk-description">
  <title id="punk-title">Purple-haired punk avatar</title>
  <desc id="punk-description">A smiling character with swept purple hair, a shaved side, silver ear piercings, and a dark leather jacket, framed by purple and pink rings against a vivid pink background.</desc>
