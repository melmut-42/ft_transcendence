    <linearGradient id="neck-green" x1="0%" y1="0%" x2="20%" y2="100%">
      <stop offset="0" stop-color="#3cac59"/>
      <stop offset=".62" stop-color="#69d86a"/>
      <stop offset="1" stop-color="#7de276"/>
    </linearGradient>
    <linearGradient id="antenna-green" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0" stop-color="#72e170"/>
      <stop offset="1" stop-color="#69d969"/>
    </linearGradient>
    <linearGradient id="suit-silver" x1="15%" y1="0%" x2="90%" y2="100%">
      <stop offset="0" stop-color="#b3becb"/>
      <stop offset=".55" stop-color="#c7cfd8"/>
      <stop offset="1" stop-color="#d6dce2"/>
    </linearGradient>
    <linearGradient id="shoulder-silver" x1="0%" y1="30%" x2="100%" y2="65%">
