      <stop offset="1" stop-color="#ef405c"/>
    </linearGradient>
    <linearGradient id="display-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#278756"/>
      <stop offset="1" stop-color="#31a964"/>
