<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 722 724" role="img" aria-labelledby="alien-title alien-description">
  <title id="alien-title">Alien astronaut avatar</title>
  <desc id="alien-description">A smiling green alien with three eyes, two antennae, pointed ears, and a silver spacesuit inside a green circular frame on a purple background.</desc>
  <defs>
    <linearGradient id="outer-ring-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#388a48"/>
      <stop offset=".55" stop-color="#348743"/>
      <stop offset="1" stop-color="#338642"/>
    </linearGradient>
    <linearGradient id="inner-ring-lime" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0" stop-color="#7bd163"/>
      <stop offset=".5" stop-color="#7ed663"/>
      <stop offset="1" stop-color="#89de67"/>
    </linearGradient>
    <radialGradient id="background-purple" cx="45%" cy="42%" r="72%">
      <stop offset="0" stop-color="#523178"/>
      <stop offset="1" stop-color="#442767"/>
    </radialGradient>
    <linearGradient id="skin-green" gradientUnits="userSpaceOnUse" x1="205" y1="259" x2="491" y2="438">
      <stop offset="0" stop-color="#6cde6d"/>
      <stop offset=".54" stop-color="#6fdd6c"/>
      <stop offset="1" stop-color="#77df72"/>
