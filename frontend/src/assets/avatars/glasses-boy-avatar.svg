<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 739" role="img" aria-labelledby="avatar-title avatar-description">
  <title id="avatar-title">Default avatar</title>
  <desc id="avatar-description">A smiling character with tousled brown hair, round glasses, and a blue hoodie, framed by blue rings against a mint green background.</desc>
  <defs>
