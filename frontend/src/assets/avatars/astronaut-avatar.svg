        <path d="M341 618 440 615Q456 614 457 630L462 678 326 680 325 635Q324 618 341 618Z" fill="url(#panel-blue)"/>
        <path d="M338 623C333 625 333 630 333 639L334 673" fill="none" stroke="#96a9c5" stroke-width="4" opacity=".42"/>
        <ellipse cx="369" cy="653.4" rx="15.7" ry="16" fill="#fb5339" stroke="#884951" stroke-width="6"/>
        <path d="M361 649C362 642 371 640 375 646" fill="none" stroke="#ff7251" stroke-width="3" opacity=".5"/>
        <ellipse cx="426.6" cy="646" rx="11.2" ry="11.7" fill="#91d773" stroke="#356445" stroke-width="6"/>
      </g>
    </g>

    <g id="helmet-collar">
      <path d="M264 529C270 514 291 512 314 517L434 516C455 514 469 526 470 543L471 555C473 567 450 578 423 581 367 589 309 580 275 568 265 565 261 559 263 548Z" fill="url(#collar-blue)" stroke="#132a4c" stroke-width="7"/>
      <path d="M270 529C276 517 295 519 311 523L432 523C446 521 461 526 465 537 426 560 318 554 269 540Z" fill="#89b4ce" opacity=".28"/>
    </g>

