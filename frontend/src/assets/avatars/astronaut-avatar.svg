        <path d="M477 565C492 578 495 603 498 634L513 641 519 626C509 608 504 596 502 588 496 574 489 568 477 565Z" fill="#e2eff8" stroke="none"/>
        <path d="M507 603C515 615 523 632 526 647L504 661 501 631Z" fill="url(#suit-white)"/>
        <path d="M203 612C211 600 213 579 226 567 237 557 248 556 257 560 282 567 294 599 292 632L288 667 239 670Z" fill="url(#suit-shadow)"/>
      </g>
      <path id="suit-chest" d="M269 566C318 578 405 586 466 562 478 582 486 615 491 651L478 689 290 691 286 655C298 618 287 585 269 566Z" fill="url(#suit-white)"/>
      <path id="left-sleeve" d="M198 627C210 608 215 588 225 588 242 585 262 619 273 649L267 671 211 660Z" fill="url(#suit-white)"/>
      <path d="M395 583 400 615" fill="none" stroke-width="6.5"/>
