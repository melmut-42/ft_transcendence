<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 746 728" role="img" aria-labelledby="astronaut-title astronaut-description">
  <title id="astronaut-title">Astronaut avatar</title>
  <desc id="astronaut-description">A smiling young astronaut with tousled dark hair, large eyes, and a white spacesuit, seen through a blue glass bubble helmet inside a navy and steel blue circular frame.</desc>
  <defs>
    <linearGradient id="frame-navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#102950"/>
      <stop offset=".55" stop-color="#10254f"/>
      <stop offset="1" stop-color="#112a53"/>
    </linearGradient>
    <linearGradient id="frame-blue" x1="0%" y1="0%" x2="75%" y2="100%">
      <stop offset="0" stop-color="#426995"/>
      <stop offset="1" stop-color="#3b6390"/>
    </linearGradient>
    <radialGradient id="background-blue" cx="49%" cy="44%" r="68%">
      <stop offset="0" stop-color="#294074"/>
      <stop offset="1" stop-color="#203763"/>
    </radialGradient>
    <radialGradient id="helmet-blue" cx="46%" cy="43%" r="69%">
      <stop offset="0" stop-color="#41799c"/>
      <stop offset=".7" stop-color="#336b97"/>
      <stop offset="1" stop-color="#2f6893"/>
    </radialGradient>
    <linearGradient id="hair-slate" x1="0%" y1="0%" x2="90%" y2="100%">
      <stop offset="0" stop-color="#41637a"/>
      <stop offset=".6" stop-color="#456374"/>
      <stop offset="1" stop-color="#455f73"/>
    </linearGradient>
    <radialGradient id="face-tone" cx="49%" cy="47%" r="75%">
      <stop offset="0" stop-color="#b7b4b3"/>
      <stop offset=".7" stop-color="#b2afae"/>
      <stop offset="1" stop-color="#aaa5a7"/>
    </radialGradient>
    <linearGradient id="ear-tone" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0" stop-color="#b2abad"/>
      <stop offset="1" stop-color="#b7b0b0"/>
    </linearGradient>
    <linearGradient id="collar-blue" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0" stop-color="#6787ad"/>
      <stop offset="1" stop-color="#6e85ae"/>
    </linearGradient>
    <linearGradient id="suit-shadow" x1="0%" y1="0%" x2="90%" y2="100%">
      <stop offset="0" stop-color="#7588ae"/>
      <stop offset="1" stop-color="#6980a7"/>
    </linearGradient>
    <linearGradient id="suit-white" x1="0%" y1="0%" x2="75%" y2="100%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3fcfd"/>
    </linearGradient>
    <linearGradient id="panel-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#778cb3"/>
      <stop offset="1" stop-color="#6e86ab"/>
    </linearGradient>
    <linearGradient id="glass-reflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#d6edf7" stop-opacity=".92"/>
      <stop offset="1" stop-color="#c5dee5" stop-opacity=".72"/>
    </linearGradient>
    <radialGradient id="glass-wash" cx="28%" cy="22%" r="90%">
      <stop offset="0" stop-color="#a4e5f2" stop-opacity=".045"/>
      <stop offset="1" stop-color="#89cced" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="avatar-clip"><ellipse cx="370.5" cy="371" rx="293.5" ry="294"/></clipPath>
    <clipPath id="helmet-clip"><ellipse cx="370.3" cy="338.1" rx="221.1" ry="213.4"/></clipPath>
  </defs>

  <g id="outer-ring"><ellipse cx="370.5" cy="371" rx="342.3" ry="341.7" fill="url(#frame-navy)"/></g>
  <g id="inner-ring"><ellipse cx="370.5" cy="371" rx="312.3" ry="311.8" fill="url(#frame-blue)"/></g>
  <g id="avatar-background"><ellipse cx="370.5" cy="371" rx="293.5" ry="294" fill="url(#background-blue)"/></g>

  <g id="portrait" clip-path="url(#avatar-clip)" stroke-linecap="round" stroke-linejoin="round">
