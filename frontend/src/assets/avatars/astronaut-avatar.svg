        <path d="M509 354C530 352 544 373 543 398 543 420 532 438 514 444L499 405Z" fill="url(#ear-tone)"/>
      </g>
      <g id="face">
        <path d="M289 276C324 286 357 296 378 290L443 285 498 286C511 319 518 353 519 383 523 420 515 466 494 495 473 525 436 539 396 542 352 545 315 536 284 515 263 500 248 477 241 447 225 458 205 453 192 438 180 425 177 404 183 383 190 361 207 353 222 356 236 357 246 364 254 374 279 356 295 319 289 276Z" fill="url(#face-tone)" stroke="#7c777d" stroke-width="6.5"/>
        <path d="M293 282C317 298 352 321 376 319 388 318 392 313 391 303 425 317 468 323 502 307L498 291 430 286 377 295 319 283Z" fill="#978a91" opacity=".7"/>
        <path d="M241 437C250 469 270 494 294 509 322 526 353 529 391 525 432 523 466 511 492 493 474 523 437 537 396 540 353 544 314 535 285 514 263 499 248 476 241 447 225 458 205 452 194 440 209 450 228 449 241 437Z" fill="#a59599" opacity=".9"/>
        <path d="M253 439C249 444 245 446 241 447" fill="none" stroke="#76717a" stroke-width="6"/>
      </g>
      <g id="ear-detail">
        <path d="M208 383C225 384 237 399 240 417 237 429 228 434 218 432 203 430 196 416 199 402Z" fill="#a697a1"/>
        <path d="M207 385C225 381 238 398 239 418M233 403C223 402 216 408 216 418" fill="none" stroke="#7a727f" stroke-width="6"/>
      </g>
      <g id="hair" fill="url(#hair-slate)" stroke="#304f66" stroke-width="6.5">
        <path d="M221 357C209 335 202 307 205 281 208 254 223 234 245 217 276 192 319 174 349 164 374 156 410 151 422 160 432 167 419 187 417 193 449 176 488 181 515 195 531 204 526 215 496 222 514 227 535 238 541 249 550 263 535 277 525 284L505 293C475 309 428 306 371 277 378 289 388 305 375 308 358 312 325 298 293 277 297 317 280 356 254 374 244 362 233 357 221 357Z"/>
      </g>
      <g id="eyebrows" fill="none" stroke="#35556a" stroke-width="10">
        <path d="M330 346C342 337 359 332 376 335"/>
        <path d="M453 335C469 332 483 335 495 345"/>
      </g>
      <g id="eyes">
        <ellipse cx="359" cy="393.3" rx="35" ry="35.9" fill="#c3e8f2"/>
        <ellipse cx="470" cy="393.3" rx="33.6" ry="35.4" fill="#c3e8f2"/>
        <ellipse cx="362.5" cy="394.2" rx="19.9" ry="20.3" fill="#365568"/>
        <ellipse cx="469" cy="393.5" rx="20.1" ry="20.2" fill="#365568"/>
        <ellipse cx="372.4" cy="387.6" rx="5.5" ry="5.6" fill="#d0eef7"/>
        <ellipse cx="479.6" cy="386.9" rx="5.7" ry="5.6" fill="#d0eef7"/>
      </g>
      <g id="nose" fill="none" stroke="#8b828a" stroke-width="5.5">
        <path d="M419 401C416 411 425 412 430 417 442 429 428 442 411 432"/>
      </g>
      <g id="mouth" fill="none" stroke="#536370" stroke-width="6">
        <path d="M371 456C387 470 412 474 434 465"/>
        <path d="M363 461C370 459 374 454 375 448"/>
      </g>
      <ellipse id="glass-tint" cx="370.3" cy="338.1" rx="221.1" ry="213.4" fill="url(#glass-wash)"/>
    </g>

    <g id="helmet-glass" fill="none">
      <ellipse cx="370.3" cy="338.1" rx="221.1" ry="213.4" stroke="#9adfed" stroke-width="8"/>
      <g id="glass-highlights" fill="url(#glass-reflection)">
        <path d="M221 214C232 196 254 177 271 174 285 171 297 177 297 189 296 201 280 220 264 233 248 247 228 254 217 246 209 240 212 226 221 214Z"/>
        <ellipse cx="203.2" cy="274.7" rx="12.8" ry="16.1" transform="rotate(24 203.2 274.7)"/>
      </g>
    </g>
  </g>
</svg>
