docs: |-
  # ft_transcendence API Contract

  > **Contract status:** Development contract for active frontend and backend implementation. Examples are normative fixtures; they do not claim that every operation is implemented yet.

  ## Contract versions

  The original room/game/chat behavior remains available in `REST API v1` and `WebSocket v1` through `{{apiVersion}} = v1`. The shared v1 session and own-profile responses have one backward-compatible addition, `active_room_api_version`, so reload recovery can select the right room protocol. The new post-game lifecycle lives only in `REST API v2 - Game` and `WebSocket v2 - Game` through `{{gameApiVersion}} = v2`. Durable channels live only in `Chat REST v2` and `Chat WebSocket v2` through `{{chatApiVersion}} = v2`.

  A frontend selects one room/game contract as a pair: v1 REST must be used with v1 room WebSocket, or v2 REST with v2 room WebSocket. Mixing versions inside one room session is unsupported. Authentication/profile/friends remain on v1 unless a dedicated v2 contract exists.

  Unless a section explicitly says v1 or shared, the room/member/post-game lifecycle described below is the Game v2 contract. The v1 collections remain the authority for the legacy `FINISHED` lifecycle.

  ## Project Overview

  `ft_transcendence` is a four-or-more-player, two-team word-association game inspired by Codenames. Players enter with a stable username identity, create or join one active room, select a team and temporary room role, become ready, and play through a server-authoritative realtime protocol.

  ## Source of Truth

  Conflicts are resolved in this order: explicit product rules in the September 2026 contract brief; its game and UI flows; compatible established project naming; old Bruno material; current backend evidence; then the general school subject. This workspace specifies intended behavior even when implementation differs.

  ## User Flow (Game v2)

  ```mermaid
  flowchart TD
      A[Lobby] --> B[Create or join room]
      B --> C[WAITING room]
      C --> D[Join unseated: no team, no role]
      D --> E[Atomically claim team + role]
      E --> F[Set ready]
      F --> G{Every start invariant valid?}
      G -->|No| C
      G -->|Yes| H[COUNTDOWN]
      H -->|Invariant breaks| C
      H -->|Completes validly| I[IN_GAME]
      I --> L{Both teams staffed?}
      L -->|Yes| I
      L -->|No| M[PAUSED_FOR_PLAYERS: shutdown countdown per deficient team]
      M -->|Unseated joiner claims the vacant seat| I
      M -->|A deadline expires| N[CLOSED: every member returns to the Lobby]
      I --> J[POST_GAME]
      J -->|Any member returns| C
      J -->|Everyone exits or times out| K[CLOSED]
  ```

  ## Room Lifecycle (Game v2)

  ```mermaid
  stateDiagram-v2
      [*] --> WAITING
      WAITING --> COUNTDOWN: every start invariant becomes valid
      COUNTDOWN --> WAITING: any invariant becomes invalid
      COUNTDOWN --> IN_GAME: countdown completes while valid
      IN_GAME --> POST_GAME: terminal game result
      IN_GAME --> CLOSED: a staffing deadline expires
      POST_GAME --> WAITING: first member returns to lobby
      WAITING --> CLOSED: empty for 300 seconds
      POST_GAME --> CLOSED: empty for 300 seconds
  ```

  There are no spectators: every room member either holds a seat (`team` plus `SPYMASTER` or `OPERATIVE`) or is **unseated** (`team:null`, `role:null`) while choosing one. Every new member—including the creator/host—starts unseated with `ready:false`; only member `state` follows the room (`IN_LOBBY` before play, `IN_GAME` during play). An unseated member claims a legal `{team, role}` pair atomically through `room.role.select`.

  A room is joinable while its shared status is `WAITING`, and during `IN_GAME` only while the game phase is `PAUSED_FOR_PLAYERS`, provided capacity remains. `COUNTDOWN` is not joinable: the countdown lasts only a few seconds and starts once every member is seated and ready, so a newcomer would only interrupt it. A member who joins a paused match exists only to fill a vacant seat: they receive the Operative-safe board, cannot submit clues, guess, or pass, and claim a vacant seat through `room.role.select`. If play resumes while a member is still unseated, the server removes that member with reason `SEAT_UNAVAILABLE` (no leave penalty), so no member ever watches a running match without playing. `COUNTDOWN`, `POST_GAME`, `CLOSED`, an unpaused `IN_GAME`, and a mixed `WAITING` room with unresolved post-game members are not joinable. After `game.ended`, the room enters `POST_GAME` and every member enters `POST_GAME`. Any member—not only the host—may return independently. New joins and countdown remain forbidden until every remaining post-game member returns or leaves.

  The post-game decision deadline is 60 seconds by default and is not paused by disconnect. A member still in `POST_GAME` at the deadline is removed with reason `POST_GAME_TIMEOUT`. An empty room starts the separate 300-second closure timer instead of closing immediately. The same `room_id`, `room_code`, host, team, and role selections survive a return; every member's `ready` resets to `false`, and a new `game_id`/board is created only after the next valid countdown.

  The host is the Room Owner. Host authority is limited to room administration, not returning to lobby or starting the game: the host kicks members and changes the room settings (capacity, turn timer, and word-pack language; see Room Settings). Settings updates require the room to be `WAITING` and the host to be personally `IN_LOBBY`. A host may kick any other member, seated or unseated, in every open room status (`WAITING`, `COUNTDOWN`, `IN_GAME`, `POST_GAME`) without a vote or the target's consent. A kick during `COUNTDOWN` cancels the countdown first; a kick during `IN_GAME` rechecks team staffing exactly like any other departure. A kicked member receives no leave penalty. The host cannot kick themself. If the host leaves, host transfers first to the earliest-joined `IN_LOBBY` member, otherwise to the earliest remaining member. An empty room has `host_user_id:null` until somebody joins or the 300-second closure timer expires.

  ## Reconnect Grace Period and Abandonment (Game v2)

  A transport disconnect is never an immediate leave. It starts the configured reconnect grace period (examples: 30 seconds in `WAITING`/`COUNTDOWN`, 60 seconds in `IN_GAME`) and reserves the member's team, role, and turn rights. Reconnecting in time restores the membership unchanged.

  When grace expires, or when an explicit leave/logout removes a member, unseated members have no effect on team staffing. During `IN_GAME`, the server recomputes both teams. Play continues while each team has at least one `SPYMASTER` and one `OPERATIVE`. A deficient team receives its own absolute `staffing.deadline_at` (120 seconds by default, server-configurable); the game enters `PAUSED_FOR_PLAYERS`, preserving the board, score, clue, guesses, and turn. Normal game commands are rejected while paused. A team becomes deficient when it loses its only Spymaster or its last Operative. `game.staffing.required` names the departed member and the reason, so every remaining player can see why the room may close, and its absolute `deadline_at` drives the live shutdown countdown: clients render the remaining time from it and never decide expiry themselves.

  While a game is `PAUSED_FOR_PLAYERS`, the room accepts joins so a new member can fill the vacant seat. The unseated joiner atomically claims a legal `{team, role}` pair; a Spymaster claim requires that team's slot to be vacant. Seated members cannot change seat during `IN_GAME`. During a staffing pause, restoring one team clears only that team's deadline; restoring both teams resumes the preserved phase. If either deadline expires, the server emits `game.cancelled` with `end_reason:"INSUFFICIENT_PLAYERS"`, `winner:null`, and `loser:null`, then shuts the room down: it emits `room.closed` with `reason:"INSUFFICIENT_PLAYERS"`, clears every remaining membership and all temporary room and game state, releases the room code, and closes every room socket with `4404`. Clients return every remaining member to the Lobby. Cancellation produces no win, loss, match-history entry, or `match.finalized` record.

  When the final room member is removed, the server sets `empty_since` and `close_at=empty_since+300s`. The room and room code remain active and joinable during this interval. A join cancels the timer and makes the joiner host. If nobody joins by `close_at`, the room becomes `CLOSED` and its code may be reused.

  ## Leave Penalty (Game v2)

  A participant (`SPYMASTER` or `OPERATIVE`) who voluntarily leaves while the room is `IN_GAME` receives a persistent leave penalty. Voluntary means an explicit Leave room (`reason:"EXITED"`) or a logout (`reason:"SESSION_ENDED"`). Unseated members, departures in any other room status, kicked members, members removed when their reconnect grace period expires, and deleted accounts receive no penalty.

  The penalty is `leave_penalty_base × role_multiplier`, and the Spymaster multiplier is strictly greater than the Operative multiplier. **Unresolved:** `leave_penalty_base`, the Spymaster multiplier, and the Operative multiplier have no agreed values. They are server configuration and stay unset until the values are agreed.

  Game Session appends a `player.penalized` integration record (`user_id`, `room_id`, `game_id`, `role`, `reason`, `points`, `penalized_at`) to its outbox in the same atomic transition as the departure. Stats consumes it idempotently and adds `points` to the user's persistent `penalty_points`, exposed on the own profile. A penalty never changes wins, losses, level, or match history.

  ## Game Lifecycle

  ```mermaid
  stateDiagram-v2
      [*] --> WAITING_FOR_CLUE
      WAITING_FOR_CLUE --> GUESSING: active Spymaster submits clue word and N
      GUESSING --> GUESSING: own card and guesses remain
      GUESSING --> WAITING_FOR_CLUE: pass, neutral, opponent card, or guesses exhausted
      WAITING_FOR_CLUE --> PAUSED_FOR_PLAYERS: a team becomes deficient
      GUESSING --> PAUSED_FOR_PLAYERS: a team becomes deficient
      PAUSED_FOR_PLAYERS --> WAITING_FOR_CLUE: staffing restored; previous phase was clue
      PAUSED_FOR_PLAYERS --> GUESSING: staffing restored; previous phase was guessing
      PAUSED_FOR_PLAYERS --> GAME_OVER: a 120-second deadline expires
      GUESSING --> GAME_OVER: assassin or either team's final card
      GAME_OVER --> [*]
  ```

  `room.status`, `game.status`, `game.current_turn.phase`, and member state are separate. Room status uses `WAITING | COUNTDOWN | IN_GAME | POST_GAME | CLOSED`; game status uses `IN_PROGRESS | GAME_FINISHED | GAME_CANCELLED`; game phase uses `WAITING_FOR_CLUE | GUESSING | PAUSED_FOR_PLAYERS | GAME_OVER`; member state uses `IN_LOBBY | IN_GAME | POST_GAME`.

  ## Identity Model

  Registration requires `{ "email", "username", "password" }` (subject Ch. III–IV, mandatory). Email is the login identifier; username is the public display name; password is hashed + salted server-side (`>= 8`, `<= 72` bytes — bcrypt's input limit). Both email and username are trimmed and case-insensitively unique. Every identity is a registered account; there is no anonymous identity. An account is created by registration or by Google sign-in (see OAuth), and its owner may delete it (see Account Deletion).

  ## Session and Credential Model

  Every session has two credentials, each with its own cookie. Neither credential is ever placed in a JSON response body, a query string, or a custom header. The two cookies are the only credential path in this contract, for browsers and for Bruno, curl or scripts alike. Bruno authenticates exactly like a browser, through its cookie jar.

  | Cookie | Carries | Attributes | Lifetime |
  | --- | --- | --- | --- |
  | `ft_session` | short-lived JWT access credential | HttpOnly, `Secure`, `SameSite=Lax`, `Path=/` | short (example: 30 min) |
  | `ft_refresh` | long-lived opaque refresh credential | HttpOnly, `Secure`, `SameSite=Lax`, `Path=/api/v1/auth/refresh` | long (example: 30 days) |

  Register and Login set both cookies and return no token value in the response body — only `access_token_expires_at` (for client-side UX timers) and profile fields. `GET /api/v1/auth/session` and every other protected REST endpoint read `ft_session` only. `POST /api/v1/auth/refresh` reads `ft_refresh` only (scoped to that one path by `Path=/api/v1/auth/refresh`, so it is never sent on other requests), validates it, rotates it (single-use — the previous `ft_refresh` is revoked the instant a new one is issued), and reissues both cookies. Reuse of an already-rotated `ft_refresh` revokes the entire token family and forces re-login — this is the theft-detection behavior for a stolen refresh credential. The WebSocket upgrade (both the room socket and the chat socket) reads `ft_session` only, attached automatically by the browser on the same-origin request; there is no WebSocket-level refresh — an expired access token means the client calls `POST /api/v1/auth/refresh` over REST first, which reissues `ft_session`, then reconnects.

  `DELETE /api/v1/auth/session` (logout) revokes both credentials server-side and clears both cookies, unconditionally — logout is never blocked by active room membership (see Room Abandonment below, which logout during `IN_GAME` now triggers instead of rejecting). Logout also closes every open, authenticated WebSocket connection for that session (room and chat).

  Concrete states: `UNAUTHORIZED` (401) — the `ft_session` credential is missing, malformed, expired, or revoked; the client retries after `POST /api/v1/auth/refresh`. `SESSION_EXPIRED` (401, refresh endpoint only) — the `ft_refresh` credential is missing, expired, already rotated, or revoked; the client must log in again. A WebSocket handshake with a missing/invalid `ft_session` is rejected before the `101` upgrade; an already-open socket whose session is explicitly revoked (logout, or refresh-token-family revocation) is closed server-side with policy code `4401`. Ordinary access-token expiry does not by itself tear down an already-open game socket — refresh happens on the next REST call or on reconnect.

  ## Teams and Roles

  Teams are exactly `RED` and `BLUE`. Roles are exactly `SPYMASTER` and `OPERATIVE`; there is no spectator role. A seated member (a participant) has a team and one of the two roles. An unseated member has `team:null` and `role:null`, always has `ready:false`, blocks the start until seated, cannot submit clues, guess, or pass, and receives the Operative-safe board projection while joining a paused match. Each team has at most one Spymaster and one or more Operatives. `room.role.select` rejects a second Spymaster claim on a team with `ROLE_CONFLICT`, and every member sees the occupied seat through `room.player.updated` and `room.state`. A startable room, and a running unpaused game, requires exactly one Spymaster and at least one Operative on each team.

  ## Room Settings

  Every room has `max_players`, an integer in `4..20` with default `20`. Capacity counts every member, seated or unseated. The host sets it in Create room and may change it while the room is `WAITING` through `room.settings.update`, never below the current `player_count`. Join room and Invite friend return `409 ROOM_FULL` when `player_count` equals `max_players`.

  Game v2 rooms also carry `turn_timer_seconds` and `language`. The host changes them through the same `room.settings.update` command under the same `WAITING`/`IN_LOBBY` preconditions; a value outside its allowed set is rejected with `INVALID_PAYLOAD`.

  | Setting | Allowed values | Default | Meaning |
  | --- | --- | --- | --- |
  | `max_players` | integer `4..20`, `>= player_count` | `20` | Room capacity, unseated members included |
  | `turn_timer_seconds` | `null`, `60`, `90`, `120` | `null` | Per-turn time limit; `null` means no limit |
  | `language` | `en`, `tr`, `fr` | `en` | Lowercase language code selecting the board's word pack: English, Turkish, French |

  The room `language` is a game setting, not the application's interface language: it chooses which word pack the next board is drawn from, and every member sees the same words whatever language their interface uses.

  The settings in force when a game starts apply to that whole game; they can change again only once the room is back in `WAITING`.

  ## Turn Timer

  When `turn_timer_seconds` is not `null`, every turn has a server-owned deadline, `current_turn.deadline_at = turn start + turn_timer_seconds`. A turn starts when a team becomes active (`game.started` for the starting team, `game.turn.changed` afterwards) and one deadline covers both its `WAITING_FOR_CLUE` and `GUESSING` phases; an accepted clue does not extend it. With no limit, `deadline_at` is `null`.

  When the deadline passes before the turn ends, the server ends the turn exactly as an accepted pass would: the clue and remaining guesses are cleared, the opponent team becomes active in `WAITING_FOR_CLUE` with a fresh deadline, and every member receives `game.turn.changed` with `reason:TURN_TIMER_EXPIRED`. A timeout never reveals a card, never changes the score, and never ends the game. A command that arrives after the deadline is rejected with `NOT_YOUR_TURN` once the turn has passed.

  While the game is `PAUSED_FOR_PLAYERS` the turn timer is stopped: `deadline_at` is `null` and the server keeps the time that was left. When staffing is restored, the preserved turn resumes with `deadline_at = resume time + remaining time`. Clients render the countdown from `deadline_at` and the server clock offset; they never end a turn themselves.

  ## Start Conditions (Game v2)

  Let `P` be all room members. The server enters `COUNTDOWN` exactly when all clauses are true:

  ```text
  |P| >= 4
  AND every p in P has team in {RED, BLUE}
  AND every p in P has role in {SPYMASTER, OPERATIVE}
  AND count(RED, SPYMASTER) = 1
  AND count(BLUE, SPYMASTER) = 1
  AND count(RED, OPERATIVE) >= 1
  AND count(BLUE, OPERATIVE) >= 1
  AND every p in P has ready = true
  AND every p in P has member state = IN_LOBBY
  AND no room member has member state = POST_GAME
  AND room.status is WAITING or a still-valid COUNTDOWN
  ```

  A member may set `ready=true` only after claiming a team and role; an unseated member keeps `ready=false` and therefore blocks the start. Changing a seat sets `ready=false`. The server re-evaluates all clauses after ready, team, role, join, and leave changes. Any invalidation during `COUNTDOWN` cancels it; a join cannot be one, because `COUNTDOWN` rooms reject joins with `ROOM_NOT_JOINABLE`. No host start action exists.

  ## Game Rules

  The board has 25 cards. The randomly selected starting team owns 9; the other team owns 8; 7 are `NEUTRAL`; 1 is `ASSASSIN`. Either `RED` or `BLUE` can be the starting team, chosen at random per game, so `score.red` and `score.blue` each independently range `0..9` (whichever color started that game owns 9; the ranges are not fixed per color). Only the active team's Spymaster may submit one normalized clue word plus integer `N` from `1` through `9`. This development contract imposes only: trim, Unicode lowercase storage, a single non-empty whitespace-free word, length `1..30`, and the numeric range. A clue must not match the word of any unrevealed board card: the trimmed clue and each unrevealed card's word are compared case-insensitively (Unicode lowercase), and a match is rejected with `INVALID_CLUE` without changing any state. Words of revealed cards are allowed as clues when all other clue rules are satisfied. The server never rewrites a submitted clue into a different word. It does not add advanced official clue restrictions.

  Operatives choose a card in two steps on the client: selecting a card only highlights it locally, and the separate Confirm Guess action sends `game.card.guess`. Selection is never sent to the server and never reveals anything; the guess command is the confirmation, and the server validates it exactly as before.

  A clue grants `N + 1` guesses. An own-team reveal increments that color's score, consumes one guess, and may continue; revealing a team's own final card wins the game for that team immediately. An opponent reveal increments the opponent's score and ends the turn, unless it completes the opponent's full set, which makes the opponent win immediately. A neutral reveal ends the turn. The assassin ends the match immediately: the guessing team loses and the opponent wins, regardless of score. Operatives may pass during `GUESSING`, which ends the turn without revealing a card. Terminal conditions (assassin, either team's full set revealed) are checked before any turn change or score update is finalized. **The winner is never determined by comparing `score.red` to `score.blue` at any point — a full board can never end in a compare-score tiebreak, because the game always ends by a terminal reveal (a full set or the assassin) before the last card would need one.** Frontend never computes the winner locally; only the terminal `game.ended` event (or a `POST_GAME` snapshot) is authoritative.

  ## Game History

  Every game carries `history`, the ordered action log of the current match. Game Session appends one entry in the same atomic transition as the authoritative change it records and emits it as `game.history.appended` right after that change's own events. Entries carry a per-game `seq` starting at `1`, so clients keep them in order and ignore one they already hold; `room.state` and `game.started` carry the full `history`, so a reconnect restores it. One logical action produces one entry: a guess and the card it revealed are one `CARD_REVEALED` entry.

  | `type` | Recorded when | Fields besides `seq`, `type`, `at` |
  | --- | --- | --- |
  | `GAME_STARTED` | the game starts | `team` (starting team) |
  | `CLUE_GIVEN` | a clue is accepted | `team`, `user_id`, `username`, `clue` (`word`, `number`) |
  | `CARD_REVEALED` | a confirmed guess reveals a card | `team` (guessing team), `user_id`, `username`, `card_id`, `word`, `color` |
  | `TURN_PASSED` | an Operative ends the team's guessing | `team`, `user_id`, `username` |
  | `TURN_CHANGED` | the active team changes | `team` (new active team), `previous_team`, `reason` (as `game.turn.changed`) |
  | `GAME_PAUSED` | a team becomes short of players | `team` (deficient team), `user_id`, `username` (departed member) |
  | `GAME_RESUMED` | both teams are staffed again | `team` (active team) |
  | `GAME_ENDED` | the game has a result | `team` (winner, or `null` when cancelled), `reason` (`ALL_TEAM_CARDS_REVEALED`, `ASSASSIN_REVEALED`, `INSUFFICIENT_PLAYERS`) |

  Every entry holds only public information, so the same entries go to every member: `CARD_REVEALED.color` is the color the reveal made public, and no entry ever names an unrevealed card's color.

  ## Data Visibility

  The server creates a projection for each recipient. Spymasters see every card affiliation. Operatives receive `color: null` for every unrevealed card and the true color after reveal. A universal secret-bearing board payload MUST NOT be broadcast. This applies to REST snapshots, initial `game.started`, reconnect `room.state`, and reveal events. Per-recipient projection happens inside the authoritative game-state owner (Game Session, see Backend Architecture) before a payload reaches any generic fan-out/broadcast layer — a full 25-color board is never handed to transport infrastructure for client-side filtering.

  **Card ID invariant:** `card_id` (`1..25`) is a stable per-game slot identifier and carries zero information about affiliation. Board generation independently randomizes (a) which 25 words appear, (b) which slot gets which word, and (c) which slot gets which affiliation (9/8/7/1). Nothing may assume `card_id` parity, range, or position correlates with color — that would leak the key through IDs alone even with correct `color:null` masking. The fixture examples in this workspace and in `07 - Full State Scenarios` use a fixed illustrative map (`RED` = odd IDs, `BLUE` = even IDs, etc.) purely so examples stay reproducible across files; this fixed pattern is a documentation convenience only and MUST NOT be treated as a rule the backend replicates.

  ## Temporary vs Persistent State

  `username`, level, wins, losses, `penalty_points`, and supported match history are persistent user data. Team, role, ready status, room membership, board, clue, guesses, turn, and score are room/game-scoped and never become permanent account roles. Leaving or closing a room clears temporary membership data as appropriate.

  ## REST vs WebSocket Responsibility

  REST owns registration/session bootstrap (including refresh, logout, and Google OAuth), profile read/update, account deletion, user reports, avatar, friends (list/remove/search, friend requests), blocking, room creation, membership join/leave, snapshots, and match history. Once a member joins the realtime channel, team, role, readiness, countdown, clue, guess, pass, and live state propagation use WebSocket. Basic chat is a separate per-user WebSocket channel (`/ws/v1/chat`), independent of any room. REST and WebSocket share field names and domain enums, and identify the same session; both accept only the `ft_session` cookie — there is no header-based credential on either transport.

  ## Multi-Tab / Multi-Socket

  One authenticated user has exactly one logical room membership at a time (the membership index stores one `(active_room_id, active_room_api_version)` pair), but may hold several simultaneous authenticated connections to it — for example two browser tabs each opening `{{wsUrl}}/ws/{{gameApiVersion}}/rooms/{{roomId}}`. All sockets belonging to that user represent the same membership, not separate players; a second tab never creates a second seat. Every command from any of the user's sockets is validated against the same role/turn/team rules as if only one socket existed. Every server-generated room/game event is delivered to all of that user's currently open sockets for that room. The reconnect grace period (above) is keyed to the membership, not to a specific socket: as long as at least one authenticated socket for that membership is open, the member is not "disconnected"; the grace period starts only when the last of that user's sockets for the room closes.

  ## Error Philosophy

  Malformed JSON is `400`; absent/invalid access tokens are `401 UNAUTHORIZED`; an expired/invalid/used refresh token is `401 SESSION_EXPIRED` (refresh endpoint only — distinct from `UNAUTHORIZED` because it means "log in again," not "retry with a refreshed token"); permission failures are `403`; missing resources are `404`; uniqueness or lifecycle conflicts are `409`; field validation is `422`; throttling is `429`. REST errors use `{ "error": { "code", "message", "details" } }`. WebSocket errors correlate to `request_id` and normally do not mutate state or close the socket. Explicit exceptions are invalid/revoked authentication (`4401`), lost room membership, kick or post-game timeout (`4403`), missing room (`4404`), `POST_GAME_DEADLINE_EXPIRED` timeout cleanup, handshake rejection, and repeated protocol abuse.

  **Frontend error-handling classes** (documented once here, not repeated per component): `INLINE_VALIDATION` (422 field errors — show next to the input: register/login/room-code/clue/chat/avatar fields), `TOAST` (transient failures with no dedicated UI state — 429, 5xx, `NOT_PERMITTED`, `USER_NOT_FOUND`), `AUTH_REDIRECT` (`401 UNAUTHORIZED`, WebSocket `4401`, or `401 SESSION_EXPIRED` after silent refresh fails — send to Login), `ROOM_RECOVERY` (`404 ROOM_NOT_FOUND`, `403 NOT_ROOM_MEMBER`, WebSocket `room.closed`, `4403`/`4404`, or `409 ROOM_NOT_JOINABLE`/`ALREADY_IN_ROOM` — return to Lobby with an explanatory toast), `RECONNECT` (an unclassified transport drop while membership is still valid — show the Reconnecting overlay and retry within the grace period), `FATAL_GAME_STATE` (a room/game action error that implies local state is stale relative to the server, e.g. `CARD_ALREADY_REVEALED`, `GAME_ALREADY_FINISHED`, `INVALID_ROOM_STATE` — discard local state and re-fetch/re-apply the next canonical `room.state` snapshot rather than patching around it). Bruno's error codes (above and in `06 - Errors/error-catalog.yml`) stay the single authoritative code list; this is only the UI-handling bucket each one falls into.

  ## Backend Architecture

  The v1/core backend runs as six independently deployable Go services: Gateway, Auth Service, User Service, Game Session, Board Generator, and Stats, communicating over REST and RabbitMQ. V2 integration events use a PostgreSQL transactional outbox and RabbitMQ; Chat v2 adds the Web BFF, Chat Gateway, and Channel Service documented separately below. Each service is internally organized into separate packages:

  | Service | Owns | Talks to |
  | --- | --- | --- |
  | **Gateway** | Public HTTPS/WSS entry point; REST reverse-proxy routing to the other services; WebSocket connection lifecycle (accept, `ft_session` validation at handshake, per-user multi-socket fan-out, close codes); TLS termination boundary. Holds **no** domain/game state and makes **no** authorization decisions beyond "is `ft_session` valid" — role/turn/membership authorization is each domain service's job. | Auth Service (session validation), User Service (routes profile/social REST), Game Session (routes room/game REST + WS traffic), all others (routes their REST traffic) |
  | **Auth Service / auth-service** | Account identity (`user_id`, login email, account creation time and status), password credentials, Google OAuth links, registration/login, `ft_session`/`ft_refresh` issuance and rotation, session validation, logout, and all-session revocation | Own PostgreSQL accounts, credentials, sessions, refresh-token metadata, OAuth links and durable coordination/revocation records; User Service for canonical profiles and profile provisioning; Game Session for current room recovery/departure; Gateway revocation notifications |
  | **User Service / user-service** | Canonical usernames, profiles, avatars, friendships, friend requests, blocks, user reports, current presence queries, social/profile events, and account-deletion coordination | Own PostgreSQL profiles, relationships, reports, coordination records and transactional outbox; Auth Service for identity/session validation and account metadata; Gateway registries for live presence; Game Session for current room linkage/profile propagation; Stats for profile statistics; Channel Service for deletion cleanup; RabbitMQ for social/profile events |
  | **Game Session** | Rooms, membership, room settings, host kick, team/role/ready, countdown, authoritative Codenames state, reconnect snapshots, staffing deadlines, room shutdown, leave penalties, and empty-room closure | PostgreSQL (room/game state, room-scoped request results, and the v2 transactional outbox, see State Ownership); Board Generator; publishes outbox records through RabbitMQ |
  | **Board Generator** | Stateless: given a word-pack, returns 25 words with randomized affiliations (`9` starting-team, `8` other-team, `7` neutral, `1` assassin) and a randomized `card_id` ↔ slot mapping satisfying the Card ID invariant above. No database, no session, no per-game memory. | Called synchronously by Game Session at game start only |
  | **Stats** | Finalized match results, wins/losses, match history, level, penalty points (see Match History & Stats and Leave Penalty) | Postgres (match_results, user_stats); idempotently consumes durable internal `match.finalized` events by `game_id` and `player.penalized` records by their event ID |

  Auth Service remains the sole authoritative source for credentials, account identity and sessions; User Service remains the sole authoritative source for profiles and social relationships; Game Session remains the sole authoritative source for room/game state; Stats remains the sole authoritative source for finalized results. Each service accesses its own database records only. A deployment may share a PostgreSQL server, but services do not share table ownership, direct database reads or cross-service foreign keys; coordination uses internal REST and durable events.

  ## Auth and User Service Boundary

  `auth-service` and `user-service` are separate deployments. They share the same stable positive-integer `user_id`: Auth allocates it, and User provisions exactly one profile for it. Auth enforces case-insensitive login-email uniqueness and owns passwords/OAuth links; User enforces case-insensitive username uniqueness and owns avatars/social data. User does not persist passwords, refresh credentials or a second authoritative login email. Auth does not persist an independently editable username/avatar/social profile. Identity/profile deletion and provisioning records remain durable until their coordination has completed.

  Public routing remains versioned as before: `/api/v1/auth/*` belongs to Auth Service; profile, search, avatar, friends, blocking, reports and `DELETE /api/v1/users/me` belong to User Service. Profile statistics and `/api/v1/users/me/matches` are supplied by Stats, and room linkage by Game Session. The public proxy/BFF may compose these responses but does not own their data. Existing browser-facing paths, cookie rules and response fields remain the contract.

  **Registration coordination:** Auth validates credentials, reserves the email/account identity and assigns `user_id`, then calls User to provision the canonical username/default-avatar profile with a durable `operation_id`. User atomically enforces username uniqueness and treats the same operation/user/payload as an idempotent retry; it never overwrites an existing profile on a delayed provisioning retry. Auth issues the first cookies and returns success only after the account and profile are ready. Pending accounts/profiles grant no login, social or game access. A failed attempt is durably resumed or compensated; provisional email/username reservations cannot become permanently orphaned. This is coordination between two local PostgreSQL transactions, not one transaction spanning both services. Google-created accounts use this same provisioning flow; an existing Google-linked account reuses its profile, and generated-username collision checks belong to User.

  **Session and response composition:** Gateway admission uses Auth's internal session validation, which returns authenticated `user_id`, `session_id` and access expiry without calling User, Stats or Game Session. Auth owns the public registration/login/session responses, obtaining the current `username` and other profile fields from User as required by each published response; `GET /api/v1/auth/session` obtains current room membership from Game Session. User obtains the owner's read-only email/account creation time from Auth when composing `GET /api/v1/users/me`. A profile update changes User's canonical record and must be reflected in later Auth responses; an old JWT or cached username never overrides it. Credential values remain cookie-only, including internal validation calls, and are never forwarded to unrelated domain services.

  Internal REST operations are restricted to their intended service callers and are not exposed by the public reverse proxy. Operation names below describe required private contracts; they are not browser-facing endpoints.

  | Internal operation | Owner/callers | Required input | Success semantics |
  | --- | --- | --- | --- |
  | Validate session | Auth; called by Gateways, BFF and protected services | `ft_session` cookie | Current active-session verdict with `user_id`, `session_id`, `session_expires_at`; missing/expired/revoked credentials fail authentication; no profile or room dependency |
  | Read account metadata | Auth; called by User | trusted `user_id` | Account status and creation time; login email used only in the owner's private profile |
  | Provision profile | User; called by Auth | `operation_id`, Auth-assigned `user_id`, `username`, account `created_at` | Exactly one profile/default avatar; case-insensitive username validation/uniqueness; identical retries are idempotent, reuse with a changed user/payload is rejected |
  | Read canonical profile | User; called by Auth and domain services | trusted `user_id` | Current `user_id`, `username`, `avatar_url`, account `created_at`; no credentials or login email; incomplete/deleting identities never grant domain access |
  | Active-friend verdict | User; called by Channel Service and Game Session | authenticated actor `user_id`, target `user_id` | Active friendship only while both accounts are active and neither blocks the other; does not reveal which side placed a block |
  | Begin/complete account deletion | Auth; called by User's deletion coordinator | `operation_id`, trusted `user_id` | Begin blocks new authentication and revokes all sessions; complete removes Auth-owned account/credential/OAuth records after downstream cleanup; retries are idempotent |

  Callers obtain actor identity from validated sessions rather than browser-supplied user IDs. A service dependency failure is an availability failure, never a fabricated invalid-session, nonexistent-user, offline or no-friendship verdict. User owns live presence aggregation and relationship decisions; Auth owns session validity. User commits social/profile mutations and outgoing events in its own PostgreSQL transactional outbox, and its publisher retries RabbitMQ delivery with stable event IDs. Auth separately owns durable session-revocation notifications. Delayed events never replace current authorization checks against the relevant owner.

  ## State Ownership and Storage

  **PostgreSQL** (durable, survives restart): users, credentials, refresh-token metadata (for rotation/reuse detection), Google OAuth links, profiles, avatars, friendships, friend requests, user blocks, user reports, finalized match results, user stats/match history, penalty points, Chat v2 channel records, membership epochs with sequence-based ROOM visibility windows, retained messages with `expires_at`, per-user read positions, command request ledgers, consumed lifecycle event IDs, and transactional outboxes. Game Session owns its room/game records, including membership, team/role/ready, host, countdown and staffing deadlines, in-progress board/turn/clue/score, room-scoped WebSocket request results, and its v2 transactional outbox. Room/game records remain temporary domain state and are removed or closed according to the room lifecycle; they never become permanent account roles or profile fields.

  **Service memory** (live connections): each Game Gateway and Chat Gateway keeps its accepted sockets and their `user_id`/`session_id` associations in its own active socket registry. User Service obtains current presence through internal REST queries to those registries. A Gateway restart removes its live connections; clients reconnect and authenticate again. Game Session derives connectivity and reconnect grace from the current room socket registry, while room membership and absolute lifecycle deadlines remain authoritative in its PostgreSQL records.

  **RabbitMQ** (service event delivery): Game Session sends recipient-specific room events to Game Gateway, and Chat v2 commands/results follow the broker flow below. V2 integration records (`room.created`, membership/access changes, `match.finalized`, and `player.penalized`) are inserted into the PostgreSQL outbox in the same transaction as their room mutation; a publisher retries them to RabbitMQ until confirmed. A room mutation and its durable integration records commit or roll back together. Session revocation notifications reach every affected Gateway instance so it can close its local sockets; live presence remains a current registry query rather than an asynchronous event projection.

  `GET /api/v1/auth/session`'s `active_room_id` and `active_room_api_version` are always derived together from Game Session's current authoritative membership at request time — they are never independently mutable Auth account or User profile fields. Both are null or both are non-null. The frontend uses the version to pair `/api/v1/rooms` with `/ws/v1/rooms` or `/api/v2/rooms` with `/ws/v2/rooms` after reload. Game Session restores persisted room state after restart and processes overdue lifecycle deadlines before granting membership-dependent access. A missing or closed room has no active membership and yields `null` for both values, preventing orphaned membership from permanently blocking the user behind `409 ALREADY_IN_ROOM`.

  ## Deployment / Same-Origin Model

  One public origin: `Browser → HTTPS/WSS reverse proxy → { SPA, /api/v1/*, /api/v2/*, /ws/v1/*, /ws/v2/rooms/*, /ws/v2/channels }`. The proxy routes room sockets to Game Gateway and `/ws/v2/channels` to Chat Gateway without sending live chat through the BFF. This same-origin surface makes the host-only `ft_session` cookie attach automatically; production must not expose Chat Gateway on a different browser hostname. Every browser-facing connection uses HTTPS/WSS. Local development mirrors this through `localhost:3000` for `baseUrl`, `wsUrl`, and `chatWsUrl`; internal container connections may use their private ports. Secrets live in a gitignored `.env`, with a committed `.env.example` containing placeholders.

  ## Backend Framework

  Every service is written in Go and uses **Gin** (`gin-gonic/gin`) as its HTTP framework. Gin's routing, middleware chain and request binding/validation cover the layered request pipeline each service implements (context/request-ID middleware, access-control middleware, request handling, service layer, response handling). WebSocket upgrades use `gorilla/websocket` inside a Gin handler.

  ## Common Data Types

  | Concept | Contract type | Rule |
  | --- | --- | --- |
  | `user_id`, `room_id`, `game_id`, `card_id` | positive integer | Stable within entity lifetime |
  | timestamps | `string<date-time>` | ISO 8601 UTC, for example `2026-09-10T08:43:12Z` |
  | JSON fields | snake_case | Used by REST and WebSocket |
  | enum values | UPPER_SNAKE_CASE | Closed value sets documented at each use |
  | message types | lowercase.dot.notation | WebSocket only |
  | booleans | JSON boolean | Never encoded as strings or integers |

