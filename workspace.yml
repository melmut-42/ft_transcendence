  ## Environment Variables

  The `local` environment defines `baseUrl=http://localhost:3000`, `wsUrl=ws://localhost:3000`, and `chatWsUrl=ws://localhost:3000`, plus version and fixture IDs. Bruno authenticates via its cookie jar, exactly like a browser: Register/Login/Refresh set `ft_session`/`ft_refresh` automatically. There is no `sessionToken`/`refreshToken` environment variable because credentials never appear in response bodies.

  ## Friends, Presence, and Chat Scope

  Friends (REST: friend requests, list, remove, plus username search for discovery — see `05 - Friends/`), blocking (`06 - Blocking/`), and Chat implement the mandatory User Interaction module. Chat v2 adds persistent channels/history, per-user read positions, unread counts, and read receipts. Chat v1 has no read receipts; typing indicators remain out of scope for both versions.

  **Relationship model.** User Service owns the relationship between two users and decides every social action atomically per user pair, so two simultaneous requests can never create conflicting states. From one user's point of view another user is exactly one of:

  | `relationship` | Meaning | Actions offered |
  | --- | --- | --- |
  | `NONE` | no friendship, no pending request, no block by the viewer | Add Friend, Block |
  | `REQUEST_SENT` | the viewer's request waits for the other user | Request Sent (disabled), Cancel Request, Block |
  | `REQUEST_RECEIVED` | the other user's request waits for the viewer | Accept, Decline, Block |
  | `FRIENDS` | accepted friendship, active | Remove Friend, Message, Invite, Block |
  | `BLOCKED` | the viewer blocks the other user | Unblock |

  A block placed by the other user is never revealed: the viewer sees `NONE` and actions toward that user fail with the generic `403 RELATIONSHIP_BLOCKED` ("You cannot send a friend request to this user." and similar).

  **Friend requests.** Friendship requires an explicit request and acceptance: `POST /friends/requests` creates one `PENDING` request; only its recipient may accept or decline it, and only its sender may cancel it while it is pending; acceptance creates the friendship both ways in the same transaction that resolves the request. At most one pending request exists per unordered user pair: a second request in the same direction returns `409 REQUEST_ALREADY_SENT`, a request against an incoming pending one returns `409 REQUEST_ALREADY_RECEIVED` (the user accepts that one instead), a request to an existing friend returns `409 ALREADY_FRIENDS`, a request to oneself returns `422 VALIDATION_ERROR`. Accepting, declining, or cancelling a request that is not pending for the caller returns `404 REQUEST_NOT_FOUND`, so a repeated acceptance is never a second friendship and a request cancelled at the same moment it is accepted resolves exactly one way. Declining or cancelling creates no relationship. Both users' Chat v2 sockets receive `friend.request.received` and `friend.request.resolved` so every open screen follows the change without a reload.

  **Blocking.** A user blocks another through `PUT /users/{user_id}/block` and lifts it through `DELETE /users/{user_id}/block`. A block between two users, in either direction:

  - resolves every pending friend request between them as `CANCELLED`;
  - suspends an existing friendship: it stays stored but is inactive, so it is absent from both friend lists, from `is_friend` checks and from every friend-only permission; the DIRECT channel becomes `INACTIVE` for both users;
  - rejects new friend requests and acceptances with `403 RELATIONSHIP_BLOCKED`;
  - rejects opening or using their DIRECT channel and room invitations between them, because those require an active friendship.

  Unblocking removes only the viewer's own block. A suspended friendship becomes active again once neither user blocks the other; no new friendship is ever created by unblocking, and requests cancelled by the block stay cancelled. Blocks do not affect a shared ROOM channel or room membership.

  **Chat v1 permission:** allowed if the sender and recipient are friends, or both are current room members while the shared v1 room is `WAITING`, `COUNTDOWN`, or `IN_GAME`. v1 `FINISHED`/`CLOSED` are excluded. A message to an offline recipient reports `RECIPIENT_OFFLINE`; v1 chat remains live-only.

  **Presence:** a user is `online` while they hold at least one currently open authenticated WebSocket connection (room or chat socket). Game Gateway and Chat Gateway track those connections in their in-memory socket registries; User Service queries their current connection state through internal REST on every presence-bearing request. The initial deployment uses one instance of each Gateway; multiple instances require querying all current registries and treating the user as online while any instance has an open authenticated socket. Closing one tab does not make the user offline while another connection remains. A registry that cannot be queried is a dependency failure, not evidence that the user is offline. No separate client heartbeat protocol is required beyond the socket's own lifetime. `is_online` is exposed consistently everywhere the UI shows presence: the friends list, the public profile, and room member lists.

  ## Room Invitations (v2)

  A v2 room member invites an active friend (no block in either direction, not themself) with no active room through `POST /api/v2/rooms/{room_id}/invites` while the room is joinable and not full. Because the notification is transient and delivered only by Chat Gateway v2, the recipient must have at least one active `/ws/v2/channels` socket; generic presence on only a room socket is not sufficient. The Web BFF routes the command to Game Session, which assigns a stable `invite_id`, a short server-configurable delivery `expires_at` (30 seconds in examples), and publishes it through RabbitMQ. `202 Accepted` means it was accepted for live delivery, not that the recipient has already rendered it. Chat Gateway deduplicates broker redelivery by `invite_id` and drops expired deliveries; v2 never also emits the invite on `/ws/v1/chat`. Accepting it is an ordinary v2 Join room request. Clients offer Invite wherever a friend appears with an inviting context — the friend's profile and the friend's row in the chat panel — and both use this one endpoint.

  ## Chat v2 Architecture

  Chat v1 above remains supported unchanged as the live-only Game Session chat contract. Chat v2 is a separate, opt-in contract that follows the new service topology and must not change v1 behavior.

  **Service naming:** `chat-service` is the deployment name of Channel Service. Chat Gateway is a separate service owning the browser's chat WebSocket connections. A command publisher in Chat Gateway and an outbox publisher in chat-service have different responsibilities.

  - The client reads channel metadata and retained history through Web BFF REST at `/api/v2/channels`.
  - The client connects directly to Chat Gateway at `{{chatWsUrl}}/ws/{{chatApiVersion}}/channels` for live messages.
  - Chat Gateway validates sessions with Auth Service, validates command envelopes, attaches its authenticated `user_id` and `session_id`, and publishes commands such as `chat.message.send` and `chat.channel.read` to RabbitMQ. Channel Service validates persistent participation, asks User Service for current DIRECT friendship or Game Session for the authoritative current ROOM/member state, and atomically commits accepted mutations, command results, and outgoing events to PostgreSQL. Channel Service's own outbox publisher sends those events to RabbitMQ; Chat Gateway consumes them and writes to authorized sockets. A ROOM verdict includes the authoritative `room_version`; Channel Service does not complete send/list/history/read-position operations until its local lifecycle projection and visibility windows are reconciled through at least that version. Lifecycle events maintain the projection and drive access notifications, but a possibly delayed projection is never the sole authorization source.
  - `DIRECT` is a private, canonical channel between two friends. A pair cannot have duplicate direct channels; shared-room membership never creates or authorizes a direct channel.
  - `ROOM` is the common channel for all eligible members of one room. Game Session durably records `room.created` in its outbox; Channel Service consumes it idempotently and creates exactly one ROOM channel. Clients do not call a create-room-channel endpoint.
  - ROOM access follows member lifecycle: `IN_LOBBY` members can use it in `WAITING`/`COUNTDOWN`, and `IN_GAME` members can read it in `IN_GAME` and send only while the game is `PAUSED_FOR_PLAYERS` (see Chat pauses while a match runs). The atomic terminal transition makes ROOM authorization fail for every member moved to `POST_GAME`; delivery of the later access-change notification is not the authorization boundary. It also closes each member's current sequence-based visibility window. Back to Lobby opens a new window independently for that returned member; Exit, kick, timeout, and room closure close access. History in the current membership epoch is the union of messages that fall inside that member's completed/current visibility windows, so a late returner cannot read lobby messages sent while they were still `POST_GAME`.
  - Channel creation/resolution, listing, history reads, read-position updates, and every send re-evaluate type-specific access. A DIRECT participant must still be an active friend (no block in either direction); a ROOM participant must still have an eligible room member state. Stored membership alone never grants access.
  - **Chat pauses while a match runs.** A user who is an `IN_GAME` member of a room whose game is running (phase `WAITING_FOR_CLUE` or `GUESSING`) cannot send on any channel, ROOM or DIRECT. Their channels stay readable with `access:"READ_ONLY"` and reason `GAME_RUNNING`, and a send returns `CHANNEL_READ_ONLY`. When the game enters `PAUSED_FOR_PLAYERS` the same channels return to `ACTIVE` with reason `GAME_PAUSED`; when it resumes they become `READ_ONLY` again. When the match ends, the ROOM channel follows the post-game rule above and DIRECT channels return to `ACTIVE` with reason `GAME_FINISHED`. Game Session's verdict for each send includes the game phase, so the restriction never depends on a delayed projection. Other users may still send to a DIRECT channel whose peer is in a running match; the peer reads it later or live.
  - Messages are retained for 30 days by default. Retention is server-configurable and each message carries its authoritative `expires_at`.
  - Successful send acknowledgements are emitted only after persistence. Channel Service deduplicates by `(sender_user_id, request_id)` so client retries and RabbitMQ redelivery cannot create duplicate messages.
  - Offline but currently authorized channel members load retained messages later through REST; recipient presence does not determine whether a v2 message is accepted, while revoked access blocks both live fan-out and history.
  - Read positions belong to a user, not a session or socket. Frontend explicitly sends `chat.channel.read` after displaying messages in an active visible conversation; socket delivery, broker acknowledgement, and a history GET do not advance read state. A read position only moves forward within its scope. ROOM scope includes the current membership epoch; Back to Lobby preserves that epoch's position, while rejoining starts a new scope. Listing includes the caller's `read_state` and `unread_count`; history includes `read_state` and per-message `read_by`. See `Chat WebSocket v2/00 - Chat Gateway/mark-channel-read.yml` and `read-events.yml`.

  Channel Service is authoritative for v2 channel records, access decisions, and messages, while User Service remains authoritative for friendship and Game Session remains authoritative for room/member state. Channel Service obtains a current verdict from those owners at each protected operation and uses lifecycle events for provisioning, membership epochs, cache invalidation, and access notifications. Auth Service validates sessions independently of these domain decisions. Chat Gateway holds no history and does not make the final authorization decision. The Bruno requests live in the separate `Chat REST v2` and `Chat WebSocket v2` collections.

  | Chat v2 component | Responsibility | State/dependencies |
  | --- | --- | --- |
  | **Web BFF** | Same-origin `/api/v2/channels` facade and room REST orchestration | no channel/message ownership |
  | **Chat Gateway** | `/ws/v2/channels`, cookie authentication, command/event transport, multi-tab fan-out | active socket registry only |
  | **chat-service / Channel Service** | DIRECT/ROOM uniqueness, membership epochs and visibility windows, authorization, command inbox/request ledger, lifecycle inbox, persistence, history/retention, read state, and outgoing event publication | PostgreSQL mutations and transactional outbox; its own outbox publisher; synchronous current-state verdicts from User Service/Game Session; Game Session lifecycle events |
  | **RabbitMQ** | Durable command/event delivery among Game Session, Channel Service, and Chat Gateway | publisher confirms, consumer acknowledgements, redelivery |

  Channel uniqueness is enforced server-side: `UNIQUE(room_id)` for ROOM and a canonical normalized user pair for DIRECT. Every Game Session lifecycle event has a stable event ID and monotonically increasing `room_version`. The outbox publisher preserves per-room order; Channel Service's lifecycle inbox stores consumed IDs in the same PostgreSQL transaction as the corresponding mutation and outgoing events, ignores stale versions, and pauses a detected version gap until it is filled or reconciled from Game Session. Consumer acknowledgement happens after transaction commit. Stats independently deduplicates `match.finalized` by unique `game_id`. RabbitMQ redelivery therefore cannot create a duplicate channel, membership epoch, access transition, or match record.

  **Command inbox:** Channel Service keeps a PostgreSQL request ledger keyed by `(sender_user_id, request_id)` for both message-send and read-position commands, for at least 30 days and at least as long as configured message retention. The command hash includes `type` and normalized payload. Current channel access is checked before returning a recorded result. Identical permitted retries replay the original terminal result; a changed type or payload under the same key is `INVALID_EVENT`. Recorded ROOM read results are also fenced to their original membership epoch; replay after rejoin is `INVALID_EVENT`. Accepted domain changes, the terminal result, and outgoing outbox events commit together. A transient failure before that commit is retriable with the same request ID. A separate table named `inbox` is not required if this ledger supplies those guarantees.

  **Outgoing outbox:** Channel Service owns its outbox and publisher. The publisher reads pending records, publishes to RabbitMQ, and marks them published only after a broker publisher confirm. A crash between confirmation and marking may cause redelivery; stable event IDs and idempotent consumers handle it. Chat Gateway publishes incoming commands and consumes results/events; it does not read Channel Service's database. Broker confirmation is distinct from a browser-facing success ack, which requires the domain transaction to have committed. Live events are not replayed as history on reconnect; clients recover persisted messages and read state through REST.

  ## Room Identifier Consistency

  `room_id` (positive integer) is the internal stable identifier: the WebSocket/REST path key, never shown to users as a "code to share." `room_code` (`^[A-Z0-9]{6}$`, generated at creation, unique among active rooms) is the human-shareable string shown in the UI for another player to type into Join Room, resolved back to `room_id` by `Lookup room by code`. Every UI reference to a room-sharing string uses this one format; other formats (dashed 4+4 codes, 4-digit codes) seen in earlier UI mockups are stale and superseded by this regex.

  ## Styling Solution

  The frontend styles with CSS custom properties (design tokens) plus component-scoped CSS files, colocated in `shared/ui` and in each feature's `components/`. The tokens match the `ui-design/` system, whose color, type and spacing custom properties are defined in `styles.css`. The visual system is hand-built; no CSS or UI framework (Tailwind, MUI, Bootstrap) is used.

  ## Profile Completion (Standard User Management — subject-mandatory)

  Beyond the read-only profile, the contract defines `PATCH /api/v1/users/me` (editable fields: `username`, within the same uniqueness/format rule as registration) and `POST /api/v1/users/me/avatar` (multipart upload — `image/jpeg`, `image/png`, `image/webp` only; max 2 MiB; server validates MIME type and dimensions server-side regardless of client-declared type; replacing an avatar deletes the previous stored file; a user with no uploaded avatar gets a deterministic default derived from `user_id`). `avatar_url` is present in own-profile, public-profile, friend-list, Chat v2 peer, and Game v2 room-member payloads so current frontend lists can render it without extra profile requests; the stable v1 room schema remains unchanged. Instead of uploading, a user can pick one of the ready-made avatars listed by `GET /api/v1/avatars/presets` with `PUT /api/v1/users/me/avatar`; the most recent upload or pick wins. See `02 - Users & Profile/update-own-profile.yml`, `upload-avatar.yml`, `list-avatar-presets.yml` and `select-avatar-preset.yml`.

  A confirmed username or avatar change takes effect everywhere at once, without a reload. In the user's active room, in any status except `CLOSED`, the server updates the member entry and emits `room.player.updated` with `changed_fields: ["username"]` or `["avatar_url"]`, followed by `room.state`; the change does not touch team, role, ready, startability or a running countdown. On the chat socket, `user.profile.updated` reaches the user's own sessions, their friends, and the other side of each of their pending friend requests. Lists read over REST after the change, such as Room Discovery and public profiles, return the current values. Game History entries keep the name recorded with them; a client shows the current name of a player who is still a member of the room.

  ## OAuth (Google)

  Google is the only OAuth provider. Auth Service owns `GET /api/v1/auth/oauth/google/authorize`, which starts an Authorization Code flow with PKCE and a single-use `state`, and `GET /api/v1/auth/oauth/google/callback`, which completes it. A verified Google email that matches an existing Auth account signs into that account and links it; otherwise Auth creates the identity and coordinates a generated unique username/default-avatar profile with User Service. An account created through Google has no password and signs in through Google. Success ends in the same `ft_session`/`ft_refresh` session model as password login, with no separate session type, and redirects the browser to a same-origin SPA path only after provisioning completes. Failure redirects to the SPA with an `oauth_error` code. The Google client ID and client secret live only in Auth's backend configuration; the frontend and User Service never hold a client secret or a provider token. See `01 - Identity/oauth-google-authorize.yml` and `oauth-google-callback.yml`.

  ## Account Deletion

  User Service owns `DELETE /api/v1/users/me` and validates the typed current username before starting a durable deletion operation. It coordinates Auth, Game Session, Channel Service and Stats using one stable internal `operation_id`; each participant performs idempotent local cleanup and never reads or deletes another service's database tables. Auth marks the account as deleting, blocks new authentication/credential issuance and revokes every session and refresh-token family. Auth's revocation notifications identify account deletion as the cause and close all user sockets with `4401`; this is distinct from a normal single-session logout.

  Game Session removes active membership with reason `ACCOUNT_DELETED`: Game v2 staffing rules apply and no leave penalty is recorded; v1 `IN_GAME` applies its forfeit. Session invalidation and transport disconnection during this operation must not turn the same departure into a second `SESSION_ENDED`/abandonment penalty. User deletes its profile/avatar, friendships, requests and blocks; Channel Service deletes the user's DIRECT channels/messages and removes the user's read state; Stats clears the user's penalty points and anonymizes retained finalized-match participants as `user_id:null`, `username:"deleted_user"`; Auth removes its account, credentials and Google links after required cleanup completes. A deleted `user_id` is never reassigned to a new account.

  User returns `204` with both cookie-clearing headers only after required cleanup completes and the email/username can be reused. Local deletion progress survives retries and coordinator restarts, and the worker resumes even after the initiating session has been revoked. Invalid session/confirmation or throttling before deletion begins causes no deletion; a timeout or dependency failure after it begins does not imply rollback of completed cleanup. Deletion is a coordinated workflow, not a cross-service PostgreSQL transaction, and cannot be undone.

  ## User Reports

  User Service owns `POST /api/v1/users/{user_id}/reports`, which lets a signed-in user report another user with a reason category (`HARASSMENT`, `CHEATING`, `OFFENSIVE_USERNAME`, `SPAM`, `OTHER`), optional free-text `details` (`0..500` characters), and an optional `room_id` for context. Reporting oneself returns `422 CANNOT_REPORT_SELF`. A reporter may file one report per target within a server-configured window (24 hours in examples); a repeat returns `409 ALREADY_REPORTED`. User stores the report for moderation and never notifies the reported user. **Unresolved:** how received reports are reviewed and acted on.

  ## Match History and Stats (minor module: Game Statistics)

  Every competitive terminal transition (normal win or assassin) appends exactly one internal `match.finalized` record containing the final participating rosters, winner, end reason, score, and timestamps. `INSUFFICIENT_PLAYERS` appends an auditable `game.cancelled` lifecycle record but no `match.finalized`; it changes no wins, losses, matches played, level, or match history. Stats consumes finalized matches idempotently by `game_id`.

  ## Privacy Policy and Terms of Service

  Subject-mandatory, and their absence is an automatic-rejection risk, not a style note. Two static frontend routes, `/privacy` and `/terms`, reachable without authentication and linked from a footer present on every public and authenticated layout. No Bruno contract is needed — they are static content, not API-backed — but their existence is recorded here so Frontend Structure and User Flow route planning include them from the start.

  ## Documentation Conventions

  Request docs define preconditions, every input, response fields, state changes, emitted events, concrete errors, and invariants. Native Bruno HTTP examples and named WebSocket messages are normative examples. `null` is stated explicitly where legal; omitted fields are not implied. Examples use the fixture identities above and ISO UTC time.
