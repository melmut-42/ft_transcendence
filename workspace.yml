docs: |-
  # ft_transcendence API Contract

  > **Contract status:** Development contract for active frontend and backend implementation. Examples are normative fixtures; they do not claim that every operation is implemented yet.

  ## Contract versions

  The original room/game/chat behavior remains available in `REST API v1` and `WebSocket v1` through `{{apiVersion}} = v1`. The shared v1 session and own-profile responses have one backward-compatible addition, `active_room_api_version`, so reload recovery can select the right room protocol. The new post-game lifecycle lives only in `REST API v2 - Game` and `WebSocket v2 - Game` through `{{gameApiVersion}} = v2`. Durable channels live only in `Chat REST v2` and `Chat WebSocket v2` through `{{chatApiVersion}} = v2`.

  A frontend selects one room/game contract as a pair: v1 REST must be used with v1 room WebSocket, or v2 REST with v2 room WebSocket. Mixing versions inside one room session is unsupported. Authentication/profile/friends remain on v1 unless a dedicated v2 contract exists.

  Unless a section explicitly says v1 or shared, the room/member/post-game lifecycle described below is the Game v2 contract. The v1 collections remain the authority for the legacy `FINISHED` lifecycle.

  ## Project Overview

  `ft_transcendence` is a four-or-more-player, two-team word-association game inspired by Codenames. Players enter with a stable username identity, create or join one active room, select a team and temporary room role, become ready, and play through a server-authoritative realtime protocol.

  ## Source of Truth

  Conflicts are resolved in this order: explicit product rules in the September 2026 contract brief; its game and UI flows; compatible established project naming; old Bruno material; current backend evidence; then the general school subject. This workspace specifies intended behavior even when implementation differs.

  ## User Flow (Game v2)

  ```mermaid
  flowchart TD
      A[Lobby] --> B[Create or join room]
      B --> C[WAITING room]
      C --> D[Choose RED or BLUE]
      C --> E[Choose SPYMASTER or OPERATIVE]
      D --> F[Set ready]
      E --> F
      F --> G{Every start invariant valid?}
      G -->|No| C
      G -->|Yes| H[COUNTDOWN]
      H -->|Invariant breaks| C
      H -->|Completes validly| I[IN_GAME]
      I --> J[POST_GAME]
      J -->|Any member returns| C
      J -->|Everyone exits or times out| K[CLOSED]
  ```

  ## Room Lifecycle (Game v2)

  ```mermaid
  stateDiagram-v2
      [*] --> WAITING
      WAITING --> COUNTDOWN: every start invariant becomes valid
      COUNTDOWN --> WAITING: any invariant becomes invalid
      COUNTDOWN --> IN_GAME: countdown completes while valid
      IN_GAME --> POST_GAME: terminal game result
      POST_GAME --> WAITING: first member returns to lobby
      WAITING --> CLOSED: last member leaves
      POST_GAME --> CLOSED: every member exits or times out
  ```

  A room is joinable only while its shared status is `WAITING` and no current member remains `POST_GAME`. A creator joins automatically and becomes host. One user may belong to only one active room. Room members have a recipient-specific state: `IN_LOBBY`, `IN_GAME`, or `POST_GAME`. After `game.ended`, the room enters `POST_GAME` and every member enters `POST_GAME`. Any member—not only the host—may choose Back to Lobby; the first accepted choice moves the shared room to `WAITING` and that member to `IN_LOBBY`, while undecided members remain `POST_GAME` and continue seeing the result. Later returners become `IN_LOBBY` independently. Once this transition occurs, shared status remains `WAITING` even if every already-returned member later exits or is kicked; pending members and the original deadline still govern cleanup. New joins, invites, and countdown are forbidden until every remaining member is `IN_LOBBY`.

  The post-game decision deadline is 60 seconds by default and server-configurable. It starts at `game.ended`, is represented by the absolute `post_game.deadline_at`, and is not paused by disconnect. A member still in `POST_GAME` at the deadline is removed with reason `POST_GAME_TIMEOUT`. If every member exits or times out, the room becomes `CLOSED`; if at least one member returned, the room remains `WAITING`. The same `room_id`, `room_code`, host, team, and role selections survive a return; every member's `ready` resets to `false`, and a new `game_id`/board is created only after the next valid countdown.

  Host authority is limited to room administration, not returning to lobby or starting the game. Capacity updates require the host to be personally `IN_LOBBY`. A host may kick another member while the shared room is `WAITING` (including a mixed lobby/post-game room), during `COUNTDOWN` (which is cancelled first), or during `POST_GAME`; the host does not need to return before removing a pending post-game member. Kicking is forbidden during `IN_GAME`, and the host cannot kick themself. If the host leaves or times out, host transfers first to the earliest-joined `IN_LOBBY` member, otherwise to the earliest remaining member; an empty room closes.

  ## Reconnect Grace Period and Abandonment (Game v2)

  A transport disconnect (closed socket, no REST leave call) is never treated as an immediate leave, in any room state. It starts a reconnect grace period (configurable server-side; example default 30s in `WAITING`/`COUNTDOWN`, 60s `IN_GAME`) during which the member's seat, team, role, ready state, and turn rights are reserved exactly as they were. Reconnecting inside the grace period (same authenticated session opening a new socket to the same room) restores the member with no state loss and no event beyond the normal reconnect snapshot.

  If the grace period expires without reconnect, behavior depends on room status:
  - **`WAITING` or `COUNTDOWN`:** the member is removed exactly as an explicit leave — `room.player.left`, host transfer if needed, countdown cancellation if the departure breaks a start invariant.
  - **`IN_GAME`:** the member is marked permanently abandoned and the match ends immediately by **forfeit** — the abandoning member's team loses, the opposite team wins, regardless of score. This is the same terminal outcome as an explicit `Leave room` call during `IN_GAME` (which is now accepted, not rejected — see below) and the same outcome as logout during `IN_GAME` (which revokes the session immediately per the Session and Credential Model above, and runs this same forfeit path for room-lifecycle purposes rather than blocking on `ALREADY_IN_ROOM`). The resulting membership event uses `EXITED`, `SESSION_ENDED`, or `DISCONNECTED` respectively.
  - **`POST_GAME`, or a `POST_GAME` member while the room is already `WAITING`:** reconnect grace does not extend the shared post-game deadline. Reconnect before `deadline_at` restores the result projection; expiry removes the unresolved member with `POST_GAME_TIMEOUT`.

  `Leave room` (`DELETE /api/v2/rooms/{room_id}/members/me`) is legal in every v2 room status, including `IN_GAME`; during `IN_GAME` it triggers the same forfeit path as an abandonment timeout, without waiting out the grace period — an explicit leave is an immediate, deliberate signal. `End session` (logout) remains on v1 and is likewise legal regardless of `active_room_id`; if the user is in an `IN_GAME` room, forfeit resolves first, synchronously with the session revocation, then the cookies clear and any open sockets close.

  The terminal `game.ended` event for a forfeit carries `end_reason: "PLAYER_FORFEIT"` alongside the usual `winner`, `loser`, `score`, `room_status: "POST_GAME"`, `game_status: "GAME_FINISHED"`, `phase: "GAME_OVER"`, and `post_game_deadline_at`; `revealed_card` is `null` because no card triggered it. The same atomic terminal transition appends one internal `match.finalized` record to the durable integration outbox. Stats consumes that complete record idempotently by `game_id`; it does not reconstruct rosters from the client-facing `game.ended` payload.

  ## Game Lifecycle

  ```mermaid
  stateDiagram-v2
      [*] --> WAITING_FOR_CLUE
      WAITING_FOR_CLUE --> GUESSING: active Spymaster submits clue word and N
      GUESSING --> GUESSING: own card and guesses remain
      GUESSING --> WAITING_FOR_CLUE: pass, neutral, opponent card, or guesses exhausted
      GUESSING --> GAME_OVER: assassin or either team's final card
      GAME_OVER --> [*]
  ```

  `room.status`, `game.status`, `game.current_turn.phase`, and member state are separate. Room status uses `WAITING | COUNTDOWN | IN_GAME | POST_GAME | CLOSED`; game status uses `IN_PROGRESS | GAME_FINISHED`; game phase uses `WAITING_FOR_CLUE | GUESSING | GAME_OVER`; member state uses `IN_LOBBY | IN_GAME | POST_GAME`.

  ## Identity Model

  Registration requires `{ "email", "username", "password" }` (subject Ch. III–IV, mandatory). Email is the login identifier; username is the public display name; password is hashed + salted server-side (`>= 8`, `<= 72` bytes — bcrypt's input limit). Both email and username are trimmed and case-insensitively unique. Every identity is a registered account; there is no anonymous identity.

  ## Session and Credential Model

  Every session has two credentials, each with its own cookie. Neither credential is ever placed in a JSON response body, a query string, or a custom header. The two cookies are the only credential path in this contract, for browsers and for Bruno, curl or scripts alike. Bruno authenticates exactly like a browser, through its cookie jar.

  | Cookie | Carries | Attributes | Lifetime |
  | --- | --- | --- | --- |
  | `ft_session` | short-lived JWT access credential | HttpOnly, `Secure`, `SameSite=Lax`, `Path=/` | short (example: 30 min) |
  | `ft_refresh` | long-lived opaque refresh credential | HttpOnly, `Secure`, `SameSite=Lax`, `Path=/api/v1/auth/refresh` | long (example: 30 days) |

  Register and Login set both cookies and return no token value in the response body — only `access_token_expires_at` (for client-side UX timers) and profile fields. `GET /api/v1/auth/session` and every other protected REST endpoint read `ft_session` only. `POST /api/v1/auth/refresh` reads `ft_refresh` only (scoped to that one path by `Path=/api/v1/auth/refresh`, so it is never sent on other requests), validates it, rotates it (single-use — the previous `ft_refresh` is revoked the instant a new one is issued), and reissues both cookies. Reuse of an already-rotated `ft_refresh` revokes the entire token family and forces re-login — this is the theft-detection behavior for a stolen refresh credential. The WebSocket upgrade (both the room socket and the chat socket) reads `ft_session` only, attached automatically by the browser on the same-origin request; there is no WebSocket-level refresh — an expired access token means the client calls `POST /api/v1/auth/refresh` over REST first, which reissues `ft_session`, then reconnects.

  `DELETE /api/v1/auth/session` (logout) revokes both credentials server-side and clears both cookies, unconditionally — logout is never blocked by active room membership (see Room Abandonment below, which logout during `IN_GAME` now triggers instead of rejecting). Logout also closes every open, authenticated WebSocket connection for that session (room and chat).

  Concrete states: `UNAUTHORIZED` (401) — the `ft_session` credential is missing, malformed, expired, or revoked; the client retries after `POST /api/v1/auth/refresh`. `SESSION_EXPIRED` (401, refresh endpoint only) — the `ft_refresh` credential is missing, expired, already rotated, or revoked; the client must log in again. A WebSocket handshake with a missing/invalid `ft_session` is rejected before the `101` upgrade; an already-open socket whose session is explicitly revoked (logout, or refresh-token-family revocation) is closed server-side with policy code `4401`. Ordinary access-token expiry does not by itself tear down an already-open game socket — refresh happens on the next REST call or on reconnect.

  ## Teams and Roles

  Teams are exactly `RED` and `BLUE`. Temporary room roles are exactly `SPYMASTER` and `OPERATIVE`. A configured member has one team and one role. A startable room has at least four players, exactly one Spymaster on each team, and at least one Operative on each team.

  ## Room Capacity

  Every room has `max_players`, an integer in `4..8` with default `8`. The host sets it in Create room and may change it while the room is `WAITING` through `room.settings.update`, never below the current `player_count`. Join room and Invite friend return `409 ROOM_FULL` when `player_count` equals `max_players`.

  ## Start Conditions (Game v2)

  Let `P` be all participating room members. The server enters `COUNTDOWN` exactly when all clauses are true:

  ```text
  |P| >= 4
  AND every p in P has team in {RED, BLUE}
  AND every p in P has role in {SPYMASTER, OPERATIVE}
  AND count(RED, SPYMASTER) = 1
  AND count(BLUE, SPYMASTER) = 1
  AND count(RED, OPERATIVE) >= 1
  AND count(BLUE, OPERATIVE) >= 1
  AND every p in P has ready = true
  AND every p in P has member state = IN_LOBBY
  AND no room member has member state = POST_GAME
  AND room.status is WAITING or a still-valid COUNTDOWN
  ```

  A member may set `ready=true` only after choosing team and role. Changing either choice sets `ready=false`. The server re-evaluates all clauses after ready, team, role, join, and leave changes. Invalidating a countdown cancels it and returns the room to `WAITING`; no host start action exists.

  ## Game Rules

  The board has 25 cards. The randomly selected starting team owns 9; the other team owns 8; 7 are `NEUTRAL`; 1 is `ASSASSIN`. Either `RED` or `BLUE` can be the starting team, chosen at random per game, so `score.red` and `score.blue` each independently range `0..9` (whichever color started that game owns 9; the ranges are not fixed per color). Only the active team's Spymaster may submit one normalized clue word plus integer `N` from `1` through `9`. This development contract imposes only: trim, Unicode lowercase storage, a single non-empty whitespace-free word, length `1..30`, and the numeric range. It does not add advanced official clue restrictions.

  A clue grants `N + 1` guesses. An own-team reveal increments that color's score, consumes one guess, and may continue; revealing a team's own final card wins the game for that team immediately. An opponent reveal increments the opponent's score and ends the turn, unless it completes the opponent's full set, which makes the opponent win immediately. A neutral reveal ends the turn. The assassin ends the match immediately: the guessing team loses and the opponent wins, regardless of score. Operatives may pass during `GUESSING`, which ends the turn without revealing a card. Terminal conditions (assassin, either team's full set revealed) are checked before any turn change or score update is finalized. **The winner is never determined by comparing `score.red` to `score.blue` at any point — a full board can never end in a compare-score tiebreak, because the game always ends by a terminal reveal (a full set or the assassin) before the last card would need one.** Frontend never computes the winner locally; only the terminal `game.ended` event (or a `POST_GAME` snapshot) is authoritative.

  ## Data Visibility

  The server creates a projection for each recipient. Spymasters see every card affiliation. Operatives receive `color: null` for every unrevealed card and the true color after reveal. A universal secret-bearing board payload MUST NOT be broadcast. This applies to REST snapshots, initial `game.started`, reconnect `room.state`, and reveal events. Per-recipient projection happens inside the authoritative game-state owner (Game Session, see Backend Architecture) before a payload reaches any generic fan-out/broadcast layer — a full 25-color board is never handed to transport infrastructure for client-side filtering.

  **Card ID invariant:** `card_id` (`1..25`) is a stable per-game slot identifier and carries zero information about affiliation. Board generation independently randomizes (a) which 25 words appear, (b) which slot gets which word, and (c) which slot gets which affiliation (9/8/7/1). Nothing may assume `card_id` parity, range, or position correlates with color — that would leak the key through IDs alone even with correct `color:null` masking. The fixture examples in this workspace and in `07 - Full State Scenarios` use a fixed illustrative map (`RED` = odd IDs, `BLUE` = even IDs, etc.) purely so examples stay reproducible across files; this fixed pattern is a documentation convenience only and MUST NOT be treated as a rule the backend replicates.

  ## Temporary vs Persistent State

  `username`, level, wins, losses, and supported match history are persistent user data. Team, role, ready status, room membership, board, clue, guesses, turn, and score are room/game-scoped and never become permanent account roles. Leaving or closing a room clears temporary membership data as appropriate.

  ## REST vs WebSocket Responsibility

  REST owns registration/session bootstrap (including refresh and logout), profile read/update, avatar, friends (list/add/remove/search), room creation, membership join/leave, snapshots, and match history. Once a member joins the realtime channel, team, role, readiness, countdown, clue, guess, pass, and live state propagation use WebSocket. Basic chat is a separate per-user WebSocket channel (`/ws/v1/chat`), independent of any room. REST and WebSocket share field names and domain enums, and identify the same session; both accept only the `ft_session` cookie — there is no header-based credential on either transport.

  ## Multi-Tab / Multi-Socket

  One authenticated user has exactly one logical room membership at a time (the membership index stores one `(active_room_id, active_room_api_version)` pair), but may hold several simultaneous authenticated connections to it — for example two browser tabs each opening `{{wsUrl}}/ws/{{gameApiVersion}}/rooms/{{roomId}}`. All sockets belonging to that user represent the same membership, not separate players; a second tab never creates a second seat. Every command from any of the user's sockets is validated against the same role/turn/team rules as if only one socket existed. Every server-generated room/game event is delivered to all of that user's currently open sockets for that room. The reconnect grace period (above) is keyed to the membership, not to a specific socket: as long as at least one authenticated socket for that membership is open, the member is not "disconnected"; the grace period starts only when the last of that user's sockets for the room closes.

  ## Error Philosophy

  Malformed JSON is `400`; absent/invalid access tokens are `401 UNAUTHORIZED`; an expired/invalid/used refresh token is `401 SESSION_EXPIRED` (refresh endpoint only — distinct from `UNAUTHORIZED` because it means "log in again," not "retry with a refreshed token"); permission failures are `403`; missing resources are `404`; uniqueness or lifecycle conflicts are `409`; field validation is `422`; throttling is `429`. REST errors use `{ "error": { "code", "message", "details" } }`. WebSocket errors correlate to `request_id` and normally do not mutate state or close the socket. Explicit exceptions are invalid/revoked authentication (`4401`), lost room membership, kick or post-game timeout (`4403`), missing room (`4404`), `POST_GAME_DEADLINE_EXPIRED` timeout cleanup, handshake rejection, and repeated protocol abuse.

  **Frontend error-handling classes** (documented once here, not repeated per component): `INLINE_VALIDATION` (422 field errors — show next to the input: register/login/room-code/clue/chat/avatar fields), `TOAST` (transient failures with no dedicated UI state — 429, 5xx, `NOT_PERMITTED`, `USER_NOT_FOUND`), `AUTH_REDIRECT` (`401 UNAUTHORIZED`, WebSocket `4401`, or `401 SESSION_EXPIRED` after silent refresh fails — send to Login), `ROOM_RECOVERY` (`404 ROOM_NOT_FOUND`, `403 NOT_ROOM_MEMBER`, WebSocket `4403`/`4404`, or `409 ROOM_NOT_JOINABLE`/`ALREADY_IN_ROOM` — return to Lobby with an explanatory toast), `RECONNECT` (an unclassified transport drop while membership is still valid — show the Reconnecting overlay and retry within the grace period), `FATAL_GAME_STATE` (a room/game action error that implies local state is stale relative to the server, e.g. `CARD_ALREADY_REVEALED`, `GAME_ALREADY_FINISHED`, `INVALID_ROOM_STATE` — discard local state and re-fetch/re-apply the next canonical `room.state` snapshot rather than patching around it). Bruno's error codes (above and in `06 - Errors/error-catalog.yml`) stay the single authoritative code list; this is only the UI-handling bucket each one falls into.

  ## Backend Architecture

  The v1/core backend runs as five independently deployable Go services, communicating over REST and Redis pub/sub. V2 integration events use an AOF-backed Redis Stream outbox and RabbitMQ; Chat v2 adds the Web BFF, Chat Gateway, and Channel Service documented separately below. Each service is internally organized into separate packages:

  | Service | Owns | Talks to |
  | --- | --- | --- |
  | **Gateway** | Public HTTPS/WSS entry point; REST reverse-proxy routing to the other services; WebSocket connection lifecycle (accept, `ft_session` validation at handshake, per-user multi-socket fan-out, close codes); TLS termination boundary. Holds **no** domain/game state and makes **no** authorization decisions beyond "is `ft_session` valid" — role/turn/membership authorization is each domain service's job. | User/Auth (session validation), Game Session (routes room/game REST + WS traffic), all others (routes their REST traffic) |
  | **User/Auth** | Users, credentials, `ft_session`/`ft_refresh` issuance and rotation, profiles, avatars, friends, presence | Postgres (users, credentials, refresh-token metadata, profiles, friends); called by Gateway for session validation and by Game Session for room-membership authorization checks (does this user exist / is this user this user) |
  | **Game Session** | Rooms, membership, team/role/ready, countdown, authoritative Codenames state (board, turn, clue, guesses, score), reconnect snapshots, abandonment/forfeit lifecycle, v1 basic-chat permission + delivery | Redis (all room/game state plus the v2 integration outbox, see State Ownership); Board Generator; publishes outbox records through RabbitMQ |
  | **Board Generator** | Stateless: given a word-pack, returns 25 words with randomized affiliations (`9` starting-team, `8` other-team, `7` neutral, `1` assassin) and a randomized `card_id` ↔ slot mapping satisfying the Card ID invariant above. No database, no session, no per-game memory. | Called synchronously by Game Session at game start only |
  | **Stats** | Finalized match results, wins/losses, match history, level (see Match History & Stats below) | Postgres (match_results, user_stats); idempotently consumes durable internal `match.finalized` events by `game_id` |

  Game Session remains the sole authoritative source for room/game state; User/Auth remains the sole authoritative source for identity/social state; Stats remains the sole authoritative source for finalized results. No service re-derives another's authoritative data locally beyond what it's told through these calls/events.

  ## State Ownership and Storage

  **PostgreSQL** (durable, survives restart): users, credentials, refresh-token metadata (for rotation/reuse detection), profiles, avatars, friends, finalized match results, user stats/match history, Chat v2 channel records, membership epochs with sequence-based ROOM visibility windows, and retained messages with `expires_at`.

  **Redis** (room/game coordination): active room state (membership, team/role/ready, host), `(active_room_id, active_room_api_version)` lookup per user (a live index into Redis room membership, not durable Postgres profile fields — so it cannot permanently orphan an account or lose the protocol version needed for recovery), countdown deadlines, in-progress board/turn/clue/score, per-socket presence, WebSocket `request_id` idempotency cache (room-lifetime scoped), and the pub/sub channel Game Session uses to fan events to Gateway. V2 integration records (`room.created`, membership/access changes, and `match.finalized`) are appended atomically with their room mutation to an AOF-backed Redis Stream outbox; a publisher retries them to RabbitMQ until confirmed. They are not sent through lossy pub/sub.

  `GET /api/v1/auth/session`'s `active_room_id` and `active_room_api_version` are always derived together from Game Session's current Redis membership index at request time — they are never independently mutable Postgres fields. Both are null or both are non-null. The frontend uses the version to pair `/api/v1/rooms` with `/ws/v1/rooms` or `/api/v2/rooms` with `/ws/v2/rooms` after reload. If Redis state is lost (restart, flush), both values become `null` for affected users automatically — there is no stale value to get permanently stuck behind `409 ALREADY_IN_ROOM`; a Game Session restart is expected to reload any room state Redis still holds (Redis persistence/AOF at the infra level) and treat anything genuinely gone as if those rooms closed.

  ## Deployment / Same-Origin Model

  One public origin: `Browser → HTTPS/WSS reverse proxy → { SPA, /api/v1/*, /api/v2/*, /ws/v1/*, /ws/v2/rooms/*, /ws/v2/channels }`. The proxy routes room sockets to Game Gateway and `/ws/v2/channels` to Chat Gateway without sending live chat through the BFF. This same-origin surface makes the host-only `ft_session` cookie attach automatically; production must not expose Chat Gateway on a different browser hostname. Every browser-facing connection uses HTTPS/WSS. Local development mirrors this through `localhost:3000` for `baseUrl`, `wsUrl`, and `chatWsUrl`; internal container connections may use their private ports. Secrets live in a gitignored `.env`, with a committed `.env.example` containing placeholders.

  ## Backend Framework

  Every service is written in Go and uses **Gin** (`gin-gonic/gin`) as its HTTP framework. Gin's routing, middleware chain and request binding/validation cover the layered request pipeline each service implements (context/request-ID middleware, access-control middleware, request handling, service layer, response handling). WebSocket upgrades use `gorilla/websocket` inside a Gin handler.

  ## Common Data Types

  | Concept | Contract type | Rule |
  | --- | --- | --- |
  | `user_id`, `room_id`, `game_id`, `card_id` | positive integer | Stable within entity lifetime |
  | timestamps | `string<date-time>` | ISO 8601 UTC, for example `2026-09-10T08:43:12Z` |
  | JSON fields | snake_case | Used by REST and WebSocket |
  | enum values | UPPER_SNAKE_CASE | Closed value sets documented at each use |
  | message types | lowercase.dot.notation | WebSocket only |
  | booleans | JSON boolean | Never encoded as strings or integers |

  ## Example Fixture Dataset

  | User ID | Username | Canonical assignment in room `1001` |
  | ---: | --- | --- |
  | `42` | `player_one` | `RED / SPYMASTER`, host |
  | `43` | `red_agent` | `RED / OPERATIVE` |
  | `44` | `blue_master` | `BLUE / SPYMASTER` |
  | `45` | `blue_agent` | `BLUE / OPERATIVE` |
  | `46` | `extra_red` | additional fixture |
  | `47` | `extra_blue` | additional fixture |

  The canonical match is `game_id=5001`. Related examples keep its word order and secret card map fixed.

  ## Environment Variables

  The `local` environment defines `baseUrl=http://localhost:3000`, `wsUrl=ws://localhost:3000`, and `chatWsUrl=ws://localhost:3000`, plus version and fixture IDs. Bruno authenticates via its cookie jar, exactly like a browser: Register/Login/Refresh set `ft_session`/`ft_refresh` automatically. There is no `sessionToken`/`refreshToken` environment variable because credentials never appear in response bodies.

  ## Friends, Presence, and Chat Scope

  Friends (REST: list/add/remove, plus username search for discovery — see `05 - Friends/search-users.yml`; immediate/mutual, no request-accept workflow) and basic Chat v1 (per-user WebSocket, friend-or-shared-active-room permission) implement the mandatory User Interaction module. Chat v2 adds the persistent channel/history model below. Read receipts, typing indicators, and blocking remain out of scope.

  **Chat v1 permission:** allowed if the sender and recipient are friends, or both are current room members while the shared v1 room is `WAITING`, `COUNTDOWN`, or `IN_GAME`. v1 `FINISHED`/`CLOSED` are excluded. A message to an offline recipient reports `RECIPIENT_OFFLINE`; v1 chat remains live-only.

  **Presence:** a user is `online` while they hold at least one currently open authenticated WebSocket connection (room or chat socket) — tracked ephemerally in Redis, no separate heartbeat protocol needed beyond the socket's own lifetime. `is_online` is exposed consistently everywhere the UI shows presence: the friends list, the public profile, and room member lists.

  ## Room Invitations (v2)

  A v2 room member invites a friend with no active room through `POST /api/v2/rooms/{room_id}/invites` while the room is joinable and not full. Because the notification is transient and delivered only by Chat Gateway v2, the recipient must have at least one active `/ws/v2/channels` socket; generic presence on only a room socket is not sufficient. The Web BFF routes the command to Game Session, which assigns a stable `invite_id`, a short server-configurable delivery `expires_at` (30 seconds in examples), and publishes it through RabbitMQ. `202 Accepted` means it was accepted for live delivery, not that the recipient has already rendered it. Chat Gateway deduplicates broker redelivery by `invite_id` and drops expired deliveries; v2 never also emits the invite on `/ws/v1/chat`. Accepting it is an ordinary v2 Join room request.

  ## Chat v2 Architecture

  Chat v1 above remains supported unchanged as the live-only Game Session chat contract. Chat v2 is a separate, opt-in contract that follows the new service topology and must not change v1 behavior.

  - The client reads channel metadata and retained history through Web BFF REST at `/api/v2/channels`.
  - The client connects directly to Chat Gateway at `{{chatWsUrl}}/ws/{{chatApiVersion}}/channels` for live messages.
  - Chat Gateway publishes commands to RabbitMQ. Channel Service validates persistent participation, asks User/Auth for current DIRECT friendship or Game Session for the authoritative current ROOM/member state, persists accepted messages, and publishes the canonical result/event back through RabbitMQ. A ROOM verdict includes the authoritative `room_version`; Channel Service does not complete send/list/history until its local lifecycle projection and visibility windows are reconciled through at least that version. Lifecycle events maintain the projection and drive access notifications, but a possibly delayed projection is never the sole authorization source.
  - `DIRECT` is a private, canonical channel between two friends. A pair cannot have duplicate direct channels; shared-room membership never creates or authorizes a direct channel.
  - `ROOM` is the common channel for all eligible members of one room. Game Session durably records `room.created` in its outbox; Channel Service consumes it idempotently and creates exactly one ROOM channel. Clients do not call a create-room-channel endpoint.
  - ROOM access follows member lifecycle: `IN_LOBBY` members can use it in `WAITING`/`COUNTDOWN`, and `IN_GAME` members can use it in `IN_GAME`. The atomic terminal transition makes ROOM authorization fail for every member moved to `POST_GAME`; delivery of the later access-change notification is not the authorization boundary. It also closes each member's current sequence-based visibility window. Back to Lobby opens a new window independently for that returned member; Exit, kick, timeout, and room closure close access. History in the current membership epoch is the union of messages that fall inside that member's completed/current visibility windows, so a late returner cannot read lobby messages sent while they were still `POST_GAME`.
  - Channel creation/resolution, listing, history reads, and every send re-evaluate type-specific access. A DIRECT participant must still be a friend; a ROOM participant must still have an eligible room member state. Stored membership alone never grants access.
  - Messages are retained for 30 days by default. Retention is server-configurable and each message carries its authoritative `expires_at`.
  - Successful send acknowledgements are emitted only after persistence. Channel Service deduplicates by `(sender_user_id, request_id)` so client retries and RabbitMQ redelivery cannot create duplicate messages.
  - Offline but currently authorized channel members load retained messages later through REST; recipient presence does not determine whether a v2 message is accepted, while revoked access blocks both live fan-out and history.

  Channel Service is authoritative for v2 channel records, access decisions, and messages, while User/Auth remains authoritative for friendship and Game Session remains authoritative for room/member state. Channel Service obtains a current verdict from those owners at each protected operation and uses lifecycle events for provisioning, membership epochs, cache invalidation, and access notifications. Chat Gateway holds no history and does not make the final authorization decision. The Bruno requests live in the separate `Chat REST v2` and `Chat WebSocket v2` collections.

  | Chat v2 component | Responsibility | State/dependencies |
  | --- | --- | --- |
  | **Web BFF** | Same-origin `/api/v2/channels` facade and room REST orchestration | no channel/message ownership |
  | **Chat Gateway** | `/ws/v2/channels`, cookie authentication, command/event transport, multi-tab fan-out | active socket registry only |
  | **Channel Service** | DIRECT/ROOM uniqueness, membership epochs and visibility windows, authorization, idempotency, persistence, history/retention | PostgreSQL; synchronous current-state verdicts from User/Auth/Game Session; Game Session outbox events |
  | **RabbitMQ** | Durable command/event delivery among Game Session, Channel Service, and Chat Gateway | publisher confirms, consumer acknowledgements, redelivery |

  Channel uniqueness is enforced server-side: `UNIQUE(room_id)` for ROOM and a canonical normalized user pair for DIRECT. Every Game Session lifecycle event has a stable event ID and monotonically increasing `room_version`. The outbox publisher preserves per-room order; Channel Service stores consumed IDs, ignores stale versions, and pauses a detected version gap until it is filled or reconciled from Game Session. Stats independently deduplicates `match.finalized` by unique `game_id`. RabbitMQ redelivery therefore cannot create a duplicate channel, membership epoch, access transition, or match record.

  ## Room Identifier Consistency

  `room_id` (positive integer) is the internal stable identifier: the WebSocket/REST path key, never shown to users as a "code to share." `room_code` (`^[A-Z0-9]{6}$`, generated at creation, unique among active rooms) is the human-shareable string shown in the UI for another player to type into Join Room, resolved back to `room_id` by `Lookup room by code`. Every UI reference to a room-sharing string uses this one format; other formats (dashed 4+4 codes, 4-digit codes) seen in earlier UI mockups are stale and superseded by this regex.

  ## Styling Solution

  The frontend styles with CSS custom properties (design tokens) plus component-scoped CSS files, colocated in `shared/ui` and in each feature's `components/`. The tokens match the `ui-design/` system, whose color, type and spacing custom properties are defined in `styles.css`. The visual system is hand-built; no CSS or UI framework (Tailwind, MUI, Bootstrap) is used.

  ## Profile Completion (Standard User Management — subject-mandatory)

  Beyond the read-only profile, the contract defines `PATCH /api/v1/users/me` (editable fields: `username`, within the same uniqueness/format rule as registration) and `POST /api/v1/users/me/avatar` (multipart upload — `image/jpeg`, `image/png`, `image/webp` only; max 2 MiB; server validates MIME type and dimensions server-side regardless of client-declared type; replacing an avatar deletes the previous stored file; a user with no uploaded avatar gets a deterministic default derived from `user_id`). `avatar_url` is present in own-profile, public-profile, friend-list, Chat v2 peer, and Game v2 room-member payloads so current frontend lists can render it without extra profile requests; the stable v1 room schema remains unchanged. Instead of uploading, a user can pick one of the ready-made avatars listed by `GET /api/v1/avatars/presets` with `PUT /api/v1/users/me/avatar`; the most recent upload or pick wins. See `02 - Users & Profile/update-own-profile.yml`, `upload-avatar.yml`, `list-avatar-presets.yml` and `select-avatar-preset.yml`.

  ## OAuth

  OAuth is **out of scope**. This contract defines no OAuth endpoint, provider integration or account-linking payload — registration and login are email/password only (see Identity Model above). Any provider integration added later must end in the same `ft_session`/`ft_refresh` session model as password login, with no separate session type.

  ## Match History and Stats (minor module: Game Statistics)

  Every terminal transition (normal win, assassin, or `PLAYER_FORFEIT`) appends exactly one internal `match.finalized` record containing `game_id`, `room_id`, both teams' final rosters (`user_id`, `username`, `team`, `role`), `winner`, `end_reason`, `score`, `started_at`, and `finished_at`. Stats consumes it at least once and upserts exactly once by unique `game_id`. `GET /api/v1/users/me/matches` (own match history, paginated) and the existing `wins`/`losses`/`matches_played` on both own and public profile read from this table. `level` stays in scope and is defined as a simple deterministic function of `wins` (`level = 1 + floor(wins / 5)`) — enough to satisfy "level" as a persistent stat without inventing an XP/points economy nothing else in scope requires. The contract defines no leaderboard endpoint; the selected module set does not require one. See `02 - Users & Profile/get-match-history.yml`.

  ## Privacy Policy and Terms of Service

  Subject-mandatory, and their absence is an automatic-rejection risk, not a style note. Two static frontend routes, `/privacy` and `/terms`, reachable without authentication and linked from a footer present on every public and authenticated layout. No Bruno contract is needed — they are static content, not API-backed — but their existence is recorded here so Frontend Structure and User Flow route planning include them from the start.

  ## Documentation Conventions

  Request docs define preconditions, every input, response fields, state changes, emitted events, concrete errors, and invariants. Native Bruno HTTP examples and named WebSocket messages are normative examples. `null` is stated explicitly where legal; omitted fields are not implied. Examples use the fixture identities above and ISO UTC time.
