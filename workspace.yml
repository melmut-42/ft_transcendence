docs: |-
  # ft_transcendence API Contract

  > **Contract status:** Draft product contract for frontend and backend implementation. Examples are normative fixtures; they do not claim that every operation is implemented yet.

  ## Project Overview

  `ft_transcendence` is a four-or-more-player, two-team word-association game inspired by Codenames. Players enter with a stable username identity, create or join one active room, select a team and temporary room role, become ready, and play through a server-authoritative realtime protocol.

  ## Source of Truth

  Conflicts are resolved in this order: explicit product rules in the September 2026 contract brief; its game and UI flows; compatible established project naming; old Bruno material; current backend evidence; then the general school subject. This workspace specifies intended behavior even when implementation differs.

  ## User Flow

  ```mermaid
  flowchart TD
      A[Lobby] --> B[Create or join room]
      B --> C[WAITING room]
      C --> D[Choose RED or BLUE]
      C --> E[Choose SPYMASTER or OPERATIVE]
      D --> F[Set ready]
      E --> F
      F --> G{Every start invariant valid?}
      G -->|No| C
      G -->|Yes| H[COUNTDOWN]
      H -->|Invariant breaks| C
      H -->|Completes validly| I[IN_GAME]
      I --> J[FINISHED]
  ```

  ## Room Lifecycle

  ```mermaid
  stateDiagram-v2
      [*] --> WAITING
      WAITING --> COUNTDOWN: every start invariant becomes valid
      COUNTDOWN --> WAITING: any invariant becomes invalid
      COUNTDOWN --> IN_GAME: countdown completes while valid
      IN_GAME --> FINISHED: terminal game result
      WAITING --> CLOSED: last member leaves
      FINISHED --> CLOSED: room closes
  ```

  `WAITING` is the only joinable state. A creator joins automatically and becomes host. One user may belong to only one active room. If a host leaves during `WAITING`, the longest-present remaining member becomes host; the room becomes `CLOSED` when empty. No rematch transition is defined.

  ## Game Lifecycle

  ```mermaid
  stateDiagram-v2
      [*] --> WAITING_FOR_CLUE
      WAITING_FOR_CLUE --> GUESSING: active Spymaster submits clue word and N
      GUESSING --> GUESSING: own card and guesses remain
      GUESSING --> WAITING_FOR_CLUE: pass, neutral, opponent card, or guesses exhausted
      GUESSING --> GAME_OVER: assassin or either team's final card
      GAME_OVER --> [*]
  ```

  `room.status` and `game.current_turn.phase` are separate. Room status uses `WAITING | COUNTDOWN | IN_GAME | FINISHED | CLOSED`; game phase uses `WAITING_FOR_CLUE | GUESSING | GAME_OVER`.

  ## Identity Model

  Registration accepts only `{ "username": "player_one" }`. The server trims the string and validates `^[A-Za-z0-9_]{3,20}$`; uniqueness is case-insensitive. There is no email or password. Successful registration creates a stable user plus an opaque session token. REST sends it as `X-Session-Id`; WebSocket sends the same token as a handshake header. A client cannot claim an existing username without that session.

  ## Teams and Roles

  Teams are exactly `RED` and `BLUE`. Temporary room roles are exactly `SPYMASTER` and `OPERATIVE`. A configured member has one team and one role. A startable room has at least four players, exactly one Spymaster on each team, and at least one Operative on each team.

  ## Start Conditions

  Let `P` be all participating room members. The server enters `COUNTDOWN` exactly when all clauses are true:

  ```text
  |P| >= 4
  AND every p in P has team in {RED, BLUE}
  AND every p in P has role in {SPYMASTER, OPERATIVE}
  AND count(RED, SPYMASTER) = 1
  AND count(BLUE, SPYMASTER) = 1
  AND count(RED, OPERATIVE) >= 1
  AND count(BLUE, OPERATIVE) >= 1
  AND every p in P has ready = true
  AND room.status is WAITING or a still-valid COUNTDOWN
  ```

  A member may set `ready=true` only after choosing team and role. Changing either choice sets `ready=false`. The server re-evaluates all clauses after ready, team, role, join, and leave changes. Invalidating a countdown cancels it and returns the room to `WAITING`; no host start action exists.

  ## Game Rules

  The board has 25 cards. The randomly selected starting team owns 9; the other team owns 8; 7 are `NEUTRAL`; 1 is `ASSASSIN`. Only the active team's Spymaster may submit one normalized clue word plus integer `N` from `1` through `9`. This draft imposes only: trim, Unicode lowercase storage, a single non-empty whitespace-free word, length `1..30`, and the numeric range. It does not add advanced official clue restrictions.

  A clue grants `N + 1` guesses. An own-team reveal increments that color's score, consumes one guess, and may continue. An opponent reveal increments the opponent score and ends the turn unless it completes that opponent's set, which makes the opponent win immediately. A neutral reveal ends the turn. The assassin ends the match immediately and the guessing team's opponent wins. Operatives may pass during `GUESSING`. Terminal conditions are checked before any turn change.

  `score.red` is the number of revealed `RED` cards; `score.blue` is the number of revealed `BLUE` cards. The first team whose full set is revealed wins. The winner is never decided by comparing scores after all 25 cards.

  ## Data Visibility

  The server creates a projection for each recipient. Spymasters see every card affiliation. Operatives receive `color: null` for every unrevealed card and the true color after reveal. A universal secret-bearing board payload MUST NOT be broadcast. This applies to REST snapshots, initial `game.started`, reconnect `game.state`, and reveal events.

  ## Temporary vs Persistent State

  `username`, level, wins, losses, and supported match history are persistent user data. Team, role, ready status, room membership, board, clue, guesses, turn, and score are room/game-scoped and never become permanent account roles. Leaving or closing a room clears temporary membership data as appropriate.

  ## REST vs WebSocket Responsibility

  REST owns registration/session bootstrap, profiles, room creation, membership join, snapshots, and leaving. Once a member joins the realtime channel, team, role, readiness, countdown, clue, guess, pass, and live state propagation use WebSocket. REST and WebSocket share field names and domain enums.

  ## Error Philosophy

  Malformed JSON is `400`; absent/invalid sessions are `401`; permission failures are `403`; missing resources are `404`; uniqueness or lifecycle conflicts are `409`; field validation is `422`; throttling is `429`. REST errors use `{ "error": { "code", "message", "details" } }`. WebSocket errors correlate to `request_id`, do not mutate state, and leave the socket open except handshake authentication failures or protocol-abuse closure.

  ## Common Data Types

  | Concept | Contract type | Rule |
  | --- | --- | --- |
  | `user_id`, `room_id`, `game_id`, `card_id` | positive integer | Stable within entity lifetime |
  | timestamps | `string<date-time>` | ISO 8601 UTC, for example `2026-09-10T08:43:12Z` |
  | JSON fields | snake_case | Used by REST and WebSocket |
  | enum values | UPPER_SNAKE_CASE | Closed value sets documented at each use |
  | message types | lowercase.dot.notation | WebSocket only |
  | booleans | JSON boolean | Never encoded as strings or integers |

  ## Example Fixture Dataset

  | User ID | Username | Canonical assignment in room `1001` |
  | ---: | --- | --- |
  | `42` | `player_one` | `RED / SPYMASTER`, host |
  | `43` | `red_agent` | `RED / OPERATIVE` |
  | `44` | `blue_master` | `BLUE / SPYMASTER` |
  | `45` | `blue_agent` | `BLUE / OPERATIVE` |
  | `46` | `extra_red` | additional fixture |
  | `47` | `extra_blue` | additional fixture |

  The canonical match is `game_id=5001`. Related examples keep its word order and secret card map fixed.

  ## Environment Variables

  The `local` environment defines `baseUrl=http://localhost:3000`, `wsUrl=ws://localhost:3000`, `sessionToken`, `userId`, `roomId`, and `gameId`. Registration and room creation scripts populate the first four runtime values. Secret session values remain blank in version control.

  ## Chat Scope

  Chat exists at product/UI level, but its permission and event contract is outside this revision because no authoritative chat rules are present in this repository or supplied brief.

  ## Subject Compliance Note

  > This contract intentionally models username-only identity with no email or password. That is a known product decision and conflicts with school-subject authentication expectations that may require email/password. The team must reconcile this before final evaluation; this draft does not conceal or pre-empt that decision.

  ## Documentation Conventions

  Request docs define preconditions, every input, response fields, state changes, emitted events, concrete errors, and invariants. Native Bruno HTTP examples and named WebSocket messages are normative examples. `null` is stated explicitly where legal; omitted fields are not implied. Examples use the fixture identities above and ISO UTC time.
