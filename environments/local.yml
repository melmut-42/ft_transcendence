name: local
variables:
  - name: baseUrl
    value: "http://localhost:3000"
    type: string
    description: "Local REST API origin"
  - name: wsUrl
    value: "ws://localhost:3000"
    type: string
    description: "Local WebSocket origin"
  - name: sessionToken
    value: ""
    secret: true
    type: string
    description: "Opaque session from registration; never commit a real value"
  - name: userId
    value: "42"
    type: number
    description: "Current fixture user ID; registration overwrites it at runtime"
  - name: roomId
    value: "1001"
    type: number
    description: "Current room ID; room creation overwrites it at runtime"
  - name: gameId
    value: "5001"
    type: number
    description: "Canonical match ID used by state examples"
