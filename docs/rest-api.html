    <script>
        const collectionData = "opencollection: 1.0.0\ninfo:\n  name: REST API\n  version: 1.0.0-draft\nconfig:\n  proxy:\n    inherit: true\n    config:\n      protocol: http\n      hostname: ''\n      port: ''\n      auth:\n        username: ''\n        password: ''\n      bypassProxy: ''\nitems:\n  - info:\n      name: 01 - Identity\n      type: folder\n      seq: 1\n    docs:\n      content: |-\n        # Identity\n\n        Identity is username-only. Usernames are trimmed, case-insensitively unique strings matching `^[A-Za-z0-9_]{3,20}$`. Registration atomically creates the persistent user and opaque session. `X-Session-Id` authenticates subsequent REST calls. Session deletion revokes the token without deleting the user or statistics.\n      type: text/markdown\n    items:\n      - info:\n          name: Register username\n          type: http\n          seq: 1\n          tags:\n            - identity\n            - smoke\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/auth/register'\n          headers:\n            - name: Content-Type\n              value: application/json\n            - name: Accept\n              value: application/json\n          body:\n            type: json\n            data: '{\"username\":\"player_one\"}'\n        runtime:\n          scripts:\n            - type: after-response\n              code: |-\n                if (res.status === 201 && res.body && res.body.data) {\n                  bru.setVar(\"sessionToken\", String(res.body.data.session_token));\n                  bru.setVar(\"userId\", String(res.body.data.user.user_id));\n                }\n            - type: tests\n              code: |-\n                test(\"creates a stable user and opaque session\", function () {\n                  expect(res.status).to.equal(201);\n                  expect(res.body.data.user.username).to.equal(\"player_one\");\n                  expect(res.body.data.session_token).to.be.a(\"string\");\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # Register username\n\n          ## Purpose\n\n          Atomically creates a persistent user and one opaque authenticated session. It accepts no email, password, OAuth assertion, or profile role.\n\n          ## Preconditions\n\n          The client has no authenticated identity. The normalized username must be unique under case-insensitive comparison.\n\n          ## Request parameters\n\n          | Parameter | Location | Required | Type | Allowed values/range | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `Content-Type` | header | yes | string | `application/json` | no | JSON request media type | `application/json` |\n          | `Accept` | header | yes | string | `application/json` | no | Requested response media type | `application/json` |\n          | `username` | body | yes | string | trimmed `^[A-Za-z0-9_]{3,20}$` | no | Persistent unique username | `player_one` |\n\n          The server trims leading/trailing whitespace before validation and storage. `Player_One` conflicts with `player_one`; original casing is otherwise preserved.\n\n          ## Success behavior and response fields\n\n          `201 Created` creates both records. The script stores `sessionToken` and `userId`.\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `data.user.user_id` | integer | yes | no | positive | Stable user identifier |\n          | `data.user.username` | string | yes | no | normalized validation rule | Stored display username |\n          | `data.user.created_at` | `string<date-time>` | yes | no | ISO 8601 UTC | User creation time |\n          | `data.session_token` | string | yes | no | opaque, non-empty | Credential for REST and WebSocket |\n          | `data.session_expires_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Session expiry |\n\n          ## State changes and events\n\n          A user and session are persisted. No room membership is created and no WebSocket event is emitted.\n\n          ## Errors\n\n          | Status | Code | When | State change |\n          | --- | --- | --- | --- |\n          | `400` | `VALIDATION_ERROR` | malformed JSON or unexpected structure | none |\n          | `422` | `INVALID_USERNAME` | missing, wrong type, length, or characters | none |\n          | `409` | `USERNAME_TAKEN` | case-insensitive username already exists | none |\n          | `429` | `RATE_LIMITED` | registration limit exceeded | none |\n\n          ## Notes/invariants\n\n          The response token is shown only at creation. A duplicate transmission cannot claim the existing username; it returns `USERNAME_TAKEN`.\n        examples:\n          - name: Success - player_one\n            request:\n              url: '{{baseUrl}}/api/auth/register'\n              method: POST\n              headers:\n                - name: Content-Type\n                  value: application/json\n                - name: Accept\n                  value: application/json\n            response:\n              status: 201\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"data\":{\"user\":{\"user_id\":42,\"username\":\"player_one\",\"created_at\":\"2026-09-10T08:40:01Z\"},\"session_token\":\"sess_7Hk2mQ9vLc4R8pXa\",\"session_expires_at\":\"2026-10-10T08:40:01Z\"}}'\n          - name: Success - BlueMaster\n            request:\n              url: '{{baseUrl}}/api/auth/register'\n              method: POST\n              headers:\n                - name: Content-Type\n                  value: application/json\n                - name: Accept\n                  value: application/json\n            response:\n              status: 201\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"data\":{\"user\":{\"user_id\":48,\"username\":\"BlueMaster\",\"created_at\":\"2026-09-10T08:40:02Z\"},\"session_token\":\"sess_4Pu8Kc2wNm7Vd5Qz\",\"session_expires_at\":\"2026-10-10T08:40:02Z\"}}'\n          - name: Success - red_agent fixture\n            request:\n              url: '{{baseUrl}}/api/auth/register'\n              method: POST\n              headers:\n                - name: Content-Type\n                  value: application/json\n                - name: Accept\n                  value: application/json\n            response:\n              status: 201\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"data\":{\"user\":{\"user_id\":43,\"username\":\"red_agent\",\"created_at\":\"2026-09-10T08:40:03Z\"},\"session_token\":\"sess_A3redAgent9Kp\",\"session_expires_at\":\"2026-10-10T08:40:03Z\"}}'\n          - name: Success - blue_master fixture\n            request:\n              url: '{{baseUrl}}/api/auth/register'\n              method: POST\n              headers:\n                - name: Content-Type\n                  value: application/json\n                - name: Accept\n                  value: application/json\n            response:\n              status: 201\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"data\":{\"user\":{\"user_id\":44,\"username\":\"blue_master\",\"created_at\":\"2026-09-10T08:40:04Z\"},\"session_token\":\"sess_B4blueMaster7Q\",\"session_expires_at\":\"2026-10-10T08:40:04Z\"}}'\n          - name: Success - blue_agent fixture\n            request:\n              url: '{{baseUrl}}/api/auth/register'\n              method: POST\n              headers:\n                - name: Content-Type\n                  value: application/json\n                - name: Accept\n                  value: application/json\n            response:\n              status: 201\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"data\":{\"user\":{\"user_id\":45,\"username\":\"blue_agent\",\"created_at\":\"2026-09-10T08:40:05Z\"},\"session_token\":\"sess_C5blueAgent2Rm\",\"session_expires_at\":\"2026-10-10T08:40:05Z\"}}'\n          - name: Error - Invalid characters\n            request:\n              url: '{{baseUrl}}/api/auth/register'\n              method: POST\n              headers:\n                - name: Content-Type\n                  value: application/json\n            response:\n              status: 422\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"error\":{\"code\":\"INVALID_USERNAME\",\"message\":\"Username must match ^[A-Za-z0-9_]{3,20}$.\",\"details\":{\"field\":\"username\",\"value\":\"player-one!\"}}}'\n          - name: Error - Username too short\n            request:\n              url: '{{baseUrl}}/api/auth/register'\n              method: POST\n              headers:\n                - name: Content-Type\n                  value: application/json\n            response:\n              status: 422\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"error\":{\"code\":\"INVALID_USERNAME\",\"message\":\"Username must contain between 3 and 20 characters.\",\"details\":{\"field\":\"username\",\"min_length\":3,\"max_length\":20}}}'\n          - name: Error - Username already exists\n            request:\n              url: '{{baseUrl}}/api/auth/register'\n              method: POST\n              headers:\n                - name: Content-Type\n                  value: application/json\n            response:\n              status: 409\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"error\":{\"code\":\"USERNAME_TAKEN\",\"message\":\"Username ''PLAYER_ONE'' is already registered.\",\"details\":{\"field\":\"username\"}}}'\n      - info:\n          name: Get current session\n          type: http\n          seq: 2\n          tags:\n            - identity\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/auth/session'\n          headers:\n            - name: X-Session-Id\n              value: '{{sessionToken}}'\n            - name: Accept\n              value: application/json\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # Get current session\n\n          ## Purpose and preconditions\n\n          Resolves the opaque session to its user and current temporary room link. A valid unexpired `X-Session-Id` is required.\n\n          ## Request parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `X-Session-Id` | header | yes | string | active opaque token | no | Shared REST/WebSocket credential | `sess_7Hk2mQ9vLc4R8pXa` |\n          | `Accept` | header | yes | string | `application/json` | no | Requested response media type | `application/json` |\n\n          ## Success and response fields\n\n          `200 OK` returns the authenticated identity without reissuing a token.\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `data.user.user_id` | integer | yes | no | positive | Authenticated user |\n          | `data.user.username` | string | yes | no | username rule | Stored display username |\n          | `data.active_room_id` | integer or null | yes | yes | positive or `null` | Current active room, never a permanent profile role |\n          | `data.session_expires_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Credential expiry |\n\n          ## State changes, events, and errors\n\n          Read-only; no event. Missing, invalid, revoked, or expired tokens return `401 UNAUTHORIZED` and an empty details object.\n        examples:\n          - name: Success - No active room\n            request:\n              url: '{{baseUrl}}/api/auth/session'\n              method: GET\n              headers:\n                - name: X-Session-Id\n                  value: sess_7Hk2mQ9vLc4R8pXa\n            response:\n              status: 200\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"data\":{\"user\":{\"user_id\":42,\"username\":\"player_one\"},\"active_room_id\":null,\"session_expires_at\":\"2026-10-10T08:40:01Z\"}}'\n          - name: Success - Active room\n            request:\n              url: '{{baseUrl}}/api/auth/session'\n              method: GET\n              headers:\n                - name: X-Session-Id\n                  value: sess_7Hk2mQ9vLc4R8pXa\n            response:\n              status: 200\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"data\":{\"user\":{\"user_id\":42,\"username\":\"player_one\"},\"active_room_id\":1001,\"session_expires_at\":\"2026-10-10T08:40:01Z\"}}'\n          - name: Error - Invalid session\n            request:\n              url: '{{baseUrl}}/api/auth/session'\n              method: GET\n              headers:\n                - name: X-Session-Id\n                  value: sess_invalid\n            response:\n              status: 401\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"error\":{\"code\":\"UNAUTHORIZED\",\"message\":\"A valid active session is required.\",\"details\":{}}}'\n      - info:\n          name: End current session\n          type: http\n          seq: 3\n          tags:\n            - identity\n        http:\n          method: DELETE\n          url: '{{baseUrl}}/api/auth/session'\n          headers:\n            - name: X-Session-Id\n              value: '{{sessionToken}}'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # End current session\n\n          ## Purpose and preconditions\n\n          Revokes the current opaque token. The user and persistent statistics remain. A member must leave an active room before ending the session so room presence cannot become ownerless.\n\n          ## Request parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `X-Session-Id` | header | yes | string | active opaque token | no | Token to revoke | `sess_7Hk2mQ9vLc4R8pXa` |\n\n          ## Success, state changes, and events\n\n          `204 No Content` has no body and makes the token unusable for REST or WebSocket. It emits no room event because active-room membership is prohibited by precondition.\n\n          ## Errors\n\n          `401 UNAUTHORIZED` covers invalid/revoked tokens. `409 ALREADY_IN_ROOM` means `active_room_id` is non-null; the token remains valid and the client must leave first.\n        examples:\n          - name: Success - Session revoked\n            request:\n              url: '{{baseUrl}}/api/auth/session'\n              method: DELETE\n              headers:\n                - name: X-Session-Id\n                  value: sess_7Hk2mQ9vLc4R8pXa\n            response:\n              status: 204\n              body:\n                type: text\n                data: ''\n          - name: Error - Active room must be left\n            request:\n              url: '{{baseUrl}}/api/auth/session'\n              method: DELETE\n              headers:\n                - name: X-Session-Id\n                  value: sess_7Hk2mQ9vLc4R8pXa\n            response:\n              status: 409\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"error\":{\"code\":\"ALREADY_IN_ROOM\",\"message\":\"Leave room 1001 before ending the session.\",\"details\":{\"room_id\":1001}}}'\n          - name: Error - Session already revoked\n            request:\n              url: '{{baseUrl}}/api/auth/session'\n              method: DELETE\n              headers:\n                - name: X-Session-Id\n                  value: sess_revoked\n            response:\n              status: 401\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"error\":{\"code\":\"UNAUTHORIZED\",\"message\":\"A valid active session is required.\",\"details\":{}}}'\n  - info:\n      name: 02 - Users & Profile\n      type: folder\n      seq: 2\n    docs:\n      content: |-\n        # Users and profiles\n\n        Profiles contain persistent identity and statistics: `wins`, `losses`, `level`, and supported match summaries. Temporary room team, role, readiness, score, board, clue, and turn never become account fields. The own profile may show `active_room_id`; public profiles omit session and active-room data.\n      type: text/markdown\n    items:\n      - info:\n          name: Get own profile\n          type: http\n          seq: 1\n          tags:\n            - profile\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/users/me'\n          headers:\n            - name: X-Session-Id\n              value: '{{sessionToken}}'\n            - name: Accept\n              value: application/json\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # Get own profile\n\n          ## Purpose and preconditions\n\n          Returns authenticated persistent statistics plus the current room link. Requires an active session.\n\n          ## Request parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `X-Session-Id` | header | yes | string | active opaque token | no | Authenticates the owner | `sess_7Hk2mQ9vLc4R8pXa` |\n          | `Accept` | header | yes | string | `application/json` | no | Requested response media type | `application/json` |\n\n          ## Response fields\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `data.user_id` | integer | yes | no | positive | Persistent user ID |\n          | `data.username` | string | yes | no | username rule | Display username |\n          | `data.level` | integer | yes | no | `>= 1` | Persistent progression level |\n          | `data.wins` | integer | yes | no | `>= 0` | Finished matches won |\n          | `data.losses` | integer | yes | no | `>= 0` | Finished matches lost |\n          | `data.matches_played` | integer | yes | no | `wins + losses` | Total settled matches |\n          | `data.active_room_id` | integer or null | yes | yes | positive or `null` | Temporary room membership link |\n          | `data.created_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Account creation time |\n\n          ## State changes, events, and errors\n\n          Read-only; no event. Invalid sessions return `401 UNAUTHORIZED`. Team, role, ready, score, and board are intentionally absent because they are room state.\n        examples:\n          - name: Success - Persistent stats with active room\n            request:\n              url: '{{baseUrl}}/api/users/me'\n              method: GET\n              headers:\n                - name: X-Session-Id\n                  value: '{{sessionToken}}'\n            response:\n              status: 200\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"data\":{\"user_id\":42,\"username\":\"player_one\",\"level\":4,\"wins\":12,\"losses\":8,\"matches_played\":20,\"active_room_id\":1001,\"created_at\":\"2026-08-01T10:00:00Z\"}}'\n          - name: Success - Persistent stats without room\n            request:\n              url: '{{baseUrl}}/api/users/me'\n              method: GET\n              headers:\n                - name: X-Session-Id\n                  value: '{{sessionToken}}'\n            response:\n              status: 200\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"data\":{\"user_id\":42,\"username\":\"player_one\",\"level\":4,\"wins\":12,\"losses\":8,\"matches_played\":20,\"active_room_id\":null,\"created_at\":\"2026-08-01T10:00:00Z\"}}'\n          - name: Error - Unauthorized\n            request:\n              url: '{{baseUrl}}/api/users/me'\n              method: GET\n            response:\n              status: 401\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"error\":{\"code\":\"UNAUTHORIZED\",\"message\":\"A valid active session is required.\",\"details\":{}}}'\n      - info:\n          name: Get public profile\n          type: http\n          seq: 2\n          tags:\n            - profile\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/users/43'\n          headers:\n            - name: X-Session-Id\n              value: '{{sessionToken}}'\n            - name: Accept\n              value: application/json\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # Get public profile\n\n          ## Purpose and preconditions\n\n          Returns another player's public persistent profile. Authentication is required; room co-membership is not.\n\n          ## Request parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `user_id` | path | yes | integer | positive | no | Target user | `43` |\n          | `X-Session-Id` | header | yes | string | active opaque token | no | Requesting identity | `sess_7Hk2mQ9vLc4R8pXa` |\n          | `Accept` | header | yes | string | `application/json` | no | Requested response media type | `application/json` |\n\n          ## Response fields\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `data.user_id` | integer | yes | no | positive | Public user ID |\n          | `data.username` | string | yes | no | username rule | Public display name |\n          | `data.level` | integer | yes | no | `>= 1` | Persistent level |\n          | `data.wins` | integer | yes | no | `>= 0` | Wins |\n          | `data.losses` | integer | yes | no | `>= 0` | Losses |\n          | `data.matches_played` | integer | yes | no | `wins + losses` | Settled matches |\n\n          ## State changes, events, and errors\n\n          Read-only; no event. `401 UNAUTHORIZED` covers the requester session; `404 USER_NOT_FOUND` covers a valid positive ID with no user. Session tokens, active room, team, role, and ready state are never public profile fields.\n        examples:\n          - name: Success - red_agent\n            request:\n              url: '{{baseUrl}}/api/users/43'\n              method: GET\n              headers:\n                - name: X-Session-Id\n                  value: '{{sessionToken}}'\n            response:\n              status: 200\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"data\":{\"user_id\":43,\"username\":\"red_agent\",\"level\":3,\"wins\":9,\"losses\":11,\"matches_played\":20}}'\n          - name: Error - User not found\n            request:\n              url: '{{baseUrl}}/api/users/9999'\n              method: GET\n              headers:\n                - name: X-Session-Id\n                  value: '{{sessionToken}}'\n            response:\n              status: 404\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"error\":{\"code\":\"USER_NOT_FOUND\",\"message\":\"User 9999 was not found.\",\"details\":{\"user_id\":9999}}}'\n          - name: Error - Invalid path ID\n            request:\n              url: '{{baseUrl}}/api/users/zero'\n              method: GET\n              headers:\n                - name: X-Session-Id\n                  value: '{{sessionToken}}'\n            response:\n              status: 422\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"error\":{\"code\":\"VALIDATION_ERROR\",\"message\":\"user_id must be a positive integer.\",\"details\":{\"field\":\"user_id\"}}}'\n  - info:\n      name: 03 - Rooms\n      type: folder\n      seq: 3\n    docs:\n      content: |-\n        # Rooms\n\n        Creating joins the creator and assigns host. Only `WAITING` rooms accept joins, and a user may have one active room. The host transfers to the longest-present member after a host leaves `WAITING`; an empty room closes. Team, role, ready, countdown, and gameplay mutations use WebSocket.\n\n        A game can start only with at least four configured, ready members; exactly one Spymaster and at least one Operative per `RED` and `BLUE`. REST room snapshots use the same enums and privacy projections as realtime state.\n      type: text/markdown\n    items:\n      - info:\n          name: Create room\n          type: http\n          seq: 1\n          tags:\n            - rooms\n            - smoke\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/rooms'\n          headers:\n            - name: X-Session-Id\n              value: '{{sessionToken}}'\n            - name: Accept\n              value: application/json\n        runtime:\n          scripts:\n            - type: after-response\n              code: |-\n                if (res.status === 201 && res.body && res.body.data) {\n                  bru.setVar(\"roomId\", String(res.body.data.room_id));\n                }\n            - type: tests\n              code: |-\n                test(\"creator is joined as unconfigured host\", function () {\n                  expect(res.status).to.equal(201);\n                  expect(res.body.data.status).to.equal(\"WAITING\");\n                  expect(res.body.data.players[0].is_host).to.equal(true);\n                  expect(res.body.data.players[0].team).to.equal(null);\n                  expect(res.body.data.players[0].role).to.equal(null);\n                  expect(res.body.data.players[0].ready).to.equal(false);\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # Create room\n\n          ## Purpose and preconditions\n\n          Creates a `WAITING` room, joins the authenticated creator, and makes that member host. The user must not already belong to any active room.\n\n          ## Request parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `X-Session-Id` | header | yes | string | active opaque token | no | Creating user | `sess_7Hk2mQ9vLc4R8pXa` |\n          | `Accept` | header | yes | string | `application/json` | no | Requested response media type | `application/json` |\n\n          There is no body: room capacity, passwords, timers, and custom boards are not contract features.\n\n          ## Response fields\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `data.room_id` | integer | yes | no | positive | New room ID |\n          | `data.status` | string enum | yes | no | `WAITING` | Initial lifecycle state |\n          | `data.host_user_id` | integer | yes | no | creator ID | Current host |\n          | `data.player_count` | integer | yes | no | `1` | Current membership count |\n          | `data.startable` | boolean | yes | no | `false` | Full start predicate result |\n          | `data.players[]` | array<object> | yes | no | one creator | Members in join order |\n          | `data.players[].user_id` | integer | yes | no | positive | Member ID |\n          | `data.players[].username` | string | yes | no | username rule | Member username |\n          | `data.players[].team` | enum or null | yes | yes | `RED`, `BLUE`, `null` | Temporary team |\n          | `data.players[].role` | enum or null | yes | yes | `SPYMASTER`, `OPERATIVE`, `null` | Temporary role |\n          | `data.players[].ready` | boolean | yes | no | `false` | Readiness |\n          | `data.players[].is_host` | boolean | yes | no | `true` | Host marker |\n          | `data.players[].joined_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Used for host transfer |\n          | `data.game` | object or null | yes | yes | `null` | No game before countdown completes |\n          | `data.created_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Room creation time |\n\n          ## State changes and events\n\n          Sets the user's `active_room_id`; no socket exists yet, so no event is required. The response snapshot is authoritative. The script stores `roomId`.\n\n          ## Errors\n\n          `401 UNAUTHORIZED`; `409 ALREADY_IN_ROOM`. Neither creates a room.\n        examples:\n          - name: Success - Newly created room\n            request:\n              url: '{{baseUrl}}/api/rooms'\n              method: POST\n              headers:\n                - name: X-Session-Id\n                  value: '{{sessionToken}}'\n            response:\n              status: 201\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"data\":{\"room_id\":1001,\"status\":\"WAITING\",\"host_user_id\":42,\"player_count\":1,\"startable\":false,\"players\":[{\"user_id\":42,\"username\":\"player_one\",\"team\":null,\"role\":null,\"ready\":false,\"is_host\":true,\"joined_at\":\"2026-09-10T08:41:00Z\"}],\"game\":null,\"created_at\":\"2026-09-10T08:41:00Z\"}}'\n          - name: Error - Already in room\n            request:\n              url: '{{baseUrl}}/api/rooms'\n              method: POST\n              headers:\n                - name: X-Session-Id\n                  value: '{{sessionToken}}'\n            response:\n              status: 409\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"error\":{\"code\":\"ALREADY_IN_ROOM\",\"message\":\"User 42 already belongs to active room 1001.\",\"details\":{\"room_id\":1001}}}'\n          - name: Error - Unauthorized\n            request:\n              url: '{{baseUrl}}/api/rooms'\n              method: POST\n            response:\n              status: 401\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"error\":{\"code\":\"UNAUTHORIZED\",\"message\":\"A valid active session is required.\",\"details\":{}}}'\n      - info:\n          name: Join room\n          type: http\n          seq: 2\n          tags:\n            - rooms\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/rooms/{{roomId}}/members'\n          headers:\n            - name: X-Session-Id\n              value: '{{sessionToken}}'\n            - name: Accept\n              value: application/json\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # Join room\n\n          ## Purpose and preconditions\n\n          Adds the authenticated user as an unconfigured member. The room must exist and be exactly `WAITING`; the user must have no active room. No body is accepted.\n\n          ## Request parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `room_id` | path | yes | integer | positive | no | Room to join | `1001` |\n          | `X-Session-Id` | header | yes | string | active opaque token | no | Joining user | `sess_A3redAgent9Kp` |\n          | `Accept` | header | yes | string | `application/json` | no | Requested response media type | `application/json` |\n\n          ## Response fields\n\n          `201 Created` returns `{data: room_snapshot}`. The new item has `team:null`, `role:null`, `ready:false`, `is_host:false`, and a UTC `joined_at`. `player_count` increments and `startable` is recomputed.\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `data.room_id` | integer | yes | no | positive | Joined room |\n          | `data.status` | string enum | yes | no | `WAITING` | Joinable lifecycle state |\n          | `data.host_user_id` | integer | yes | no | member ID | Current host |\n          | `data.player_count` | integer | yes | no | `>= 2` in this flow | Count after join |\n          | `data.startable` | boolean | yes | no | `false` | New member is unconfigured, so full predicate fails |\n          | `data.players[]` | array<object> | yes | no | members in join order | Membership snapshot |\n          | `data.players[].user_id` | integer | yes | no | positive | Member ID |\n          | `data.players[].username` | string | yes | no | username rule | Display name |\n          | `data.players[].team` | enum or null | yes | yes | `RED`, `BLUE`, `null` | Temporary team |\n          | `data.players[].role` | enum or null | yes | yes | `SPYMASTER`, `OPERATIVE`, `null` | Temporary role |\n          | `data.players[].ready` | boolean | yes | no | `true`, `false` | Current readiness |\n          | `data.players[].is_host` | boolean | yes | no | `true`, `false` | Host marker |\n          | `data.players[].joined_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Membership order |\n          | `data.game` | object or null | yes | yes | `null` on join | Game absent in `WAITING` |\n          | `data.created_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Room creation time |\n\n          ## State changes and emitted events\n\n          Sets `active_room_id`, emits `room.player.joined`, then emits a role-safe `room.state`. A join can never trigger countdown because the new unconfigured member makes the start predicate false.\n\n          ## Errors\n\n          | Status | Code | When | State change |\n          | --- | --- | --- | --- |\n          | `401` | `UNAUTHORIZED` | invalid session | none |\n          | `404` | `ROOM_NOT_FOUND` | room ID absent | none |\n          | `409` | `ROOM_NOT_JOINABLE` | state is `COUNTDOWN`, `IN_GAME`, `FINISHED`, or `CLOSED` | none |\n          | `409` | `ALREADY_IN_ROOM` | user already has active room, including this one | none |\n          | `422` | `VALIDATION_ERROR` | room ID is not positive integer | none |\n\n          ## Invariants\n\n          No capacity maximum is imposed. Joining is forbidden as soon as countdown begins.\n        examples:\n          - name: Success - Join empty-team room\n            request:\n              url: '{{baseUrl}}/api/rooms/1001/members'\n              method: POST\n              headers:\n                - name: X-Session-Id\n                  value: sess_A3redAgent9Kp\n            response:\n              status: 201\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"data\":{\"room_id\":1001,\"status\":\"WAITING\",\"host_user_id\":42,\"player_count\":2,\"startable\":false,\"players\":[{\"user_id\":42,\"username\":\"player_one\",\"team\":null,\"role\":null,\"ready\":false,\"is_host\":true,\"joined_at\":\"2026-09-10T08:41:00Z\"},{\"user_id\":43,\"username\":\"red_agent\",\"team\":null,\"role\":null,\"ready\":false,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:20Z\"}],\"game\":null,\"created_at\":\"2026-09-10T08:41:00Z\"}}'\n          - name: Success - Fifth player joins\n            request:\n              url: '{{baseUrl}}/api/rooms/1001/members'\n              method: POST\n              headers:\n                - name: X-Session-Id\n                  value: sess_extraRed46\n            response:\n              status: 201\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"data\":{\"room_id\":1001,\"status\":\"WAITING\",\"host_user_id\":42,\"player_count\":5,\"startable\":false,\"players\":[{\"user_id\":42,\"username\":\"player_one\",\"team\":\"RED\",\"role\":\"SPYMASTER\",\"ready\":false,\"is_host\":true,\"joined_at\":\"2026-09-10T08:41:00Z\"},{\"user_id\":43,\"username\":\"red_agent\",\"team\":\"RED\",\"role\":\"OPERATIVE\",\"ready\":false,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:20Z\"},{\"user_id\":44,\"username\":\"blue_master\",\"team\":\"BLUE\",\"role\":\"SPYMASTER\",\"ready\":false,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:30Z\"},{\"user_id\":45,\"username\":\"blue_agent\",\"team\":\"BLUE\",\"role\":\"OPERATIVE\",\"ready\":false,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:40Z\"},{\"user_id\":46,\"username\":\"extra_red\",\"team\":null,\"role\":null,\"ready\":false,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:50Z\"}],\"game\":null,\"created_at\":\"2026-09-10T08:41:00Z\"}}'\n          - name: Error - Room not found\n            request:\n              url: '{{baseUrl}}/api/rooms/9999/members'\n              method: POST\n              headers:\n                - name: X-Session-Id\n                  value: sess_A3redAgent9Kp\n            response:\n              status: 404\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"error\":{\"code\":\"ROOM_NOT_FOUND\",\"message\":\"Room 9999 was not found.\",\"details\":{\"room_id\":9999}}}'\n          - name: Error - Countdown already started\n            request:\n              url: '{{baseUrl}}/api/rooms/1001/members'\n              method: POST\n              headers:\n                - name: X-Session-Id\n                  value: sess_extraRed46\n            response:\n              status: 409\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"error\":{\"code\":\"ROOM_NOT_JOINABLE\",\"message\":\"Room 1001 is not joinable while status is COUNTDOWN.\",\"details\":{\"room_id\":1001,\"status\":\"COUNTDOWN\"}}}'\n          - name: Error - Already in another room\n            request:\n              url: '{{baseUrl}}/api/rooms/1001/members'\n              method: POST\n              headers:\n                - name: X-Session-Id\n                  value: sess_extraRed46\n            response:\n              status: 409\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"error\":{\"code\":\"ALREADY_IN_ROOM\",\"message\":\"User 46 already belongs to active room 1002.\",\"details\":{\"room_id\":1002}}}'\n      - info:\n          name: Get room snapshot\n          type: http\n          seq: 3\n          tags:\n            - rooms\n            - snapshot\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/rooms/{{roomId}}'\n          headers:\n            - name: X-Session-Id\n              value: '{{sessionToken}}'\n            - name: Accept\n              value: application/json\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                test(\"returns canonical room vocabulary\", function () {\n                  expect(res.status).to.equal(200);\n                  expect([\"WAITING\", \"COUNTDOWN\", \"IN_GAME\", \"FINISHED\", \"CLOSED\"]).to.include(res.body.data.status);\n                  expect(res.body.data.room_id).to.equal(Number(bru.getVar(\"roomId\")));\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # Get room snapshot\n\n          ## Purpose\n\n          Returns the server-authoritative, recipient-specific room and optional game state. It is used after navigation or reconnect recovery; realtime changes continue over WebSocket.\n\n          ## Preconditions and request parameters\n\n          The room must exist and the authenticated user must be a current member.\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `room_id` | path | yes | integer | positive | no | Requested room | `1001` |\n          | `X-Session-Id` | header | yes | string | active opaque token | no | Determines access and projection | `sess_A3redAgent9Kp` |\n          | `Accept` | header | yes | string | `application/json` | no | Requested response media type | `application/json` |\n\n          ## Room response fields\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `data.room_id` | integer | yes | no | positive | Room ID shared with WebSocket |\n          | `data.status` | string enum | yes | no | `WAITING`, `COUNTDOWN`, `IN_GAME`, `FINISHED`, `CLOSED` | Lifecycle state |\n          | `data.host_user_id` | integer | yes | no | member user ID | Host; deterministic after transfer |\n          | `data.player_count` | integer | yes | no | `>= 1` for accessible room | Current members |\n          | `data.startable` | boolean | yes | no | `true`, `false` | Complete start predicate, not merely all-ready |\n          | `data.countdown.seconds_remaining` | integer | conditional | no | `0..3` | Present only in `COUNTDOWN` |\n          | `data.players[]` | array<object> | yes | no | one or more | Members in join order |\n          | `data.players[].user_id` | integer | yes | no | positive | Member ID |\n          | `data.players[].username` | string | yes | no | username rule | Username |\n          | `data.players[].team` | enum or null | yes | yes | `RED`, `BLUE`, `null` | Temporary team; null until selected |\n          | `data.players[].role` | enum or null | yes | yes | `SPYMASTER`, `OPERATIVE`, `null` | Temporary role; null until selected |\n          | `data.players[].ready` | boolean | yes | no | `true`, `false` | Confirms current selections; selection change resets false |\n          | `data.players[].is_host` | boolean | yes | no | `true`, `false` | Exactly one true in non-empty room |\n          | `data.players[].joined_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Membership order |\n          | `data.game` | object or null | yes | yes | game object or `null` | Non-null in `IN_GAME` and `FINISHED` |\n          | `data.created_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Room creation time |\n\n          ## Game response fields\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `data.game.game_id` | integer | yes when game exists | no | positive | Match ID |\n          | `data.game.starting_team` | enum | yes | no | `RED`, `BLUE` | Team owning 9 cards and first clue |\n          | `data.game.current_turn.team` | enum | yes | no | `RED`, `BLUE` | Active team |\n          | `data.game.current_turn.phase` | enum | yes | no | `WAITING_FOR_CLUE`, `GUESSING`, `GAME_OVER` | Round phase |\n          | `data.game.current_turn.clue.word` | string | conditional | no | normalized one word, `1..30` chars | Present in `GUESSING`; final clue may remain in `GAME_OVER` |\n          | `data.game.current_turn.clue.number` | integer | conditional | no | `1..9` | Clue number `N` |\n          | `data.game.current_turn.guesses_remaining` | integer or null | yes | yes | `0..10`, or `null` | `N+1` at clue acceptance; null while waiting for clue |\n          | `data.game.score.red` | integer | yes | no | `0..9` | Revealed RED cards |\n          | `data.game.score.blue` | integer | yes | no | `0..8` | Revealed BLUE cards |\n          | `data.game.board[]` | array<object> | yes | no | exactly 25 unique cards | Fixed board order |\n          | `data.game.board[].card_id` | integer | yes | no | `1..25` unique | Card identifier |\n          | `data.game.board[].word` | string | yes | no | fixture word | Visible to both roles |\n          | `data.game.board[].revealed` | boolean | yes | no | `true`, `false` | Reveal state |\n          | `data.game.board[].color` | enum or null | yes | yes | `RED`, `BLUE`, `NEUTRAL`, `ASSASSIN`, `null` | Null only for unrevealed cards hidden from an Operative; Spymasters always receive color |\n          | `data.game.winner` | enum or null | yes | yes | `RED`, `BLUE`, `null` | Non-null only after terminal result |\n          | `data.game.end_reason` | enum or null | yes | yes | `ALL_TEAM_CARDS_REVEALED`, `ASSASSIN_REVEALED`, `null` | Terminal cause |\n          | `data.game.started_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Board creation/start time |\n          | `data.game.finished_at` | `string<date-time>` or null | yes | yes | ISO 8601 UTC or `null` | Terminal time |\n\n          ## State changes and events\n\n          Read-only and emits nothing. It does not advance countdown or turn state.\n\n          ## Errors and privacy invariant\n\n          `401 UNAUTHORIZED`, `404 ROOM_NOT_FOUND`, `403 NOT_ROOM_MEMBER`, `422 VALIDATION_ERROR`. Errors reveal no room state. The server projects every card for the authenticated viewer; an Operative never receives an unrevealed affiliation.\n        examples:\n          - name: Newly created room\n            request:\n              url: '{{baseUrl}}/api/rooms/1001'\n              method: GET\n              headers:\n                - name: X-Session-Id\n                  value: sess_7Hk2mQ9vLc4R8pXa\n            response:\n              status: 200\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"data\":{\"room_id\":1001,\"status\":\"WAITING\",\"host_user_id\":42,\"player_count\":1,\"startable\":false,\"players\":[{\"user_id\":42,\"username\":\"player_one\",\"team\":null,\"role\":null,\"ready\":false,\"is_host\":true,\"joined_at\":\"2026-09-10T08:41:00Z\"}],\"game\":null,\"created_at\":\"2026-09-10T08:41:00Z\"}}'\n          - name: Four joined - Not configured\n            request:\n              url: '{{baseUrl}}/api/rooms/1001'\n              method: GET\n              headers:\n                - name: X-Session-Id\n                  value: sess_7Hk2mQ9vLc4R8pXa\n            response:\n              status: 200\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"data\":{\"room_id\":1001,\"status\":\"WAITING\",\"host_user_id\":42,\"player_count\":4,\"startable\":false,\"players\":[{\"user_id\":42,\"username\":\"player_one\",\"team\":null,\"role\":null,\"ready\":false,\"is_host\":true,\"joined_at\":\"2026-09-10T08:41:00Z\"},{\"user_id\":43,\"username\":\"red_agent\",\"team\":null,\"role\":null,\"ready\":false,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:20Z\"},{\"user_id\":44,\"username\":\"blue_master\",\"team\":null,\"role\":null,\"ready\":false,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:30Z\"},{\"user_id\":45,\"username\":\"blue_agent\",\"team\":null,\"role\":null,\"ready\":false,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:40Z\"}],\"game\":null,\"created_at\":\"2026-09-10T08:41:00Z\"}}'\n          - name: Teams selected - Roles incomplete\n            request:\n              url: '{{baseUrl}}/api/rooms/1001'\n              method: GET\n              headers:\n                - name: X-Session-Id\n                  value: sess_7Hk2mQ9vLc4R8pXa\n            response:\n              status: 200\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"data\":{\"room_id\":1001,\"status\":\"WAITING\",\"host_user_id\":42,\"player_count\":4,\"startable\":false,\"players\":[{\"user_id\":42,\"username\":\"player_one\",\"team\":\"RED\",\"role\":\"SPYMASTER\",\"ready\":false,\"is_host\":true,\"joined_at\":\"2026-09-10T08:41:00Z\"},{\"user_id\":43,\"username\":\"red_agent\",\"team\":\"RED\",\"role\":null,\"ready\":false,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:20Z\"},{\"user_id\":44,\"username\":\"blue_master\",\"team\":\"BLUE\",\"role\":\"SPYMASTER\",\"ready\":false,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:30Z\"},{\"user_id\":45,\"username\":\"blue_agent\",\"team\":\"BLUE\",\"role\":null,\"ready\":false,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:40Z\"}],\"game\":null,\"created_at\":\"2026-09-10T08:41:00Z\"}}'\n          - name: Roles valid - Players not ready\n            request:\n              url: '{{baseUrl}}/api/rooms/1001'\n              method: GET\n              headers:\n                - name: X-Session-Id\n                  value: sess_7Hk2mQ9vLc4R8pXa\n            response:\n              status: 200\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"data\":{\"room_id\":1001,\"status\":\"WAITING\",\"host_user_id\":42,\"player_count\":4,\"startable\":false,\"players\":[{\"user_id\":42,\"username\":\"player_one\",\"team\":\"RED\",\"role\":\"SPYMASTER\",\"ready\":true,\"is_host\":true,\"joined_at\":\"2026-09-10T08:41:00Z\"},{\"user_id\":43,\"username\":\"red_agent\",\"team\":\"RED\",\"role\":\"OPERATIVE\",\"ready\":true,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:20Z\"},{\"user_id\":44,\"username\":\"blue_master\",\"team\":\"BLUE\",\"role\":\"SPYMASTER\",\"ready\":true,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:30Z\"},{\"user_id\":45,\"username\":\"blue_agent\",\"team\":\"BLUE\",\"role\":\"OPERATIVE\",\"ready\":false,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:40Z\"}],\"game\":null,\"created_at\":\"2026-09-10T08:41:00Z\"}}'\n          - name: In game - Operative projection\n            request:\n              url: '{{baseUrl}}/api/rooms/1001'\n              method: GET\n              headers:\n                - name: X-Session-Id\n                  value: sess_A3redAgent9Kp\n            response:\n              status: 200\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"data\": {\n                      \"room_id\": 1001,\n                      \"status\": \"IN_GAME\",\n                      \"host_user_id\": 42,\n                      \"player_count\": 4,\n                      \"startable\": false,\n                      \"players\": [\n                        {\"user_id\":42,\"username\":\"player_one\",\"team\":\"RED\",\"role\":\"SPYMASTER\",\"ready\":true,\"is_host\":true,\"joined_at\":\"2026-09-10T08:41:00Z\"},\n                        {\"user_id\":43,\"username\":\"red_agent\",\"team\":\"RED\",\"role\":\"OPERATIVE\",\"ready\":true,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:20Z\"},\n                        {\"user_id\":44,\"username\":\"blue_master\",\"team\":\"BLUE\",\"role\":\"SPYMASTER\",\"ready\":true,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:30Z\"},\n                        {\"user_id\":45,\"username\":\"blue_agent\",\"team\":\"BLUE\",\"role\":\"OPERATIVE\",\"ready\":true,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:40Z\"}\n                      ],\n                      \"game\": {\n                        \"game_id\": 5001,\n                        \"starting_team\": \"RED\",\n                        \"current_turn\": {\"team\":\"RED\",\"phase\":\"WAITING_FOR_CLUE\",\"clue\":null,\"guesses_remaining\":null},\n                        \"score\": {\"red\":0,\"blue\":0},\n                        \"board\": [\n                          {\"card_id\":1,\"word\":\"MOON\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":2,\"word\":\"APPLE\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":3,\"word\":\"TRAIN\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":4,\"word\":\"BRIDGE\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":5,\"word\":\"OCEAN\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":6,\"word\":\"KING\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":7,\"word\":\"LASER\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":8,\"word\":\"FOREST\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":9,\"word\":\"DOCTOR\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":10,\"word\":\"GLASS\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":11,\"word\":\"DRAGON\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":12,\"word\":\"TABLE\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":13,\"word\":\"SATURN\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":14,\"word\":\"SNOW\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":15,\"word\":\"PIANO\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":16,\"word\":\"HEART\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":17,\"word\":\"ROME\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":18,\"word\":\"WHALE\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":19,\"word\":\"ROBOT\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":20,\"word\":\"CROWN\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":21,\"word\":\"DESERT\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":22,\"word\":\"SCREEN\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":23,\"word\":\"MOUSE\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":24,\"word\":\"KNIFE\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":25,\"word\":\"CLOUD\",\"revealed\":false,\"color\":null}\n                        ],\n                        \"winner\": null,\n                        \"end_reason\": null,\n                        \"started_at\": \"2026-09-10T08:43:15Z\",\n                        \"finished_at\": null\n                      },\n                      \"created_at\": \"2026-09-10T08:41:00Z\"\n                    }\n                  }\n          - name: Error - Room not found\n            request:\n              url: '{{baseUrl}}/api/rooms/9999'\n              method: GET\n              headers:\n                - name: X-Session-Id\n                  value: '{{sessionToken}}'\n            response:\n              status: 404\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"error\":{\"code\":\"ROOM_NOT_FOUND\",\"message\":\"Room 9999 was not found.\",\"details\":{\"room_id\":9999}}}'\n          - name: Error - Not a member\n            request:\n              url: '{{baseUrl}}/api/rooms/1001'\n              method: GET\n              headers:\n                - name: X-Session-Id\n                  value: sess_outsider47\n            response:\n              status: 403\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"error\":{\"code\":\"NOT_ROOM_MEMBER\",\"message\":\"User 47 is not a member of room 1001.\",\"details\":{\"room_id\":1001,\"user_id\":47}}}'\n      - info:\n          name: Leave room\n          type: http\n          seq: 4\n          tags:\n            - rooms\n        http:\n          method: DELETE\n          url: '{{baseUrl}}/api/rooms/{{roomId}}/members/me'\n          headers:\n            - name: X-Session-Id\n              value: '{{sessionToken}}'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # Leave room\n\n          ## Purpose and preconditions\n\n          Removes the authenticated member during `WAITING`, `COUNTDOWN`, or `FINISHED`. Leaving an active `IN_GAME` match is rejected; transport disconnect is not a leave.\n\n          ## Request parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `room_id` | path | yes | integer | positive | no | Room to leave | `1001` |\n          | `X-Session-Id` | header | yes | string | active opaque token | no | Departing member | `sess_A3redAgent9Kp` |\n\n          ## Success and state changes\n\n          `204 No Content` clears the user's active room. It emits `room.player.left` and a new `room.state` to remaining members. During `COUNTDOWN`, removal first cancels countdown and returns to `WAITING`. If the host leaves, host becomes the remaining member with the earliest `joined_at`; if none remain, status becomes `CLOSED`.\n\n          ## Errors\n\n          `401 UNAUTHORIZED`, `404 ROOM_NOT_FOUND`, `403 NOT_ROOM_MEMBER`, and `409 INVALID_ROOM_STATE` for `IN_GAME`. Errors do not change membership.\n        examples:\n          - name: Success - Member leaves waiting room\n            request:\n              url: '{{baseUrl}}/api/rooms/1001/members/me'\n              method: DELETE\n              headers:\n                - name: X-Session-Id\n                  value: sess_A3redAgent9Kp\n            response:\n              status: 204\n              body:\n                type: text\n                data: ''\n          - name: Success - Host leaves and ownership transfers\n            request:\n              url: '{{baseUrl}}/api/rooms/1001/members/me'\n              method: DELETE\n              headers:\n                - name: X-Session-Id\n                  value: sess_7Hk2mQ9vLc4R8pXa\n            response:\n              status: 204\n              body:\n                type: text\n                data: ''\n          - name: Error - Not a room member\n            request:\n              url: '{{baseUrl}}/api/rooms/1001/members/me'\n              method: DELETE\n              headers:\n                - name: X-Session-Id\n                  value: sess_outsider47\n            response:\n              status: 403\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"error\":{\"code\":\"NOT_ROOM_MEMBER\",\"message\":\"User 47 is not a member of room 1001.\",\"details\":{\"room_id\":1001,\"user_id\":47}}}'\n          - name: Error - Game in progress\n            request:\n              url: '{{baseUrl}}/api/rooms/1001/members/me'\n              method: DELETE\n              headers:\n                - name: X-Session-Id\n                  value: sess_A3redAgent9Kp\n            response:\n              status: 409\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"error\":{\"code\":\"INVALID_ROOM_STATE\",\"message\":\"Room 1001 cannot be left while status is IN_GAME.\",\"details\":{\"room_id\":1001,\"status\":\"IN_GAME\"}}}'\n  - info:\n      name: 04 - Error & State Examples\n      type: folder\n      seq: 4\n    docs:\n      content: |-\n        # Error and state examples\n\n        Cross-endpoint REST taxonomy and canonical room lifecycle index. Endpoint files remain authoritative for applicability; this folder prevents unrelated errors from being attached to every request.\n\n        ## Error envelope\n\n        ```json\n        {\"error\":{\"code\":\"ROOM_NOT_FOUND\",\"message\":\"Room 9999 was not found.\",\"details\":{\"room_id\":9999}}}\n        ```\n\n        | HTTP | Code | Concrete message example | Applicable operations |\n        | ---: | --- | --- | --- |\n        | `422` | `INVALID_USERNAME` | `Username must match ^[A-Za-z0-9_]{3,20}$.` | register |\n        | `409` | `USERNAME_TAKEN` | `Username 'player_one' is already registered.` | register |\n        | `401` | `UNAUTHORIZED` | `A valid active session is required.` | every protected endpoint |\n        | `404` | `USER_NOT_FOUND` | `User 9999 was not found.` | public profile |\n        | `404` | `ROOM_NOT_FOUND` | `Room 9999 was not found.` | join, get, leave |\n        | `409` | `ROOM_NOT_JOINABLE` | `Room 1001 is not joinable while status is COUNTDOWN.` | join |\n        | `409` | `ALREADY_IN_ROOM` | `User 46 already belongs to active room 1002.` | create, join |\n        | `403` | `NOT_ROOM_MEMBER` | `User 47 is not a member of room 1001.` | get, leave |\n        | `409` | `INVALID_ROOM_STATE` | `Room 1001 cannot be left while status is IN_GAME.` | leave |\n        | `400` or `422` | `VALIDATION_ERROR` | `user_id must be a positive integer.` | malformed JSON or field/path validation |\n        | `429` | `RATE_LIMITED` | `Too many registration attempts; retry after 60 seconds.` | throttled operation |\n\n        Malformed JSON uses `400 VALIDATION_ERROR`; syntactically valid values that fail field constraints use `422 VALIDATION_ERROR`, except the more specific `INVALID_USERNAME`. Every error keeps state unchanged.\n\n        ## State example index\n\n        `Get room snapshot` contains new, four-player unconfigured, incomplete-role, valid-role/unready, full `IN_GAME` Operative, missing-room, and forbidden-access examples. WebSocket scenario docs contain all-ready, countdown, cancellation, Spymaster `IN_GAME`, every reveal branch, and finished state.\n      type: text/markdown\n  - info:\n      name: 00 - Contract & Health\n      type: folder\n    docs:\n      content: |-\n        # Contract and health\n\n        Service-level metadata and a non-authenticated health check. Health confirms process availability and contract version only; it does not prove database, room, or realtime gameplay correctness.\n      type: text/markdown\n    items:\n      - info:\n          name: Health and contract version\n          type: http\n          seq: 1\n          tags:\n            - contract\n            - health\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/health'\n          headers:\n            - name: Accept\n              value: application/json\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                test(\"returns the draft contract version\", function () {\n                  expect(res.status).to.equal(200);\n                  expect(res.body.data.status).to.equal(\"OK\");\n                  expect(res.body.data.contract_version).to.equal(\"2.0.0-draft\");\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # Health and contract version\n\n          ## Purpose\n\n          Confirms that the HTTP process is reachable and declares the API contract version it serves. This endpoint is not an end-to-end gameplay readiness probe.\n\n          ## Preconditions and request\n\n          No session or request body is required.\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | --- | --- | --- | --- | --- | --- |\n          | `Accept` | header | yes | string | `application/json` | no | Requested response media type | `application/json` |\n\n          ## Success and response fields\n\n          `200 OK` uses the normal success envelope.\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `data.status` | string enum | yes | no | `OK` | Process is serving requests |\n          | `data.contract_version` | string | yes | no | `2.0.0-draft` | Implemented contract revision |\n          | `data.server_time` | `string<date-time>` | yes | no | ISO 8601 UTC | Server clock at response creation |\n\n          ## State changes and events\n\n          None. No WebSocket event is emitted.\n\n          ## Errors and invariants\n\n          Infrastructure may return `503 Service Unavailable` with `SERVICE_UNAVAILABLE`; application authentication errors do not apply. A successful response does not assert that persistence or WebSocket subsystems are healthy.\n        examples:\n          - name: Success - Service available\n            request:\n              url: '{{baseUrl}}/api/health'\n              method: GET\n              headers:\n                - name: Accept\n                  value: application/json\n            response:\n              status: 200\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"data\":{\"status\":\"OK\",\"contract_version\":\"2.0.0-draft\",\"server_time\":\"2026-09-10T08:40:00Z\"}}'\n          - name: Error - Service unavailable\n            request:\n              url: '{{baseUrl}}/api/health'\n              method: GET\n              headers:\n                - name: Accept\n                  value: application/json\n            response:\n              status: 503\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"error\":{\"code\":\"SERVICE_UNAVAILABLE\",\"message\":\"The API is temporarily unavailable.\",\"details\":{}}}'\ndocs:\n  content: |-\n    # ft_transcendence REST API\n\n    ## Transport and session\n\n    Base URL: `{{baseUrl}}` (`http://localhost:3000` locally). JSON requests send `Content-Type: application/json`; JSON responses send the same media type. Protected endpoints require `X-Session-Id: {{sessionToken}}`, an opaque token created by username registration. Tokens are never URL parameters.\n\n    ## Response envelopes\n\n    Every non-empty success is `{ \"data\": value }`. `204 No Content` has no body. Every error is `{ \"error\": { \"code\": string, \"message\": string, \"details\": object } }`; `details` is always an object and may be empty.\n\n    ## Endpoint matrix\n\n    | Method | Path | Purpose | Auth | Main requirement |\n    | --- | --- | --- | --- | --- |\n    | `GET` | `/api/health` | Contract/service health | no | none |\n    | `POST` | `/api/auth/register` | Create username and session | no | valid unique username |\n    | `GET` | `/api/auth/session` | Read current session identity | yes | active session |\n    | `DELETE` | `/api/auth/session` | Revoke current session | yes | active session |\n    | `GET` | `/api/users/me` | Own persistent profile | yes | active session |\n    | `GET` | `/api/users/{user_id}` | Public persistent profile | yes | user exists |\n    | `POST` | `/api/rooms` | Create and host a room | yes | not in active room |\n    | `POST` | `/api/rooms/{room_id}/members` | Join a room | yes | `WAITING`, not in active room |\n    | `GET` | `/api/rooms/{room_id}` | Role-safe room/game snapshot | yes | room member |\n    | `DELETE` | `/api/rooms/{room_id}/members/me` | Leave room | yes | room member; not `IN_GAME` |\n\n    ## Status conventions\n\n    `200` reads/updates; `201` creation/join; `204` session deletion or leave; `400` malformed syntax; `401` authentication; `403` access; `404` missing entity; `409` uniqueness/lifecycle conflict; `422` field validation; `429` throttling.\n\n    ## Domain and lifetime\n\n    IDs are positive integers, timestamps are ISO 8601 UTC, JSON is snake_case, and enums are UPPER_SNAKE_CASE. Profiles expose persistent wins, losses, level, and match history. Room team, role, readiness, board, clue, turn, and score are temporary. `room_id` always names the same integer domain value used by WebSocket.\n\n    ## REST/WebSocket boundary\n\n    REST bootstraps identity and membership and returns recoverable snapshots. Team/role/readiness and gameplay mutations are WebSocket-only. The REST room snapshot is server-authoritative and recipient-specific: an Operative never receives unrevealed card colors.\n\n    ## Example index\n\n    - Minimum and invalid waiting rooms: `03 - Rooms/Get room snapshot`\n    - Joinability and membership failures: `03 - Rooms/Join room`\n    - Complete started-game Operative projection: `03 - Rooms/Get room snapshot`\n    - Countdown and both role projections: WebSocket `07 - Full State Scenarios`\n    - Clue and all reveal outcomes: WebSocket `04 - Game`\n\n    ## Environment\n\n    Select `local`. Registration stores `sessionToken` and `userId`; room creation stores `roomId`. The canonical fixtures use users `42` through `47`, room `1001`, and game `5001`.\n  type: text/markdown\nbundled: true\nextensions:\n  bruno:\n    exportedAt: '2026-09-10T09:53:07.226Z'\n    exportedUsing: Bruno/4.1.0\n";
