    <script>
        const collectionData = "opencollection: 1.0.0\ninfo:\n  name: REST API\n  version: 1.1.0-dev\nconfig:\n  proxy:\n    inherit: true\n    config:\n      protocol: http\n      hostname: ''\n      port: ''\n      auth:\n        username: ''\n        password: ''\n      bypassProxy: ''\nitems:\n  - info:\n      name: 01 - Identity\n      type: folder\n      seq: 1\n    docs:\n      content: |-\n        # Identity\n\n        Registered-account identity: email + username + password (subject Ch. III\u2013IV, mandatory). This contract defines email + password authentication only, and every identity is a registered account \u2014 there is no anonymous identity. Email is the login identifier; username is the public display name. Both are trimmed and case-insensitively unique; password is hashed + salted server-side and never returned or logged.\n\n        Registration and login each issue a two-cookie session pair \u2014 a JWT access credential plus a refresh credential, both carried as cookies: `ft_session` (HttpOnly, `Secure`, `SameSite=Lax`, `Path=/`, short-lived JWT access credential) and `ft_refresh` (HttpOnly, `Secure`, `SameSite=Lax`, `Path=/api/auth/refresh`, long-lived opaque refresh credential, single-use/rotated). No token value is ever returned in a JSON response body, and there is no `X-Session-Id` header or any other credential path \u2014 every client, browser or non-browser, authenticates through these two cookies. Bruno uses its cookie jar the same way a browser does.\n\n        `POST /api/auth/refresh` reads `ft_refresh` only, rotates it, and reissues both cookies without forcing the user to log in again. `DELETE /api/auth/session` (logout) revokes both credentials and clears both cookies, regardless of room membership \u2014 if the user is `IN_GAME`, it forfeits that match first (see `workspace.yml`, Room Abandonment). Neither endpoint deletes the user or their statistics. Full model, including expiry/revocation semantics and refresh-token-reuse detection: `workspace.yml`, Session and Credential Model.\n      type: text/markdown\n    items:\n      - info:\n          name: Register account\n          type: http\n          seq: 1\n          tags:\n            - identity\n            - smoke\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/auth/register'\n          headers:\n            - name: Content-Type\n              value: application/json\n            - name: Accept\n              value: application/json\n          body:\n            type: json\n            data: |-\n              {\n                \"email\": \"player.one@example.com\",\n                \"username\": \"player_one\",\n                \"password\": \"Correct-Horse-1\"\n              }\n        runtime:\n          scripts:\n            - type: after-response\n              code: |-\n                if (res.status === 201 && res.body && res.body.data) {\n                  bru.setVar(\"userId\", String(res.body.data.user.user_id));\n                }\n            - type: tests\n              code: |-\n                test(\"creates a registered user and sets session cookies\", function () {\n                  expect(res.status).to.equal(201);\n                  expect(res.body.data.user.email).to.equal(\"player.one@example.com\");\n                  expect(res.body.data.access_token_expires_at).to.be.a(\"string\");\n                  expect(res.body.data).to.not.have.property(\"access_token\");\n                  expect(res.body.data).to.not.have.property(\"refresh_token\");\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # Register account\n\n          ## Purpose\n\n          Mandatory registered-account creation (subject Ch. III\u2013IV: email + password auth, hashed + salted at rest). Creates one persistent user and one authenticated session pair. This is the only account-creation path \u2014 there is no separate guest/anonymous identity in this contract.\n\n          ## Preconditions\n\n          The client has no authenticated identity. Email must be unique (case-insensitive). Username must be unique (case-insensitive).\n\n          ## Request parameters\n\n          | Parameter | Location | Required | Type | Allowed values/range | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `Content-Type` | header | yes | string | `application/json` | no | JSON request media type | `application/json` |\n          | `Accept` | header | yes | string | `application/json` | no | Requested response media type | `application/json` |\n          | `email` | body | yes | string | valid email, trimmed, case-insensitive uniqueness | no | Login identifier | `player.one@example.com` |\n          | `username` | body | yes | string | trimmed `^[A-Za-z0-9_]{3,20}$`, case-insensitive uniqueness | no | Public display name | `player_one` |\n          | `password` | body | yes | string | `>= 8` and `<= 72` bytes (bcrypt input limit) | no | Hashed + salted server-side, never returned | `Correct-Horse-1` |\n\n          ## Success behavior and response fields\n\n          `201 Created` creates the user and one session pair in the same transaction. The response sets two cookies and returns no token value in the body (Session and Credential Model, `workspace.yml`): `ft_session` (HttpOnly, `Secure`, `SameSite=Lax`, `Path=/`, short-lived JWT access credential) and `ft_refresh` (HttpOnly, `Secure`, `SameSite=Lax`, `Path=/api/auth/refresh`, long-lived opaque refresh credential). Both are sent automatically by a browser on subsequent REST calls and the WebSocket upgrade \u2014 there is no `X-Session-Id` header and no token value in JSON for any client, browser or non-browser; Bruno authenticates through its cookie jar exactly like a browser.\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `data.user.user_id` | integer | yes | no | positive | Stable user identifier |\n          | `data.user.username` | string | yes | no | username rule | Display username |\n          | `data.user.email` | string | yes | no | valid email | Login identifier |\n          | `data.user.created_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Account creation time |\n          | `data.access_token_expires_at` | `string<date-time>` | yes | no | ISO 8601 UTC | `ft_session` expiry, for client-side UX timers only \u2014 the token itself is never in this body |\n\n          ## State changes and events\n\n          A user and session pair are persisted. No room membership is created and no WebSocket event is emitted.\n\n          ## Errors\n\n          | Status | Code | When | State change |\n          | --- | --- | --- | --- |\n          | `400` | `VALIDATION_ERROR` | malformed JSON or unexpected structure | none |\n          | `422` | `INVALID_EMAIL` | missing or malformed email | none |\n          | `422` | `INVALID_USERNAME` | missing, wrong type, length, or characters | none |\n          | `422` | `INVALID_PASSWORD` | missing, under minimum length, or over the 72-byte hashing limit | none |\n          | `409` | `EMAIL_TAKEN` | case-insensitive email already exists | none |\n          | `409` | `USERNAME_TAKEN` | case-insensitive username already exists | none |\n          | `429` | `RATE_LIMITED` | registration limit exceeded | none |\n\n          ## Notes/invariants\n\n          The password is never returned or logged. A duplicate transmission cannot claim an existing email or username. `ft_refresh` is scoped to `Path=/api/auth/refresh`, so the browser never sends it on any other request \u2014 it exists solely for the Refresh endpoint to read.\n        examples:\n          - name: Success - player_one\n            request:\n              url: '{{baseUrl}}/api/auth/register'\n              method: POST\n              headers:\n                - name: Content-Type\n                  value: application/json\n                - name: Accept\n                  value: application/json\n            response:\n              status: 201\n              headers:\n                - name: Content-Type\n                  value: application/json\n                - name: Set-Cookie\n                  value: ft_session=eyJhbGciOiJIUzI1NiJ9...; HttpOnly; Secure; SameSite=Lax; Path=/\n                - name: Set-Cookie\n                  value: ft_refresh=rtok_7Hk2mQ9vLc4R8pXaZq; HttpOnly; Secure; SameSite=Lax; Path=/api/auth/refresh\n              body:\n                type: json\n                data: |-\n                  {\n                    \"data\": {\n                      \"user\": {\n                        \"user_id\": 42,\n                        \"username\": \"player_one\",\n                        \"email\": \"player.one@example.com\",\n                        \"created_at\": \"2026-09-10T08:40:01Z\"\n                      },\n                      \"access_token_expires_at\": \"2026-09-10T09:10:01Z\"\n                    }\n                  }\n          - name: Error - Invalid email\n            request:\n              url: '{{baseUrl}}/api/auth/register'\n              method: POST\n              headers:\n                - name: Content-Type\n                  value: application/json\n            response:\n              status: 422\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"error\": {\n                      \"code\": \"INVALID_EMAIL\",\n                      \"message\": \"email must be a valid email address.\",\n                      \"details\": {\n                        \"field\": \"email\"\n                      }\n                    }\n                  }\n          - name: Error - Password too short\n            request:\n              url: '{{baseUrl}}/api/auth/register'\n              method: POST\n              headers:\n                - name: Content-Type\n                  value: application/json\n            response:\n              status: 422\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"error\": {\n                      \"code\": \"INVALID_PASSWORD\",\n                      \"message\": \"password must be at least 8 characters.\",\n                      \"details\": {\n                        \"field\": \"password\",\n                        \"min_length\": 8\n                      }\n                    }\n                  }\n          - name: Error - Email already exists\n            request:\n              url: '{{baseUrl}}/api/auth/register'\n              method: POST\n              headers:\n                - name: Content-Type\n                  value: application/json\n            response:\n              status: 409\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"error\": {\n                      \"code\": \"EMAIL_TAKEN\",\n                      \"message\": \"Email 'PLAYER.ONE@example.com' is already registered.\",\n                      \"details\": {\n                        \"field\": \"email\"\n                      }\n                    }\n                  }\n          - name: Error - Username already exists\n            request:\n              url: '{{baseUrl}}/api/auth/register'\n              method: POST\n              headers:\n                - name: Content-Type\n                  value: application/json\n            response:\n              status: 409\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"error\": {\n                      \"code\": \"USERNAME_TAKEN\",\n                      \"message\": \"Username 'PLAYER_ONE' is already registered.\",\n                      \"details\": {\n                        \"field\": \"username\"\n                      }\n                    }\n                  }\n      - info:\n          name: Login\n          type: http\n          seq: 2\n          tags:\n            - identity\n            - smoke\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/auth/login'\n          headers:\n            - name: Content-Type\n              value: application/json\n            - name: Accept\n              value: application/json\n          body:\n            type: json\n            data: |-\n              {\n                \"email\": \"player.one@example.com\",\n                \"password\": \"Correct-Horse-1\"\n              }\n        runtime:\n          scripts:\n            - type: after-response\n              code: |-\n                if (res.status === 200 && res.body && res.body.data) {\n                  bru.setVar(\"userId\", String(res.body.data.user.user_id));\n                }\n            - type: tests\n              code: |-\n                test(\"logs in a registered user and sets session cookies\", function () {\n                  expect(res.status).to.equal(200);\n                  expect(res.body.data.access_token_expires_at).to.be.a(\"string\");\n                  expect(res.body.data).to.not.have.property(\"access_token\");\n                  expect(res.body.data).to.not.have.property(\"refresh_token\");\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # Login\n\n          ## Purpose\n\n          Mandatory authentication entry point for an existing registered account (subject Ch. III\u2013IV). Verifies email + password and issues a new session.\n\n          ## Preconditions\n\n          The client has no authenticated identity. The account referenced by `email` must exist.\n\n          ## Request parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `Content-Type` | header | yes | string | `application/json` | no | JSON request media type | `application/json` |\n          | `Accept` | header | yes | string | `application/json` | no | Requested response media type | `application/json` |\n          | `email` | body | yes | string | valid email | no | Login identifier | `player.one@example.com` |\n          | `password` | body | yes | string | non-empty | no | Verified against stored hash | `Correct-Horse-1` |\n\n          ## Success behavior and response fields\n\n          `200 OK` issues a new session pair for the matched account and sets the same two cookies as Register (`ft_session`, `ft_refresh`), so the WebSocket upgrade and every following REST call authenticate without a custom header. No token value is returned in the body, on either client type.\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `data.user.user_id` | integer | yes | no | positive | Authenticated user |\n          | `data.user.username` | string | yes | no | username rule | Display username |\n          | `data.user.email` | string | yes | no | valid email | Login identifier |\n          | `data.access_token_expires_at` | `string<date-time>` | yes | no | ISO 8601 UTC | `ft_session` expiry, for client-side UX timers only |\n\n          ## State changes and events\n\n          A new session pair is persisted. No room membership is implied and no WebSocket event is emitted.\n\n          ## Errors\n\n          | Status | Code | When | State change |\n          | --- | --- | --- | --- |\n          | `400` | `VALIDATION_ERROR` | malformed JSON or unexpected structure | none |\n          | `401` | `INVALID_CREDENTIALS` | email not found, or password does not match | none |\n          | `429` | `RATE_LIMITED` | login attempt limit exceeded | none |\n\n          ## Notes/invariants\n\n          `INVALID_CREDENTIALS` is returned identically for \"email not found\" and \"wrong password\" so the response never discloses whether an email is registered. Multiple concurrent sessions per user are permitted; login does not revoke prior sessions.\n        examples:\n          - name: Success - player_one\n            request:\n              url: '{{baseUrl}}/api/auth/login'\n              method: POST\n              headers:\n                - name: Content-Type\n                  value: application/json\n                - name: Accept\n                  value: application/json\n            response:\n              status: 200\n              headers:\n                - name: Content-Type\n                  value: application/json\n                - name: Set-Cookie\n                  value: ft_session=eyJhbGciOiJIUzI1NiJ9...; HttpOnly; Secure; SameSite=Lax; Path=/\n                - name: Set-Cookie\n                  value: ft_refresh=rtok_9NqK2vLc4R8pXaZm; HttpOnly; Secure; SameSite=Lax; Path=/api/auth/refresh\n              body:\n                type: json\n                data: |-\n                  {\n                    \"data\": {\n                      \"user\": {\n                        \"user_id\": 42,\n                        \"username\": \"player_one\",\n                        \"email\": \"player.one@example.com\"\n                      },\n                      \"access_token_expires_at\": \"2026-09-11T09:30:00Z\"\n                    }\n                  }\n          - name: Error - Wrong password\n            request:\n              url: '{{baseUrl}}/api/auth/login'\n              method: POST\n              headers:\n                - name: Content-Type\n                  value: application/json\n            response:\n              status: 401\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"error\": {\n                      \"code\": \"INVALID_CREDENTIALS\",\n                      \"message\": \"Email or password is incorrect.\",\n                      \"details\": {}\n                    }\n                  }\n          - name: Error - Unknown email\n            request:\n              url: '{{baseUrl}}/api/auth/login'\n              method: POST\n              headers:\n                - name: Content-Type\n                  value: application/json\n            response:\n              status: 401\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"error\": {\n                      \"code\": \"INVALID_CREDENTIALS\",\n                      \"message\": \"Email or password is incorrect.\",\n                      \"details\": {}\n                    }\n                  }\n      - info:\n          name: Refresh session\n          type: http\n          seq: 3\n          tags:\n            - identity\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/auth/refresh'\n          headers:\n            - name: Accept\n              value: application/json\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                test(\"issues a new access token\", function () {\n                  expect(res.status).to.equal(200);\n                  expect(res.body.data.access_token_expires_at).to.be.a(\"string\");\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # Refresh session\n\n          ## Purpose\n\n          Exchanges a valid, unexpired `ft_refresh` credential for a new `ft_session`/`ft_refresh` pair, without forcing the user through Login again. This is the only way to renew an expired access token, and it is the step a client takes before reconnecting a WebSocket whose `ft_session` has expired.\n\n          ## Preconditions and request parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `ft_refresh` cookie | request cookie | yes | string | active, unexpired, unrevoked, not previously rotated | no | Long-lived credential from Register/Login/a prior Refresh | set by Register/Login |\n\n          There is no request body and no other credential path. `ft_refresh` is scoped `Path=/api/auth/refresh`, so a browser sends it here and nowhere else. Bruno relies on the same cookie via its cookie jar \u2014 there is no `refresh_token` body field for \"non-browser tooling\"; Bruno authenticates exactly like a browser.\n\n          ## Success behavior and response fields\n\n          `200 OK` rotates the refresh credential (single-use \u2014 the presented `ft_refresh` is revoked the instant the new one is issued) and reissues both `ft_session` and `ft_refresh` cookies. No token value is returned in the body.\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `data.access_token_expires_at` | `string<date-time>` | yes | no | ISO 8601 UTC | New `ft_session` expiry, for client-side UX timers only |\n\n          ## State changes and events\n\n          The presented refresh credential is revoked and replaced (rotation). No room membership or WebSocket event is affected \u2014 an existing room WebSocket connection keeps its handshake-time authorization until it disconnects and reconnects; ordinary access-token expiry does not by itself tear down an already-open socket (`workspace.yml`, Session and Credential Model).\n\n          ## Errors\n\n          | Status | Code | When | State change |\n          | --- | --- | --- | --- |\n          | `401` | `SESSION_EXPIRED` | `ft_refresh` missing, expired, already rotated, or revoked | none, unless reuse-of-rotated is detected |\n\n          `SESSION_EXPIRED` here means the frontend must send the user back through Login; it is distinct from `UNAUTHORIZED`, which means a REST/WebSocket request presented no valid `ft_session`. Presenting an already-rotated `ft_refresh` (reuse of a stolen/replayed refresh credential) is also reported as `SESSION_EXPIRED`, but additionally revokes every credential in that token's rotation family server-side \u2014 the account-wide theft-detection response required by the Session and Credential Model.\n        examples:\n          - name: Success - New access token\n            request:\n              url: '{{baseUrl}}/api/auth/refresh'\n              method: POST\n              headers:\n                - name: Accept\n                  value: application/json\n            response:\n              status: 200\n              headers:\n                - name: Content-Type\n                  value: application/json\n                - name: Set-Cookie\n                  value: ft_session=eyJhbGciOiJIUzI1NiJ9...; HttpOnly; Secure; SameSite=Lax; Path=/\n                - name: Set-Cookie\n                  value: ft_refresh=rtok_newRotated123; HttpOnly; Secure; SameSite=Lax; Path=/api/auth/refresh\n              body:\n                type: json\n                data: |-\n                  {\n                    \"data\": {\n                      \"access_token_expires_at\": \"2026-09-10T09:40:01Z\"\n                    }\n                  }\n          - name: Error - Expired or revoked refresh token\n            request:\n              url: '{{baseUrl}}/api/auth/refresh'\n              method: POST\n              headers:\n                - name: Accept\n                  value: application/json\n                - name: Cookie\n                  value: ft_refresh=rtok_expiredOrUsed\n            response:\n              status: 401\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"error\": {\n                      \"code\": \"SESSION_EXPIRED\",\n                      \"message\": \"The refresh token is invalid or expired. Log in again.\",\n                      \"details\": {}\n                    }\n                  }\n      - info:\n          name: Get current session\n          type: http\n          seq: 4\n          tags:\n            - identity\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/auth/session'\n          headers:\n            - name: Accept\n              value: application/json\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # Get current session\n\n          ## Purpose and preconditions\n\n          Resolves the `ft_session` credential (from Register, Login, or Refresh) to its user and current room membership, derived live from Game Session's authoritative membership index (`workspace.yml`, State Ownership) \u2014 never a stale cached value. A valid unexpired `ft_session` cookie is required; this is also the endpoint frontend route recovery calls on bootstrap to decide which screen to show (Routing Recovery).\n\n          ## Request parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `ft_session` cookie | request cookie | yes | string | active JWT access credential | no | Shared REST/WebSocket credential | set by Register/Login |\n          | `Accept` | header | yes | string | `application/json` | no | Requested response media type | `application/json` |\n\n          ## Success and response fields\n\n          `200 OK` returns the authenticated identity without reissuing a token.\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `data.user.user_id` | integer | yes | no | positive | Authenticated user |\n          | `data.user.username` | string | yes | no | username rule | Stored display username |\n          | `data.active_room_id` | integer or null | yes | yes | positive or `null` | Current live room membership (from Game Session's membership index), never a permanent profile field |\n          | `data.session_expires_at` | `string<date-time>` | yes | no | ISO 8601 UTC | `ft_session` expiry |\n\n          ## State changes, events, and errors\n\n          Read-only; no event. Missing, invalid, revoked, or expired `ft_session` returns `401 UNAUTHORIZED` and an empty details object \u2014 the frontend should attempt `POST /api/auth/refresh` before treating this as a full logout.\n        examples:\n          - name: Success - No active room\n            request:\n              url: '{{baseUrl}}/api/auth/session'\n              method: GET\n              headers:\n                - name: Accept\n                  value: application/json\n            response:\n              status: 200\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"data\": {\n                      \"user\": {\n                        \"user_id\": 42,\n                        \"username\": \"player_one\"\n                      },\n                      \"active_room_id\": null,\n                      \"session_expires_at\": \"2026-09-10T09:10:01Z\"\n                    }\n                  }\n          - name: Success - Active room\n            request:\n              url: '{{baseUrl}}/api/auth/session'\n              method: GET\n              headers:\n                - name: Accept\n                  value: application/json\n            response:\n              status: 200\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"data\": {\n                      \"user\": {\n                        \"user_id\": 42,\n                        \"username\": \"player_one\"\n                      },\n                      \"active_room_id\": 1001,\n                      \"session_expires_at\": \"2026-09-10T09:10:01Z\"\n                    }\n                  }\n          - name: Error - Invalid session\n            request:\n              url: '{{baseUrl}}/api/auth/session'\n              method: GET\n              headers:\n                - name: Accept\n                  value: application/json\n                - name: Cookie\n                  value: ft_session=invalid\n            response:\n              status: 401\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"error\": {\n                      \"code\": \"UNAUTHORIZED\",\n                      \"message\": \"A valid active session is required.\",\n                      \"details\": {}\n                    }\n                  }\n      - info:\n          name: End current session\n          type: http\n          seq: 5\n          tags:\n            - identity\n        http:\n          method: DELETE\n          url: '{{baseUrl}}/api/auth/session'\n          headers:\n            - name: Accept\n              value: application/json\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # End current session\n\n          ## Purpose and preconditions\n\n          Revokes the current session (`ft_session` and `ft_refresh`, from Register, Login, or Refresh) and clears both cookies. The user account and persistent statistics remain. Logout is legal regardless of room membership (`workspace.yml`, Session and Credential Model / Room Abandonment): if the user currently has `active_room_id` set and that room is `IN_GAME`, logout triggers the same `PLAYER_FORFEIT` lifecycle as an explicit `Leave room` call or an abandonment-timeout, synchronously, before the session is revoked \u2014 there is no `409 ALREADY_IN_ROOM` block here anymore. Logout also closes every open, authenticated WebSocket connection (room and chat) belonging to this session.\n\n          ## Request parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `ft_session` cookie | request cookie | yes | string | active JWT access credential | no | Session to revoke | set by Register/Login |\n\n          ## Success, state changes, and events\n\n          `204 No Content` has no body. It revokes both `ft_session` and `ft_refresh`, clears both cookies, and closes open sockets for this session. If the user was `IN_GAME`, the room's `game.ended` event (`end_reason: \"PLAYER_FORFEIT\"`) is emitted to the remaining room members as part of the same operation, before the response returns.\n\n          ## Errors\n\n          `401 UNAUTHORIZED` covers invalid/revoked tokens. There is no room-membership error on this endpoint.\n        examples:\n          - name: Success - Session revoked, no active room\n            request:\n              url: '{{baseUrl}}/api/auth/session'\n              method: DELETE\n              headers:\n                - name: Accept\n                  value: application/json\n            response:\n              status: 204\n              body:\n                type: text\n                data: ''\n          - name: Success - Session revoked, forfeits active game\n            request:\n              url: '{{baseUrl}}/api/auth/session'\n              method: DELETE\n              headers:\n                - name: Accept\n                  value: application/json\n            response:\n              status: 204\n              body:\n                type: text\n                data: ''\n          - name: Error - Already revoked\n            request:\n              url: '{{baseUrl}}/api/auth/session'\n              method: DELETE\n              headers:\n                - name: Accept\n                  value: application/json\n                - name: Cookie\n                  value: ft_session=alreadyRevoked\n            response:\n              status: 401\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"error\": {\n                      \"code\": \"UNAUTHORIZED\",\n                      \"message\": \"A valid active session is required.\",\n                      \"details\": {}\n                    }\n                  }\n  - info:\n      name: 02 - Users & Profile\n      type: folder\n      seq: 2\n    docs:\n      content: |-\n        # Users and profiles\n\n        Profiles contain persistent identity and statistics: `wins`, `losses`, `level`, and supported match summaries. Temporary room team, role, readiness, score, board, clue, and turn never become account fields. The own profile may show `active_room_id`; public profiles omit session and active-room data.\n      type: text/markdown\n    items:\n      - info:\n          name: Get own profile\n          type: http\n          seq: 1\n          tags:\n            - profile\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/users/me'\n          headers:\n            - name: Accept\n              value: application/json\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # Get own profile\n\n          ## Purpose and preconditions\n\n          Returns authenticated persistent statistics plus the current room link. Requires an active session.\n\n          ## Request parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `ft_session` cookie | request cookie | yes | string | active JWT access credential | no | Authenticates the owner | set by Register/Login |\n          | `Accept` | header | yes | string | `application/json` | no | Requested response media type | `application/json` |\n\n          ## Response fields\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `data.user_id` | integer | yes | no | positive | Persistent user ID |\n          | `data.username` | string | yes | no | username rule | Display username |\n          | `data.avatar_url` | string | yes | no | URL | Uploaded avatar, or the deterministic default if none uploaded |\n          | `data.level` | integer | yes | no | `>= 1` | Persistent progression level |\n          | `data.wins` | integer | yes | no | `>= 0` | Finished matches won |\n          | `data.losses` | integer | yes | no | `>= 0` | Finished matches lost |\n          | `data.matches_played` | integer | yes | no | `wins + losses` | Total settled matches |\n          | `data.active_room_id` | integer or null | yes | yes | positive or `null` | Temporary room membership link |\n          | `data.created_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Account creation time |\n\n          ## State changes, events, and errors\n\n          Read-only; no event. Invalid sessions return `401 UNAUTHORIZED`. Team, role, ready, score, and board are intentionally absent because they are room state.\n        examples:\n          - name: Success - Persistent stats with active room\n            request:\n              url: '{{baseUrl}}/api/users/me'\n              method: GET\n            response:\n              status: 200\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"data\": {\n                      \"user_id\": 42,\n                      \"username\": \"player_one\",\n                      \"avatar_url\": \"https://{{baseUrl}}/static/avatars/default/42.svg\",\n                      \"level\": 4,\n                      \"wins\": 12,\n                      \"losses\": 8,\n                      \"matches_played\": 20,\n                      \"active_room_id\": 1001,\n                      \"created_at\": \"2026-08-01T10:00:00Z\"\n                    }\n                  }\n          - name: Success - Persistent stats without room\n            request:\n              url: '{{baseUrl}}/api/users/me'\n              method: GET\n            response:\n              status: 200\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"data\": {\n                      \"user_id\": 42,\n                      \"username\": \"player_one\",\n                      \"avatar_url\": \"https://{{baseUrl}}/static/avatars/default/42.svg\",\n                      \"level\": 4,\n                      \"wins\": 12,\n                      \"losses\": 8,\n                      \"matches_played\": 20,\n                      \"active_room_id\": null,\n                      \"created_at\": \"2026-08-01T10:00:00Z\"\n                    }\n                  }\n          - name: Error - Unauthorized\n            request:\n              url: '{{baseUrl}}/api/users/me'\n              method: GET\n            response:\n              status: 401\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"error\": {\n                      \"code\": \"UNAUTHORIZED\",\n                      \"message\": \"A valid active session is required.\",\n                      \"details\": {}\n                    }\n                  }\n      - info:\n          name: Get public profile\n          type: http\n          seq: 2\n          tags:\n            - profile\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/users/43'\n          headers:\n            - name: Accept\n              value: application/json\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # Get public profile\n\n          ## Purpose and preconditions\n\n          Returns another player's public persistent profile. Authentication is required; room co-membership is not.\n\n          ## Request parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `user_id` | path | yes | integer | positive | no | Target user | `43` |\n          | `ft_session` cookie | request cookie | yes | string | active JWT access credential | no | Requesting identity | set by Register/Login |\n          | `Accept` | header | yes | string | `application/json` | no | Requested response media type | `application/json` |\n\n          ## Response fields\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `data.user_id` | integer | yes | no | positive | Public user ID |\n          | `data.username` | string | yes | no | username rule | Public display name |\n          | `data.avatar_url` | string | yes | no | URL | Uploaded avatar, or the deterministic default if none uploaded |\n          | `data.level` | integer | yes | no | `>= 1` | Persistent level |\n          | `data.wins` | integer | yes | no | `>= 0` | Wins |\n          | `data.losses` | integer | yes | no | `>= 0` | Losses |\n          | `data.matches_played` | integer | yes | no | `wins + losses` | Settled matches |\n          | `data.is_online` | boolean | yes | no | `true`, `false` | At least one open authenticated connection right now (`workspace.yml`, Presence) |\n\n          ## State changes, events, and errors\n\n          Read-only; no event. `401 UNAUTHORIZED` covers the requester session; `404 USER_NOT_FOUND` covers a valid positive ID with no user. Session credentials, active room, team, role, and ready state are never public profile fields.\n        examples:\n          - name: Success - red_agent\n            request:\n              url: '{{baseUrl}}/api/users/43'\n              method: GET\n            response:\n              status: 200\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"data\": {\n                      \"user_id\": 43,\n                      \"username\": \"red_agent\",\n                      \"avatar_url\": \"https://{{baseUrl}}/static/avatars/default/43.svg\",\n                      \"level\": 3,\n                      \"wins\": 9,\n                      \"losses\": 11,\n                      \"matches_played\": 20,\n                      \"is_online\": true\n                    }\n                  }\n          - name: Error - User not found\n            request:\n              url: '{{baseUrl}}/api/users/9999'\n              method: GET\n            response:\n              status: 404\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"error\": {\n                      \"code\": \"USER_NOT_FOUND\",\n                      \"message\": \"User 9999 was not found.\",\n                      \"details\": {\n                        \"user_id\": 9999\n                      }\n                    }\n                  }\n          - name: Error - Invalid path ID\n            request:\n              url: '{{baseUrl}}/api/users/zero'\n              method: GET\n            response:\n              status: 422\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"error\": {\n                      \"code\": \"VALIDATION_ERROR\",\n                      \"message\": \"user_id must be a positive integer.\",\n                      \"details\": {\n                        \"field\": \"user_id\"\n                      }\n                    }\n                  }\n      - info:\n          name: Update own profile\n          type: http\n          seq: 3\n          tags:\n            - profile\n        http:\n          method: PATCH\n          url: '{{baseUrl}}/api/users/me'\n          headers:\n            - name: Content-Type\n              value: application/json\n            - name: Accept\n              value: application/json\n          body:\n            type: json\n            data: |-\n              {\n                \"username\": \"player_one_updated\"\n              }\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # Update own profile\n\n          ## Purpose and preconditions\n\n          Completes the Standard User Management contract (subject Ch. III\u2013IV, Major module): lets a user edit their own profile. Requires an active session.\n\n          ## Request parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `ft_session` cookie | request cookie | yes | string | active JWT access credential | no | Authenticates the owner | set by Register/Login |\n          | `username` | body | no | string | trimmed `^[A-Za-z0-9_]{3,20}$`, case-insensitive uniqueness | no | New display name; omit to leave unchanged | `player_one_updated` |\n\n          `email` and `password` are intentionally not editable here \u2014 email is the login identifier (changing it is an account-recovery-sensitive flow out of this contract's scope) and password change belongs to a dedicated re-auth-gated flow, also out of scope for this revision. Avatar has its own endpoint (`upload-avatar.yml`).\n\n          ## Success behavior and response fields\n\n          `200 OK` returns the updated profile, same shape as `Get own profile`.\n\n          ## Errors\n\n          | Status | Code | When |\n          | --- | --- | --- |\n          | `401` | `UNAUTHORIZED` | invalid session |\n          | `422` | `INVALID_USERNAME` | present but malformed |\n          | `409` | `USERNAME_TAKEN` | case-insensitive collision with another account |\n        examples:\n          - name: Success - Username updated\n            request:\n              url: '{{baseUrl}}/api/users/me'\n              method: PATCH\n              headers:\n                - name: Content-Type\n                  value: application/json\n            response:\n              status: 200\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"data\": {\n                      \"user_id\": 42,\n                      \"username\": \"player_one_updated\",\n                      \"avatar_url\": \"https://{{baseUrl}}/static/avatars/default/42.svg\",\n                      \"level\": 4,\n                      \"wins\": 12,\n                      \"losses\": 8,\n                      \"matches_played\": 20,\n                      \"active_room_id\": null,\n                      \"created_at\": \"2026-08-01T10:00:00Z\"\n                    }\n                  }\n          - name: Error - Username taken\n            request:\n              url: '{{baseUrl}}/api/users/me'\n              method: PATCH\n              headers:\n                - name: Content-Type\n                  value: application/json\n            response:\n              status: 409\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"error\":{\"code\":\"USERNAME_TAKEN\",\"message\":\"Username ''red_agent'' is already registered.\",\"details\":{\"field\":\"username\"}}}'\n      - info:\n          name: Upload avatar\n          type: http\n          seq: 4\n          tags:\n            - profile\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/users/me/avatar'\n          headers:\n            - name: Accept\n              value: application/json\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # Upload avatar\n\n          ## Purpose and preconditions\n\n          Completes the Standard User Management contract's avatar requirement. Requires an active session.\n\n          ## Request parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `ft_session` cookie | request cookie | yes | string | active JWT access credential | no | Authenticates the owner | set by Register/Login |\n          | `avatar` | multipart body | yes | file | `image/jpeg`, `image/png`, `image/webp`; `<= 2 MiB`; square recommended, server crops/resizes | no | New avatar image | `avatar.png` |\n\n          MIME type and size are validated server-side from the actual file bytes, never trusted from the client-declared `Content-Type` alone. A user with no uploaded avatar renders a deterministic default derived from `user_id` (no upload step required to have *an* avatar).\n\n          ## Success behavior and response fields\n\n          `200 OK` replaces any previous uploaded avatar (the old file is deleted) and returns the new `avatar_url`, which then appears on own-profile, public-profile, friends-list, and room-member payloads.\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `data.avatar_url` | string | yes | no | URL | New avatar location |\n\n          ## Errors\n\n          | Status | Code | When |\n          | --- | --- | --- |\n          | `401` | `UNAUTHORIZED` | invalid session |\n          | `422` | `INVALID_IMAGE` | wrong MIME type, corrupt file, or over 2 MiB |\n        examples:\n          - name: Success - Avatar replaced\n            request:\n              url: '{{baseUrl}}/api/users/me/avatar'\n              method: POST\n            response:\n              status: 200\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"data\": {\n                      \"avatar_url\": \"https://{{baseUrl}}/static/avatars/uploaded/42.webp\"\n                    }\n                  }\n          - name: Error - Invalid image\n            request:\n              url: '{{baseUrl}}/api/users/me/avatar'\n              method: POST\n            response:\n              status: 422\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"error\":{\"code\":\"INVALID_IMAGE\",\"message\":\"Avatar must be image/jpeg, image/png, or image/webp under 2 MiB.\",\"details\":{}}}'\n      - info:\n          name: Get own match history\n          type: http\n          seq: 5\n          tags:\n            - profile\n            - stats\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/users/me/matches?limit=20'\n          headers:\n            - name: Accept\n              value: application/json\n          params:\n            - name: limit\n              value: '20'\n              type: query\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # Get own match history\n\n          ## Purpose and preconditions\n\n          Completes the Game Statistics minor module (requires a game \u2014 satisfied). Requires an active session. Reads from the Stats service's finalized match records (`workspace.yml`, Match History and Stats), one row per terminal `game.ended`.\n\n          ## Request parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `ft_session` cookie | request cookie | yes | string | active JWT access credential | no | Authenticates the owner | set by Register/Login |\n          | `limit` | query | no | integer | `1..50`, default `20` | no | Page size | `20` |\n          | `before` | query | no | `string<date-time>` | ISO 8601 UTC | no | Return matches finished before this time (pagination cursor) | `2026-09-10T08:50:00Z` |\n\n          ## Response fields\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `data.matches[].game_id` | integer | yes | no | positive | Match ID |\n          | `data.matches[].room_id` | integer | yes | no | positive | Room the match was played in |\n          | `data.matches[].team` | enum | yes | no | `RED`, `BLUE` | This user's team in the match |\n          | `data.matches[].opponents[]` | array<object> | yes | no | `user_id`, `username` | Opposing team's roster |\n          | `data.matches[].result` | enum | yes | no | `WIN`, `LOSS` | Outcome for this user |\n          | `data.matches[].end_reason` | enum | yes | no | `ALL_TEAM_CARDS_REVEALED`, `ASSASSIN_REVEALED`, `PLAYER_FORFEIT` | Terminal cause |\n          | `data.matches[].score` | object | yes | no | `{red, blue}` | Final score |\n          | `data.matches[].finished_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Match end time |\n\n          ## Errors\n\n          `401 UNAUTHORIZED` for an invalid session. Read-only; no event.\n        examples:\n          - name: Success - Two recent matches\n            request:\n              url: '{{baseUrl}}/api/users/me/matches?limit=20'\n              method: GET\n              params:\n                - name: limit\n                  value: '20'\n                  type: query\n            response:\n              status: 200\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"data\": {\n                      \"matches\": [\n                        {\n                          \"game_id\": 5001,\n                          \"room_id\": 1001,\n                          \"team\": \"RED\",\n                          \"opponents\": [\n                            {\"user_id\": 44, \"username\": \"blue_master\"},\n                            {\"user_id\": 45, \"username\": \"blue_agent\"}\n                          ],\n                          \"result\": \"WIN\",\n                          \"end_reason\": \"ALL_TEAM_CARDS_REVEALED\",\n                          \"score\": {\"red\": 9, \"blue\": 5},\n                          \"finished_at\": \"2026-09-10T08:50:00Z\"\n                        },\n                        {\n                          \"game_id\": 4998,\n                          \"room_id\": 998,\n                          \"team\": \"BLUE\",\n                          \"opponents\": [\n                            {\"user_id\": 46, \"username\": \"extra_red\"}\n                          ],\n                          \"result\": \"LOSS\",\n                          \"end_reason\": \"PLAYER_FORFEIT\",\n                          \"score\": {\"red\": 3, \"blue\": 2},\n                          \"finished_at\": \"2026-09-09T20:10:00Z\"\n                        }\n                      ]\n                    }\n                  }\n  - info:\n      name: 03 - Rooms\n      type: folder\n      seq: 3\n    docs:\n      content: |-\n        # Rooms\n\n        Creating joins the creator and assigns host. Only `WAITING` rooms accept joins, and a user may have one active room (`active_room_id` is derived live from Game Session's membership index, not a durable field that can orphan an account \u2014 `workspace.yml`, State Ownership). The host transfers to the longest-present member after a host leaves `WAITING`; an empty room closes; a `FINISHED` room closes once its last member leaves. Team, role, ready, countdown, and gameplay mutations use WebSocket.\n\n        A game can start only with at least four configured, ready members; exactly one Spymaster and at least one Operative per `RED` and `BLUE`. REST room snapshots use the same enums and privacy projections as realtime state.\n\n        `Leave room` and logout (`DELETE /api/auth/session`) are legal in every room status, including `IN_GAME`: leaving mid-game forfeits the match for that member's team (Room Abandonment, `workspace.yml`) rather than being rejected. A transport disconnect alone is never an immediate leave \u2014 it starts a reconnect grace period first, and only resolves to a leave/forfeit if that period expires without reconnect.\n      type: text/markdown\n    items:\n      - info:\n          name: Create room\n          type: http\n          seq: 1\n          tags:\n            - rooms\n            - smoke\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/rooms'\n          headers:\n            - name: Accept\n              value: application/json\n        runtime:\n          scripts:\n            - type: after-response\n              code: |-\n                if (res.status === 201 && res.body && res.body.data) {\n                  bru.setVar(\"roomId\", String(res.body.data.room_id));\n                }\n            - type: tests\n              code: |-\n                test(\"creator is joined as unconfigured host\", function () {\n                  expect(res.status).to.equal(201);\n                  expect(res.body.data.status).to.equal(\"WAITING\");\n                  expect(res.body.data.players[0].is_host).to.equal(true);\n                  expect(res.body.data.players[0].team).to.equal(null);\n                  expect(res.body.data.players[0].role).to.equal(null);\n                  expect(res.body.data.players[0].ready).to.equal(false);\n                  expect(res.body.data.room_code).to.match(/^[A-Z0-9]{6}$/);\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # Create room\n\n          ## Purpose and preconditions\n\n          Creates a `WAITING` room, joins the authenticated creator, and makes that member host. The user must not already belong to any active room.\n\n          ## Request parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `ft_session` cookie | request cookie | yes | string | active JWT access credential | no | Creating user | set by Register/Login |\n          | `Accept` | header | yes | string | `application/json` | no | Requested response media type | `application/json` |\n\n          There is no body: room capacity, passwords, timers, and custom boards are not contract features.\n\n          ## Response fields\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `data.room_id` | integer | yes | no | positive | Internal room ID, used as the WebSocket/REST path key |\n          | `data.room_code` | string | yes | no | `^[A-Z0-9]{6}$`, unique among active rooms | Human-shareable join code shown in the Join Room UI |\n          | `data.status` | string enum | yes | no | `WAITING` | Initial lifecycle state |\n          | `data.host_user_id` | integer | yes | no | creator ID | Current host |\n          | `data.player_count` | integer | yes | no | `1` | Current membership count |\n          | `data.startable` | boolean | yes | no | `false` | Full start predicate result |\n          | `data.players[]` | array<object> | yes | no | one creator | Members in join order |\n          | `data.players[].user_id` | integer | yes | no | positive | Member ID |\n          | `data.players[].username` | string | yes | no | username rule | Member username |\n          | `data.players[].team` | enum or null | yes | yes | `RED`, `BLUE`, `null` | Temporary team |\n          | `data.players[].role` | enum or null | yes | yes | `SPYMASTER`, `OPERATIVE`, `null` | Temporary role |\n          | `data.players[].ready` | boolean | yes | no | `false` | Readiness |\n          | `data.players[].is_host` | boolean | yes | no | `true` | Host marker |\n          | `data.players[].joined_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Used for host transfer |\n          | `data.game` | object or null | yes | yes | `null` | No game before countdown completes |\n          | `data.created_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Room creation time |\n\n          ## State changes and events\n\n          Sets the user's `active_room_id`; no socket exists yet, so no event is required. The response snapshot is authoritative. The script stores `roomId`.\n\n          `room_code` is generated server-side, is not reused while the room is active, and is the value shown to the room creator to share for Join Room. See `Lookup room by code` for how another client resolves it back to `room_id`.\n\n          ## Errors\n\n          `401 UNAUTHORIZED`; `409 ALREADY_IN_ROOM`. Neither creates a room.\n        examples:\n          - name: Success - Newly created room\n            request:\n              url: '{{baseUrl}}/api/rooms'\n              method: POST\n            response:\n              status: 201\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"data\": {\n                      \"room_id\": 1001,\n                      \"room_code\": \"ABCD12\",\n                      \"status\": \"WAITING\",\n                      \"host_user_id\": 42,\n                      \"player_count\": 1,\n                      \"startable\": false,\n                      \"players\": [\n                        {\n                          \"user_id\": 42,\n                          \"username\": \"player_one\",\n                          \"team\": null,\n                          \"role\": null,\n                          \"ready\": false,\n                          \"is_host\": true,\n                          \"joined_at\": \"2026-09-10T08:41:00Z\"\n                        }\n                      ],\n                      \"game\": null,\n                      \"created_at\": \"2026-09-10T08:41:00Z\"\n                    }\n                  }\n          - name: Error - Already in room\n            request:\n              url: '{{baseUrl}}/api/rooms'\n              method: POST\n            response:\n              status: 409\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"error\": {\n                      \"code\": \"ALREADY_IN_ROOM\",\n                      \"message\": \"User 42 already belongs to active room 1001.\",\n                      \"details\": {\n                        \"room_id\": 1001\n                      }\n                    }\n                  }\n          - name: Error - Unauthorized\n            request:\n              url: '{{baseUrl}}/api/rooms'\n              method: POST\n            response:\n              status: 401\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"error\": {\n                      \"code\": \"UNAUTHORIZED\",\n                      \"message\": \"A valid active session is required.\",\n                      \"details\": {}\n                    }\n                  }\n      - info:\n          name: Join room\n          type: http\n          seq: 2\n          tags:\n            - rooms\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/rooms/{{roomId}}/members'\n          headers:\n            - name: Accept\n              value: application/json\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # Join room\n\n          ## Purpose and preconditions\n\n          Adds the authenticated user as an unconfigured member. The room must exist and be exactly `WAITING`; the user must have no active room. No body is accepted.\n\n          ## Request parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `room_id` | path | yes | integer | positive | no | Room to join | `1001` |\n          | `ft_session` cookie | request cookie | yes | string | active JWT access credential | no | Joining user | set by Register/Login |\n          | `Accept` | header | yes | string | `application/json` | no | Requested response media type | `application/json` |\n\n          ## Response fields\n\n          `201 Created` returns `{data: room_snapshot}`. The new item has `team:null`, `role:null`, `ready:false`, `is_host:false`, and a UTC `joined_at`. `player_count` increments and `startable` is recomputed.\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `data.room_id` | integer | yes | no | positive | Joined room |\n          | `data.status` | string enum | yes | no | `WAITING` | Joinable lifecycle state |\n          | `data.host_user_id` | integer | yes | no | member ID | Current host |\n          | `data.player_count` | integer | yes | no | `>= 2` in this flow | Count after join |\n          | `data.startable` | boolean | yes | no | `false` | New member is unconfigured, so full predicate fails |\n          | `data.players[]` | array<object> | yes | no | members in join order | Membership snapshot |\n          | `data.players[].user_id` | integer | yes | no | positive | Member ID |\n          | `data.players[].username` | string | yes | no | username rule | Display name |\n          | `data.players[].team` | enum or null | yes | yes | `RED`, `BLUE`, `null` | Temporary team |\n          | `data.players[].role` | enum or null | yes | yes | `SPYMASTER`, `OPERATIVE`, `null` | Temporary role |\n          | `data.players[].ready` | boolean | yes | no | `true`, `false` | Current readiness |\n          | `data.players[].is_host` | boolean | yes | no | `true`, `false` | Host marker |\n          | `data.players[].joined_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Membership order |\n          | `data.game` | object or null | yes | yes | `null` on join | Game absent in `WAITING` |\n          | `data.created_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Room creation time |\n\n          ## State changes and emitted events\n\n          Sets `active_room_id`, emits `room.player.joined`, then emits a role-safe `room.state`. A join can never trigger countdown because the new unconfigured member makes the start predicate false.\n\n          ## Errors\n\n          | Status | Code | When | State change |\n          | --- | --- | --- | --- |\n          | `401` | `UNAUTHORIZED` | invalid session | none |\n          | `404` | `ROOM_NOT_FOUND` | room ID absent | none |\n          | `409` | `ROOM_NOT_JOINABLE` | state is `COUNTDOWN`, `IN_GAME`, `FINISHED`, or `CLOSED` | none |\n          | `409` | `ALREADY_IN_ROOM` | user already has active room, including this one | none |\n          | `422` | `VALIDATION_ERROR` | room ID is not positive integer | none |\n\n          ## Invariants\n\n          No capacity maximum is imposed. Joining is forbidden as soon as countdown begins.\n        examples:\n          - name: Success - Join empty-team room\n            request:\n              url: '{{baseUrl}}/api/rooms/1001/members'\n              method: POST\n            response:\n              status: 201\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"data\": {\n                      \"room_id\": 1001,\n                      \"status\": \"WAITING\",\n                      \"host_user_id\": 42,\n                      \"player_count\": 2,\n                      \"startable\": false,\n                      \"players\": [\n                        {\n                          \"user_id\": 42,\n                          \"username\": \"player_one\",\n                          \"team\": null,\n                          \"role\": null,\n                          \"ready\": false,\n                          \"is_host\": true,\n                          \"joined_at\": \"2026-09-10T08:41:00Z\"\n                        },\n                        {\n                          \"user_id\": 43,\n                          \"username\": \"red_agent\",\n                          \"team\": null,\n                          \"role\": null,\n                          \"ready\": false,\n                          \"is_host\": false,\n                          \"joined_at\": \"2026-09-10T08:41:20Z\"\n                        }\n                      ],\n                      \"game\": null,\n                      \"created_at\": \"2026-09-10T08:41:00Z\"\n                    }\n                  }\n          - name: Success - Fifth player joins\n            request:\n              url: '{{baseUrl}}/api/rooms/1001/members'\n              method: POST\n            response:\n              status: 201\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"data\": {\n                      \"room_id\": 1001,\n                      \"status\": \"WAITING\",\n                      \"host_user_id\": 42,\n                      \"player_count\": 5,\n                      \"startable\": false,\n                      \"players\": [\n                        {\n                          \"user_id\": 42,\n                          \"username\": \"player_one\",\n                          \"team\": \"RED\",\n                          \"role\": \"SPYMASTER\",\n                          \"ready\": false,\n                          \"is_host\": true,\n                          \"joined_at\": \"2026-09-10T08:41:00Z\"\n                        },\n                        {\n                          \"user_id\": 43,\n                          \"username\": \"red_agent\",\n                          \"team\": \"RED\",\n                          \"role\": \"OPERATIVE\",\n                          \"ready\": false,\n                          \"is_host\": false,\n                          \"joined_at\": \"2026-09-10T08:41:20Z\"\n                        },\n                        {\n                          \"user_id\": 44,\n                          \"username\": \"blue_master\",\n                          \"team\": \"BLUE\",\n                          \"role\": \"SPYMASTER\",\n                          \"ready\": false,\n                          \"is_host\": false,\n                          \"joined_at\": \"2026-09-10T08:41:30Z\"\n                        },\n                        {\n                          \"user_id\": 45,\n                          \"username\": \"blue_agent\",\n                          \"team\": \"BLUE\",\n                          \"role\": \"OPERATIVE\",\n                          \"ready\": false,\n                          \"is_host\": false,\n                          \"joined_at\": \"2026-09-10T08:41:40Z\"\n                        },\n                        {\n                          \"user_id\": 46,\n                          \"username\": \"extra_red\",\n                          \"team\": null,\n                          \"role\": null,\n                          \"ready\": false,\n                          \"is_host\": false,\n                          \"joined_at\": \"2026-09-10T08:41:50Z\"\n                        }\n                      ],\n                      \"game\": null,\n                      \"created_at\": \"2026-09-10T08:41:00Z\"\n                    }\n                  }\n          - name: Error - Room not found\n            request:\n              url: '{{baseUrl}}/api/rooms/9999/members'\n              method: POST\n            response:\n              status: 404\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"error\":{\"code\":\"ROOM_NOT_FOUND\",\"message\":\"Room 9999 was not found.\",\"details\":{\"room_id\":9999}}}'\n          - name: Error - Countdown already started\n            request:\n              url: '{{baseUrl}}/api/rooms/1001/members'\n              method: POST\n            response:\n              status: 409\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"error\":{\"code\":\"ROOM_NOT_JOINABLE\",\"message\":\"Room 1001 is not joinable while status is COUNTDOWN.\",\"details\":{\"room_id\":1001,\"status\":\"COUNTDOWN\"}}}'\n          - name: Error - Already in another room\n            request:\n              url: '{{baseUrl}}/api/rooms/1001/members'\n              method: POST\n            response:\n              status: 409\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"error\":{\"code\":\"ALREADY_IN_ROOM\",\"message\":\"User 46 already belongs to active room 1002.\",\"details\":{\"room_id\":1002}}}'\n      - info:\n          name: Get room snapshot\n          type: http\n          seq: 3\n          tags:\n            - rooms\n            - snapshot\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/rooms/{{roomId}}'\n          headers:\n            - name: Accept\n              value: application/json\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                test(\"returns canonical room vocabulary\", function () {\n                  expect(res.status).to.equal(200);\n                  expect([\"WAITING\", \"COUNTDOWN\", \"IN_GAME\", \"FINISHED\", \"CLOSED\"]).to.include(res.body.data.status);\n                  expect(res.body.data.room_id).to.equal(Number(bru.getVar(\"roomId\")));\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # Get room snapshot\n\n          ## Purpose\n\n          Returns the server-authoritative, recipient-specific room and optional game state. It is used after navigation or reconnect recovery; realtime changes continue over WebSocket.\n\n          ## Preconditions and request parameters\n\n          The room must exist and the authenticated user must be a current member.\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `room_id` | path | yes | integer | positive | no | Requested room | `1001` |\n          | `ft_session` cookie | request cookie | yes | string | active JWT access credential | no | Determines access and projection | set by Register/Login |\n          | `Accept` | header | yes | string | `application/json` | no | Requested response media type | `application/json` |\n\n          ## Room response fields\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `data.room_id` | integer | yes | no | positive | Room ID shared with WebSocket |\n          | `data.status` | string enum | yes | no | `WAITING`, `COUNTDOWN`, `IN_GAME`, `FINISHED`, `CLOSED` | Lifecycle state |\n          | `data.host_user_id` | integer | yes | no | member user ID | Host; deterministic after transfer |\n          | `data.player_count` | integer | yes | no | `>= 1` for accessible room | Current members |\n          | `data.startable` | boolean | yes | no | `true`, `false` | Complete start predicate, not merely all-ready |\n          | `data.countdown.seconds_remaining` | integer | conditional | no | `0..3` | Present only in `COUNTDOWN` |\n          | `data.players[]` | array<object> | yes | no | one or more | Members in join order |\n          | `data.players[].user_id` | integer | yes | no | positive | Member ID |\n          | `data.players[].username` | string | yes | no | username rule | Username |\n          | `data.players[].team` | enum or null | yes | yes | `RED`, `BLUE`, `null` | Temporary team; null until selected |\n          | `data.players[].role` | enu
