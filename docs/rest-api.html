the error code\u2014not only the HTTP status\u2014matches the contract.\n      type: text/markdown\n    items:\n      - info:\n          name: Create room as host\n          type: http\n          seq: 1\n          tags:\n            - smoke\n            - rooms\n        http:\n          method: POST\n          url: '{{baseUrl}}/rooms'\n          headers:\n            - name: X-Session-Id\n              value: '{{user_session_id}}'\n            - name: Accept\n              value: application/json\n        runtime:\n          scripts:\n            - type: after-response\n              code: |-\n                if (res.status === 201 && res.body && res.body.room_id !== undefined) {\n                  bru.setVar(\"room_id\", String(res.body.room_id));\n                }\n            - type: tests\n              code: |-\n                test(\"creates a waiting room\", function() {\n                  expect(res.status).to.equal(201);\n                  expect(res.body.status).to.equal(\"WAITING\");\n                  expect(res.body.host.user_id).to.be.a(\"number\");\n                  expect(res.body.players).to.be.an(\"array\");\n                  expect(res.body.minimum_players).to.equal(4);\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # \uD83D\uDCE5 Create room as host\n\n          ## \uD83D\uDCDD Overview\n\n          Creates a room for the authenticated user. The backend assigns the host role in the returned room snapshot and the runtime script stores `room_id` for the next requests.\n\n          ## \uD83D\uDCCD Endpoint\n\n          `POST {{baseUrl}}/rooms`\n\n          ## \uD83D\uDD10 Authentication\n\n          A valid temporary session is required in `X-Session-Id`. The selected environment supplies the value at runtime.\n\n          ## \uD83D\uDCE6 Request body\n\n          No request body is required for this request.\n\n          ## \uD83D\uDCE4 Response scenarios\n\n          - `201` \u2014 201 Created \u2014 waiting room\n          - `401` \u2014 Unauthorized\n          - `409` \u2014 USER_ALREADY_IN_ROOM\n\n          Review the native example body for the complete response shape.\n\n          ## \uD83E\uDDED Typical workflow\n\n          Run after the user-entry flow. On success, continue with room-state retrieval, joining, or the documented negative room scenarios.\n\n          ## \uD83E\uDDEA Testing guidance\n\n          Use the native response example as a quick contract reference, then run the request against a local backend when the required variables are populated.\n\n          > \uD83D\uDCA1 **Tip**\n          >\n          > Use the `local` environment and inspect the native response examples before sending a state-changing request.\n\n\n          ## \uD83E\uDDE9 Workspace metadata\n\n          Tags: smoke, rooms.\n\n          The request documentation describes the known contract only. If the backend changes, update the route, scripts, tests, and native examples together.\n        examples:\n          - name: 201 Created \u2014 waiting room\n            request:\n              url: '{{baseUrl}}/rooms'\n              method: POST\n              headers:\n                - name: X-Session-Id\n                  value: '{{user_session_id}}'\n                - name: Accept\n                  value: application/json\n            response:\n              status: 201\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"room_id\": 1001,\n                    \"status\": \"WAITING\",\n                    \"host\": { \"user_id\": 42, \"username\": \"player_one\" },\n                    \"players\": [\n                      { \"user_id\": 42, \"username\": \"player_one\", \"role\": \"HOST\", \"connection_status\": \"CONNECTED\" }\n                    ],\n                    \"minimum_players\": 4,\n                    \"game\": null\n                  }\n          - name: 401 Unauthorized\n            request:\n              url: '{{baseUrl}}/rooms'\n              method: POST\n              headers:\n                - name: X-Session-Id\n                  value: '{{user_session_id}}'\n                - name: Accept\n                  value: application/json\n            response:\n              status: 401\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"error\": {\n                      \"code\": \"UNAUTHORIZED\"\n                    }\n                  }\n          - name: 409 USER_ALREADY_IN_ROOM\n            request:\n              url: '{{baseUrl}}/rooms'\n              method: POST\n              headers:\n                - name: X-Session-Id\n                  value: '{{user_session_id}}'\n                - name: Accept\n                  value: application/json\n            response:\n              status: 409\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"error\": {\n                      \"code\": \"USER_ALREADY_IN_ROOM\"\n                    }\n                  }\n      - info:\n          name: Get room state\n          type: http\n          seq: 2\n          tags:\n            - smoke\n            - rooms\n        http:\n          method: GET\n          url: '{{baseUrl}}/rooms/:room_id'\n          headers:\n            - name: X-Session-Id\n              value: '{{user_session_id}}'\n            - name: Accept\n              value: application/json\n          params:\n            - name: room_id\n              value: '{{room_id}}'\n              type: path\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                test(\"returns the authoritative room snapshot\", function() {\n                  expect(res.status).to.equal(200);\n                  expect(res.body.room_id).to.equal(Number(bru.getVar(\"room_id\")));\n                  expect(res.body.status).to.be.oneOf([\"WAITING\", \"READY\", \"IN_PROGRESS\", \"FINISHED\"]);\n                  expect(res.body.players).to.be.an(\"array\");\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # \uD83D\uDCE5 Get room state\n\n          ## \uD83D\uDCDD Overview\n\n          Retrieves the authoritative room snapshot for the path parameter `room_id`. Access depends on the authenticated user's membership and authorization.\n\n          ## \uD83D\uDCCD Endpoint\n\n          `GET {{baseUrl}}/rooms/:room_id`\n\n          ## \uD83D\uDD10 Authentication\n\n          A valid temporary session is required in `X-Session-Id`. The selected environment supplies the value at runtime.\n\n          ## \uD83D\uDCE6 Request body\n\n          No request body is required for this request.\n\n          ## \uD83D\uDCE4 Response scenarios\n\n          - `200` \u2014 200 OK \u2014 authoritative snapshot\n\n          Review the native example body for the complete response shape.\n\n          ## \uD83E\uDDED Typical workflow\n\n          Run after `room_id` and a suitable session are available. Use the prepared guest session when validating membership, and use an outsider session only for the forbidden-access scenario.\n\n          ## \uD83E\uDDEA Testing guidance\n\n          Use the native response example as a quick contract reference, then run the request against a local backend when the required variables are populated.\n\n          > \uD83D\uDCA1 **Tip**\n          >\n          > Use the `local` environment and inspect the native response examples before sending a state-changing request.\n\n\n          ## \uD83E\uDDE9 Workspace metadata\n\n          Tags: smoke, rooms.\n\n          The request documentation describes the known contract only. If the backend changes, update the route, scripts, tests, and native examples together.\n        examples:\n          - name: 200 OK \u2014 authoritative snapshot\n            request:\n              url: '{{baseUrl}}/rooms/:room_id'\n              method: GET\n              headers:\n                - name: X-Session-Id\n                  value: '{{user_session_id}}'\n                - name: Accept\n                  value: application/json\n              params:\n                - name: room_id\n                  value: '{{room_id}}'\n                  type: path\n            response:\n              status: 200\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"room_id\": 1001,\n                    \"status\": \"WAITING\",\n                    \"host\": { \"user_id\": 42, \"username\": \"player_one\" },\n                    \"players\": [\n                      { \"user_id\": 42, \"username\": \"player_one\", \"role\": \"HOST\", \"connection_status\": \"CONNECTED\" }\n                    ],\n                    \"minimum_players\": 4,\n                    \"game\": null\n                  }\n          - name: 401 Unauthorized\n            request:\n              url: '{{baseUrl}}/rooms/:room_id'\n              method: GET\n              headers:\n                - name: X-Session-Id\n                  value: '{{user_session_id}}'\n                - name: Accept\n                  value: application/json\n              params:\n                - name: room_id\n                  value: '{{room_id}}'\n                  type: path\n            response:\n              status: 401\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"error\": {\n                      \"code\": \"UNAUTHORIZED\"\n                    }\n                  }\n          - name: 403 FORBIDDEN\n            request:\n              url: '{{baseUrl}}/rooms/:room_id'\n              method: GET\n              headers:\n                - name: X-Session-Id\n                  value: '{{outsider_session_id}}'\n                - name: Accept\n                  value: application/json\n              params:\n                - name: room_id\n                  value: '{{room_id}}'\n                  type: path\n            response:\n              status: 403\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"error\": {\n                      \"code\": \"FORBIDDEN\"\n                    }\n                  }\n          - name: 404 ROOM_NOT_FOUND\n            request:\n              url: '{{baseUrl}}/rooms/:room_id'\n              method: GET\n              headers:\n                - name: X-Session-Id\n                  value: '{{user_session_id}}'\n                - name: Accept\n                  value: application/json\n              params:\n                - name: room_id\n                  value: '2147483647'\n                  type: path\n            response:\n              status: 404\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"error\": {\n                      \"code\": \"ROOM_NOT_FOUND\"\n                    }\n                  }\n      - info:\n          name: Join room\n          type: http\n          seq: 3\n          tags:\n            - smoke\n            - rooms\n        http:\n          method: POST\n          url: '{{baseUrl}}/rooms/join'\n          headers:\n            - name: X-Session-Id\n              value: '{{guest_session_id}}'\n            - name: Content-Type\n              value: application/json\n            - name: Accept\n              value: application/json\n          body:\n            type: json\n            data: |-\n              {\n                \"room_id\": {{room_id}}\n              }\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                test(\"joins the waiting room\", function() {\n                  expect(res.status).to.equal(200);\n                  expect(res.body.room_id).to.equal(Number(bru.getVar(\"room_id\")));\n                  expect(res.body.players).to.be.an(\"array\");\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # \uD83D\uDCE5 Join room\n\n          ## \uD83D\uDCDD Overview\n\n          Attempts to add the authenticated user to the room identified by `room_id`. The response reflects whether the room exists, is joinable, and does not already contain the user.\n\n          ## \uD83D\uDCCD Endpoint\n\n          `POST {{baseUrl}}/rooms/join`\n\n          ## \uD83D\uDD10 Authentication\n\n          A valid temporary session is required in `X-Session-Id`. For a guest workflow, set the prepared `guest_session_id` in the selected local environment.\n\n          ## \uD83D\uDCE6 Request body\n\n          The request sends JSON. Use the fields already present in the request editor; do not replace runtime placeholders with committed secrets.\n\n          ```json\n          {\n            \"room_id\": {{room_id}}\n          }\n          ```\n\n          ## \uD83D\uDCE4 Response scenarios\n\n          - `200` \u2014 200 OK \u2014 joined room\n          - `400` \u2014 INVALID_REQUEST\n          - `401` \u2014 Unauthorized\n          - `404` \u2014 ROOM_NOT_FOUND\n          - `409` \u2014 ROOM_NOT_JOINABLE\n          - `422` \u2014 USER_ALREADY_IN_ROOM\n\n          Review the native example body for the complete response shape.\n\n          ## \uD83E\uDDED Typical workflow\n\n          Run after a host has created a room and a prepared guest session plus `room_id` are available. This is a manual/prepared-state scenario; a successful join can be followed by room-state retrieval and WebSocket observation.\n\n          ## \uD83E\uDDEA Testing guidance\n\n          Use the native response example as a quick contract reference, then run the request against a local backend when the required variables are populated.\n\n          > \uD83D\uDCA1 **Tip**\n          >\n          > Use the `local` environment and inspect the native response examples before sending a state-changing request.\n\n\n          ## \uD83E\uDDE9 Workspace metadata\n\n          Tags: smoke, rooms.\n\n          The request documentation describes the known contract only. If the backend changes, update the route, scripts, tests, and native examples together.\n        examples:\n          - name: 200 OK \u2014 joined room\n            request:\n              url: '{{baseUrl}}/rooms/join'\n              method: POST\n              headers:\n                - name: X-Session-Id\n                  value: '{{guest_session_id}}'\n                - name: Content-Type\n                  value: application/json\n                - name: Accept\n                  value: application/json\n            response:\n              status: 200\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"room_id\": 1001,\n                    \"status\": \"WAITING\",\n                    \"host\": { \"user_id\": 42, \"username\": \"player_one\" },\n                    \"players\": [\n                      { \"user_id\": 42, \"username\": \"player_one\", \"role\": \"HOST\", \"connection_status\": \"CONNECTED\" },\n                      { \"user_id\": 43, \"username\": \"player_two\", \"role\": \"OPERATIVE\", \"connection_status\": \"CONNECTED\" }\n                    ],\n                    \"minimum_players\": 4,\n                    \"game\": null\n                  }\n          - name: 400 INVALID_REQUEST\n            request:\n              url: '{{baseUrl}}/rooms/join'\n              method: POST\n              headers:\n                - name: X-Session-Id\n                  value: '{{guest_session_id}}'\n                - name: Content-Type\n                  value: application/json\n                - name: Accept\n                  value: application/json\n            response:\n              status: 400\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"error\": {\n                      \"code\": \"INVALID_REQUEST\"\n                    }\n                  }\n          - name: 401 Unauthorized\n            request:\n              url: '{{baseUrl}}/rooms/join'\n              method: POST\n              headers:\n                - name: X-Session-Id\n                  value: '{{guest_session_id}}'\n                - name: Content-Type\n                  value: application/json\n                - name: Accept\n                  value: application/json\n            response:\n              status: 401\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"error\": {\n                      \"code\": \"UNAUTHORIZED\"\n                    }\n                  }\n          - name: 404 ROOM_NOT_FOUND\n            request:\n              url: '{{baseUrl}}/rooms/join'\n              method: POST\n              headers:\n                - name: X-Session-Id\n                  value: '{{guest_session_id}}'\n                - name: Content-Type\n                  value: application/json\n                - name: Accept\n                  value: application/json\n            response:\n              status: 404\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"error\": {\n                      \"code\": \"ROOM_NOT_FOUND\"\n                    }\n                  }\n          - name: 409 ROOM_NOT_JOINABLE\n            request:\n              url: '{{baseUrl}}/rooms/join'\n              method: POST\n              headers:\n                - name: X-Session-Id\n                  value: '{{outsider_session_id}}'\n                - name: Content-Type\n                  value: application/json\n                - name: Accept\n                  value: application/json\n            response:\n              status: 409\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"error\": {\n                      \"code\": \"ROOM_NOT_JOINABLE\"\n                    }\n                  }\n          - name: 422 USER_ALREADY_IN_ROOM\n            request:\n              url: '{{baseUrl}}/rooms/join'\n              method: POST\n              headers:\n                - name: X-Session-Id\n                  value: '{{guest_session_id}}'\n                - name: Content-Type\n                  value: application/json\n                - name: Accept\n                  value: application/json\n            response:\n              status: 422\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"error\": {\n                      \"code\": \"USER_ALREADY_IN_ROOM\"\n                    }\n                  }\n  - info:\n      name: \uD83D\uDD10 User & Session\n      type: folder\n    docs:\n      content: |-\n        # \uD83D\uDC64 User & Session\n\n        This folder contains the temporary identity bootstrap used by the rest of the workspace. \uD83D\uDC64 It creates or enters a username-based session so later room requests can be authenticated without introducing passwords, JWTs, or unsupported account-management behavior.\n\n        ## \uD83E\uDDED When to use these requests\n\n        - Run `Enter user` first to create the primary temporary user.\n        - Use the prepared `guest_session_id` environment variable when a room workflow needs another participant.\n        - Inspect the native `400 INVALID_REQUEST` example to verify validation behavior.\n        - Inspect the native `409 USERNAME_TAKEN` example to verify the exact conflict contract.\n\n        ## \uD83D\uDD17 Runtime chaining\n\n        Successful responses populate session and user identifiers in Bruno runtime variables. Those values are consumed by the Rooms folder and are not written to the committed environment file.\n\n        > \uD83D\uDD10 **Security**\n        >\n        > Session IDs are temporary secrets. Keep them in Bruno's local environment storage and leave committed secret variables blank.\n\n        ## \uD83E\uDDEA Testing focus\n\n        Verify the `201`, `400 INVALID_REQUEST`, and `409 USERNAME_TAKEN` examples. The native examples are safe to inspect without sending a request.\n      type: text/markdown\n    items:\n      - info:\n          name: Enter user\n          type: http\n          seq: 1\n          tags:\n            - smoke\n            - bootstrap\n        http:\n          method: POST\n          url: '{{baseUrl}}/users/enter'\n          headers:\n            - name: Content-Type\n              value: application/json\n            - name: Accept\n              value: application/json\n          body:\n            type: json\n            data: |-\n              {\n                \"username\": \"{{user_username}}\"\n              }\n        runtime:\n          scripts:\n            - type: before-request\n              code: |-\n                const suffix = Date.now().toString(36);\n                bru.setVar(\"user_username\", \"user_\" + suffix);\n            - type: after-response\n              code: |-\n                if (res.status === 201 && res.body && res.body.session) {\n                  bru.setVar(\"session_id\", String(res.body.session.session_id));\n                  bru.setVar(\"user_session_id\", String(res.body.session.session_id));\n                  bru.setVar(\"user_id\", String(res.body.user.user_id));\n                }\n            - type: tests\n              code: |-\n                test(\"creates a temporary user session\", function() {\n                  expect(res.status).to.equal(201);\n                  expect(res.body.user.username).to.be.a(\"string\");\n                  expect(res.body.session.session_id).to.be.a(\"number\");\n                  expect(res.body.active_room).to.equal(null);\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # \uD83D\uDCE5 Enter user\n\n          ## \uD83D\uDCDD Overview\n\n          Creates a temporary username-based session that subsequent room requests can reuse. This is the workspace bootstrap step; it is not password registration or JWT login.\n\n          ## \uD83D\uDCCD Endpoint\n\n          `POST {{baseUrl}}/users/enter`\n\n          ## \uD83D\uDD10 Authentication\n\n          No existing session is required. A successful response creates a temporary session for later protected requests.\n\n          ## \uD83D\uDCE6 Request body\n\n          The request sends JSON. Use the fields already present in the request editor; do not replace runtime placeholders with committed secrets.\n\n          ```json\n          {\n            \"username\": \"{{user_username}}\"\n          }\n          ```\n\n          ## \uD83D\uDCE4 Response scenarios\n\n          - `201` \u2014 201 Created\n          - `400` \u2014 INVALID_REQUEST\n          - `409` \u2014 USERNAME_TAKEN\n\n          Review the native example body for the complete response shape.\n\n          ## \uD83E\uDDED Typical workflow\n\n          Run this request before protected room requests. Its runtime script saves the session and user identifiers for the rest of the workspace.\n\n          ## \uD83E\uDDEA Testing guidance\n\n          Use the native response example as a quick contract reference, then run the request against a local backend when the required variables are populated.\n\n          > \uD83D\uDCA1 **Tip**\n          >\n          > Use the `local` environment and inspect the native response examples before sending a state-changing request.\n\n\n          ## \uD83E\uDDE9 Workspace metadata\n\n          Tags: smoke, bootstrap.\n\n          The request documentation describes the known contract only. If the backend changes, update the route, scripts, tests, and native examples together.\n        examples:\n          - name: 201 Created\n            request:\n              url: '{{baseUrl}}/users/enter'\n              method: POST\n              headers:\n                - name: Content-Type\n                  value: application/json\n                - name: Accept\n                  value: application/json\n            response:\n              status: 201\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"user\": { \"user_id\": 42, \"username\": \"player_one\" },\n                    \"session\": { \"session_id\": 7001, \"expires_at\": 1788883200 },\n                    \"active_room\": null\n                  }\n          - name: 400 INVALID_REQUEST\n            request:\n              url: '{{baseUrl}}/users/enter'\n              method: POST\n              headers:\n                - name: Content-Type\n                  value: application/json\n                - name: Accept\n                  value: application/json\n            response:\n              status: 400\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"error\": {\n                      \"code\": \"INVALID_REQUEST\"\n                    }\n                  }\n          - name: 409 USERNAME_TAKEN\n            request:\n              url: '{{baseUrl}}/users/enter'\n              method: POST\n              headers:\n                - name: Content-Type\n                  value: application/json\n                - name: Accept\n                  value: application/json\n            response:\n              status: 409\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"error\": {\n                      \"code\": \"USERNAME_TAKEN\"\n                    }\n                  }\ndocs:\n  content: |-\n    # \uD83C\uDF10 ft_transcendence REST API\n\n    Welcome to the HTTP side of the `ft_transcendence` API. \uD83D\uDE80 This collection is a practical reference for onboarding, smoke testing, regression checks, and investigating the room lifecycle without guessing at undocumented endpoints.\n\n    ## \uD83C\uDFAF What this collection covers\n\n    - \uD83D\uDC64 Temporary username entry and session creation through `POST /users/enter`\n    - \u2795 Room creation through `POST /rooms`\n    - \uD83D\uDD17 Room joining through `POST /rooms/join`\n    - \uD83D\uDCCA Authoritative room snapshots through `GET /rooms/:room_id`\n    - \u2705 Successful response examples and \u274C contract-level error scenarios\n\n    ## \uD83C\uDF0D Before you send a request\n\n    1. Start the backend on `http://localhost:3000`.\n    2. Select the workspace-level `local` environment.\n    3. Run `Enter user` to create the host session. Set `guest_session_id` manually when testing the prepared guest join scenario.\n    4. Run `Create room as host` to populate `room_id` for the remaining smoke flow.\n\n    The base URL comes from `{{baseUrl}}`. Protected requests send `X-Session-Id`; this is temporary session authentication, not password, JWT, or production identity management. \uD83D\uDD10\n\n    ## \uD83E\uDDED Recommended workflow\n\n    `Enter user` \u2192 `Create room as host` \u2192 `Get room state` \u2192 `Join room` \u2192 `Get room state`\n\n    Runtime scripts chain the host session and room identifier between requests. `Join room` uses the prepared `guest_session_id` and is intentionally manual. Native examples group the known success and error outcomes under each endpoint.\n\n    ## \uD83D\uDCE4 Reading responses\n\n    Room responses are authoritative snapshots. Room states include `WAITING`, `READY`, `IN_PROGRESS`, and `FINISHED`; a room needs four players before the host can start a game through the shared WebSocket. Review the native response examples on each request before exercising a manual scenario.\n\n    > \u26A0\uFE0F **Prepared-state scenarios**\n    >\n    > Outsider access and in-progress/finished-room tests require IDs and sessions prepared outside the default smoke flow. Do not replace the documented placeholders with real secrets in Git.\n\n    ## \uD83D\uDD16 Version\n\n    This collection is version `1.1.0`. The version tracks the documented workspace structure and coverage, not a new backend API release.\n  type: text/markdown\nbundled: true\nextensions:\n  bruno:\n    exportedAt: '2026-09-09T13:24:03.122Z'\n    exportedUsing: Bruno/4.1.0\n";
