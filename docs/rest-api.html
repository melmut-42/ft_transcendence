m or null | yes | yes | `SPYMASTER`, `OPERATIVE`, `null` | Temporary role; null until selected |\n          | `data.players[].ready` | boolean | yes | no | `true`, `false` | Confirms current selections; selection change resets false |\n          | `data.players[].is_host` | boolean | yes | no | `true`, `false` | Exactly one true in non-empty room |\n          | `data.players[].joined_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Membership order |\n          | `data.game` | object or null | yes | yes | game object or `null` | Non-null in `IN_GAME` and `FINISHED` |\n          | `data.created_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Room creation time |\n\n          ## Game response fields\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `data.game.game_id` | integer | yes when game exists | no | positive | Match ID |\n          | `data.game.starting_team` | enum | yes | no | `RED`, `BLUE` | Team owning 9 cards and first clue |\n          | `data.game.current_turn.team` | enum | yes | no | `RED`, `BLUE` | Active team |\n          | `data.game.current_turn.phase` | enum | yes | no | `WAITING_FOR_CLUE`, `GUESSING`, `GAME_OVER` | Round phase |\n          | `data.game.current_turn.clue.word` | string | conditional | no | normalized one word, `1..30` chars | Present in `GUESSING`; final clue may remain in `GAME_OVER` |\n          | `data.game.current_turn.clue.number` | integer | conditional | no | `1..9` | Clue number `N` |\n          | `data.game.current_turn.guesses_remaining` | integer or null | yes | yes | `0..10`, or `null` | `N+1` at clue acceptance; null while waiting for clue |\n          | `data.game.score.red` | integer | yes | no | `0..9` | Revealed RED cards (either team may start with 9 \u2014 see workspace.yml Game Rules) |\n          | `data.game.score.blue` | integer | yes | no | `0..9` | Revealed BLUE cards (either team may start with 9 \u2014 see workspace.yml Game Rules) |\n          | `data.game.board[]` | array<object> | yes | no | exactly 25 unique cards | Fixed board order |\n          | `data.game.board[].card_id` | integer | yes | no | `1..25` unique | Slot identifier; carries zero affiliation information (`workspace.yml`, Card ID invariant) \u2014 the fixture example's `card_id`\u2194color pattern is illustrative only, not a rule |\n          | `data.game.board[].word` | string | yes | no | fixture word | Visible to both roles |\n          | `data.game.board[].revealed` | boolean | yes | no | `true`, `false` | Reveal state |\n          | `data.game.board[].color` | enum or null | yes | yes | `RED`, `BLUE`, `NEUTRAL`, `ASSASSIN`, `null` | Null only for unrevealed cards hidden from an Operative; Spymasters always receive color |\n          | `data.game.winner` | enum or null | yes | yes | `RED`, `BLUE`, `null` | Non-null only after terminal result |\n          | `data.game.end_reason` | enum or null | yes | yes | `ALL_TEAM_CARDS_REVEALED`, `ASSASSIN_REVEALED`, `null` | Terminal cause |\n          | `data.game.started_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Board creation/start time |\n          | `data.game.finished_at` | `string<date-time>` or null | yes | yes | ISO 8601 UTC or `null` | Terminal time |\n\n          ## State changes and events\n\n          Read-only and emits nothing. It does not advance countdown or turn state.\n\n          ## Errors and privacy invariant\n\n          `401 UNAUTHORIZED`, `404 ROOM_NOT_FOUND`, `403 NOT_ROOM_MEMBER`, `422 VALIDATION_ERROR`. Errors reveal no room state. The server projects every card for the authenticated viewer; an Operative never receives an unrevealed affiliation.\n        examples:\n          - name: Newly created room\n            request:\n              url: '{{baseUrl}}/api/rooms/1001'\n              method: GET\n            response:\n              status: 200\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"data\": {\n                      \"room_id\": 1001,\n                      \"status\": \"WAITING\",\n                      \"host_user_id\": 42,\n                      \"player_count\": 1,\n                      \"startable\": false,\n                      \"players\": [\n                        {\n                          \"user_id\": 42,\n                          \"username\": \"player_one\",\n                          \"team\": null,\n                          \"role\": null,\n                          \"ready\": false,\n                          \"is_host\": true,\n                          \"joined_at\": \"2026-09-10T08:41:00Z\"\n                        }\n                      ],\n                      \"game\": null,\n                      \"created_at\": \"2026-09-10T08:41:00Z\"\n                    }\n                  }\n          - name: Four joined - Not configured\n            request:\n              url: '{{baseUrl}}/api/rooms/1001'\n              method: GET\n            response:\n              status: 200\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"data\": {\n                      \"room_id\": 1001,\n                      \"status\": \"WAITING\",\n                      \"host_user_id\": 42,\n                      \"player_count\": 4,\n                      \"startable\": false,\n                      \"players\": [\n                        {\n                          \"user_id\": 42,\n                          \"username\": \"player_one\",\n                          \"team\": null,\n                          \"role\": null,\n                          \"ready\": false,\n                          \"is_host\": true,\n                          \"joined_at\": \"2026-09-10T08:41:00Z\"\n                        },\n                        {\n                          \"user_id\": 43,\n                          \"username\": \"red_agent\",\n                          \"team\": null,\n                          \"role\": null,\n                          \"ready\": false,\n                          \"is_host\": false,\n                          \"joined_at\": \"2026-09-10T08:41:20Z\"\n                        },\n                        {\n                          \"user_id\": 44,\n                          \"username\": \"blue_master\",\n                          \"team\": null,\n                          \"role\": null,\n                          \"ready\": false,\n                          \"is_host\": false,\n                          \"joined_at\": \"2026-09-10T08:41:30Z\"\n                        },\n                        {\n                          \"user_id\": 45,\n                          \"username\": \"blue_agent\",\n                          \"team\": null,\n                          \"role\": null,\n                          \"ready\": false,\n                          \"is_host\": false,\n                          \"joined_at\": \"2026-09-10T08:41:40Z\"\n                        }\n                      ],\n                      \"game\": null,\n                      \"created_at\": \"2026-09-10T08:41:00Z\"\n                    }\n                  }\n          - name: Teams selected - Roles incomplete\n            request:\n              url: '{{baseUrl}}/api/rooms/1001'\n              method: GET\n            response:\n              status: 200\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"data\": {\n                      \"room_id\": 1001,\n                      \"status\": \"WAITING\",\n                      \"host_user_id\": 42,\n                      \"player_count\": 4,\n                      \"startable\": false,\n                      \"players\": [\n                        {\n                          \"user_id\": 42,\n                          \"username\": \"player_one\",\n                          \"team\": \"RED\",\n                          \"role\": \"SPYMASTER\",\n                          \"ready\": false,\n                          \"is_host\": true,\n                          \"joined_at\": \"2026-09-10T08:41:00Z\"\n                        },\n                        {\n                          \"user_id\": 43,\n                          \"username\": \"red_agent\",\n                          \"team\": \"RED\",\n                          \"role\": null,\n                          \"ready\": false,\n                          \"is_host\": false,\n                          \"joined_at\": \"2026-09-10T08:41:20Z\"\n                        },\n                        {\n                          \"user_id\": 44,\n                          \"username\": \"blue_master\",\n                          \"team\": \"BLUE\",\n                          \"role\": \"SPYMASTER\",\n                          \"ready\": false,\n                          \"is_host\": false,\n                          \"joined_at\": \"2026-09-10T08:41:30Z\"\n                        },\n                        {\n                          \"user_id\": 45,\n                          \"username\": \"blue_agent\",\n                          \"team\": \"BLUE\",\n                          \"role\": null,\n                          \"ready\": false,\n                          \"is_host\": false,\n                          \"joined_at\": \"2026-09-10T08:41:40Z\"\n                        }\n                      ],\n                      \"game\": null,\n                      \"created_at\": \"2026-09-10T08:41:00Z\"\n                    }\n                  }\n          - name: Roles valid - Players not ready\n            request:\n              url: '{{baseUrl}}/api/rooms/1001'\n              method: GET\n            response:\n              status: 200\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"data\": {\n                      \"room_id\": 1001,\n                      \"status\": \"WAITING\",\n                      \"host_user_id\": 42,\n                      \"player_count\": 4,\n                      \"startable\": false,\n                      \"players\": [\n                        {\n                          \"user_id\": 42,\n                          \"username\": \"player_one\",\n                          \"team\": \"RED\",\n                          \"role\": \"SPYMASTER\",\n                          \"ready\": true,\n                          \"is_host\": true,\n                          \"joined_at\": \"2026-09-10T08:41:00Z\"\n                        },\n                        {\n                          \"user_id\": 43,\n                          \"username\": \"red_agent\",\n                          \"team\": \"RED\",\n                          \"role\": \"OPERATIVE\",\n                          \"ready\": true,\n                          \"is_host\": false,\n                          \"joined_at\": \"2026-09-10T08:41:20Z\"\n                        },\n                        {\n                          \"user_id\": 44,\n                          \"username\": \"blue_master\",\n                          \"team\": \"BLUE\",\n                          \"role\": \"SPYMASTER\",\n                          \"ready\": true,\n                          \"is_host\": false,\n                          \"joined_at\": \"2026-09-10T08:41:30Z\"\n                        },\n                        {\n                          \"user_id\": 45,\n                          \"username\": \"blue_agent\",\n                          \"team\": \"BLUE\",\n                          \"role\": \"OPERATIVE\",\n                          \"ready\": false,\n                          \"is_host\": false,\n                          \"joined_at\": \"2026-09-10T08:41:40Z\"\n                        }\n                      ],\n                      \"game\": null,\n                      \"created_at\": \"2026-09-10T08:41:00Z\"\n                    }\n                  }\n          - name: In game - Operative projection\n            request:\n              url: '{{baseUrl}}/api/rooms/1001'\n              method: GET\n            response:\n              status: 200\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"data\": {\n                      \"room_id\": 1001,\n                      \"status\": \"IN_GAME\",\n                      \"host_user_id\": 42,\n                      \"player_count\": 4,\n                      \"startable\": false,\n                      \"players\": [\n                        {\"user_id\":42,\"username\":\"player_one\",\"team\":\"RED\",\"role\":\"SPYMASTER\",\"ready\":true,\"is_host\":true,\"joined_at\":\"2026-09-10T08:41:00Z\"},\n                        {\"user_id\":43,\"username\":\"red_agent\",\"team\":\"RED\",\"role\":\"OPERATIVE\",\"ready\":true,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:20Z\"},\n                        {\"user_id\":44,\"username\":\"blue_master\",\"team\":\"BLUE\",\"role\":\"SPYMASTER\",\"ready\":true,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:30Z\"},\n                        {\"user_id\":45,\"username\":\"blue_agent\",\"team\":\"BLUE\",\"role\":\"OPERATIVE\",\"ready\":true,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:40Z\"}\n                      ],\n                      \"game\": {\n                        \"game_id\": 5001,\n                        \"starting_team\": \"RED\",\n                        \"current_turn\": {\"team\":\"RED\",\"phase\":\"WAITING_FOR_CLUE\",\"clue\":null,\"guesses_remaining\":null},\n                        \"score\": {\"red\":0,\"blue\":0},\n                        \"board\": [\n                          {\"card_id\":1,\"word\":\"MOON\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":2,\"word\":\"APPLE\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":3,\"word\":\"TRAIN\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":4,\"word\":\"BRIDGE\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":5,\"word\":\"OCEAN\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":6,\"word\":\"KING\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":7,\"word\":\"LASER\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":8,\"word\":\"FOREST\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":9,\"word\":\"DOCTOR\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":10,\"word\":\"GLASS\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":11,\"word\":\"DRAGON\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":12,\"word\":\"TABLE\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":13,\"word\":\"SATURN\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":14,\"word\":\"SNOW\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":15,\"word\":\"PIANO\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":16,\"word\":\"HEART\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":17,\"word\":\"ROME\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":18,\"word\":\"WHALE\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":19,\"word\":\"ROBOT\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":20,\"word\":\"CROWN\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":21,\"word\":\"DESERT\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":22,\"word\":\"SCREEN\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":23,\"word\":\"MOUSE\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":24,\"word\":\"KNIFE\",\"revealed\":false,\"color\":null},\n                          {\"card_id\":25,\"word\":\"CLOUD\",\"revealed\":false,\"color\":null}\n                        ],\n                        \"winner\": null,\n                        \"end_reason\": null,\n                        \"started_at\": \"2026-09-10T08:43:15Z\",\n                        \"finished_at\": null\n                      },\n                      \"created_at\": \"2026-09-10T08:41:00Z\"\n                    }\n                  }\n          - name: Error - Room not found\n            request:\n              url: '{{baseUrl}}/api/rooms/9999'\n              method: GET\n            response:\n              status: 404\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"error\":{\"code\":\"ROOM_NOT_FOUND\",\"message\":\"Room 9999 was not found.\",\"details\":{\"room_id\":9999}}}'\n          - name: Error - Not a member\n            request:\n              url: '{{baseUrl}}/api/rooms/1001'\n              method: GET\n            response:\n              status: 403\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"error\":{\"code\":\"NOT_ROOM_MEMBER\",\"message\":\"User 47 is not a member of room 1001.\",\"details\":{\"room_id\":1001,\"user_id\":47}}}'\n      - info:\n          name: Leave room\n          type: http\n          seq: 4\n          tags:\n            - rooms\n        http:\n          method: DELETE\n          url: '{{baseUrl}}/api/rooms/{{roomId}}/members/me'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # Leave room\n\n          ## Purpose and preconditions\n\n          Removes the authenticated member. Legal in every room status, including `IN_GAME` (Room Abandonment, `workspace.yml`) \u2014 an explicit leave during `IN_GAME` immediately triggers `PLAYER_FORFEIT` for that member's team rather than being rejected. Transport disconnect alone is not a leave; it starts the reconnect grace period instead, and only becomes this same effect if the grace period expires without reconnect.\n\n          ## Request parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `room_id` | path | yes | integer | positive | no | Room to leave | `1001` |\n          | `ft_session` cookie | request cookie | yes | string | active JWT access credential | no | Departing member | set by Register/Login |\n\n          ## Success and state changes\n\n          `204 No Content` clears the user's active room.\n\n          - **`WAITING` / `COUNTDOWN` / `FINISHED`:** emits `room.player.left` and a new `room.state` to remaining members. During `COUNTDOWN`, removal first cancels countdown and returns to `WAITING`. If the host leaves, host becomes the remaining member with the earliest `joined_at`; if none remain, status becomes `CLOSED`. Leaving a `FINISHED` room when the last member leaves also closes it.\n          - **`IN_GAME`:** triggers forfeit \u2014 the departing member's team loses, the opposite team wins. The room emits `game.ended` with `end_reason: \"PLAYER_FORFEIT\"`, `winner`/`loser`, current `score`, `room_status: \"FINISHED\"`, `phase: \"GAME_OVER\"`, and `revealed_card: null` (see WebSocket `04 - Game/guess-card.yml` for the sibling terminal-event shape). The room then behaves like any other `FINISHED` room.\n\n          ## Errors\n\n          `401 UNAUTHORIZED`, `404 ROOM_NOT_FOUND`, `403 NOT_ROOM_MEMBER`. There is no `409 INVALID_ROOM_STATE` for `IN_GAME` anymore \u2014 that state now resolves to a forfeit instead of being rejected. Errors do not change membership.\n        examples:\n          - name: Success - Member leaves waiting room\n            request:\n              url: '{{baseUrl}}/api/rooms/1001/members/me'\n              method: DELETE\n            response:\n              status: 204\n              body:\n                type: text\n                data: ''\n          - name: Success - Host leaves and ownership transfers\n            request:\n              url: '{{baseUrl}}/api/rooms/1001/members/me'\n              method: DELETE\n            response:\n              status: 204\n              body:\n                type: text\n                data: ''\n          - name: Success - Leave during IN_GAME triggers forfeit\n            request:\n              url: '{{baseUrl}}/api/rooms/1001/members/me'\n              method: DELETE\n            response:\n              status: 204\n              body:\n                type: text\n                data: ''\n          - name: Error - Not a room member\n            request:\n              url: '{{baseUrl}}/api/rooms/1001/members/me'\n              method: DELETE\n            response:\n              status: 403\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"error\":{\"code\":\"NOT_ROOM_MEMBER\",\"message\":\"User 47 is not a member of room 1001.\",\"details\":{\"room_id\":1001,\"user_id\":47}}}'\n      - info:\n          name: Lookup room by code\n          type: http\n          seq: 5\n          tags:\n            - rooms\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/rooms/lookup/ABCD12'\n          headers:\n            - name: Accept\n              value: application/json\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # Lookup room by code\n\n          ## Purpose\n\n          Resolves the human-shareable `room_code` shown in the Join Room UI to the internal `room_id` used by `Join room` and by the WebSocket path. Closes the contract gap between the prepared UI (room-code entry, e.g. `ABCD12`) and the existing `room_id`-keyed join/snapshot/WebSocket endpoints \u2014 no separate room-browsing/list endpoint exists or is required.\n\n          ## Preconditions and request parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `room_code` | path | yes | string | `^[A-Z0-9]{6}$`, case-insensitive on input | no | Code shown to the user | `ABCD12` |\n          | `ft_session` cookie | request cookie | yes | string | active JWT access credential | no | Requesting identity | set by Register/Login |\n          | `Accept` | header | yes | string | `application/json` | no | Requested response media type | `application/json` |\n\n          ## Success behavior and response fields\n\n          `200 OK` returns enough for a Join Room preview card without exposing full room contents. The caller does not need to be a member.\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `data.room_id` | integer | yes | no | positive | Resolved internal ID, pass to `Join room` |\n          | `data.room_code` | string | yes | no | normalized uppercase | Echoed input |\n          | `data.status` | string enum | yes | no | `WAITING`, `COUNTDOWN`, `IN_GAME`, `FINISHED`, `CLOSED` | Lifecycle state, used to grey out Join when not `WAITING` |\n          | `data.player_count` | integer | yes | no | `>= 1` | Current membership count |\n\n          ## State changes and events\n\n          Read-only; no event.\n\n          ## Errors\n\n          | Status | Code | When | State change |\n          | --- | --- | --- | --- |\n          | `401` | `UNAUTHORIZED` | invalid session | none |\n          | `404` | `ROOM_NOT_FOUND` | no active room has this code | none |\n          | `422` | `VALIDATION_ERROR` | code does not match `^[A-Za-z0-9]{6}$` | none |\n\n          ## Notes/invariants\n\n          This endpoint never returns `players[]`, `game`, or `host_user_id` \u2014 those require membership, via `Get room snapshot` after joining. Lookup does not create membership; the client still calls `Join room` with the resolved `room_id`.\n        examples:\n          - name: Success - Resolves to waiting room\n            request:\n              url: '{{baseUrl}}/api/rooms/lookup/ABCD12'\n              method: GET\n            response:\n              status: 200\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"data\": {\n                      \"room_id\": 1001,\n                      \"room_code\": \"ABCD12\",\n                      \"status\": \"WAITING\",\n                      \"player_count\": 1\n                    }\n                  }\n          - name: Error - Unknown code\n            request:\n              url: '{{baseUrl}}/api/rooms/lookup/ZZZZZZ'\n              method: GET\n            response:\n              status: 404\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"error\":{\"code\":\"ROOM_NOT_FOUND\",\"message\":\"No active room matches code ZZZZZZ.\",\"details\":{\"room_code\":\"ZZZZZZ\"}}}'\n          - name: Error - Malformed code\n            request:\n              url: '{{baseUrl}}/api/rooms/lookup/ab'\n              method: GET\n            response:\n              status: 422\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"error\":{\"code\":\"VALIDATION_ERROR\",\"message\":\"room_code must match ^[A-Za-z0-9]{6}$.\",\"details\":{\"field\":\"room_code\"}}}'\n  - info:\n      name: 04 - Error & State Examples\n      type: folder\n      seq: 4\n    docs:\n      content: |-\n        # Error and state examples\n\n        Cross-endpoint REST taxonomy and canonical room lifecycle index. Endpoint files remain authoritative for applicability; this folder prevents unrelated errors from being attached to every request.\n\n        ## Error envelope\n\n        ```json\n          {\n            \"error\": {\n              \"code\": \"ROOM_NOT_FOUND\",\n              \"message\": \"Room 9999 was not found.\",\n              \"details\": {\n                \"room_id\": 9999\n              }\n            }\n          }\n        ```\n\n        | HTTP | Code | Concrete message example | Applicable operations |\n        | ---: | --- | --- | --- |\n        | `422` | `INVALID_EMAIL` | `email must be a valid email address.` | register |\n        | `422` | `INVALID_USERNAME` | `Username must match ^[A-Za-z0-9_]{3,20}$.` | register |\n        | `422` | `INVALID_PASSWORD` | `password must be at least 8 characters.` | register |\n        | `409` | `EMAIL_TAKEN` | `Email 'player.one@example.com' is already registered.` | register |\n        | `409` | `USERNAME_TAKEN` | `Username 'player_one' is already registered.` | register |\n        | `401` | `INVALID_CREDENTIALS` | `Email or password is incorrect.` | login |\n        | `401` | `SESSION_EXPIRED` | `The refresh token is invalid or expired. Log in again.` | refresh |\n        | `401` | `UNAUTHORIZED` | `A valid active session is required.` | every other protected endpoint |\n        | `404` | `USER_NOT_FOUND` | `User 9999 was not found.` | public profile, add friend |\n        | `409` | `ALREADY_FRIENDS` | `User 43 is already a friend.` | add friend |\n        | `404` | `NOT_FRIENDS` | `User 9999 is not a friend.` | remove friend |\n        | `404` | `ROOM_NOT_FOUND` | `Room 9999 was not found.` | join, get, leave, lookup |\n        | `409` | `ROOM_NOT_JOINABLE` | `Room 1001 is not joinable while status is COUNTDOWN.` | join |\n        | `409` | `ALREADY_IN_ROOM` | `User 46 already belongs to active room 1002.` | create, join |\n        | `403` | `NOT_ROOM_MEMBER` | `User 47 is not a member of room 1001.` | get, leave |\n        | `422` | `INVALID_IMAGE` | `Avatar must be image/jpeg, image/png, or image/webp under 2 MiB.` | upload avatar |\n        | `400` or `422` | `VALIDATION_ERROR` | `user_id must be a positive integer.` | malformed JSON or field/path validation |\n        | `429` | `RATE_LIMITED` | `Too many registration attempts; retry after 60 seconds.` | throttled operation |\n\n        Malformed JSON uses `400 VALIDATION_ERROR`; syntactically valid values that fail field constraints use `422 VALIDATION_ERROR`, except the more specific `INVALID_EMAIL`/`INVALID_USERNAME`/`INVALID_PASSWORD`/`INVALID_IMAGE`. `SESSION_EXPIRED` is distinct from `UNAUTHORIZED`: it means the refresh credential itself is dead and the user must log in again, not merely that a request needs to retry after refreshing. Every error keeps state unchanged. **`Leave room` never returns `409 INVALID_ROOM_STATE` for `IN_GAME`** \u2014 leaving (or logging out) during `IN_GAME` succeeds and triggers forfeit (`workspace.yml`, Room Abandonment). `INVALID_ROOM_STATE` applies to the WebSocket room/game action errors documented in `06 - Errors/error-catalog.yml`.\n\n        ## State example index\n\n        `Get room snapshot` contains new, four-player unconfigured, incomplete-role, valid-role/unready, full `IN_GAME` Operative, missing-room, and forbidden-access examples. WebSocket scenario docs contain all-ready, countdown, cancellation, Spymaster `IN_GAME`, every reveal branch (including `PLAYER_FORFEIT`), and finished state.\n      type: text/markdown\n  - info:\n      name: 05 - Friends\n      type: folder\n      seq: 5\n    docs:\n      content: |-\n        # Friends\n\n        Minimum contract for the mandatory User Interaction module's friends feature (subject: chat/profile/friends). No friend-request/accept workflow \u2014 \"Add Friend\" is a single action with no pending state, so add is immediate and mutual. Online status is live presence (workspace.yml, Presence): at least one open authenticated connection, read fresh on every REST call (not push-updated over REST, but never a stale request-time-only snapshot either). Friend discovery beyond add-by-user_id uses `Search users`.\n      type: text/markdown\n    items:\n      - info:\n          name: List friends\n          type: http\n          seq: 1\n          tags:\n            - friends\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/friends'\n          headers:\n            - name: Accept\n              value: application/json\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # List friends\n\n          ## Purpose\n\n          Returns the authenticated user's friend list with live online/offline presence, for the Profile popup, which shows friend count, friend list and online/offline state.\n\n          ## Request parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `ft_session` cookie | request cookie | yes | string | active JWT access credential | no | Requesting identity | set by Register/Login |\n          | `Accept` | header | yes | string | `application/json` | no | Requested response media type | `application/json` |\n\n          ## Response fields\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `data.friend_count` | integer | yes | no | `>= 0` | Total friends |\n          | `data.friends[].user_id` | integer | yes | no | positive | Friend's user ID |\n          | `data.friends[].username` | string | yes | no | username rule | Friend's display name |\n          | `data.friends[].avatar_url` | string | yes | no | URL | Friend's avatar |\n          | `data.friends[].is_online` | boolean | yes | no | `true`, `false` | Live presence \u2014 at least one open authenticated connection (`workspace.yml`, Presence), not merely a request-time snapshot |\n\n          ## Errors\n\n          `401 UNAUTHORIZED` for an invalid session. Read-only; no event.\n        examples:\n          - name: Success - Two friends\n            request:\n              url: '{{baseUrl}}/api/friends'\n              method: GET\n            response:\n              status: 200\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"data\": {\n                      \"friend_count\": 2,\n                      \"friends\": [\n                        {\n                          \"user_id\": 43,\n                          \"username\": \"red_agent\",\n                          \"avatar_url\": \"https://{{baseUrl}}/static/avatars/default/43.svg\",\n                          \"is_online\": true\n                        },\n                        {\n                          \"user_id\": 44,\n                          \"username\": \"blue_master\",\n                          \"avatar_url\": \"https://{{baseUrl}}/static/avatars/default/44.svg\",\n                          \"is_online\": false\n                        }\n                      ]\n                    }\n                  }\n      - info:\n          name: Add friend\n          type: http\n          seq: 2\n          tags:\n            - friends\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/friends'\n          headers:\n            - name: Content-Type\n              value: application/json\n            - name: Accept\n              value: application/json\n          body:\n            type: json\n            data: |-\n              {\n                \"user_id\": 43\n              }\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # Add friend\n\n          ## Purpose\n\n          Adds another user to the authenticated user's friend list. Immediate and mutual \u2014 no pending/accept state (see folder docs).\n\n          ## Request parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `ft_session` cookie | request cookie | yes | string | active JWT access credential | no | Requesting identity | set by Register/Login |\n          | `user_id` | body | yes | integer | positive, existing user, not self | no | Target user | `43` |\n\n          ## Success behavior\n\n          `201 Created` adds the friendship both ways.\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `data.user_id` | integer | yes | no | positive | New friend |\n          | `data.username` | string | yes | no | username rule | New friend's display name |\n          | `data.avatar_url` | string | yes | no | URL | New friend's avatar |\n          | `data.is_online` | boolean | yes | no | `true`, `false` | Live presence |\n\n          ## Errors\n\n          | Status | Code | When |\n          | --- | --- | --- |\n          | `401` | `UNAUTHORIZED` | invalid session |\n          | `404` | `USER_NOT_FOUND` | `user_id` does not exist |\n          | `409` | `ALREADY_FRIENDS` | friendship already exists |\n          | `422` | `VALIDATION_ERROR` | `user_id` missing/non-integer, or equals the requester |\n        examples:\n          - name: Success - Add red_agent\n            request:\n              url: '{{baseUrl}}/api/friends'\n              method: POST\n              headers:\n                - name: Content-Type\n                  value: application/json\n            response:\n              status: 201\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"data\": {\n                      \"user_id\": 43,\n                      \"username\": \"red_agent\",\n                      \"avatar_url\": \"https://{{baseUrl}}/static/avatars/default/43.svg\",\n                      \"is_online\": true\n                    }\n                  }\n          - name: Error - Already friends\n            request:\n              url: '{{baseUrl}}/api/friends'\n              method: POST\n            response:\n              status: 409\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"error\":{\"code\":\"ALREADY_FRIENDS\",\"message\":\"User 43 is already a friend.\",\"details\":{\"user_id\":43}}}'\n      - info:\n          name: Remove friend\n          type: http\n          seq: 3\n          tags:\n            - friends\n        http:\n          method: DELETE\n          url: '{{baseUrl}}/api/friends/43'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # Remove friend\n\n          ## Purpose\n\n          Removes an existing friendship both ways.\n\n          ## Request parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `user_id` | path | yes | integer | positive | no | Friend to remove | `43` |\n          | `ft_session` cookie | request cookie | yes | string | active JWT access credential | no | Requesting identity | set by Register/Login |\n\n          ## Success and errors\n\n          `204 No Content` on success. `401 UNAUTHORIZED` for invalid session; `404 NOT_FRIENDS` when no friendship exists.\n        examples:\n          - name: Success - Remove red_agent\n            request:\n              url: '{{baseUrl}}/api/friends/43'\n              method: DELETE\n            response:\n              status: 204\n              body:\n                type: text\n                data: ''\n          - name: Error - Not friends\n            request:\n              url: '{{baseUrl}}/api/friends/9999'\n              method: DELETE\n            response:\n              status: 404\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: '{\"error\":{\"code\":\"NOT_FRIENDS\",\"message\":\"User 9999 is not a friend.\",\"details\":{\"user_id\":9999}}}'\n      - info:\n          name: Search users\n          type: http\n          seq: 4\n          tags:\n            - friends\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/users/search?q=red'\n          headers:\n            - name: Accept\n              value: application/json\n          params:\n            - name: q\n              value: red\n              type: query\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # Search users\n\n          ## Purpose and preconditions\n\n          Friend discovery (`workspace.yml`, Friends, Presence, and Chat Scope): add-by-`user_id`-only is too hard for normal use, so this adds a minimal authenticated username search. Requires an active session.\n\n          ## Request parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `ft_session` cookie | request cookie | yes | string | active JWT access credential | no | Requesting identity | set by Register/Login |\n          | `q` | query | yes | string | trimmed, `1..20` chars | no | Case-insensitive username substring | `red` |\n\n          ## Response fields\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `data.results[]` | array<object> | yes | no | up to 20 matches | Ranked by prefix match, then alphabetically |\n          | `data.results[].user_id` | integer | yes | no | positive | Matched user |\n          | `data.results[].username` | string | yes | no | username rule | Matched username |\n          | `data.results[].avatar_url` | string | yes | no | URL | Avatar |\n          | `data.results[].is_friend` | boolean | yes | no | `true`, `false` | Whether already a friend of the requester |\n\n          No email, credentials, or session data is ever exposed by this endpoint \u2014 same privacy boundary as `Get public profile`.\n\n          ## Errors\n\n          | Status | Code | When |\n          | --- | --- | --- |\n          | `401` | `UNAUTHORIZED` | invalid session |\n          | `422` | `VALIDATION_ERROR` | `q` missing or empty |\n        examples:\n          - name: Success - Matches for \"red\"\n            request:\n              url: '{{baseUrl}}/api/users/search?q=red'\n              method: GET\n              params:\n                - name: q\n                  value: red\n                  type: query\n            response:\n              status: 200\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"data\": {\n                      \"results\": [\n                        {\"user_id\": 43, \"username\": \"red_agent\", \"avatar_url\": \"https://{{baseUrl}}/static/avatars/default/43.svg\", \"is_friend\": false},\n                        {\"user_id\": 46, \"username\": \"extra_red\", \"avatar_url\": \"https://{{baseUrl}}/static/avatars/default/46.svg\", \"is_friend\": false}\n                      ]\n                    }\n                  }\n  - info:\n      name: 00 - Contract & Health\n      type: folder\n    docs:\n      content: |-\n        # Contract and health\n\n        Service-level metadata and a non-authenticated health check. Health confirms process availability and contract version only; it does not prove database, room, or realtime gameplay correctness.\n      type: text/markdown\n    items:\n      - info:\n          name: Health and contract version\n          type: http\n          seq: 1\n          tags:\n            - contract\n            - health\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/health'\n          headers:\n            - name: Accept\n              value: application/json\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                test(\"returns the development contract version\", function () {\n                  expect(res.status).to.equal(200);\n                  expect(res.body.data.status).to.equal(\"OK\");\n                  expect(res.body.data.contract_version).to.equal(\"1.0.0-dev\");\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: |-\n          # Health and contract version\n\n          ## Purpose\n\n          Confirms that the HTTP process is reachable and declares the API contract version it serves. This endpoint is not an end-to-end gameplay readiness probe.\n\n          ## Preconditions and request\n\n          No session or request body is required.\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | --- | --- | --- | --- | --- | --- |\n          | `Accept` | header | yes | string | `application/json` | no | Requested response media type | `application/json` |\n\n          ## Success and response fields\n\n          `200 OK` uses the normal success envelope.\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `data.status` | string enum | yes | no | `OK` | Process is serving requests |\n          | `data.contract_version` | string | yes | no | `1.0.0-dev` | Implemented contract revision |\n          | `data.server_time` | `string<date-time>` | yes | no | ISO 8601 UTC | Server clock at response creation |\n\n          ## State changes and events\n\n          None. No WebSocket event is emitted.\n\n          ## Errors and invariants\n\n          Infrastructure may return `503 Service Unavailable` with `SERVICE_UNAVAILABLE`; application authentication errors do not apply. A successful response does not assert that persistence or WebSocket subsystems are healthy.\n        examples:\n          - name: Success - Service available\n            request:\n              url: '{{baseUrl}}/api/health'\n              method: GET\n              headers:\n                - name: Accept\n                  value: application/json\n            response:\n              status: 200\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"data\": {\n                      \"status\": \"OK\",\n                      \"contract_version\": \"1.0.0-dev\",\n                      \"server_time\": \"2026-09-10T08:40:00Z\"\n                    }\n                  }\n          - name: Error - Service unavailable\n            request:\n              url: '{{baseUrl}}/api/health'\n              method: GET\n              headers:\n                - name: Accept\n                  value: application/json\n            response:\n              status: 503\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"error\": {\n                      \"code\": \"SERVICE_UNAVAILABLE\",\n                      \"message\": \"The API is temporarily unavailable.\",\n                      \"details\": {}\n                    }\n                  }\ndocs:\n  content: |-\n    # ft_transcendence REST API\n\n    ## Transport and session\n\n    Base URL: `{{baseUrl}}` (`http://localhost:3000` locally). JSON requests send `Content-Type: application/json`; JSON responses send the same media type. Protected endpoints require the `ft_session` cookie (HttpOnly, `Secure`, `SameSite=Lax`, `Path=/`) \u2014 sent automatically by a browser, and by Bruno through its cookie jar. There is no header-based credential and no token value in any response body; see `workspace.yml`, Session and Credential Model. `POST /api/auth/refresh` reads the separate `ft_refresh` cookie (`Path=/api/auth/refresh`) and reissues both cookies. Tokens are never URL parameters.\n\n    ## Response envelopes\n\n    Every non-empty success is `{ \"data\": value }`. `204 No Content` has no body. Every error is `{ \"error\": { \"code\": string, \"message\": string, \"details\": object } }`; `details` is always an object and may be empty.\n\n    ## Endpoint matrix\n\n    | Method | Path | Purpose | Auth | Main requirement |\n    | --- | --- | --- | --- | --- |\n    | `GET` | `/api/health` | Contract/service health | no | none |\n    | `POST` | `/api/auth/register` | Create account + issue session pair | no | unique email + username |\n    | `POST` | `/api/auth/login` | Issue a new session pair | no | valid email + password |\n    | `POST` | `/api/auth/refresh` | Exchange refresh token for new access token | refresh token | unexpired, unrevoked refresh token |\n    | `GET` | `/api/auth/session` | Read current session identity | yes | active access token |\n    | `DELETE` | `/api/auth/session` | Revoke current session (forfeits an `IN_GAME` room first) | yes | active access token |\n    | `GET` | `/api/users/me` | Own persistent profile | yes | active session |\n    | `PATCH` | `/api/users/me` | Update own profile (`username`) | yes | active session |\n    | `POST` | `/api/users/me/avatar` | Upload/replace avatar | yes | active session, valid image |\n    | `GET` | `/api/users/me/matches` | Own match history (paginated) | yes | active session |\n    | `GET` | `/api/users/{user_id}` | Public persistent profile | yes | user exists |\n    | `GET` | `/api/users/search?q=` | Username search for friend discovery | yes | active session |\n    | `POST` | `/api/rooms` | Create and host a room | yes | not in active room |\n    | `POST` | `/api/rooms/{room_id}/members` | Join a room | yes | `WAITING`, not in active room |\n    | `GET` | `/api/rooms/{room_id}` | Role-safe room/game snapshot | yes | room member |\n    | `DELETE` | `/api/rooms/{room_id}/members/me` | Leave room (forfeits if `IN_GAME`) | yes | room member |\n    | `GET` | `/api/rooms/lookup/{room_code}` | Resolve room code to room ID | yes | active room with that code |\n    | `GET` | `/api/friends` | List friends with snapshot presence | yes | active session |\n    | `POST` | `/api/friends` | Add a friend (immediate, mutual) | yes | target user exists, not self |\n    | `DELETE` | `/api/friends/{user_id}` | Remove a friend | yes | friendship exists |\n\n    ## Status conventions\n\n    `200` reads/updates; `201` creation/join/add; `204` session deletion or leave/remove; `400` malformed syntax; `401` authentication (`UNAUTHORIZED` for a bad access credential, `SESSION_EXPIRED` for a bad refresh credential); `403` access; `404` missing entity; `409` uniqueness/lifecycle conflict; `422` field validation; `429` throttling.\n\n    ## Domain and lifetime\n\n    IDs are positive integers, timestamps are ISO 8601 UTC, JSON is snake_case, and enums are UPPER_SNAKE_CASE. Profiles expose persistent `username`, `avatar_url`, `wins`, `losses`, `level`, and match history. Room team, role, readiness, board, clue, turn, and score are temporary. `room_id` (internal, path key) and `room_code` (`^[A-Z0-9]{6}$`, human-shareable) are distinct and never interchangeable \u2014 see `workspace.yml`, Room Identifier Consistency.\n\n    ## REST/WebSocket boundary\n\n    REST bootstraps identity, session refresh, profile/avatar, friends, and membership, and returns recoverable snapshots. Team/role/readiness and gameplay mutations are WebSocket-only. The REST room snapshot is server-authoritative and recipient-specific: an Operative never receives unrevealed card colors. `Leave room` is now legal in every room status, including `IN_GAME` (it forfeits the match \u2014 see `workspace.yml`, Room Abandonment).\n\n    ## Example index\n\n    - Minimum and invalid waiting rooms: `03 - Rooms/Get room snapshot`\n    - Joinability and membership failures: `03 - Rooms/Join room`\n    - Complete started-game Operative projection: `03 - Rooms/Get room snapshot`\n    - Room-code join preview: `03 - Rooms/Lookup room by code`\n    - Countdown and both role projections: WebSocket `07 - Full State Scenarios`\n    - Clue and all reveal outcomes, plus forfeit: WebSocket `04 - Game`\n\n    ## Environment\n\n    Select `local`. Bruno authenticates through its cookie jar exactly like a browser \u2014 Register/Login/Refresh set `ft_session`/`ft_refresh` cookies automatically, no variable wiring needed. Registration stores `userId`; room creation stores `roomId`. The canonical fixtures use users `42` through `47`, room `1001`, and game `5001`.\n  type: text/markdown\nbundled: true\nextensions:\n  bruno:\n    exportedAt: '2026-09-19T21:51:27.804Z'\n    exportedUsing: Bruno/4.1.0\n";
