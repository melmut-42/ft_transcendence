dshake problems.\n\n          ## \uD83D\uDD0C Connection\n\n          `{{wsUrl}}/ws?session_id={{session_id}}`\n\n          The session is supplied in the `session_id` query parameter. REST's `X-Session-Id` header is not used for the WebSocket handshake.\n\n          ## \uD83D\uDCE5 Message behavior\n\n          This request sends no outgoing message. Use it to establish a connection or observe incoming frames.\n\n          ## \uD83D\uDCE4 Expected observation\n\n          Observe the documented error envelope or error code associated with the deliberate failure.\n\n          ## \uD83E\uDDED Typical workflow\n\n          Open an authenticated connection when required, perform a deliberate test action, and compare the captured frame with the documented envelope.\n\n          ## \uD83E\uDDEA Testing guidance\n\n          Confirm the error event, code, and message, then verify that state remains unchanged.\n\n          > \uD83D\uDCA1 **Tip**\n          >\n          > Use the `local` environment, keep session values out of Git, and run one state-changing message at a time.\n\n          ## \uD83D\uDCCC Contract boundary\n\n          Event names and the verified `give_clue` example are documented from the known contract. Undocumented client and server payload fields are intentionally left unguessed.\n      - info:\n          name: error_code_catalog\n          type: websocket\n          seq: 2\n          tags:\n            - error\n            - documentation\n        websocket:\n          url: '{{wsUrl}}/ws?session_id={{session_id}}'\n        docs: |-\n          # \u26A1 error_code_catalog\n\n          ## \uD83D\uDCDD Overview\n\n          Documents the WebSocket error behavior and known failure vocabulary associated with rejected actions or handshake problems.\n\n          ## \uD83D\uDD0C Connection\n\n          `{{wsUrl}}/ws?session_id={{session_id}}`\n\n          The session is supplied in the `session_id` query parameter. REST's `X-Session-Id` header is not used for n          type: websocket\n          seq: 1\n          tags:\n            - interactive\n            - smoke\n        websocket:\n          url: '{{wsUrl}}/ws?session_id={{session_id}}'\n        docs: |-\n          # \u26A1 connect\n\n          ## \uD83D\uDCDD Overview\n\n          Establishes or deliberately tests the shared WebSocket handshake for `connect`. The socket carries room and game events after the transport connection is accepted.\n\n          ## \uD83D\uDD0C Connection\n\n          `{{wsUrl}}/ws?session_id={{session_id}}`\n\n          The session is supplied in the `session_id` query parameter. REST's `X-Session-Id` header is not used for the WebSocket handshake.\n\n          ## \uD83D\uDCE5 Message behavior\n\n          This request sends no outgoing message. Use it to establish a connection or observe incoming frames.\n\n          ## \uD83D\uDCE4 Expected observation\n\n          Observe the handshake, server event, or error frame in Bruno's WebSocket message history.\n\n          ## \uD83E\uDDED Typical workflow\n\n          Run the REST bootstrap first, populate a valid runtime session when appropriate, and then open the connection. Inspect the handshake result before selecting event or action messages.\n\n          ## \uD83E\uDDEA Testing guidance\n\n          Confirm the handshake outcome and keep session values in local secret storage.\n\n          > \uD83D\uDCA1 **Tip**\n          >\n          > Use the `local` environment, keep session values out of Git, and run one state-changing message at a time.\n\n          ## \uD83D\uDCCC Contract boundary\n\n          Event names and the verified `give_clue` example are documented from the known contract. Undocumented client and server payload fields are intentionally left unguessed.\n      - info:\n          name: connect_without_session\n          type: websocket\n          seq: 2\n          tags:\n            - manual\n            - negative\n        websocket:\n          url: '{{wsUrl}}/ws'\n et carries room and game events after the transport connection is accepted.\n\n          ## \uD83D\uDD0C Connection\n\n          `{{wsUrl}}/ws?session_id=invalid-session`\n\n          The URL deliberately contains an invalid session placeholder; use it to verify the backend's unauthorized handshake behavior.\n\n          ## \uD83D\uDCE5 Message behavior\n\n          This request sends no outgoing message. Use it to establish a connection or observe incoming frames.\n\n          ## \uD83D\uDCE4 Expected observation\n\n          Observe the handshake, server event, or error frame in Bruno's WebSocket message history.\n\n          ## \uD83E\uDDED Typical workflow\n\n          Run the REST bootstrap first, populate a valid runtime session when appropriate, and then open the connection. Inspect the handshake result before selecting event or action messages.\n\n          ## \uD83E\uDDEA Testing guidance\n\n          Confirm the handshake outcome and keep session values in local secret storage.\n\n          > \uD83D\uDCA1 **Tip**\n          >\n          > Use the `local` environment, keep session values out of Git, and run one state-changing message at a time.\n\n          ## \uD83D\uDCCC Contract boundary\n\n          Event names and the verified `give_clue` example are documented from the known contract. Undocumented client and server payload fields are intentionally left unguessed.\ndocs:\n  content: |-\n    # \u26A1 ft_transcendence WebSocket API\n\n    Welcome to the real-time API reference. \uD83D\uDD0C This collection documents the single shared room/game socket, its connection lifecycle, known client actions, server event names, and the error envelope used for rejected actions.\n\n    ## \uD83C\uDFAF What this collection covers\n\n    - \uD83D\uDD0C Authenticated, missing-session, and invalid-session connection scenarios\n    - \uD83C\uDFAE Client actions: `leave_room`, `start_game`, `give_clue`, `reveal_card`, and `end_turn`\n    - \uD83D\uDCE1 Server events: player lifecycle, game lifecycle, turn changes, card reveals, and action logging\n    - \u274C Error observation using the known `{ event, data: { code, message } }` envelope\n\n    ## \uD83D\uDD0C Connection details\n\n    Connect with:\n\n    `{{wsUrl}}/ws?session_id={{session_id}}`\n\n    Select the `local` environment so `wsUrl` resolves to `ws://localhost:3000`. WebSocket authentication uses the `session_id` query parameter during the handshake; it does not use the REST `X-Session-Id` header. \uD83D\uDD10\n\n    ## \uD83E\uDDED Real-time workflow\n\n    1. \uD83C\uDF0D Select `local` and obtain a temporary session from the REST collection.\n    2. \uD83D\uDD0C Open `connect` and confirm the socket is established.\n    3. \uD83D\uDC65 Prepare the required room membership and role/state.\n    4. \uD83D\uDCE5 Select one client action only when its preconditions are satisfied.\n    5. \uD83D\uDCE4 Observe server events and error frames in Bruno's message history.\n\n    The server validates identity, membership, role, turn, and game state. Rejected actions must not mutate state or create a successful action log.\n\n    > \u26A0\uFE0F **Payload accuracy**\n    >\n    > `give_clue` is the only client action with a verified field-level payload in the current contract. Other action requests remain disabled reference scaffolds; their fields must not be invented.\n\n    ## \uD83E\uDDEA Testing guidance\n\n    Use the connection and event requests individually. Do not batch-run the complete collection: some requests are passive observers, some are interactive, and several require a prepared game state. Review the `error_envelope` request when testing invalid actions.\n\n    ## \uD83D\uDD16 Version\n\n    This collection is version `1.1.0`, matching the REST collection's documentation and consistency pass.\n  type: text/markdown\nbundled: true\nextensions:\n  bruno:\n    exportedAt: '2026-09-09T13:25:12.454Z'\n    exportedUsing: Bruno/4.1.0\n";
