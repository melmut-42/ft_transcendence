    <div id="opencollection-container"></div>
    <script>
        const collectionData = "opencollection: 1.0.0\ninfo:\n  name: WebSocket\n  version: 1.0.0-draft\nconfig:\n  proxy:\n    inherit: true\n    config:\n      protocol: http\n      hostname: ''\n      port: ''\n      auth:\n        username: ''\n        password: ''\n      bypassProxy: ''\nitems:\n  - info:\n      name: 01 - Room Lobby\n      type: folder\n      seq: 1\n    docs:\n      content: |-\n        # Room lobby\n\n        This folder documents server membership events created by REST join/leave operations. Join is legal only in `WAITING`. Every join or leave causes the server to re-evaluate startability. Host transfer is deterministic by earliest `joined_at` among remaining members.\n      type: text/markdown\n    items:\n      - info:\n          name: Membership event reference\n          type: websocket\n          seq: 1\n          tags:\n            - server-event\n            - room\n        websocket:\n          url: '{{wsUrl}}/ws/rooms/{{roomId}}'\n          headers:\n            - name: X-Session-Id\n              value: '{{sessionToken}}'\n        docs: |-\n          # Membership event reference\n\n          ## Purpose and trigger\n\n          Observes membership events produced by REST join/leave. This request sends no application message. `room.player.joined` occurs only in `WAITING`; `room.player.left` may occur in `WAITING`, `COUNTDOWN`, or `FINISHED`.\n\n          ## Connection parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `room_id` | WebSocket path | yes | integer | positive | no | Observed room | `1001` |\n          | `X-Session-Id` | handshake header | yes | string | active member session | no | Recipient identity | `sess_7Hk2mQ9vLc4R8pXa` |\n\n          ## Event fields\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `type` | string enum | yes | no | `room.player.joined`, `room.player.left` | Membership change |\n          | `event_id` | string | yes | no | room-unique | Ordered event ID |\n          | `room_id` | integer | yes | no | positive | Affected room |\n          | `sent_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Event time |\n          | `payload.player` | object | yes | no | member schema | Joined/left identity and temporary selections at change time |\n          | `payload.player.user_id` | integer | yes | no | positive | Affected member |\n          | `payload.player.username` | string | yes | no | username rule | Affected username |\n          | `payload.player.team` | enum or null | yes | yes | `RED`, `BLUE`, `null` | Temporary team |\n          | `payload.player.role` | enum or null | yes | yes | `SPYMASTER`, `OPERATIVE`, `null` | Temporary role |\n          | `payload.player.ready` | boolean | yes | no | `true`, `false` | Readiness at change time |\n          | `payload.host_user_id` | integer or null | yes | yes | remaining member ID or `null` | Host after change; null only when room closes empty |\n          | `payload.player_count` | integer | yes | no | `>= 0` | Membership after change |\n          | `payload.room_status` | enum | yes | no | `WAITING`, `FINISHED`, `CLOSED` | State after membership processing |\n\n          ## State behavior and ordering\n\n          Join initializes team/role to null and ready false. Leave clears the user's active room. Host leave transfers to the remaining earliest `joined_at`. Countdown leave first produces `room.countdown.cancelled`, then `room.player.left`, then `room.state`.\n\n          ## Concrete events\n\n          ```json\n          {\"type\":\"room.player.joined\",\"event_id\":\"evt_0104\",\"room_id\":1001,\"sent_at\":\"2026-09-10T08:41:20Z\",\"payload\":{\"player\":{\"user_id\":43,\"username\":\"red_agent\",\"team\":null,\"role\":null,\"ready\":false,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:20Z\"},\"host_user_id\":42,\"player_count\":2,\"room_status\":\"WAITING\"}}\n          ```\n\n          ```json\n          {\"type\":\"room.player.left\",\"event_id\":\"evt_0110\",\"room_id\":1001,\"sent_at\":\"2026-09-10T08:42:05Z\",\"payload\":{\"player\":{\"user_id\":42,\"username\":\"player_one\",\"team\":\"RED\",\"role\":\"SPYMASTER\",\"ready\":false,\"is_host\":true,\"joined_at\":\"2026-09-10T08:41:00Z\"},\"host_user_id\":43,\"player_count\":3,\"room_status\":\"WAITING\"}}\n          ```\n\n          No client command error applies because the source operation is REST; consult the REST join/leave requests for errors.\n  - info:\n      name: 02 - Team & Role\n      type: folder\n      seq: 2\n    docs:\n      content: |-\n        # Team and role\n\n        Members select exactly one team (`RED | BLUE`) and one room role (`SPYMASTER | OPERATIVE`) during `WAITING`. A team may have exactly one Spymaster. A selection change is also accepted during `COUNTDOWN` specifically so it can cancel the countdown. Changing team or role clears `ready`, emits `room.player.updated`, re-evaluates startability, and returns an active countdown to `WAITING`.\n      type: text/markdown\n    items:\n      - info:\n          name: Select team\n          type: websocket\n          seq: 1\n          tags:\n            - action\n            - room\n        websocket:\n          url: '{{wsUrl}}/ws/rooms/{{roomId}}'\n          headers:\n            - name: X-Session-Id\n              value: '{{sessionToken}}'\n          message:\n            - title: Success - Select RED\n              message:\n                type: json\n                data: '{\"type\":\"room.team.select\",\"request_id\":\"req_0001\",\"payload\":{\"team\":\"RED\"}}'\n            - title: Success - Select BLUE\n              message:\n                type: json\n                data: '{\"type\":\"room.team.select\",\"request_id\":\"req_0002\",\"payload\":{\"team\":\"BLUE\"}}'\n            - title: Success - Change team resets ready\n              message:\n                type: json\n                data: '{\"type\":\"room.team.select\",\"request_id\":\"req_0003\",\"payload\":{\"team\":\"BLUE\"}}'\n            - title: Error - Invalid team\n              message:\n                type: json\n                data: '{\"type\":\"room.team.select\",\"request_id\":\"req_0004\",\"payload\":{\"team\":\"GREEN\"}}'\n        docs: |-\n          # Select team\n\n          ## Purpose and preconditions\n\n          Selects the authenticated member's temporary team. Allowed in `WAITING`; during `COUNTDOWN`, a change is accepted, clears readiness, cancels countdown, and returns the room to `WAITING`. No host privilege is required.\n\n          ## Message and payload parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `room_id` | WebSocket path | yes | integer | positive | no | Connected room | `1001` |\n          | `X-Session-Id` | handshake header | yes | string | active opaque token | no | Authenticated member | `sess_7Hk2mQ9vLc4R8pXa` |\n          | `type` | envelope | yes | string enum | `room.team.select` | no | Operation | `room.team.select` |\n          | `request_id` | envelope | yes | string | `1..64` visible ASCII, unique per session | no | Idempotency key | `req_0001` |\n          | `payload.team` | payload | yes | string enum | `RED`, `BLUE` | no | New temporary team | `RED` |\n\n          ## Success, state, and emitted events\n\n          The requester receives `{\"type\":\"ack\",\"request_id\":\"req_0001\",\"ok\":true,\"payload\":{\"user_id\":42,\"team\":\"RED\",\"role\":null,\"ready\":false,\"room_status\":\"WAITING\"}}`. The server emits `room.player.updated` then `room.state`. If team changes, the existing role remains only if it does not create a Spymaster conflict on the destination team; otherwise the command is rejected. Every successful team change sets `ready=false` and re-evaluates startability. During `COUNTDOWN`, event order is `room.player.updated`, `room.countdown.cancelled` with reason `TEAM_CHANGED`, then `room.state`.\n\n          The BLUE selection example returns `{\"type\":\"ack\",\"request_id\":\"req_0002\",\"ok\":true,\"payload\":{\"user_id\":44,\"team\":\"BLUE\",\"role\":null,\"ready\":false,\"room_status\":\"WAITING\"}}`.\n\n          The countdown team-change example returns `{\"type\":\"ack\",\"request_id\":\"req_0003\",\"ok\":true,\"payload\":{\"user_id\":46,\"team\":\"BLUE\",\"role\":\"OPERATIVE\",\"ready\":false,\"room_status\":\"WAITING\"}}` and emits cancellation reason `TEAM_CHANGED`.\n\n          Updated event:\n\n          ```json\n          {\"type\":\"room.player.updated\",\"event_id\":\"evt_0111\",\"room_id\":1001,\"sent_at\":\"2026-09-10T08:42:10Z\",\"payload\":{\"player\":{\"user_id\":42,\"username\":\"player_one\",\"team\":\"RED\",\"role\":null,\"ready\":false,\"is_host\":true,\"joined_at\":\"2026-09-10T08:41:00Z\"},\"changed_fields\":[\"team\"],\"room_status\":\"WAITING\",\"startable\":false}}\n          ```\n\n          | Result field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `ack.payload.user_id` | integer | yes | no | positive | Updated member |\n          | `ack.payload.team` | enum | yes | no | `RED`, `BLUE` | Accepted team |\n          | `ack.payload.role` | enum or null | yes | yes | `SPYMASTER`, `OPERATIVE`, `null` | Retained role when valid |\n          | `ack.payload.ready` | boolean | yes | no | `false` | Reset confirmation |\n          | `ack.payload.room_status` | enum | yes | no | `WAITING` | Post-command state, including cancelled countdown |\n          | `event.payload.changed_fields[]` | array<string enum> | yes | no | `team`, plus `ready` when it changed | Fields changed atomically |\n          | `event.payload.startable` | boolean | yes | no | `true`, `false` | Full predicate after update |\n\n          ## Errors\n\n          `INVALID_PAYLOAD` for missing/unknown team; `NOT_ROOM_MEMBER`; `INVALID_ROOM_STATE` outside `WAITING` and `COUNTDOWN`; `ROLE_CONFLICT` if moving an existing Spymaster would duplicate the destination Spymaster. Errors preserve all state and keep the socket open.\n\n          ```json\n          {\"type\":\"error\",\"request_id\":\"req_0004\",\"error\":{\"code\":\"INVALID_PAYLOAD\",\"message\":\"payload.team must be RED or BLUE.\",\"details\":{\"field\":\"payload.team\"}}}\n          ```\n      - info:\n          name: Select role\n          type: websocket\n          seq: 2\n          tags:\n            - action\n            - room\n        websocket:\n          url: '{{wsUrl}}/ws/rooms/{{roomId}}'\n          headers:\n            - name: X-Session-Id\n              value: '{{sessionToken}}'\n          message:\n            - title: Success - Select RED Spymaster\n              message:\n                type: json\n                data: '{\"type\":\"room.role.select\",\"request_id\":\"req_0005\",\"payload\":{\"role\":\"SPYMASTER\"}}'\n            - title: Success - Select BLUE Operative\n              message:\n                type: json\n                data: '{\"type\":\"room.role.select\",\"request_id\":\"req_0006\",\"payload\":{\"role\":\"OPERATIVE\"}}'\n            - title: Success - Change Operative to Spymaster\n              message:\n                type: json\n                data: '{\"type\":\"room.role.select\",\"request_id\":\"req_0007\",\"payload\":{\"role\":\"SPYMASTER\"}}'\n            - title: Error - Spymaster already occupied\n              message:\n                type: json\n                data: '{\"type\":\"room.role.select\",\"request_id\":\"req_0008\",\"payload\":{\"role\":\"SPYMASTER\"}}'\n            - title: Error - No team selected\n              message:\n                type: json\n                data: '{\"type\":\"room.role.select\",\"request_id\":\"req_0009\",\"payload\":{\"role\":\"OPERATIVE\"}}'\n            - title: Error - Game already started\n              message:\n                type: json\n                data: '{\"type\":\"room.role.select\",\"request_id\":\"req_0010\",\"payload\":{\"role\":\"OPERATIVE\"}}'\n        docs: |-\n          # Select role\n\n          ## Purpose and preconditions\n\n          Selects the member's temporary room role. The member must first choose `RED` or `BLUE`. It is allowed in `WAITING`; during `COUNTDOWN`, a change clears readiness, cancels countdown, and returns the room to `WAITING`.\n\n          ## Message and payload parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `room_id` | WebSocket path | yes | integer | positive | no | Connected room | `1001` |\n          | `X-Session-Id` | handshake header | yes | string | active opaque token | no | Authenticated member | `sess_A3redAgent9Kp` |\n          | `type` | envelope | yes | string enum | `room.role.select` | no | Operation | `room.role.select` |\n          | `request_id` | envelope | yes | string | `1..64` visible ASCII, unique | no | Idempotency key | `req_0005` |\n          | `payload.role` | payload | yes | string enum | `SPYMASTER`, `OPERATIVE` | no | New temporary role | `SPYMASTER` |\n\n          ## Success, state, and emitted events\n\n          A role selection sets `ready=false`, re-evaluates startability, sends an ack, emits `room.player.updated`, then `room.state`. During `COUNTDOWN`, `room.countdown.cancelled` with reason `ROLE_CHANGED` is inserted before the state snapshot. Example ack: `{\"type\":\"ack\",\"request_id\":\"req_0005\",\"ok\":true,\"payload\":{\"user_id\":42,\"team\":\"RED\",\"role\":\"SPYMASTER\",\"ready\":false,\"room_status\":\"WAITING\"}}`.\n\n          The BLUE Operative example returns `{\"type\":\"ack\",\"request_id\":\"req_0006\",\"ok\":true,\"payload\":{\"user_id\":45,\"team\":\"BLUE\",\"role\":\"OPERATIVE\",\"ready\":false,\"room_status\":\"WAITING\"}}`.\n\n          The role-change example assumes RED's Spymaster slot is vacant and returns `{\"type\":\"ack\",\"request_id\":\"req_0007\",\"ok\":true,\"payload\":{\"user_id\":43,\"team\":\"RED\",\"role\":\"SPYMASTER\",\"ready\":false,\"room_status\":\"WAITING\"}}`.\n\n          | Result field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `ack.payload.user_id` | integer | yes | no | positive | Updated member |\n          | `ack.payload.team` | enum | yes | no | `RED`, `BLUE` | Existing selected team |\n          | `ack.payload.role` | enum | yes | no | `SPYMASTER`, `OPERATIVE` | Accepted role |\n          | `ack.payload.ready` | boolean | yes | no | `false` | Reset confirmation |\n          | `ack.payload.room_status` | enum | yes | no | `WAITING` | Post-command state |\n          | `room.player.updated.payload.changed_fields[]` | array<string enum> | yes | no | `role`, plus `ready` when it changed | Atomic changes |\n\n          ## Duplicate Spymaster error\n\n          Given user `42` already occupies `RED / SPYMASTER`, user `43` attempting the same role receives:\n\n          ```json\n          {\"type\":\"error\",\"request_id\":\"req_0008\",\"error\":{\"code\":\"ROLE_CONFLICT\",\"message\":\"RED already has a Spymaster.\",\"details\":{\"team\":\"RED\",\"occupied_by_user_id\":42}}}\n          ```\n\n          No player field changes and no update event is emitted.\n\n          ## Other errors\n\n          - `TEAM_REQUIRED`: `Select a team before selecting a role.`\n          - `INVALID_PAYLOAD`: role is absent or outside the two-value enum.\n          - `INVALID_ROOM_STATE`: room status is not `WAITING` or `COUNTDOWN`, including `IN_GAME`.\n          - `NOT_ROOM_MEMBER`: session user is outside the room.\n\n          ```json\n          {\"type\":\"error\",\"request_id\":\"req_0009\",\"error\":{\"code\":\"TEAM_REQUIRED\",\"message\":\"Select a team before selecting a role.\",\"details\":{\"user_id\":43}}}\n          ```\n\n          ```json\n          {\"type\":\"error\",\"request_id\":\"req_0010\",\"error\":{\"code\":\"INVALID_ROOM_STATE\",\"message\":\"Roles cannot change while room status is IN_GAME.\",\"details\":{\"status\":\"IN_GAME\"}}}\n          ```\n  - info:\n      name: 03 - Ready & Countdown\n      type: folder\n      seq: 3\n    docs:\n      content: |-\n        # Ready and countdown\n\n        `ready=true` requires both team and role. Readiness is not sufficient by itself: all nine start clauses in workspace documentation must hold. The server automatically starts a three-second countdown when they do. Join, leave, team, role, or ready changes can cancel it and return the room to `WAITING`.\n      type: text/markdown\n    items:\n      - info:\n          name: Set ready\n          type: websocket\n          seq: 1\n          tags:\n            - action\n            - room\n            - countdown\n        websocket:\n          url: '{{wsUrl}}/ws/rooms/{{roomId}}'\n          headers:\n            - name: X-Session-Id\n              value: '{{sessionToken}}'\n          message:\n            - title: Success - Ready true\n              message:\n                type: json\n                data: '{\"type\":\"room.ready.set\",\"request_id\":\"req_0011\",\"payload\":{\"ready\":true}}'\n            - title: Success - Ready false\n              message:\n                type: json\n                data: '{\"type\":\"room.ready.set\",\"request_id\":\"req_0012\",\"payload\":{\"ready\":false}}'\n            - title: Success - Last player triggers countdown\n              message:\n                type: json\n                data: '{\"type\":\"room.ready.set\",\"request_id\":\"req_0013\",\"payload\":{\"ready\":true}}'\n            - title: Success - Unready cancels countdown\n              message:\n                type: json\n                data: '{\"type\":\"room.ready.set\",\"request_id\":\"req_0014\",\"payload\":{\"ready\":false}}'\n            - title: Error - Team missing\n              message:\n                type: json\n                data: '{\"type\":\"room.ready.set\",\"request_id\":\"req_0015\",\"payload\":{\"ready\":true}}'\n            - title: Error - Role missing\n              message:\n                type: json\n                data: '{\"type\":\"room.ready.set\",\"request_id\":\"req_0016\",\"payload\":{\"ready\":true}}'\n        docs: |-\n          # Set ready\n\n          ## Purpose and preconditions\n\n          Confirms or withdraws the member's current team/role configuration. `ready=true` is legal in `WAITING` only after both selections. `ready=false` is legal in `WAITING` and `COUNTDOWN` and cancels an active countdown.\n\n          ## Message and payload parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `room_id` | WebSocket path | yes | integer | positive | no | Connected room | `1001` |\n          | `X-Session-Id` | handshake header | yes | string | active opaque token | no | Authenticated member | `sess_C5blueAgent2Rm` |\n          | `type` | envelope | yes | string enum | `room.ready.set` | no | Operation | `room.ready.set` |\n          | `request_id` | envelope | yes | string | `1..64` visible ASCII, unique | no | Idempotency key | `req_0011` |\n          | `payload.ready` | payload | yes | boolean | `true`, `false` | no | Desired readiness | `true` |\n\n          ## Success behavior\n\n          Every accepted change emits `room.player.updated` and `room.state`. The ack reports the post-evaluation state:\n\n          ```json\n          {\"type\":\"ack\",\"request_id\":\"req_0011\",\"ok\":true,\"payload\":{\"user_id\":42,\"ready\":true,\"room_status\":\"WAITING\",\"startable\":false}}\n          ```\n\n          | Result field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `ack.payload.user_id` | integer | yes | no | positive | Updated member |\n          | `ack.payload.ready` | boolean | yes | no | `true`, `false` | Accepted readiness |\n          | `ack.payload.room_status` | enum | yes | no | `WAITING`, `COUNTDOWN` | State after full predicate evaluation |\n          | `ack.payload.startable` | boolean | yes | no | `true`, `false` | Full predicate result |\n          | `room.player.updated.payload.changed_fields[]` | array<string enum> | yes | no | `ready` | Updated field |\n\n          The ordinary unready example in `WAITING` returns `{\"type\":\"ack\",\"request_id\":\"req_0012\",\"ok\":true,\"payload\":{\"user_id\":42,\"ready\":false,\"room_status\":\"WAITING\",\"startable\":false}}` and emits no countdown event.\n\n          ### Last readiness and automatic countdown\n\n          Immediately before processing user `45`, the server has this pre-request `WAITING` snapshot:\n\n          ```json\n          {\"room_id\":1001,\"status\":\"WAITING\",\"player_count\":4,\"startable\":false,\"players\":[{\"user_id\":42,\"team\":\"RED\",\"role\":\"SPYMASTER\",\"ready\":true},{\"user_id\":43,\"team\":\"RED\",\"role\":\"OPERATIVE\",\"ready\":true},{\"user_id\":44,\"team\":\"BLUE\",\"role\":\"SPYMASTER\",\"ready\":true},{\"user_id\":45,\"team\":\"BLUE\",\"role\":\"OPERATIVE\",\"ready\":false}]}\n          ```\n\n          Applying request `req_0013` produces this final all-ready `WAITING` candidate inside the same server transaction, immediately before the lifecycle transition:\n\n          ```json\n          {\"room_id\":1001,\"status\":\"WAITING\",\"player_count\":4,\"startable\":true,\"players\":[{\"user_id\":42,\"team\":\"RED\",\"role\":\"SPYMASTER\",\"ready\":true},{\"user_id\":43,\"team\":\"RED\",\"role\":\"OPERATIVE\",\"ready\":true},{\"user_id\":44,\"team\":\"BLUE\",\"role\":\"SPYMASTER\",\"ready\":true},{\"user_id\":45,\"team\":\"BLUE\",\"role\":\"OPERATIVE\",\"ready\":true}]}\n          ```\n\n          The server does not expose that candidate as a durable idle state: all clauses are true, so it atomically enters `COUNTDOWN`. The ack is post-transition:\n\n          ```json\n          {\"type\":\"ack\",\"request_id\":\"req_0013\",\"ok\":true,\"payload\":{\"user_id\":45,\"ready\":true,\"room_status\":\"COUNTDOWN\",\"startable\":true}}\n          ```\n\n          The server emits `room.player.updated`, `room.countdown.started`, then a `room.state` with `status=COUNTDOWN`.\n\n          ### Countdown cancellation\n\n          Request `req_0014` from user `43` produces:\n\n          ```json\n          {\"type\":\"ack\",\"request_id\":\"req_0014\",\"ok\":true,\"payload\":{\"user_id\":43,\"ready\":false,\"room_status\":\"WAITING\",\"startable\":false}}\n          ```\n\n          The server emits `room.player.updated`, `room.countdown.cancelled`, then `room.state`. No board is generated.\n\n          ## Errors\n\n          `TEAM_REQUIRED` and `ROLE_REQUIRED` reject `ready=true`; `INVALID_PAYLOAD` rejects non-boolean values; `NOT_ROOM_MEMBER`; `INVALID_ROOM_STATE` rejects `true` in countdown or any mutation in `IN_GAME`, `FINISHED`, `CLOSED`. Errors change no state.\n\n          ```json\n          {\"type\":\"error\",\"request_id\":\"req_0015\",\"error\":{\"code\":\"TEAM_REQUIRED\",\"message\":\"Select a team before becoming ready.\",\"details\":{\"user_id\":43}}}\n          ```\n\n          ```json\n          {\"type\":\"error\",\"request_id\":\"req_0016\",\"error\":{\"code\":\"ROLE_REQUIRED\",\"message\":\"Select a role before becoming ready.\",\"details\":{\"user_id\":43}}}\n          ```\n\n          ## Invariants\n\n          Ready is tied to the exact current selections. Any later successful team or role change forces it to false. `all ready` is never used as a substitute for the complete start predicate.\n      - info:\n          name: Countdown event reference\n          type: websocket\n          seq: 2\n          tags:\n            - server-event\n            - countdown\n        websocket:\n          url: '{{wsUrl}}/ws/rooms/{{roomId}}'\n          headers:\n            - name: X-Session-Id\n              value: '{{sessionToken}}'\n        docs: |-\n          # Countdown event reference\n\n          ## Purpose and triggers\n\n          Passive reference for the automatic `WAITING -> COUNTDOWN -> IN_GAME` flow and its cancellation path. It sends no client message. Countdown duration is fixed to three seconds in this contract.\n\n          ## Connection parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `room_id` | WebSocket path | yes | integer | positive | no | Observed room | `1001` |\n          | `X-Session-Id` | handshake header | yes | string | active member session | no | Recipient identity | `sess_7Hk2mQ9vLc4R8pXa` |\n\n          ## Event field schema\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `type` | string enum | yes | no | `room.countdown.started`, `room.countdown.tick`, `room.countdown.cancelled` | Countdown event |\n          | `event_id` | string | yes | no | room-unique | Ordered event identifier |\n          | `room_id` | integer | yes | no | positive | Room |\n          | `sent_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Event time |\n          | `payload.seconds_remaining` | integer | start/tick only | no | `0..3` | Whole seconds remaining |\n          | `payload.reason` | string enum | cancel only | no | `PLAYER_UNREADY`, `PLAYER_LEFT`, `TEAM_CHANGED`, `ROLE_CHANGED` | Invariant invalidation cause |\n          | `payload.changed_by_user_id` | integer | cancel only | no | positive | Member whose action invalidated start |\n\n          ## Complete successful sequence\n\n          ```json\n          {\"type\":\"room.countdown.started\",\"event_id\":\"evt_0132\",\"room_id\":1001,\"sent_at\":\"2026-09-10T08:43:12Z\",\"payload\":{\"seconds_remaining\":3}}\n          ```\n\n          ```json\n          {\"type\":\"room.state\",\"event_id\":\"evt_0133\",\"room_id\":1001,\"sent_at\":\"2026-09-10T08:43:12Z\",\"payload\":{\"room\":{\"room_id\":1001,\"status\":\"COUNTDOWN\",\"host_user_id\":42,\"player_count\":4,\"startable\":true,\"countdown\":{\"seconds_remaining\":3},\"players\":[{\"user_id\":42,\"username\":\"player_one\",\"team\":\"RED\",\"role\":\"SPYMASTER\",\"ready\":true,\"is_host\":true,\"joined_at\":\"2026-09-10T08:41:00Z\"},{\"user_id\":43,\"username\":\"red_agent\",\"team\":\"RED\",\"role\":\"OPERATIVE\",\"ready\":true,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:20Z\"},{\"user_id\":44,\"username\":\"blue_master\",\"team\":\"BLUE\",\"role\":\"SPYMASTER\",\"ready\":true,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:30Z\"},{\"user_id\":45,\"username\":\"blue_agent\",\"team\":\"BLUE\",\"role\":\"OPERATIVE\",\"ready\":true,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:40Z\"}],\"game\":null,\"created_at\":\"2026-09-10T08:41:00Z\"}}}\n          ```\n\n          ```json\n          {\"type\":\"room.countdown.tick\",\"event_id\":\"evt_0134\",\"room_id\":1001,\"sent_at\":\"2026-09-10T08:43:13Z\",\"payload\":{\"seconds_remaining\":2}}\n          ```\n\n          ```json\n          {\"type\":\"room.countdown.tick\",\"event_id\":\"evt_0135\",\"room_id\":1001,\"sent_at\":\"2026-09-10T08:43:14Z\",\"payload\":{\"seconds_remaining\":1}}\n          ```\n\n          ```json\n          {\"type\":\"room.countdown.tick\",\"event_id\":\"evt_0136\",\"room_id\":1001,\"sent_at\":\"2026-09-10T08:43:15Z\",\"payload\":{\"seconds_remaining\":0}}\n          ```\n\n          The next event is `game.started` with room status `IN_GAME`, `game_id=5001`, and a recipient-safe board.\n\n          ## Complete cancellation sequence\n\n          If user `43` sets ready false at two seconds:\n\n          ```json\n          {\"type\":\"room.countdown.cancelled\",\"event_id\":\"evt_0140\",\"room_id\":1001,\"sent_at\":\"2026-09-10T08:44:01Z\",\"payload\":{\"reason\":\"PLAYER_UNREADY\",\"changed_by_user_id\":43}}\n          ```\n\n          ```json\n          {\"type\":\"room.state\",\"event_id\":\"evt_0141\",\"room_id\":1001,\"sent_at\":\"2026-09-10T08:44:01Z\",\"payload\":{\"room\":{\"room_id\":1001,\"status\":\"WAITING\",\"host_user_id\":42,\"player_count\":4,\"startable\":false,\"players\":[{\"user_id\":42,\"username\":\"player_one\",\"team\":\"RED\",\"role\":\"SPYMASTER\",\"ready\":true,\"is_host\":true,\"joined_at\":\"2026-09-10T08:41:00Z\"},{\"user_id\":43,\"username\":\"red_agent\",\"team\":\"RED\",\"role\":\"OPERATIVE\",\"ready\":false,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:20Z\"},{\"user_id\":44,\"username\":\"blue_master\",\"team\":\"BLUE\",\"role\":\"SPYMASTER\",\"ready\":true,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:30Z\"},{\"user_id\":45,\"username\":\"blue_agent\",\"team\":\"BLUE\",\"role\":\"OPERATIVE\",\"ready\":true,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:40Z\"}],\"game\":null,\"created_at\":\"2026-09-10T08:41:00Z\"}}}\n          ```\n\n          The cancelled snapshot omits `countdown`; remaining scheduled ticks and `game.started` MUST NOT be emitted.\n\n          ## State and errors\n\n          Events are server-generated and have no action-level errors. The server rechecks all invariants immediately before creating the board; stale timer completion cannot start an invalid room.\n  - info:\n      name: 04 - Game\n      type: folder\n      seq: 4\n    docs:\n      content: |-\n        # Game\n\n        Game phase is `WAITING_FOR_CLUE | GUESSING | GAME_OVER`, separate from room status. The active Spymaster submits a clue and integer `N`; the active Operatives receive `N+1` guesses. Own cards may continue, opponent and neutral cards end the turn, assassin ends the game, and any team's last card wins immediately. Passing is voluntary during `GUESSING`.\n\n        Scores count revealed team cards, regardless of which team guessed them. Every reveal checks terminal conditions before emitting a turn change.\n      type: text/markdown\n    items:\n      - info:\n          name: Submit clue\n          type: websocket\n          seq: 1\n          tags:\n            - action\n            - game\n        websocket:\n          url: '{{wsUrl}}/ws/rooms/{{roomId}}'\n          headers:\n            - name: X-Session-Id\n              value: '{{sessionToken}}'\n          message:\n            - title: Success - Ocean 2\n              message:\n                type: json\n                data: '{\"type\":\"game.clue.submit\",\"request_id\":\"req_0020\",\"payload\":{\"word\":\"ocean\",\"number\":2}}'\n            - title: Success - Space 3\n              message:\n                type: json\n                data: '{\"type\":\"game.clue.submit\",\"request_id\":\"req_0021\",\"payload\":{\"word\":\" SPACE \",\"number\":3}}'\n            - title: Error - Operative cannot submit\n              message:\n                type: json\n                data: '{\"type\":\"game.clue.submit\",\"request_id\":\"req_0022\",\"payload\":{\"word\":\"ocean\",\"number\":2}}'\n            - title: Error - Wrong team\n              message:\n                type: json\n                data: '{\"type\":\"game.clue.submit\",\"request_id\":\"req_0023\",\"payload\":{\"word\":\"space\",\"number\":3}}'\n            - title: Error - Wrong phase\n              message:\n                type: json\n                data: '{\"type\":\"game.clue.submit\",\"request_id\":\"req_0024\",\"payload\":{\"word\":\"ocean\",\"number\":2}}'\n            - title: Error - Invalid number\n              message:\n                type: json\n                data: '{\"type\":\"game.clue.submit\",\"request_id\":\"req_0025\",\"payload\":{\"word\":\"ocean\",\"number\":0}}'\n            - title: Error - Multiple words\n              message:\n                type: json\n                data: '{\"type\":\"game.clue.submit\",\"request_id\":\"req_0026\",\"payload\":{\"word\":\"deep ocean\",\"number\":2}}'\n        docs: |-\n          # Submit clue\n\n          ## Purpose and preconditions\n\n          Moves the active team from `WAITING_FOR_CLUE` to `GUESSING`. Only that team's `SPYMASTER` may submit. The room must be `IN_GAME` and the game unfinished.\n\n          ## Message and payload parameters\n\n          | Parameter | Location | Required | Type | Allowed values/range | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `room_id` | WebSocket path | yes | integer | positive | no | Connected room | `1001` |\n          | `X-Session-Id` | handshake header | yes | string | active opaque token | no | Actor identity | `sess_7Hk2mQ9vLc4R8pXa` |\n          | `type` | envelope | yes | string enum | `game.clue.submit` | no | Operation | `game.clue.submit` |\n          | `request_id` | envelope | yes | string | `1..64` visible ASCII, unique | no | Idempotency key | `req_0020` |\n          | `payload.word` | payload | yes | string | trim; one non-whitespace word; `1..30` Unicode characters | no | Clue stored in Unicode lowercase | `ocean` |\n          | `payload.number` | payload | yes | integer | `1..9` | no | Base guess count `N` | `2` |\n\n          Deterministic validation adds no word-list, board-word, inflection, or proper-noun restrictions. `\" SPACE \"` normalizes to `\"space\"`; `\"deep ocean\"` is invalid.\n\n          ## Success behavior and response\n\n          Request `req_0020` returns:\n\n          ```json\n          {\"type\":\"ack\",\"request_id\":\"req_0020\",\"ok\":true,\"payload\":{\"game_id\":5001,\"current_turn\":{\"team\":\"RED\",\"phase\":\"GUESSING\",\"clue\":{\"word\":\"ocean\",\"number\":2},\"guesses_remaining\":3}}}\n          ```\n\n          The server emits exactly one event for a unique request:\n\n          ```json\n          {\"type\":\"game.clue.submitted\",\"event_id\":\"evt_0142\",\"room_id\":1001,\"sent_at\":\"2026-09-10T08:43:30Z\",\"payload\":{\"game_id\":5001,\"submitted_by_user_id\":42,\"team\":\"RED\",\"clue\":{\"word\":\"ocean\",\"number\":2},\"guesses_remaining\":3,\"current_turn\":{\"team\":\"RED\",\"phase\":\"GUESSING\"}}}\n          ```\n\n          Retrying identical `req_0020` returns the original ack without a second event or new turn.\n\n          The normalized Space example returns:\n\n          ```json\n          {\"type\":\"ack\",\"request_id\":\"req_0021\",\"ok\":true,\"payload\":{\"game_id\":5001,\"current_turn\":{\"team\":\"RED\",\"phase\":\"GUESSING\",\"clue\":{\"word\":\"space\",\"number\":3},\"guesses_remaining\":4}}}\n          ```\n\n          It emits `game.clue.submitted` once with `clue.word=\"space\"`, `clue.number=3`, and `guesses_remaining=4`.\n\n          ## Response/event fields\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `payload.game_id` | integer | yes | no | positive | Match |\n          | `payload.submitted_by_user_id` | integer | event only | no | active Spymaster ID | Actor |\n          | `payload.team` | enum | event only | no | `RED`, `BLUE` | Active team |\n          | `payload.clue.word` | string | yes | no | normalized rule | Public clue |\n          | `payload.clue.number` | integer | yes | no | `1..9` | `N` |\n          | `payload.guesses_remaining` | integer | yes | no | `2..10` | Exactly `N+1` at acceptance |\n          | `payload.current_turn.phase` | enum | yes | no | `GUESSING` | New phase |\n\n          ## Errors and state guarantees\n\n          - `ROLE_FORBIDDEN`: an Operative submits; message `Only the active team's Spymaster may submit a clue.`\n          - `NOT_YOUR_TURN`: inactive-team Spymaster submits.\n          - `INVALID_ROOM_STATE`: room is not `IN_GAME`.\n          - `INVALID_CLUE`: word missing, empty, over 30 characters, or contains whitespace.\n          - `INVALID_CLUE_NUMBER`: number is non-integer or outside `1..9`.\n          - `GAME_ALREADY_FINISHED`: phase is `GAME_OVER`.\n\n          Errors keep `WAITING_FOR_CLUE`, create no clue, and keep the socket open.\n\n          ```json\n          {\"type\":\"error\",\"request_id\":\"req_0022\",\"error\":{\"code\":\"ROLE_FORBIDDEN\",\"message\":\"Only the active team's Spymaster may submit a clue.\",\"details\":{\"required_role\":\"SPYMASTER\"}}}\n          ```\n\n          ```json\n          {\"type\":\"error\",\"request_id\":\"req_0023\",\"error\":{\"code\":\"NOT_YOUR_TURN\",\"message\":\"BLUE cannot submit a clue while RED is the active team.\",\"details\":{\"active_team\":\"RED\"}}}\n          ```\n\n          ```json\n          {\"type\":\"error\",\"request_id\":\"req_0024\",\"error\":{\"code\":\"INVALID_ROOM_STATE\",\"message\":\"A clue can be submitted only during WAITING_FOR_CLUE.\",\"details\":{\"phase\":\"GUESSING\"}}}\n          ```\n\n          ```json\n          {\"type\":\"error\",\"request_id\":\"req_0025\",\"error\":{\"code\":\"INVALID_CLUE_NUMBER\",\"message\":\"payload.number must be an integer from 1 through 9.\",\"details\":{\"field\":\"payload.number\",\"min\":1,\"max\":9}}}\n          ```\n\n          ```json\n          {\"type\":\"error\",\"request_id\":\"req_0026\",\"error\":{\"code\":\"INVALID_CLUE\",\"message\":\"payload.word must contain exactly one non-whitespace word.\",\"details\":{\"field\":\"payload.word\"}}}\n          ```\n      - info:\n          name: Guess card\n          type: websocket\n          seq: 2\n          tags:\n            - action\n            - game\n        websocket:\n          url: '{{wsUrl}}/ws/rooms/{{roomId}}'\n          headers:\n            - name: X-Session-Id\n              value: '{{sessionToken}}'\n          message:\n            - title: Own team - Continue\n              message:\n                type: json\n                data: '{\"type\":\"game.card.guess\",\"request_id\":\"req_0030\",\"payload\":{\"card_id\":5}}'\n            - title: Own team - Last guess\n              message:\n                type: json\n                data: '{\"type\":\"game.card.guess\",\"request_id\":\"req_0031\",\"payload\":{\"card_id\":7}}'\n            - title: Own team - Wins match\n              message:\n                type: json\n                data: '{\"type\":\"game.card.guess\",\"request_id\":\"req_0032\",\"payload\":{\"card_id\":17}}'\n            - title: Opponent team - Turn ends\n              message:\n                type: json\n                data: '{\"type\":\"game.card.guess\",\"request_id\":\"req_0033\",\"payload\":{\"card_id\":6}}'\n            - title: Opponent team - Opponent wins\n              message:\n                type: json\n                data: '{\"type\":\"game.card.guess\",\"request_id\":\"req_0034\",\"payload\":{\"card_id\":16}}'\n            - title: Neutral - Turn ends\n              message:\n                type: json\n                data: '{\"type\":\"game.card.guess\",\"request_id\":\"req_0035\",\"payload\":{\"card_id\":18}}'\n            - title: Assassin - Instant loss\n              message:\n                type: json\n                data: '{\"type\":\"game.card.guess\",\"request_id\":\"req_0036\",\"payload\":{\"card_id\":25}}'\n            - title: Already revealed card - Error\n              message:\n                type: json\n                data: '{\"type\":\"game.card.guess\",\"request_id\":\"req_0037\",\"payload\":{\"card_id\":1}}'\n            - title: Wrong team - Error\n              message:\n                type: json\n                data: '{\"type\":\"game.card.guess\",\"request_id\":\"req_0038\",\"payload\":{\"card_id\":5}}'\n        docs: |-\n          # Guess card\n\n          ## Purpose and preconditions\n\n          Reveals one unrevealed card for the active team during `GUESSING`. Any active-team `OPERATIVE` may submit; Spymasters and inactive-team members may not. The client submits only `card_id`, never a color or predicted result.\n\n          ## Message and payload parameters\n\n          | Parameter | Location | Required | Type | Allowed values/range | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `room_id` | WebSocket path | yes | integer | positive | no | Connected room | `1001` |\n          | `X-Session-Id` | handshake header | yes | string | active opaque token | no | Actor identity | `sess_A3redAgent9Kp` |\n          | `type` | envelope | yes | string enum | `game.card.guess` | no | Operation | `game.card.guess` |\n          | `request_id` | envelope | yes | string | `1..64` visible ASCII, unique | no | Idempotency key | `req_0030` |\n          | `payload.card_id` | payload | yes | integer | `1..25`, existing in game | no | Unrevealed card | `5` |\n\n          ## Common success fields and ordering\n\n          The ack includes `game_id`, card result, score, current turn, winner, and end reason. The server reveals atomically, checks both teams' completion and assassin, then emits in order: `game.card.revealed`; `game.score.updated` when a team-card score changed; either `game.turn.changed`, no turn event when continuing, or `game.ended` when terminal. Terminal outcomes never emit a later turn change.\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `payload.card.card_id` | integer | yes | no | `1..25` | Revealed card |\n          | `payload.card.word` | string | yes | no | board word | Visible word |\n          | `payload.card.revealed` | boolean | yes | no | `true` | Post-action state |\n          | `payload.card.color` | enum | yes | no | `RED`, `BLUE`, `NEUTRAL`, `ASSASSIN` | Revealed color, now public |\n          | `payload.guessed_by_user_id` | integer | event only | no | active Operative ID | Actor |\n          | `payload.guessing_team` | enum | yes | no | `RED`, `BLUE` | Team taking action |\n          | `payload.score.red` | integer | yes | no | `0..9` | Revealed RED count |\n          | `payload.score.blue` | integer | yes | no | `0..8` | Revealed BLUE count |\n          | `payload.current_turn.team` | enum | yes | no | `RED`, `BLUE` | Active or terminal guessing team |\n          | `payload.current_turn.phase` | enum | yes | no | `WAITING_FOR_CLUE`, `GUESSING`, `GAME_OVER` | Result phase |\n          | `payload.current_turn.guesses_remaining` | integer or null | yes | yes | `0..10`, `null` | Remaining in `GUESSING`; null otherwise |\n          | `payload.winner` | enum or null | yes | yes | `RED`, `BLUE`, `null` | Terminal winner |\n          | `payload.end_reason` | enum or null | yes | yes | `ALL_TEAM_CARDS_REVEALED`, `ASSASSIN_REVEALED`, `null` | Terminal cause |\n\n          ## Outcome examples\n\n          These are independent branches from the canonical fixed map: RED cards are `1,3,5,7,9,11,13,15,17`; BLUE cards are `2,4,6,8,10,12,14,16`; neutral cards are `18..24`; assassin is `25`.\n\n          ### Own card \u2014 continue\n\n          Baseline is RED guessing with 3 guesses and score `2-2`. Card `5` is RED:\n\n          ```json\n          {\"type\":\"ack\",\"request_id\":\"req_0030\",\"ok\":true,\"payload\":{\"game_id\":5001,\"card\":{\"card_id\":5,\"word\":\"OCEAN\",\"revealed\":true,\"color\":\"RED\"},\"guessing_team\":\"RED\",\"score\":{\"red\":3,\"blue\":2},\"current_turn\":{\"team\":\"RED\",\"phase\":\"GUESSING\",\"clue\":{\"word\":\"ocean\",\"number\":2},\"guesses_remaining\":2},\"winner\":null,\"end_reason\":null}}\n          ```\n\n          `game.card.revealed` is followed by `game.score.updated`; no turn event occurs.\n\n          ### Own card \u2014 last allowed guess\n\n          Baseline has one guess remaining. Card `7` is RED; score increases and the guess count reaches zero, so BLUE becomes active:\n\n          ```json\n          {\"type\":\"ack\",\"request_id\":\"req_0031\",\"ok\":true,\"payload\":{\"game_id\":5001,\"card\":{\"card_id\":7,\"word\":\"LASER\",\"revealed\":true,\"color\":\"RED\"},\"guessing_team\":\"RED\",\"score\":{\"red\":4,\"blue\":2},\"current_turn\":{\"team\":\"BLUE\",\"phase\":\"WAITING_FOR_CLUE\",\"clue\":null,\"guesses_remaining\":null},\"winner\":null,\"end_reason\":null}}\n          ```\n\n          ### Own final card \u2014 RED wins\n\n          With eight RED cards already revealed, card `17` completes RED:\n\n          ```json\n          {\"type\":\"game.ended\",\"event_id\":\"evt_0180\",\"room_id\":1001,\"sent_at\":\"2026-09-10T08:50:00Z\",\"payload\":{\"game_id\":5001,\"winner\":\"RED\",\"loser\":\"BLUE\",\"end_reason\":\"ALL_TEAM_CARDS_REVEALED\",\"revealed_card\":{\"card_id\":17,\"word\":\"ROME\",\"revealed\":true,\"color\":\"RED\"},\"score\":{\"red\":9,\"blue\":5},\"room_status\":\"FINISHED\",\"phase\":\"GAME_OVER\",\"finished_at\":\"2026-09-10T08:50:00Z\"}}\n          ```\n\n          ### Opponent card \u2014 turn ends\n\n          RED reveals BLUE card `6`; BLUE score increases and BLUE becomes active:\n\n          ```json\n          {\"type\":\"ack\",\"request_id\":\"req_0033\",\"ok\":true,\"payload\":{\"game_id\":5001,\"card\":{\"card_id\":6,\"word\":\"KING\",\"revealed\":true,\"color\":\"BLUE\"},\"guessing_team\":\"RED\",\"score\":{\"red\":2,\"blue\":3},\"current_turn\":{\"team\":\"BLUE\",\"phase\":\"WAITING_FOR_CLUE\",\"clue\":null,\"guesses_remaining\":null},\"winner\":null,\"end_reason\":null}}\n          ```\n\n          ### Opponent final card \u2014 BLUE wins\n\n          With seven BLUE cards already revealed, RED reveals BLUE card `16`:\n\n          ```json\n          {\"type\":\"game.ended\",\"event_id\":\"evt_0181\",\"room_id\":1001,\"sent_at\":\"2026-09-10T08:51:00Z\",\"payload\":{\"game_id\":5001,\"winner\":\"BLUE\",\"loser\":\"RED\",\"end_reason\":\"ALL_TEAM_CARDS_REVEALED\",\"revealed_card\":{\"card_id\":16,\"word\":\"HEART\",\"revealed\":true,\"color\":\"BLUE\"},\"score\":{\"red\":6,\"blue\":8},\"room_status\":\"FINISHED\",\"phase\":\"GAME_OVER\",\"finished_at\":\"2026-09-10T08:51:00Z\"}}\n          ```\n\n          ### Neutral \u2014 turn ends\n\n          ```json\n          {\"type\":\"ack\",\"request_id\":\"req_0035\",\"ok\":true,\"payload\":{\"game_id\":5001,\"card\":{\"card_id\":18,\"word\":\"WHALE\",\"revealed\":true,\"color\":\"NEUTRAL\"},\"guessing_team\":\"RED\",\"score\":{\"red\":2,\"blue\":2},\"current_turn\":{\"team\":\"BLUE\",\"phase\":\"WAITING_FOR_CLUE\",\"clue\":null,\"guesses_remaining\":null},\"winner\":null,\"end_reason\":null}}\n          ```\n\n          ### Assassin \u2014 instant loss\n\n          RED reveals card `25`, so BLUE wins regardless of score:\n\n          ```json\n          {\"type\":\"game.ended\",\"event_id\":\"evt_0182\",\"room_id\":1001,\"sent_at\":\"2026-09-10T08:52:00Z\",\"payload\":{\"game_id\":5001,\"winner\":\"BLUE\",\"loser\":\"RED\",\"end_reason\":\"ASSASSIN_REVEALED\",\"revealed_card\":{\"card_id\":25,\"word\":\"CLOUD\",\"revealed\":true,\"color\":\"ASSASSIN\"},\"score\":{\"red\":2,\"blue\":2},\"room_status\":\"FINISHED\",\"phase\":\"GAME_OVER\",\"finished_at\":\"2026-09-10T08:52:00Z\"}}\n          ```\n\n          ## Errors and state guarantees\n\n          - `ROLE_FORBIDDEN`: Spymaster guesses.\n          - `NOT_YOUR_TURN`: inactive team member guesses.\n          - `INVALID_ROOM_STATE`: room is not `IN_GAME` or phase is not `GUESSING`.\n          - `INVALID_CARD`: ID is missing, non-integer, outside the board, or absent from this game.\n          - `CARD_ALREADY_REVEALED`: card is already public.\n          - `NO_GUESSES_REMAINING`: stale command arrives after count reached zero.\n          - `GAME_ALREADY_FINISHED`: terminal result already exists.\n\n          ```json\n          {\"type\":\"error\",\"request_id\":\"req_0037\",\"error\":{\"code\":\"CARD_ALREADY_REVEALED\",\"message\":\"Card 1 has already been revealed.\",\"details\":{\"card_id\":1}}}\n          ```\n\n          ```json\n          {\"type\":\"error\",\"request_id\":\"req_0038\",\"error\":{\"code\":\"NOT_YOUR_TURN\",\"message\":\"BLUE cannot guess while RED is the active team.\",\"details\":{\"active_team\":\"RED\"}}}\n          ```\n\n          All errors preserve card, score, guesses, phase, and turn and emit no success event.\n      - info:\n          name: Pass turn\n          type: websocket\n          seq: 3\n          tags:\n            - action\n            - game\n        websocket:\n          url: '{{wsUrl}}/ws/rooms/{{roomId}}'\n          headers:\n            - name: X-Session-Id\n              value: '{{sessionToken}}'\n          message:\n            - title: Success - RED Operative passes\n              message:\n                type: json\n                data: '{\"type\":\"game.turn.pass\",\"request_id\":\"req_0040\",\"payload\":{}}'\n            - title: Error - Spymaster cannot pass\n              message:\n                type: json\n                data: '{\"type\":\"game.turn.pass\",\"request_id\":\"req_0041\",\"payload\":{}}'\n            - title: Error - Waiting for clue\n              message:\n                type: json\n                data: '{\"type\":\"game.turn.pass\",\"request_id\":\"req_0042\",\"payload\":{}}'\n        docs: |-\n          # Pass turn\n\n          ## Purpose and preconditions\n\n          Lets an active-team Operative voluntarily stop guessing while at least one guess remains. Room must be `IN_GAME`, phase `GUESSING`, and game unfinished.\n\n          ## Message and payload parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `room_id` | WebSocket path | yes | integer | positive | no | Connected room | `1001` |\n          | `X-Session-Id` | handshake header | yes | string | active opaque token | no | Actor identity | `sess_A3redAgent9Kp` |\n          | `type` | envelope | yes | string enum | `game.turn.pass` | no | Operation | `game.turn.pass` |\n          | `request_id` | envelope | yes | string | `1..64` visible ASCII, unique | no | Idempotency key | `req_0040` |\n          | `payload` | payload | yes | object | empty object | no | Pass has no additional inputs | `{}` |\n\n          ## Success behavior and response fields\n\n          The turn changes to the opponent in `WAITING_FOR_CLUE`; clue and guesses become null. Board and score do not change.\n\n          ```json\n          {\"type\":\"ack\",\"request_id\":\"req_0040\",\"ok\":true,\"payload\":{\"game_id\":5001,\"passed_by_user_id\":43,\"previous_team\":\"RED\",\"current_turn\":{\"team\":\"BLUE\",\"phase\":\"WAITING_FOR_CLUE\",\"clue\":null,\"guesses_remaining\":null},\"score\":{\"red\":3,\"blue\":2}}}\n          ```\n\n          ```json\n          {\"type\":\"game.turn.changed\",\"event_id\":\"evt_0170\",\"room_id\":1001,\"sent_at\":\"2026-09-10T08:47:00Z\",\"payload\":{\"game_id\":5001,\"previous_team\":\"RED\",\"reason\":\"PASSED\",\"current_turn\":{\"team\":\"BLUE\",\"phase\":\"WAITING_FOR_CLUE\",\"clue\":null,\"guesses_remaining\":null},\"score\":{\"red\":3,\"blue\":2}}}\n          ```\n\n          `reason` is `PASSED | GUESSES_EXHAUSTED | OPPONENT_CARD_REVEALED | NEUTRAL_CARD_REVEALED` across turn-change events.\n\n          | Result field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `payload.game_id` | integer | yes | no | positive | Match |\n          | `payload.passed_by_user_id` | integer | ack only | no | active Operative ID | Actor |\n          | `payload.previous_team` | enum | yes | no | `RED`, `BLUE` | Team that ended guessing |\n          | `payload.reason` | enum | event only | no | `PASSED` | Cause for this command |\n          | `payload.current_turn.team` | enum | yes | no | opponent team | New active team |\n          | `payload.current_turn.phase` | enum | yes | no | `WAITING_FOR_CLUE` | New phase |\n          | `payload.current_turn.clue` | null | yes | yes | `null` | Cleared previous clue |\n          | `payload.current_turn.guesses_remaining` | null | yes | yes | `null` | No guesses before next clue |\n          | `payload.score.red` | integer | yes | no | `0..9` | Unchanged revealed RED count |\n          | `payload.score.blue` | integer | yes | no | `0..8` | Unchanged revealed BLUE count |\n\n          ## Errors and invariants\n\n          `ROLE_FORBIDDEN` for a Spymaster; `NOT_YOUR_TURN` for inactive team; `INVALID_ROOM_STATE` outside `IN_GAME` or `GUESSING`; `NO_GUESSES_REMAINING` for a stale pass; `GAME_ALREADY_FINISHED` after terminal result. Errors preserve turn and socket.\n\n          ```json\n          {\"type\":\"error\",\"request_id\":\"req_0041\",\"error\":{\"code\":\"ROLE_FORBIDDEN\",\"message\":\"Only an active-team Operative may pass the guessing turn.\",\"details\":{\"required_role\":\"OPERATIVE\"}}}\n          ```\n\n          ```json\n          {\"type\":\"error\",\"request_id\":\"req_0042\",\"error\":{\"code\":\"INVALID_ROOM_STATE\",\"message\":\"A turn can be passed only during GUESSING.\",\"details\":{\"phase\":\"WAITING_FOR_CLUE\"}}}\n          ```\n  - info:\n      name: 05 - Server Events\n      type: folder\n      seq: 5\n    docs:\n      content: |-\n        # Server events\n\n        Server events carry `type`, monotonic room-scoped `event_id`, integer `room_id`, UTC `sent_at`, and event-specific `payload`. Snapshot and board-bearing events are generated per recipient. Event examples here are server output references and are not client-sendable messages.\n      type: text/markdown\n    items:\n      - info:\n          name: Server event catalog\n          type: websocket\n          seq: 1\n          tags:\n            - server-event\n            - reference\n        websocket:\n          url: '{{wsUrl}}/ws/rooms/{{roomId}}'\n          headers:\n            - name: X-Session-Id\n              value: '{{sessionToken}}'\n        docs: |-\n          # Server event catalog\n\n          ## Purpose\n\n          Passive observer and schema reference for canonical server event names. It sends no application message. Command acknowledgements/errors are requester-only; domain events go to connected room members using recipient-safe projection.\n\n          ## Connection parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `room_id` | WebSocket path | yes | integer | positive | no | Observed room | `1001` |\n          | `X-Session-Id` | handshake header | yes | string | active member session | no | Recipient identity | `sess_A3redAgent9Kp` |\n\n          ## Common envelope fields\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `type` | string enum | yes | no | event matrix below | Event discriminator |\n          | `event_id` | string | yes | no | unique, monotonically ordered in room | Resume/order marker |\n          | `room_id` | integer | yes | no | positive | Domain room ID |\n          | `sent_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Server emission time |\n          | `payload` | object | yes | no | type-specific | Event data |\n\n          ## Event payload matrix\n\n          | Type | Required payload fields | Trigger | Projection |\n          | --- | --- | --- | --- |\n          | `room.state` | `room` | connect, recovery, room mutation | per recipient when game exists |\n          | `room.player.joined` | `player`, `host_user_id`, `player_count`, `room_status` | REST join | common |\n          | `room.player.left` | same membership fields | REST leave | common |\n          | `room.player.updated` | `player`, `changed_fields`, `room_status`, `startable` | team, role, ready | common |\n          | `room.countdown.started` | `seconds_remaining=3` | full start predicate becomes true | common |\n          | `room.countdown.tick` | `seconds_remaining` | server timer | common |\n          | `room.countdown.cancelled` | `reason`, `changed_by_user_id` | predicate becomes false | common |\n          | `game.started` | `room` containing `game` | valid countdown reaches zero | role-safe board |\n          | `game.state` | `room` containing `game` | reconnect/recovery | role-safe board |\n          | `game.clue.submitted` | `game_id`, actor, team, clue, guesses, turn | accepted clue | common |\n          | `game.card.revealed` | game/card/actor/team/score/turn/result | accepted guess | role-safe board delta |\n          | `game.score.updated` | `game_id`, `score`, `changed_color` | RED or BLUE reveal | common |\n          | `game.turn.changed` | game ID, previous team, reason, current turn, score | non-terminal turn end | common |\n          | `game.ended` | winner, loser, reason, revealed card, score, status, phase, time | terminal reveal | contains only the revealed terminal card; no hidden-board disclosure |\n\n          ## Concrete game events\n\n          ```json\n          {\"type\":\"game.score.updated\",\"event_id\":\"evt_0144\",\"room_id\":1001,\"sent_at\":\"2026-09-10T08:44:01Z\",\"payload\":{\"game_id\":5001,\"score\":{\"red\":3,\"blue\":2},\"changed_color\":\"RED\"}}\n          ```\n\n          ```json\n          {\"type\":\"game.turn.changed\",\"event_id\":\"evt_0148\",\"room_id\":1001,\"sent_at\":\"2026-09-10T08:44:20Z\",\"payload\":{\"game_id\":5001,\"previous_team\":\"RED\",\"reason\":\"NEUTRAL_CARD_REVEALED\",\"current_turn\":{\"team\":\"BLUE\",\"phase\":\"WAITING_FOR_CLUE\",\"clue\":null,\"guesses_remaining\":null},\"score\":{\"red\":3,\"blue\":2}}}\n          ```\n\n          ```json\n          {\"type\":\"game.card.revealed\",\"event_id\":\"evt_0143\",\"room_id\":1001,\"sent_at\":\"2026-09-10T08:44:01Z\",\"payload\":{\"game_id\":5001,\"card\":{\"card_id\":5,\"word\":\"OCEAN\",\"revealed\":true,\"color\":\"RED\"},\"guessed_by_user_id\":43,\"guessing_team\":\"RED\",\"score\":{\"red\":3,\"blue\":2},\"current_turn\":{\"team\":\"RED\",\"phase\":\"GUESSING\",\"clue\":{\"word\":\"ocean\",\"number\":2},\"guesses_remaining\":2},\"winner\":null,\"end_reason\":null}}\n          ```\n\n          ## Acknowledgement schema\n\n          Acks are not room events and omit `event_id`, `room_id`, and `sent_at`:\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `type` | string enum | yes | no | `ack` | Response discriminator |\n          | `request_id` | string | yes | no | echoed request | Correlation/idempotency ID |\n          | `ok` | boolean | yes | no | `true` | Acceptance flag |\n          | `payload` | object | yes | no | command-specific result | Authoritative post-command values |\n\n          ## Invariants\n\n          A terminal `game.ended` is final for the match and no `game.turn.changed` follows it. An Operative event never leaks any unrelated unrevealed card color, including after `FINISHED`. Duplicate request IDs do not duplicate domain events.\n  - info:\n      name: 06 - Errors\n      type: folder\n      seq: 6\n    docs:\n      content: |-\n        # WebSocket errors\n\n        Errors correlate to the rejected `request_id`, contain a concrete code and message, leave state unchanged, and normally keep the socket open. Handshake failures occur as HTTP responses before the WebSocket opens. Repeated protocol abuse is the only documented reason the server may close an authenticated socket after an application error.\n      type: text/markdown\n    items:\n      - info:\n          name: Error catalog\n          type: websocket\n          seq: 1\n          tags:\n            - error\n            - reference\n        websocket:\n          url: '{{wsUrl}}/ws/rooms/{{roomId}}'\n          headers:\n            - name: X-Session-Id\n              value: '{{sessionToken}}'\n          message:\n            - title: Error trigger - Unknown event\n              message:\n                type: json\n                data: '{\"type\":\"room.start\",\"request_id\":\"req_0090\",\"payload\":{}}'\n            - title: Error trigger - Missing request ID\n              message:\n                type: json\n                data: '{\"type\":\"room.ready.set\",\"payload\":{\"ready\":true}}'\n        docs: |-\n          # WebSocket error catalog\n\n          ## Purpose and envelope\n\n          Defines all application error codes. An error is requester-only, changes no state, emits no success event, and keeps the socket open. The only exceptions are HTTP handshake rejection and optional close after repeated protocol abuse.\n\n          The reference connects with path `room_id` (required positive integer, example `1001`) and handshake header `X-Session-Id` (required active opaque member session, example `sess_A3redAgent9Kp`). Its two disabled messages use the same client envelope documented below; one intentionally uses unsupported type `room.start`, and one intentionally omits `request_id`.\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `room_id` | WebSocket path | yes | integer | positive | no | Connected room | `1001` |\n          | `X-Session-Id` | handshake header | yes | string | active opaque token | no | Member identity | `sess_A3redAgent9Kp` |\n          | `type` | envelope | yes | string | canonical operation name | no | Deliberately invalid in first example | `room.start` |\n          | `request_id` | envelope | yes | string | `1..64` visible ASCII | no | Deliberately absent in second example | `req_0090` |\n          | `payload` | envelope | yes | object | operation-specific | no | Command parameters | `{}` |\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `type` | string enum | yes | no | `error` | Response discriminator |\n          | `request_id` | string or null | yes | yes | echoed ID or `null` when absent/unparseable | Correlation |\n          | `error.code` | string enum | yes | no | catalog values | Machine-readable code |\n          | `error.message` | string | yes | no | concrete human-readable text | Explanation |\n          | `error.details` | object | yes | no | code-specific | Structured context |\n\n          ## Catalog\n\n          | Code | Caused by | State/socket behavior |\n          | --- | --- | --- |\n          | `INVALID_EVENT` | unknown type, bad envelope, duplicate ID reused with different content | unchanged; open |\n          | `INVALID_PAYLOAD` | missing/wrong-type/unrecognized payload field | unchanged; open |\n          | `UNAUTHORIZED` | session becomes invalid after connection | unchanged; server closes with policy code `4401` |\n          | `ROOM_NOT_FOUND` | room removed after connection race | unchanged; server closes with `4404` |\n          | `NOT_ROOM_MEMBER` | user no longer belongs to room | unchanged; server closes with `4403` |\n          | `INVALID_ROOM_STATE` | operation not legal in room status/phase | unchanged; open |\n          | `TEAM_REQUIRED` | ready/role before team | unchanged; open |\n          | `ROLE_REQUIRED` | ready before role | unchanged; open |\n          | `ROLE_CONFLICT` | second Spymaster on one team | unchanged; open |\n          | `NOT_YOUR_TURN` | inactive team attempts clue/guess/pass | unchanged; open |\n          | `ROLE_FORBIDDEN` | wrong room role attempts game action | unchanged; open |\n          | `INVALID_CLUE` | clue word fails deterministic rule | unchanged; open |\n          | `INVALID_CLUE_NUMBER` | clue number not integer `1..9` | unchanged; open |\n          | `INVALID_CARD` | card ID absent/invalid | unchanged; open |\n          | `CARD_ALREADY_REVEALED` | card was already revealed | unchanged; open |\n          | `NO_GUESSES_REMAINING` | stale guess/pass after zero | unchanged; open |\n          | `GAME_ALREADY_FINISHED` | game command after terminal result | unchanged; open |\n\n          ## Concrete examples\n\n          ```json\n          {\"type\":\"error\",\"request_id\":\"req_0090\",\"error\":{\"code\":\"INVALID_EVENT\",\"message\":\"Message type 'room.start' is not supported.\",\"details\":{\"type\":\"room.start\"}}}\n          ```\n\n          ```json\n          {\"type\":\"error\",\"request_id\":null,\"error\":{\"code\":\"INVALID_EVENT\",\"message\":\"request_id is required for every client message.\",\"details\":{\"field\":\"request_id\"}}}\n          ```\n\n          ```json\n          {\"type\":\"error\",\"request_id\":\"req_0018\",\"error\":{\"code\":\"ROLE_CONFLICT\",\"message\":\"RED already has a Spymaster.\",\"details\":{\"team\":\"RED\",\"occupied_by_user_id\":42}}}\n          ```\n\n          ```json\n          {\"type\":\"error\",\"request_id\":\"req_0041\",\"error\":{\"code\":\"NOT_YOUR_TURN\",\"message\":\"BLUE cannot guess while RED is the active team.\",\"details\":{\"active_team\":\"RED\"}}}\n          ```\n\n          ```json\n          {\"type\":\"error\",\"request_id\":\"req_0045\",\"error\":{\"code\":\"GAME_ALREADY_FINISHED\",\"message\":\"Game 5001 has already finished.\",\"details\":{\"game_id\":5001,\"winner\":\"RED\"}}}\n          ```\n\n          ```json\n          {\"type\":\"error\",\"request_id\":\"req_0091\",\"error\":{\"code\":\"INVALID_PAYLOAD\",\"message\":\"payload.ready must be a boolean.\",\"details\":{\"field\":\"payload.ready\"}}}\n          ```\n\n          ```json\n          {\"type\":\"error\",\"request_id\":\"req_0092\",\"error\":{\"code\":\"UNAUTHORIZED\",\"message\":\"The session is no longer active.\",\"details\":{}}}\n          ```\n\n          ```json\n          {\"type\":\"error\",\"request_id\":\"req_0093\",\"error\":{\"code\":\"ROOM_NOT_FOUND\",\"message\":\"Room 1001 was not found.\",\"details\":{\"room_id\":1001}}}\n          ```\n\n          ```json\n          {\"type\":\"error\",\"request_id\":\"req_0094\",\"error\":{\"code\":\"NOT_ROOM_MEMBER\",\"message\":\"User 47 is not a member of room 1001.\",\"details\":{\"room_id\":1001,\"user_id\":47}}}\n          ```\n\n          ```json\n          {\"type\":\"error\",\"request_id\":\"req_0095\",\"error\":{\"code\":\"INVALID_ROOM_STATE\",\"message\":\"This action is not allowed while room status is FINISHED.\",\"details\":{\"status\":\"FINISHED\"}}}\n          ```\n\n          ```json\n          {\"type\":\"error\",\"request_id\":\"req_0096\",\"error\":{\"code\":\"TEAM_REQUIRED\",\"message\":\"Select a team before becoming ready.\",\"details\":{\"user_id\":43}}}\n          ```\n\n          ```json\n          {\"type\":\"error\",\"request_id\":\"req_0097\",\"error\":{\"code\":\"ROLE_REQUIRED\",\"message\":\"Select a role before becoming ready.\",\"details\":{\"user_id\":43}}}\n          ```\n\n          ```json\n          {\"type\":\"error\",\"request_id\":\"req_0098\",\"error\":{\"code\":\"ROLE_FORBIDDEN\",\"message\":\"Only an active-team Operative may guess a card.\",\"details\":{\"required_role\":\"OPERATIVE\"}}}\n          ```\n\n          ```json\n          {\"type\":\"error\",\"request_id\":\"req_0099\",\"error\":{\"code\":\"INVALID_CLUE\",\"message\":\"payload.word must contain exactly one non-whitespace word.\",\"details\":{\"field\":\"payload.word\"}}}\n          ```\n\n          ```json\n          {\"type\":\"error\",\"request_id\":\"req_0100\",\"error\":{\"code\":\"INVALID_CLUE_NUMBER\",\"message\":\"payload.number must be an integer from 1 through 9.\",\"details\":{\"field\":\"payload.number\",\"min\":1,\"max\":9}}}\n          ```\n\n          ```json\n          {\"type\":\"error\",\"request_id\":\"req_0101\",\"error\":{\"code\":\"INVALID_CARD\",\"message\":\"Card 30 does not exist in game 5001.\",\"details\":{\"card_id\":30,\"game_id\":5001}}}\n          ```\n\n          ```json\n          {\"type\":\"error\",\"request_id\":\"req_0102\",\"error\":{\"code\":\"CARD_ALREADY_REVEALED\",\"message\":\"Card 1 has already been revealed.\",\"details\":{\"card_id\":1}}}\n          ```\n\n          ```json\n          {\"type\":\"error\",\"request_id\":\"req_0103\",\"error\":{\"code\":\"NO_GUESSES_REMAINING\",\"message\":\"RED has no guesses remaining in the current turn.\",\"details\":{\"team\":\"RED\",\"guesses_remaining\":0}}}\n          ```\n\n          ## Validation invariant\n\n          Parsing and authorization complete before mutation. A rejected command cannot reveal a card, change score or turn, toggle ready, create/cancel countdown, or consume an idempotency result as success.\n  - info:\n      name: 07 - Full State Scenarios\n      type: folder\n      seq: 7\n    docs:\n      content: |-\n        # Full state scenarios\n\n        Normative, end-to-end snapshots for room `1001` and game `5001`: newly created, four joined, incomplete roles, valid unready, all ready, countdown, cancellation, full `IN_GAME` projections, clue, reveals, and terminal results. The same fixed 25-card secret map is used throughout.\n      type: text/markdown\n    items:\n      - info:\n          name: Full IN_GAME role projections\n          type: websocket\n          seq: 1\n          tags:\n            - scenario\n            - game\n            - privacy\n        websocket:\n          url: '{{wsUrl}}/ws/rooms/{{roomId}}'\n          headers:\n            - name: X-Session-Id\n              value: '{{sessionToken}}'\n        docs: |-\n          # Full IN_GAME role projections\n\n          ## Purpose and preconditions\n\n          These two `game.started` frames are normative projections of the same logical room `1001`, game `5001`, board, timestamp, players, turn, and score immediately after a valid countdown. This request is a passive observer and sends no application message.\n\n          The request connects with required positive-integer path `room_id=1001` and required handshake header `X-Session-Id`, whose active session determines whether the returned board is the Spymaster or Operative projection.\n\n          ## Projection rule\n\n          | Viewer | Unrevealed `board[].color` | Revealed `board[].color` |\n          | --- | --- | --- |\n          | `SPYMASTER` | actual `RED`, `BLUE`, `NEUTRAL`, or `ASSASSIN` | actual color |\n          | `OPERATIVE` | `null` | actual color |\n\n          Words, IDs, order, reveal flags, score, players, and turn are identical. The server generates one payload per recipient and never sends the Spymaster version to an Operative.\n\n          ## Response field schema\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `type` | string enum | yes | no | `game.started` | Lifecycle event |\n          | `event_id` | string | yes | no | room-unique | Ordered event ID |\n          | `room_id` | integer | yes | no | positive | Envelope room |\n          | `sent_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Event time |\n          | `payload.room.room_id` | integer | yes | no | same as envelope | Domain room ID |\n          | `payload.room.status` | enum | yes | no | `IN_GAME` | Post-countdown state |\n          | `payload.room.host_user_id` | integer | yes | no | member ID | Host |\n          | `payload.room.player_count` | integer | yes | no | `>= 4` | Participants |\n          | `payload.room.startable` | boolean | yes | no | `false` | Start predicate is only actionable in `WAITING` |\n          | `payload.room.players[]` | array<object> | yes | no | configured members | Join-ordered membership |\n          | `payload.room.players[].user_id` | integer | yes | no | positive | Member |\n          | `payload.room.players[].username` | string | yes | no | username rule | Display name |\n          | `payload.room.players[].team` | enum | yes | no | `RED`, `BLUE` | Match team |\n          | `payload.room.players[].role` | enum | yes | no | `SPYMASTER`, `OPERATIVE` | Match role |\n          | `payload.room.players[].ready` | boolean | yes | no | `true` | Frozen start confirmation |\n          | `payload.room.players[].is_host` | boolean | yes | no | `true`, `false` | Exactly one true |\n          | `payload.room.players[].joined_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Join order |\n          | `payload.room.game.game_id` | integer | yes | no | positive | Match |\n          | `payload.room.game.starting_team` | enum | yes | no | `RED`, `BLUE` | Team with 9 cards and first clue |\n          | `payload.room.game.current_turn.team` | enum | yes | no | `RED`, `BLUE` | Active team |\n          | `payload.room.game.current_turn.phase` | enum | yes | no | `WAITING_FOR_CLUE` | Initial phase |\n          | `payload.room.game.current_turn.clue` | null | yes | yes | `null` | No clue yet |\n          | `payload.room.game.current_turn.guesses_remaining` | null | yes | yes | `null` | No guesses before clue |\n          | `payload.room.game.score.red` | integer | yes | no | `0..9` | Revealed RED cards |\n          | `payload.room.game.score.blue` | integer | yes | no | `0..8` | Revealed BLUE cards |\n          | `payload.room.game.board[]` | array<object> | yes | no | exactly 25 | Ordered board |\n          | `payload.room.game.board[].card_id` | integer | yes | no | unique `1..25` | Card ID |\n          | `payload.room.game.board[].word` | string | yes | no | canonical word | Public word |\n          | `payload.room.game.board[].revealed` | boolean | yes | no | `false` initially | Reveal state |\n          | `payload.room.game.board[].color` | enum or null | yes | yes | `RED`, `BLUE`, `NEUTRAL`, `ASSASSIN`, `null` | Null only for an Operative's unrevealed card |\n          | `payload.room.game.winner` | enum or null | yes | yes | `RED`, `BLUE`, `null` | Null at start |\n          | `payload.room.game.end_reason` | enum or null | yes | yes | `ALL_TEAM_CARDS_REVEALED`, `ASSASSIN_REVEALED`, `null` | Null at start |\n          | `payload.room.game.started_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Game start |\n          | `payload.room.game.finished_at` | `string<date-time>` or null | yes | yes | UTC or `null` | Null at start |\n          | `payload.room.created_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Room creation |\n\n          ## Complete Spymaster-visible `game.started`\n\n          ```json\n          {\n            \"type\": \"game.started\",\n            \"event_id\": \"evt_0137\",\n            \"room_id\": 1001,\n            \"sent_at\": \"2026-09-10T08:43:15Z\",\n            \"payload\": {\n              \"room\": {\n                \"room_id\": 1001,\n                \"status\": \"IN_GAME\",\n                \"host_user_id\": 42,\n                \"player_count\": 4,\n                \"startable\": false,\n                \"players\": [\n                  {\"user_id\":42,\"username\":\"player_one\",\"team\":\"RED\",\"role\":\"SPYMASTER\",\"ready\":true,\"is_host\":true,\"joined_at\":\"2026-09-10T08:41:00Z\"},\n                  {\"user_id\":43,\"username\":\"red_agent\",\"team\":\"RED\",\"role\":\"OPERATIVE\",\"ready\":true,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:20Z\"},\n                  {\"user_id\":44,\"username\":\"blue_master\",\"team\":\"BLUE\",\"role\":\"SPYMASTER\",\"ready\":true,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:30Z\"},\n                  {\"user_id\":45,\"username\":\"blue_agent\",\"team\":\"BLUE\",\"role\":\"OPERATIVE\",\"ready\":true,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:40Z\"}\n                ],\n                \"game\": {\n                  \"game_id\": 5001,\n                  \"starting_team\": \"RED\",\n                  \"current_turn\": {\"team\":\"RED\",\"phase\":\"WAITING_FOR_CLUE\",\"clue\":null,\"guesses_remaining\":null},\n                  \"score\": {\"red\":0,\"blue\":0},\n                  \"board\": [\n                    {\"card_id\":1,\"word\":\"MOON\",\"revealed\":false,\"color\":\"RED\"},\n                    {\"card_id\":2,\"word\":\"APPLE\",\"revealed\":false,\"color\":\"BLUE\"},\n                    {\"card_id\":3,\"word\":\"TRAIN\",\"revealed\":false,\"color\":\"RED\"},\n                    {\"card_id\":4,\"word\":\"BRIDGE\",\"revealed\":false,\"color\":\"BLUE\"},\n                    {\"card_id\":5,\"word\":\"OCEAN\",\"revealed\":false,\"color\":\"RED\"},\n                    {\"card_id\":6,\"word\":\"KING\",\"revealed\":false,\"color\":\"BLUE\"},\n                    {\"card_id\":7,\"word\":\"LASER\",\"revealed\":false,\"color\":\"RED\"},\n                    {\"card_id\":8,\"word\":\"FOREST\",\"revealed\":false,\"color\":\"BLUE\"},\n                    {\"card_id\":9,\"word\":\"DOCTOR\",\"revealed\":false,\"color\":\"RED\"},\n                    {\"card_id\":10,\"word\":\"GLASS\",\"revealed\":false,\"color\":\"BLUE\"},\n                    {\"card_id\":11,\"word\":\"DRAGON\",\"revealed\":false,\"color\":\"RED\"},\n                    {\"card_id\":12,\"word\":\"TABLE\",\"revealed\":false,\"color\":\"BLUE\"},\n                    {\"card_id\":13,\"word\":\"SATURN\",\"revealed\":false,\"color\":\"RED\"},\n                    {\"card_id\":14,\"word\":\"SNOW\",\"revealed\":false,\"color\":\"BLUE\"},\n                    {\"card_id\":15,\"word\":\"PIANO\",\"revealed\":false,\"color\":\"RED\"},\n                    {\"card_id\":16,\"word\":\"HEART\",\"revealed\":false,\"color\":\"BLUE\"},\n                    {\"card_id\":17,\"word\":\"ROME\",\"revealed\":false,\"color\":\"RED\"},\n                    {\"card_id\":18,\"word\":\"WHALE\",\"revealed\":false,\"color\":\"NEUTRAL\"},\n                    {\"card_id\":19,\"word\":\"ROBOT\",\"revealed\":false,\"color\":\"NEUTRAL\"},\n                    {\"card_id\":20,\"word\":\"CROWN\",\"revealed\":false,\"color\":\"NEUTRAL\"},\n                    {\"card_id\":21,\"word\":\"DESERT\",\"revealed
