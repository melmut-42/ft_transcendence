\":false,\"color\":\"NEUTRAL\"},\n                    {\"card_id\":22,\"word\":\"SCREEN\",\"revealed\":false,\"color\":\"NEUTRAL\"},\n                    {\"card_id\":23,\"word\":\"MOUSE\",\"revealed\":false,\"color\":\"NEUTRAL\"},\n                    {\"card_id\":24,\"word\":\"KNIFE\",\"revealed\":false,\"color\":\"NEUTRAL\"},\n                    {\"card_id\":25,\"word\":\"CLOUD\",\"revealed\":false,\"color\":\"ASSASSIN\"}\n                  ],\n                  \"winner\": null,\n                  \"end_reason\": null,\n                  \"started_at\": \"2026-09-10T08:43:15Z\",\n                  \"finished_at\": null\n                },\n                \"created_at\": \"2026-09-10T08:41:00Z\"\n              }\n            }\n          }\n          ```\n\n          ## Complete Operative-visible `game.started`\n\n          ```json\n          {\n            \"type\": \"game.started\",\n            \"event_id\": \"evt_0137\",\n            \"room_id\": 1001,\n            \"sent_at\": \"2026-09-10T08:43:15Z\",\n            \"payload\": {\n              \"room\": {\n                \"room_id\": 1001,\n                \"status\": \"IN_GAME\",\n                \"host_user_id\": 42,\n                \"player_count\": 4,\n                \"startable\": false,\n                \"players\": [\n                  {\"user_id\":42,\"username\":\"player_one\",\"team\":\"RED\",\"role\":\"SPYMASTER\",\"ready\":true,\"is_host\":true,\"joined_at\":\"2026-09-10T08:41:00Z\"},\n                  {\"user_id\":43,\"username\":\"red_agent\",\"team\":\"RED\",\"role\":\"OPERATIVE\",\"ready\":true,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:20Z\"},\n                  {\"user_id\":44,\"username\":\"blue_master\",\"team\":\"BLUE\",\"role\":\"SPYMASTER\",\"ready\":true,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:30Z\"},\n                  {\"user_id\":45,\"username\":\"blue_agent\",\"team\":\"BLUE\",\"role\":\"OPERATIVE\",\"ready\":true,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:40Z\"}\n                ],\n                \"game\": {\n                  \"game_id\": 5001,\n                  \"starting_team\": \"RED\",\n                  \"current_turn\": {\"team\":\"RED\",\"phase\":\"WAITING_FOR_CLUE\",\"clue\":null,\"guesses_remaining\":null},\n                  \"score\": {\"red\":0,\"blue\":0},\n                  \"board\": [\n                    {\"card_id\":1,\"word\":\"MOON\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":2,\"word\":\"APPLE\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":3,\"word\":\"TRAIN\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":4,\"word\":\"BRIDGE\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":5,\"word\":\"OCEAN\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":6,\"word\":\"KING\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":7,\"word\":\"LASER\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":8,\"word\":\"FOREST\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":9,\"word\":\"DOCTOR\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":10,\"word\":\"GLASS\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":11,\"word\":\"DRAGON\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":12,\"word\":\"TABLE\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":13,\"word\":\"SATURN\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":14,\"word\":\"SNOW\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":15,\"word\":\"PIANO\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":16,\"word\":\"HEART\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":17,\"word\":\"ROME\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":18,\"word\":\"WHALE\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":19,\"word\":\"ROBOT\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":20,\"word\":\"CROWN\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":21,\"word\":\"DESERT\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":22,\"word\":\"SCREEN\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":23,\"word\":\"MOUSE\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":24,\"word\":\"KNIFE\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":25,\"word\":\"CLOUD\",\"revealed\":false,\"color\":null}\n                  ],\n                  \"winner\": null,\n                  \"end_reason\": null,\n                  \"started_at\": \"2026-09-10T08:43:15Z\",\n                  \"finished_at\": null\n                },\n                \"created_at\": \"2026-09-10T08:41:00Z\"\n              }\n            }\n          }\n          ```\n\n          ## Field requirements\n\n          Every nested field follows the room/game schema documented by REST `Get room snapshot`. `ready` is retained as the frozen start confirmation after game start; it has no post-start mutation semantics. `startable=false` outside `WAITING` even though the starting composition remains valid. `current_turn.clue` and `guesses_remaining` are null in `WAITING_FOR_CLUE`.\n\n          ## State changes, events, and errors\n\n          `game.started` follows the zero tick, sets room `IN_GAME`, creates the board once, and begins with the starting team waiting for clue. It is not a client action and has no action error. If an invariant breaks before board creation, the server cancels countdown instead and neither projection is emitted.\n      - info:\n          name: Canonical scenario index\n          type: websocket\n          seq: 2\n          tags:\n            - scenario\n            - reference\n        websocket:\n          url: '{{wsUrl}}/ws/rooms/{{roomId}}'\n          headers:\n            - name: X-Session-Id\n              value: '{{sessionToken}}'\n        docs: |-\n          # Canonical scenario index\n\n          ## End-to-end reconstruction\n\n          This passive reference maps each required state to its normative example. It sends no message.\n\n          It connects with required positive-integer path `room_id=1001` and required handshake header `X-Session-Id` containing an active opaque member session.\n\n          | Scenario | Fixture transition | Contract location |\n          | --- | --- | --- |\n          | Newly created room | user `42` creates `1001` | REST `Create room` |\n          | Four joined, unconfigured | users `42..45`, all selections null | REST `Get room snapshot` |\n          | Teams selected, roles incomplete | users `43` and `45` lack roles | REST `Get room snapshot` |\n          | Duplicate Spymaster | user `43` requests RED Spymaster occupied by `42` | WebSocket `Select role` |\n          | Roles valid, some unready | user `45` remains false | REST `Get room snapshot` |\n          | All four ready | `req_0013` changes user `45` | WebSocket `Set ready` |\n          | Countdown | seconds `3`, `2`, `1`, `0` | WebSocket `Countdown event reference` |\n          | Countdown cancelled | user `43` changes true to false | WebSocket `Set ready` |\n          | Game started | room `IN_GAME`, game `5001`, all 25 cards | `Full IN_GAME role projections` |\n          | Clue submitted | RED Spymaster, `ocean / 2`, 3 guesses | WebSocket `Submit clue` |\n          | Correct own guess | RED reveals card `5`, score `3-2`, 2 guesses | WebSocket `Guess card` |\n          | Neutral guess | RED reveals card `18`, BLUE turn | WebSocket `Guess card` |\n          | Opponent guess | RED reveals BLUE card `6`, blue score rises | WebSocket `Guess card` |\n          | Assassin | RED reveals card `25`, BLUE wins | WebSocket `Guess card` |\n          | Normal victory | card `17` completes RED | WebSocket `Guess card` |\n          | Opponent completion | RED reveals card `16`, completes BLUE | WebSocket `Guess card` |\n          | Finished game | room `FINISHED`, phase `GAME_OVER`, result event | below |\n\n          ## Finished game snapshot\n\n          This Spymaster-visible state follows the normal RED victory branch. The nine RED cards and five previously found BLUE cards are revealed. Spymasters continue to see the full map; an Operative projection MUST replace the colors of every remaining unrevealed card with `null`, even after `FINISHED`.\n\n          ```json\n          {\n            \"type\":\"game.state\",\n            \"event_id\":\"evt_0183\",\n            \"room_id\":1001,\n            \"sent_at\":\"2026-09-10T08:50:01Z\",\n            \"payload\":{\"room\":{\n              \"room_id\":1001,\n              \"status\":\"FINISHED\",\n              \"host_user_id\":42,\n              \"player_count\":4,\n              \"startable\":false,\n              \"players\":[\n                {\"user_id\":42,\"username\":\"player_one\",\"team\":\"RED\",\"role\":\"SPYMASTER\",\"ready\":true,\"is_host\":true,\"joined_at\":\"2026-09-10T08:41:00Z\"},\n                {\"user_id\":43,\"username\":\"red_agent\",\"team\":\"RED\",\"role\":\"OPERATIVE\",\"ready\":true,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:20Z\"},\n                {\"user_id\":44,\"username\":\"blue_master\",\"team\":\"BLUE\",\"role\":\"SPYMASTER\",\"ready\":true,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:30Z\"},\n                {\"user_id\":45,\"username\":\"blue_agent\",\"team\":\"BLUE\",\"role\":\"OPERATIVE\",\"ready\":true,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:40Z\"}\n              ],\n              \"game\":{\n                \"game_id\":5001,\n                \"starting_team\":\"RED\",\n                \"current_turn\":{\"team\":\"RED\",\"phase\":\"GAME_OVER\",\"clue\":{\"word\":\"empire\",\"number\":1},\"guesses_remaining\":null},\n                \"score\":{\"red\":9,\"blue\":5},\n                \"board\":[\n                  {\"card_id\":1,\"word\":\"MOON\",\"revealed\":true,\"color\":\"RED\"},\n                  {\"card_id\":2,\"word\":\"APPLE\",\"revealed\":true,\"color\":\"BLUE\"},\n                  {\"card_id\":3,\"word\":\"TRAIN\",\"revealed\":true,\"color\":\"RED\"},\n                  {\"card_id\":4,\"word\":\"BRIDGE\",\"revealed\":true,\"color\":\"BLUE\"},\n                  {\"card_id\":5,\"word\":\"OCEAN\",\"revealed\":true,\"color\":\"RED\"},\n                  {\"card_id\":6,\"word\":\"KING\",\"revealed\":true,\"color\":\"BLUE\"},\n                  {\"card_id\":7,\"word\":\"LASER\",\"revealed\":true,\"color\":\"RED\"},\n                  {\"card_id\":8,\"word\":\"FOREST\",\"revealed\":true,\"color\":\"BLUE\"},\n                  {\"card_id\":9,\"word\":\"DOCTOR\",\"revealed\":true,\"color\":\"RED\"},\n                  {\"card_id\":10,\"word\":\"GLASS\",\"revealed\":true,\"color\":\"BLUE\"},\n                  {\"card_id\":11,\"word\":\"DRAGON\",\"revealed\":true,\"color\":\"RED\"},\n                  {\"card_id\":12,\"word\":\"TABLE\",\"revealed\":false,\"color\":\"BLUE\"},\n                  {\"card_id\":13,\"word\":\"SATURN\",\"revealed\":true,\"color\":\"RED\"},\n                  {\"card_id\":14,\"word\":\"SNOW\",\"revealed\":false,\"color\":\"BLUE\"},\n                  {\"card_id\":15,\"word\":\"PIANO\",\"revealed\":true,\"color\":\"RED\"},\n                  {\"card_id\":16,\"word\":\"HEART\",\"revealed\":false,\"color\":\"BLUE\"},\n                  {\"card_id\":17,\"word\":\"ROME\",\"revealed\":true,\"color\":\"RED\"},\n                  {\"card_id\":18,\"word\":\"WHALE\",\"revealed\":false,\"color\":\"NEUTRAL\"},\n                  {\"card_id\":19,\"word\":\"ROBOT\",\"revealed\":false,\"color\":\"NEUTRAL\"},\n                  {\"card_id\":20,\"word\":\"CROWN\",\"revealed\":false,\"color\":\"NEUTRAL\"},\n                  {\"card_id\":21,\"word\":\"DESERT\",\"revealed\":false,\"color\":\"NEUTRAL\"},\n                  {\"card_id\":22,\"word\":\"SCREEN\",\"revealed\":false,\"color\":\"NEUTRAL\"},\n                  {\"card_id\":23,\"word\":\"MOUSE\",\"revealed\":false,\"color\":\"NEUTRAL\"},\n                  {\"card_id\":24,\"word\":\"KNIFE\",\"revealed\":false,\"color\":\"NEUTRAL\"},\n                  {\"card_id\":25,\"word\":\"CLOUD\",\"revealed\":false,\"color\":\"ASSASSIN\"}\n                ],\n                \"winner\":\"RED\",\n                \"end_reason\":\"ALL_TEAM_CARDS_REVEALED\",\n                \"started_at\":\"2026-09-10T08:43:15Z\",\n                \"finished_at\":\"2026-09-10T08:50:00Z\"\n              },\n              \"created_at\":\"2026-09-10T08:41:00Z\"\n            }}\n          }\n          ```\n\n          The finished recovery snapshot is paired with the terminal `game.ended` event. Persistent wins/losses update once: users `42,43` gain one win and users `44,45` gain one loss. Team and role remain room-scoped until room lifecycle cleanup. The terminal event reveals card `17`; it never carries unrelated hidden card colors.\n\n          ## Scope boundary\n\n          There is no rematch, spectator, bot, matchmaking, room-password, capacity, kick/ban, custom-board, custom-timer, or chat event protocol in this revision.\n  - info:\n      name: 00 - Connection & Protocol\n      type: folder\n    docs:\n      content: |-\n        # Connection and protocol\n\n        Authenticate the handshake with `X-Session-Id`; the URL contains only the integer `roomId`. The user must already be a REST room member. The first frame is a role-safe `room.state`. Reconnect replaces local state from a fresh snapshot; ordinary transport disconnect does not itself remove membership.\n      type: text/markdown\n    items:\n      - info:\n          name: Connect to room stream\n          type: websocket\n          seq: 1\n          tags:\n            - connection\n            - smoke\n        websocket:\n          url: '{{wsUrl}}/ws/rooms/{{roomId}}'\n          headers:\n            - name: X-Session-Id\n              value: '{{sessionToken}}'\n        docs: |-\n          # Connect to room stream\n\n          ## Purpose\n\n          Opens the sole realtime channel for one REST-joined room. No subscription message is needed because `room_id` is in the path.\n\n          ## Preconditions and handshake parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `room_id` | path | yes | integer | positive | no | Existing room already joined by user | `1001` |\n          | `X-Session-Id` | handshake header | yes | string | active opaque session | no | Same credential used by REST | `sess_A3redAgent9Kp` |\n\n          ## Success behavior\n\n          The server upgrades with HTTP `101 Switching Protocols`, then sends a role-safe `room.state`. If the room is `IN_GAME` or `FINISHED`, the snapshot includes the recipient-projected game board.\n\n          Initial event fields:\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `type` | string enum | yes | no | `room.state` | Snapshot event name |\n          | `event_id` | string | yes | no | unique in room stream | Ordering/correlation ID |\n          | `room_id` | integer | yes | no | positive | Subscribed room |\n          | `sent_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Event creation time |\n          | `payload.room` | object | yes | no | canonical room schema | Recipient-safe snapshot |\n\n          ## Failure behavior\n\n          | HTTP status | Code | Condition | Socket opens |\n          | --- | --- | --- | --- |\n          | `401` | `UNAUTHORIZED` | missing, invalid, revoked, or expired token | no |\n          | `404` | `ROOM_NOT_FOUND` | path room does not exist | no |\n          | `403` | `NOT_ROOM_MEMBER` | authenticated user is not a member | no |\n          | `409` | `INVALID_ROOM_STATE` | room is `CLOSED` | no |\n\n          A successful transport disconnect changes no membership state. Reconnect with the same session yields a current snapshot; missed incremental events need not be replayed.\n\n          ## Concrete frames\n\n          First frame for the newly created fixture room:\n\n          ```json\n          {\"type\":\"room.state\",\"event_id\":\"evt_0100\",\"room_id\":1001,\"sent_at\":\"2026-09-10T08:41:01Z\",\"payload\":{\"room\":{\"room_id\":1001,\"status\":\"WAITING\",\"host_user_id\":42,\"player_count\":1,\"startable\":false,\"players\":[{\"user_id\":42,\"username\":\"player_one\",\"team\":null,\"role\":null,\"ready\":false,\"is_host\":true,\"joined_at\":\"2026-09-10T08:41:00Z\"}],\"game\":null,\"created_at\":\"2026-09-10T08:41:00Z\"}}}\n          ```\n\n          Failed authentication body before upgrade:\n\n          ```json\n          {\"error\":{\"code\":\"UNAUTHORIZED\",\"message\":\"A valid active session is required.\",\"details\":{}}}\n          ```\ndocs:\n  content: |-\n    # ft_transcendence WebSocket Protocol\n\n    ## Connection\n\n    Connect to `{{wsUrl}}/ws/rooms/{{roomId}}` with handshake header `X-Session-Id: {{sessionToken}}`. The session must be active and the user must already belong to the room through REST. Authentication is never placed in the URL. A successful connection first receives a recipient-safe `room.state` snapshot.\n\n    Invalid session rejects the handshake with HTTP `401`; missing room uses `404`; an authenticated non-member uses `403`. An ordinary disconnect does not remove room membership immediately. Reconnect with the same session obtains a fresh role-safe snapshot. Membership removal occurs only through the REST leave endpoint or room lifecycle policy.\n\n    ## Envelopes and ordering\n\n    Client messages are `{ \"type\", \"request_id\", \"payload\" }`. `request_id` is a client-generated unique string of `1..64` visible ASCII characters. The server caches the result of a request ID per session for the room lifetime; an identical retry returns the original ack/error and does not repeat mutation. Reuse with different content returns `INVALID_EVENT`.\n\n    Successful commands receive `{ \"type\": \"ack\", \"request_id\", \"ok\": true, \"payload\": object }`. Events are `{ \"type\", \"event_id\", \"room_id\", \"sent_at\", \"payload\" }`. `event_id` is unique and monotonically ordered within one room stream. Timestamps are ISO 8601 UTC. Clients apply events in arrival order and replace local state when a full `room.state` or `game.state` snapshot arrives.\n\n    ## Message and event matrix\n\n    | Type | Direction | Allowed room/phase | Permission | Purpose |\n    | --- | --- | --- | --- | --- |\n    | `room.team.select` | C to S | `WAITING`, `COUNTDOWN` | member | select team; countdown change cancels |\n    | `room.role.select` | C to S | `WAITING`, `COUNTDOWN` | member with team | select role; countdown change cancels |\n    | `room.ready.set` | C to S | `WAITING`, `COUNTDOWN` for false | configured member | toggle readiness |\n    | `game.clue.submit` | C to S | `IN_GAME / WAITING_FOR_CLUE` | active Spymaster | create clue and guesses |\n    | `game.card.guess` | C to S | `IN_GAME / GUESSING` | active Operative | reveal one card |\n    | `game.turn.pass` | C to S | `IN_GAME / GUESSING` | active Operative | end team turn |\n    | `room.state` | S to C | any non-closed state | recipient projection | full room snapshot |\n    | `room.player.joined` | S to C | `WAITING` | server | membership added |\n    | `room.player.left` | S to C | `WAITING`, `COUNTDOWN`, `FINISHED` | server | membership removed/host transfer |\n    | `room.player.updated` | S to C | `WAITING`, `COUNTDOWN` | server | team, role, ready change |\n    | `room.countdown.started` | S to C | `COUNTDOWN` | server | start at 3 seconds |\n    | `room.countdown.tick` | S to C | `COUNTDOWN` | server | remaining `2`, `1`, `0` |\n    | `room.countdown.cancelled` | S to C | `WAITING` | server | invariant broke |\n    | `game.started` | S to C | `IN_GAME` | recipient projection | complete role-safe game |\n    | `game.state` | S to C | `IN_GAME`, `FINISHED` | recipient projection | recovery snapshot |\n    | `game.clue.submitted` | S to C | `IN_GAME / GUESSING` | server | public clue |\n    | `game.card.revealed` | S to C | `IN_GAME`, `FINISHED` | recipient projection | reveal result |\n    | `game.score.updated` | S to C | `IN_GAME`, `FINISHED` | server | revealed team totals |\n    | `game.turn.changed` | S to C | `IN_GAME` | server | next team waits for clue |\n    | `game.ended` | S to C | `FINISHED / GAME_OVER` | server | terminal result |\n    | `ack` | S to C | command-dependent | requester | command accepted |\n    | `error` | S to C | any open connection | requester | command rejected |\n\n    ## Countdown and authority\n\n    The server rechecks the full start predicate after every join, leave, team, role, and ready change. When it first becomes true, the room enters `COUNTDOWN` and emits start plus concrete ticks. Any invalidation emits cancellation and returns to `WAITING`. Completion while still valid generates the 25-card board and enters `IN_GAME`. There is no host start command.\n\n    ## Privacy projection\n\n    Spymasters receive all 25 colors. Operatives receive `color: null` on unrevealed cards and the true color on revealed cards. The server MUST render events per recipient and MUST NOT broadcast one secret-bearing payload. The full paired examples in `07 - Full State Scenarios` differ only where authorization requires it.\n\n    ## Errors and connection policy\n\n    Action errors retain the connection and never mutate room/game state. `INVALID_EVENT`, `INVALID_PAYLOAD`, `NOT_ROOM_MEMBER`, `INVALID_ROOM_STATE`, `TEAM_REQUIRED`, `ROLE_REQUIRED`, `ROLE_CONFLICT`, `NOT_YOUR_TURN`, `ROLE_FORBIDDEN`, `INVALID_CLUE`, `INVALID_CLUE_NUMBER`, `INVALID_CARD`, `CARD_ALREADY_REVEALED`, `NO_GUESSES_REMAINING`, and `GAME_ALREADY_FINISHED` have concrete examples in the action/error folders. The server may close for invalid handshake auth or repeated protocol abuse only.\n\n    ## Example index\n\n    `03 - Ready & Countdown` contains minimum valid room, countdown, and cancellation. `07 - Full State Scenarios` contains full Spymaster and Operative boards. `04 - Game` contains clue, own-team continuation, last-guess turn end, own-team victory, opponent turn end, opponent final-card victory, neutral, assassin, pass, and invalid-action cases.\n  type: text/markdown\nbundled: true\nextensions:\n  bruno:\n    exportedAt: '2026-09-10T09:52:53.201Z'\n    exportedUsing: Bruno/4.1.0\n";
