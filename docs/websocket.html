ring with the action or connection-state change that triggered it. Record unexpected frames for backend investigation.\n  - info:\n      name: \uD83D\uDD0C Connection\n      type: folder\n    docs:\n      content: |-\n        # \uD83D\uDD0C WebSocket Connection\n\n        This folder contains the canonical handshake request for the shared room/game socket.\n\n        ## Connection URL\n\n        ```text\n        {{wsUrl}}/ws?session_id={{session_id}}\n        ```\n\n        Authentication is supplied only through the `session_id` query parameter. REST-protected requests use `X-Session-Id` separately.\n\n        ## Connection request\n\n        `connect` opens the socket with a valid local session.\n\n        The collection does not keep separate missing-session or invalid-session child requests. Test those handshake failures against the backend only when the required scenario is prepared, and record the returned error using the error_catalog in the WebSocket collection overview.\n      type: text/markdown\n    items:\n      - info:\n          name: connect\n          type: websocket\n          seq: 1\n          tags:\n            - interactive\n            - smoke\n        websocket:\n          url: '{{wsUrl}}/ws?session_id={{session_id}}'\n        docs: |-\n          # \u26A1 connect\n\n          ## Purpose\n\n          Opens the shared WebSocket with the session from the selected Bruno environment.\n\n          ## URL and authentication\n\n          `{{wsUrl}}/ws?session_id={{session_id}}`\n\n          The session is sent as the `session_id` query parameter. It is not sent as the REST `X-Session-Id` header.\n\n          ## Usage\n\n          Run the REST `Enter user` request first, then open this connection. Once connected, observe server events and select a client action only when its documented game-state preconditions are satisfied.\n\n          ## Message behavior\n\n          This request sends no application message. It is the normal authenticated connection scenario.\n\n          ## Validation\n\n          Confirm the handshake succeeds and keep the session value in Bruno's local secret storage.\ndocs:\n  content: |-\n    # \u26A1 ft_transcendence WebSocket API\n\n    This collection documents the shared room/game WebSocket used by `ft_transcendence`.\n\n    ## Transport and authentication\n\n    ```text\n    {{wsUrl}}/ws?session_id={{session_id}}\n    ```\n\n    Select the `local` environment. REST creates the temporary session; the WebSocket sends that session in the `session_id` query parameter during the handshake. The WebSocket does not use REST's `X-Session-Id` header.\n\n    ## Collection layout\n\n    - **Connection** \u2014 the canonical authenticated handshake.\n    - **Client Actions** \u2014 known outbound event names; only `give_clue` has a verified payload example.\n    - **Server Events** \u2014 passive observers for known server event names.\n    - **Errors** \u2014 the error envelope, catalog guidance, and failure-testing rules.\n\n    ## Recommended workflow\n\n    1. Select `local` and run the REST `Enter user` request.\n    2. Open `connect` with the populated `session_id`.\n    3. Prepare the required room membership, role, turn, and game state.\n    4. Select one client action only when its preconditions are satisfied.\n    5. Observe the related server event or error frame in Bruno's message history.\n\n    Do not batch-run this collection. Some requests observe frames, while actions change live game state.\n\n    ## Known client events\n\n    `leave_room`, `start_game`, `give_clue`, `reveal_card`, and `end_turn`.\n\n    ## Known server events\n\n    `player_joined`, `player_left`, `game_started`, `clue_given`, `card_revealed`, `turn_changed`, `player_disconnected`, `player_reconnected`, `game_finished`, and `game_action_logged`.\n\n    ## Errors and error_catalog\n\n    All WebSocket error guidance lives in this collection overview. The current repository verifies the `INVALID_ACTION` error code, but it does not contain a concrete server error body or verified message text. No fabricated error JSON is shown here.\n\n    ### Known error codes\n\n    | Code | Description | Scope |\n    | --- | --- | --- |\n    | `INVALID_ACTION` | The requested client action is not allowed in the current role, turn, or game state. | WebSocket action rejection; confirm the exact backend message in a captured frame. |\n\n    `INVALID_ACTION` is the only WebSocket error code currently named by the workspace contract. No additional WebSocket code is treated as verified until it appears in an authoritative backend response or backend documentation. REST error codes are documented in the REST collection and are intentionally not duplicated in this WebSocket catalog.\n\n    ### Error-testing procedure\n\n    1. Open `connect` when the failure scenario requires an authenticated session.\n    2. Prepare one deliberate handshake or client-action failure.\n    3. Capture the returned frame in Bruno's message history.\n    4. Record the exact `event`, `data.code`, and `data.message`.\n    5. Confirm a rejected action did not mutate state or create a successful action log.\n\n    ## Contract boundaries\n\n    The `give_clue` request contains the only complete client payload currently verified in this workspace. Other client messages stay disabled until their payloads are confirmed. Server event files document names and observation guidance without inventing payload fields.\n\n    The backend validates identity, membership, role, turn, and game state. Rejected actions must not mutate state or create a successful action log.\n  type: text/markdown\nbundled: true\nextensions:\n  bruno:\n    exportedAt: '2026-09-09T21:02:12.640Z'\n    exportedUsing: Bruno/4.1.0\n";
