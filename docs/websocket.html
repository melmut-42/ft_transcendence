`, Reconnect) | role-safe board |\n          | `game.clue.submitted` | `game_id`, actor, team, clue, guesses, turn | accepted clue | common |\n          | `game.card.revealed` | game/card/actor/team/score/turn/result | accepted guess | role-safe board delta |\n          | `game.score.updated` | `game_id`, `score`, `changed_color` | RED or BLUE reveal | common |\n          | `game.turn.changed` | game ID, previous team, reason, current turn, score | non-terminal turn end | common |\n          | `game.ended` | winner, loser, reason, revealed card, score, status, phase, time | terminal reveal, or `PLAYER_FORFEIT` (abandonment-timeout, explicit `Leave room`, or logout during `IN_GAME` \u2014 `workspace.yml`, Room Abandonment) | contains only the revealed terminal card (`null` for `PLAYER_FORFEIT`); no hidden-board disclosure |\n\n          ## Concrete game events\n\n          ```json\n            {\n              \"type\": \"game.score.updated\",\n              \"event_id\": \"evt_0144\",\n              \"room_id\": 1001,\n              \"sent_at\": \"2026-09-10T08:44:01Z\",\n              \"payload\": {\n                \"game_id\": 5001,\n                \"score\": {\n                  \"red\": 3,\n                  \"blue\": 2\n                },\n                \"changed_color\": \"RED\"\n              }\n            }\n          ```\n\n          ```json\n            {\n              \"type\": \"game.turn.changed\",\n              \"event_id\": \"evt_0148\",\n              \"room_id\": 1001,\n              \"sent_at\": \"2026-09-10T08:44:20Z\",\n              \"payload\": {\n                \"game_id\": 5001,\n                \"previous_team\": \"RED\",\n                \"reason\": \"NEUTRAL_CARD_REVEALED\",\n                \"current_turn\": {\n                  \"team\": \"BLUE\",\n                  \"phase\": \"WAITING_FOR_CLUE\",\n                  \"clue\": null,\n                  \"guesses_remaining\": null\n                },\n                \"score\": {\n                  \"red\": 3,\n                  \"blue\": 2\n                }\n              }\n            }\n          ```\n\n          ```json\n            {\n              \"type\": \"game.card.revealed\",\n              \"event_id\": \"evt_0143\",\n              \"room_id\": 1001,\n              \"sent_at\": \"2026-09-10T08:44:01Z\",\n              \"payload\": {\n                \"game_id\": 5001,\n                \"card\": {\n                  \"card_id\": 5,\n                  \"word\": \"OCEAN\",\n                  \"revealed\": true,\n                  \"color\": \"RED\"\n                },\n                \"guessed_by_user_id\": 43,\n                \"guessing_team\": \"RED\",\n                \"score\": {\n                  \"red\": 3,\n                  \"blue\": 2\n                },\n                \"current_turn\": {\n                  \"team\": \"RED\",\n                  \"phase\": \"GUESSING\",\n                  \"clue\": {\n                    \"word\": \"ocean\",\n                    \"number\": 2\n                  },\n                  \"guesses_remaining\": 2\n                },\n                \"winner\": null,\n                \"end_reason\": null\n              }\n            }\n          ```\n\n          ## Acknowledgement schema\n\n          Acks are not room events and omit `event_id`, `room_id`, and `sent_at`:\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `type` | string enum | yes | no | `ack` | Response discriminator |\n          | `request_id` | string | yes | no | echoed request | Correlation/idempotency ID |\n          | `ok` | boolean | yes | no | `true` | Acceptance flag |\n          | `payload` | object | yes | no | command-specific result | Authoritative post-command values |\n\n          ## Invariants\n\n          A terminal `game.ended` is final for the match and no `game.turn.changed` follows it. An Operative event never leaks any unrelated unrevealed card color, including after `FINISHED`. Duplicate request IDs do not duplicate domain events.\n\n          ## Forfeit example\n\n          Abandonment (grace period expiry), explicit `Leave room`, or logout during `IN_GAME` all produce this same event shape \u2014 RED's Spymaster (user `42`) abandons mid-match:\n\n          ```json\n            {\n              \"type\": \"game.ended\",\n              \"event_id\": \"evt_0190\",\n              \"room_id\": 1001,\n              \"sent_at\": \"2026-09-10T08:46:30Z\",\n              \"payload\": {\n                \"game_id\": 5001,\n                \"winner\": \"BLUE\",\n                \"loser\": \"RED\",\n                \"end_reason\": \"PLAYER_FORFEIT\",\n                \"abandoned_by_user_id\": 42,\n                \"revealed_card\": null,\n                \"score\": {\n                  \"red\": 2,\n                  \"blue\": 2\n                },\n                \"room_status\": \"FINISHED\",\n                \"phase\": \"GAME_OVER\",\n                \"finished_at\": \"2026-09-10T08:46:30Z\"\n              }\n            }\n          ```\n  - info:\n      name: 06 - Errors\n      type: folder\n      seq: 6\n    docs:\n      content: |-\n        # WebSocket errors\n\n        Errors correlate to the rejected `request_id`, contain a concrete code and message, leave state unchanged, and normally keep the socket open. Handshake failures occur as HTTP responses before the WebSocket opens. Repeated protocol abuse is the only documented reason the server may close an authenticated socket after an application error.\n      type: text/markdown\n    items:\n      - info:\n          name: Error catalog\n          type: websocket\n          seq: 1\n          tags:\n            - error\n            - reference\n        websocket:\n          url: '{{wsUrl}}/ws/rooms/{{roomId}}'\n          message:\n            - title: Error trigger - Unknown event\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"room.start\",\n                    \"request_id\": \"req_0090\",\n                    \"payload\": {}\n                  }\n            - title: Error trigger - Missing request ID\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"room.ready.set\",\n                    \"payload\": {\n                      \"ready\": true\n                    }\n                  }\n        docs: |-\n          # WebSocket error catalog\n\n          ## Purpose and envelope\n\n          Defines all application error codes. An error is requester-only, changes no state, emits no success event, and keeps the socket open. The only exceptions are HTTP handshake rejection and optional close after repeated protocol abuse.\n\n          The reference connects with path `room_id` (required positive integer, example `1001`), authenticated by the `ft_session` cookie alone. Its two disabled messages use the same client envelope documented below; one intentionally uses unsupported type `room.start`, and one intentionally omits `request_id`.\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `room_id` | WebSocket path | yes | integer | positive | no | Connected room | `1001` |\n          | `ft_session` cookie | handshake | yes | string | HttpOnly, Secure, active session | no | Sole handshake credential; automatic on same-origin upgrade | set by Register/Login |\n          | `type` | envelope | yes | string | canonical operation name | no | Deliberately invalid in first example | `room.start` |\n          | `request_id` | envelope | yes | string | `1..64` visible ASCII | no | Deliberately absent in second example | `req_0090` |\n          | `payload` | envelope | yes | object | operation-specific | no | Command parameters | `{}` |\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `type` | string enum | yes | no | `error` | Response discriminator |\n          | `request_id` | string or null | yes | yes | echoed ID or `null` when absent/unparseable | Correlation |\n          | `error.code` | string enum | yes | no | catalog values | Machine-readable code |\n          | `error.message` | string | yes | no | concrete human-readable text | Explanation |\n          | `error.details` | object | yes | no | code-specific | Structured context |\n\n          ## Catalog\n\n          | Code | Caused by | State/socket behavior |\n          | --- | --- | --- |\n          | `INVALID_EVENT` | unknown type, bad envelope, duplicate ID reused with different content | unchanged; open |\n          | `INVALID_PAYLOAD` | missing/wrong-type/unrecognized payload field | unchanged; open |\n          | `UNAUTHORIZED` | session becomes invalid after connection | unchanged; server closes with policy code `4401` |\n          | `ROOM_NOT_FOUND` | room removed after connection race | unchanged; server closes with `4404` |\n          | `NOT_ROOM_MEMBER` | user no longer belongs to room | unchanged; server closes with `4403` |\n          | `INVALID_ROOM_STATE` | operation not legal in room status/phase | unchanged; open |\n          | `TEAM_REQUIRED` | ready/role before team | unchanged; open |\n          | `ROLE_REQUIRED` | ready before role | unchanged; open |\n          | `ROLE_CONFLICT` | second Spymaster on one team | unchanged; open |\n          | `NOT_YOUR_TURN` | inactive team attempts clue/guess/pass | unchanged; open |\n          | `ROLE_FORBIDDEN` | wrong room role attempts game action | unchanged; open |\n          | `INVALID_CLUE` | clue word fails deterministic rule | unchanged; open |\n          | `INVALID_CLUE_NUMBER` | clue number not integer `1..9` | unchanged; open |\n          | `INVALID_CARD` | card ID absent/invalid | unchanged; open |\n          | `CARD_ALREADY_REVEALED` | card was already revealed | unchanged; open |\n          | `NO_GUESSES_REMAINING` | stale guess/pass after zero | unchanged; open |\n          | `GAME_ALREADY_FINISHED` | game command after terminal result | unchanged; open |\n          | `NOT_PERMITTED` | chat message to a user who is not a friend and shares no active in-game room | unchanged; open |\n          | `USER_NOT_FOUND` | chat message `to_user_id` does not exist | unchanged; open |\n\n          Room/game codes apply on `/ws/rooms/{roomId}`; `NOT_PERMITTED` and `USER_NOT_FOUND` apply only on the chat socket `/ws/chat` (see `08 - Chat/send-message.yml`).\n\n          ## Concrete examples\n\n          ```json\n            {\n              \"type\": \"error\",\n              \"request_id\": \"req_0090\",\n              \"error\": {\n                \"code\": \"INVALID_EVENT\",\n                \"message\": \"Message type 'room.start' is not supported.\",\n                \"details\": {\n                  \"type\": \"room.start\"\n                }\n              }\n            }\n          ```\n\n          ```json\n            {\n              \"type\": \"error\",\n              \"request_id\": null,\n              \"error\": {\n                \"code\": \"INVALID_EVENT\",\n                \"message\": \"request_id is required for every client message.\",\n                \"details\": {\n                  \"field\": \"request_id\"\n                }\n              }\n            }\n          ```\n\n          ```json\n            {\n              \"type\": \"error\",\n              \"request_id\": \"req_0018\",\n              \"error\": {\n                \"code\": \"ROLE_CONFLICT\",\n                \"message\": \"RED already has a Spymaster.\",\n                \"details\": {\n                  \"team\": \"RED\",\n                  \"occupied_by_user_id\": 42\n                }\n              }\n            }\n          ```\n\n          ```json\n            {\n              \"type\": \"error\",\n              \"request_id\": \"req_0041\",\n              \"error\": {\n                \"code\": \"NOT_YOUR_TURN\",\n                \"message\": \"BLUE cannot guess while RED is the active team.\",\n                \"details\": {\n                  \"active_team\": \"RED\"\n                }\n              }\n            }\n          ```\n\n          ```json\n            {\n              \"type\": \"error\",\n              \"request_id\": \"req_0045\",\n              \"error\": {\n                \"code\": \"GAME_ALREADY_FINISHED\",\n                \"message\": \"Game 5001 has already finished.\",\n                \"details\": {\n                  \"game_id\": 5001,\n                  \"winner\": \"RED\"\n                }\n              }\n            }\n          ```\n\n          ```json\n            {\n              \"type\": \"error\",\n              \"request_id\": \"req_0091\",\n              \"error\": {\n                \"code\": \"INVALID_PAYLOAD\",\n                \"message\": \"payload.ready must be a boolean.\",\n                \"details\": {\n                  \"field\": \"payload.ready\"\n                }\n              }\n            }\n          ```\n\n          ```json\n            {\n              \"type\": \"error\",\n              \"request_id\": \"req_0092\",\n              \"error\": {\n                \"code\": \"UNAUTHORIZED\",\n                \"message\": \"The session is no longer active.\",\n                \"details\": {}\n              }\n            }\n          ```\n\n          ```json\n            {\n              \"type\": \"error\",\n              \"request_id\": \"req_0093\",\n              \"error\": {\n                \"code\": \"ROOM_NOT_FOUND\",\n                \"message\": \"Room 1001 was not found.\",\n                \"details\": {\n                  \"room_id\": 1001\n                }\n              }\n            }\n          ```\n\n          ```json\n            {\n              \"type\": \"error\",\n              \"request_id\": \"req_0094\",\n              \"error\": {\n                \"code\": \"NOT_ROOM_MEMBER\",\n                \"message\": \"User 47 is not a member of room 1001.\",\n                \"details\": {\n                  \"room_id\": 1001,\n                  \"user_id\": 47\n                }\n              }\n            }\n          ```\n\n          ```json\n            {\n              \"type\": \"error\",\n              \"request_id\": \"req_0095\",\n              \"error\": {\n                \"code\": \"INVALID_ROOM_STATE\",\n                \"message\": \"This action is not allowed while room status is FINISHED.\",\n                \"details\": {\n                  \"status\": \"FINISHED\"\n                }\n              }\n            }\n          ```\n\n          ```json\n            {\n              \"type\": \"error\",\n              \"request_id\": \"req_0096\",\n              \"error\": {\n                \"code\": \"TEAM_REQUIRED\",\n                \"message\": \"Select a team before becoming ready.\",\n                \"details\": {\n                  \"user_id\": 43\n                }\n              }\n            }\n          ```\n\n          ```json\n            {\n              \"type\": \"error\",\n              \"request_id\": \"req_0097\",\n              \"error\": {\n                \"code\": \"ROLE_REQUIRED\",\n                \"message\": \"Select a role before becoming ready.\",\n                \"details\": {\n                  \"user_id\": 43\n                }\n              }\n            }\n          ```\n\n          ```json\n            {\n              \"type\": \"error\",\n              \"request_id\": \"req_0098\",\n              \"error\": {\n                \"code\": \"ROLE_FORBIDDEN\",\n                \"message\": \"Only an active-team Operative may guess a card.\",\n                \"details\": {\n                  \"required_role\": \"OPERATIVE\"\n                }\n              }\n            }\n          ```\n\n          ```json\n            {\n              \"type\": \"error\",\n              \"request_id\": \"req_0099\",\n              \"error\": {\n                \"code\": \"INVALID_CLUE\",\n                \"message\": \"payload.word must contain exactly one non-whitespace word.\",\n                \"details\": {\n                  \"field\": \"payload.word\"\n                }\n              }\n            }\n          ```\n\n          ```json\n            {\n              \"type\": \"error\",\n              \"request_id\": \"req_0100\",\n              \"error\": {\n                \"code\": \"INVALID_CLUE_NUMBER\",\n                \"message\": \"payload.number must be an integer from 1 through 9.\",\n                \"details\": {\n                  \"field\": \"payload.number\",\n                  \"min\": 1,\n                  \"max\": 9\n                }\n              }\n            }\n          ```\n\n          ```json\n            {\n              \"type\": \"error\",\n              \"request_id\": \"req_0101\",\n              \"error\": {\n                \"code\": \"INVALID_CARD\",\n                \"message\": \"Card 30 does not exist in game 5001.\",\n                \"details\": {\n                  \"card_id\": 30,\n                  \"game_id\": 5001\n                }\n              }\n            }\n          ```\n\n          ```json\n            {\n              \"type\": \"error\",\n              \"request_id\": \"req_0102\",\n              \"error\": {\n                \"code\": \"CARD_ALREADY_REVEALED\",\n                \"message\": \"Card 1 has already been revealed.\",\n                \"details\": {\n                  \"card_id\": 1\n                }\n              }\n            }\n          ```\n\n          ```json\n            {\n              \"type\": \"error\",\n              \"request_id\": \"req_0103\",\n              \"error\": {\n                \"code\": \"NO_GUESSES_REMAINING\",\n                \"message\": \"RED has no guesses remaining in the current turn.\",\n                \"details\": {\n                  \"team\": \"RED\",\n                  \"guesses_remaining\": 0\n                }\n              }\n            }\n          ```\n\n          ## Validation invariant\n\n          Parsing and authorization complete before mutation. A rejected command cannot reveal a card, change score or turn, toggle ready, create/cancel countdown, or consume an idempotency result as success.\n  - info:\n      name: 07 - Full State Scenarios\n      type: folder\n      seq: 7\n    docs:\n      content: |-\n        # Full state scenarios\n\n        Normative, end-to-end snapshots for room `1001` and game `5001`: newly created, four joined, incomplete roles, valid unready, all ready, countdown, cancellation, full `IN_GAME` projections, clue, reveals, and terminal results. The same fixed 25-card secret map is used throughout, purely so examples stay reproducible and cross-reference each other. **This fixed map (`RED`=odd `card_id`, `BLUE`=even, etc.) is a documentation convenience only \u2014 it is not a rule the backend replicates.** `card_id` carries zero affiliation information in the real system; board generation randomizes word placement and affiliation independently of `card_id` (`workspace.yml`, Card ID invariant).\n      type: text/markdown\n    items:\n      - info:\n          name: Full IN_GAME role projections\n          type: websocket\n          seq: 1\n          tags:\n            - scenario\n            - game\n            - privacy\n        websocket:\n          url: '{{wsUrl}}/ws/rooms/{{roomId}}'\n        docs: |-\n          # Full IN_GAME role projections\n\n          ## Purpose and preconditions\n\n          These two `game.started` frames are normative projections of the same logical room `1001`, game `5001`, board, timestamp, players, turn, and score immediately after a valid countdown. This request is a passive observer and sends no application message.\n\n          The request connects with required positive-integer path `room_id=1001`, authenticated via the `ft_session` cookie alone \u2014 see `00 - Connection & Protocol/connect.yml`. The connecting session's identity determines whether the returned board is the Spymaster or Operative projection.\n\n          ## Projection rule\n\n          | Viewer | Unrevealed `board[].color` | Revealed `board[].color` |\n          | --- | --- | --- |\n          | `SPYMASTER` | actual `RED`, `BLUE`, `NEUTRAL`, or `ASSASSIN` | actual color |\n          | `OPERATIVE` | `null` | actual color |\n\n          Words, IDs, order, reveal flags, score, players, and turn are identical. The server generates one payload per recipient and never sends the Spymaster version to an Operative.\n\n          ## Response field schema\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `type` | string enum | yes | no | `game.started` | Lifecycle event |\n          | `event_id` | string | yes | no | room-unique | Ordered event ID |\n          | `room_id` | integer | yes | no | positive | Envelope room |\n          | `sent_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Event time |\n          | `payload.room.room_id` | integer | yes | no | same as envelope | Domain room ID |\n          | `payload.room.status` | enum | yes | no | `IN_GAME` | Post-countdown state |\n          | `payload.room.host_user_id` | integer | yes | no | member ID | Host |\n          | `payload.room.player_count` | integer | yes | no | `>= 4` | Participants |\n          | `payload.room.startable` | boolean | yes | no | `false` | Start predicate is only actionable in `WAITING` |\n          | `payload.room.players[]` | array<object> | yes | no | configured members | Join-ordered membership |\n          | `payload.room.players[].user_id` | integer | yes | no | positive | Member |\n          | `payload.room.players[].username` | string | yes | no | username rule | Display name |\n          | `payload.room.players[].team` | enum | yes | no | `RED`, `BLUE` | Match team |\n          | `payload.room.players[].role` | enum | yes | no | `SPYMASTER`, `OPERATIVE` | Match role |\n          | `payload.room.players[].ready` | boolean | yes | no | `true` | Frozen start confirmation |\n          | `payload.room.players[].is_host` | boolean | yes | no | `true`, `false` | Exactly one true |\n          | `payload.room.players[].joined_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Join order |\n          | `payload.room.game.game_id` | integer | yes | no | positive | Match |\n          | `payload.room.game.starting_team` | enum | yes | no | `RED`, `BLUE` | Team with 9 cards and first clue |\n          | `payload.room.game.current_turn.team` | enum | yes | no | `RED`, `BLUE` | Active team |\n          | `payload.room.game.current_turn.phase` | enum | yes | no | `WAITING_FOR_CLUE` | Initial phase |\n          | `payload.room.game.current_turn.clue` | null | yes | yes | `null` | No clue yet |\n          | `payload.room.game.current_turn.guesses_remaining` | null | yes | yes | `null` | No guesses before clue |\n          | `payload.room.game.score.red` | integer | yes | no | `0..9` | Revealed RED cards |\n          | `payload.room.game.score.blue` | integer | yes | no | `0..8` | Revealed BLUE cards |\n          | `payload.room.game.board[]` | array<object> | yes | no | exactly 25 | Ordered board |\n          | `payload.room.game.board[].card_id` | integer | yes | no | unique `1..25` | Card ID |\n          | `payload.room.game.board[].word` | string | yes | no | canonical word | Public word |\n          | `payload.room.game.board[].revealed` | boolean | yes | no | `false` initially | Reveal state |\n          | `payload.room.game.board[].color` | enum or null | yes | yes | `RED`, `BLUE`, `NEUTRAL`, `ASSASSIN`, `null` | Null only for an Operative's unrevealed card |\n          | `payload.room.game.winner` | enum or null | yes | yes | `RED`, `BLUE`, `null` | Null at start |\n          | `payload.room.game.end_reason` | enum or null | yes | yes | `ALL_TEAM_CARDS_REVEALED`, `ASSASSIN_REVEALED`, `null` | Null at start |\n          | `payload.room.game.started_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Game start |\n          | `payload.room.game.finished_at` | `string<date-time>` or null | yes | yes | UTC or `null` | Null at start |\n          | `payload.room.created_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Room creation |\n\n          ## Complete Spymaster-visible `game.started`\n\n          ```json\n          {\n            \"type\": \"game.started\",\n            \"event_id\": \"evt_0137\",\n            \"room_id\": 1001,\n            \"sent_at\": \"2026-09-10T08:43:15Z\",\n            \"payload\": {\n              \"room\": {\n                \"room_id\": 1001,\n                \"status\": \"IN_GAME\",\n                \"host_user_id\": 42,\n                \"player_count\": 4,\n                \"startable\": false,\n                \"players\": [\n                  {\"user_id\":42,\"username\":\"player_one\",\"team\":\"RED\",\"role\":\"SPYMASTER\",\"ready\":true,\"is_host\":true,\"joined_at\":\"2026-09-10T08:41:00Z\"},\n                  {\"user_id\":43,\"username\":\"red_agent\",\"team\":\"RED\",\"role\":\"OPERATIVE\",\"ready\":true,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:20Z\"},\n                  {\"user_id\":44,\"username\":\"blue_master\",\"team\":\"BLUE\",\"role\":\"SPYMASTER\",\"ready\":true,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:30Z\"},\n                  {\"user_id\":45,\"username\":\"blue_agent\",\"team\":\"BLUE\",\"role\":\"OPERATIVE\",\"ready\":true,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:40Z\"}\n                ],\n                \"game\": {\n                  \"game_id\": 5001,\n                  \"starting_team\": \"RED\",\n                  \"current_turn\": {\"team\":\"RED\",\"phase\":\"WAITING_FOR_CLUE\",\"clue\":null,\"guesses_remaining\":null},\n                  \"score\": {\"red\":0,\"blue\":0},\n                  \"board\": [\n                    {\"card_id\":1,\"word\":\"MOON\",\"revealed\":false,\"color\":\"RED\"},\n                    {\"card_id\":2,\"word\":\"APPLE\",\"revealed\":false,\"color\":\"BLUE\"},\n                    {\"card_id\":3,\"word\":\"TRAIN\",\"revealed\":false,\"color\":\"RED\"},\n                    {\"card_id\":4,\"word\":\"BRIDGE\",\"revealed\":false,\"color\":\"BLUE\"},\n                    {\"card_id\":5,\"word\":\"OCEAN\",\"revealed\":false,\"color\":\"RED\"},\n                    {\"card_id\":6,\"word\":\"KING\",\"revealed\":false,\"color\":\"BLUE\"},\n                    {\"card_id\":7,\"word\":\"LASER\",\"revealed\":false,\"color\":\"RED\"},\n                    {\"card_id\":8,\"word\":\"FOREST\",\"revealed\":false,\"color\":\"BLUE\"},\n                    {\"card_id\":9,\"word\":\"DOCTOR\",\"revealed\":false,\"color\":\"RED\"},\n                    {\"card_id\":10,\"word\":\"GLASS\",\"revealed\":false,\"color\":\"BLUE\"},\n                    {\"card_id\":11,\"word\":\"DRAGON\",\"revealed\":false,\"color\":\"RED\"},\n                    {\"card_id\":12,\"word\":\"TABLE\",\"revealed\":false,\"color\":\"BLUE\"},\n                    {\"card_id\":13,\"word\":\"SATURN\",\"revealed\":false,\"color\":\"RED\"},\n                    {\"card_id\":14,\"word\":\"SNOW\",\"revealed\":false,\"color\":\"BLUE\"},\n                    {\"card_id\":15,\"word\":\"PIANO\",\"revealed\":false,\"color\":\"RED\"},\n                    {\"card_id\":16,\"word\":\"HEART\",\"revealed\":false,\"color\":\"BLUE\"},\n                    {\"card_id\":17,\"word\":\"ROME\",\"revealed\":false,\"color\":\"RED\"},\n                    {\"card_id\":18,\"word\":\"WHALE\",\"revealed\":false,\"color\":\"NEUTRAL\"},\n                    {\"card_id\":19,\"word\":\"ROBOT\",\"revealed\":false,\"color\":\"NEUTRAL\"},\n                    {\"card_id\":20,\"word\":\"CROWN\",\"revealed\":false,\"color\":\"NEUTRAL\"},\n                    {\"card_id\":21,\"word\":\"DESERT\",\"revealed\":false,\"color\":\"NEUTRAL\"},\n                    {\"card_id\":22,\"word\":\"SCREEN\",\"revealed\":false,\"color\":\"NEUTRAL\"},\n                    {\"card_id\":23,\"word\":\"MOUSE\",\"revealed\":false,\"color\":\"NEUTRAL\"},\n                    {\"card_id\":24,\"word\":\"KNIFE\",\"revealed\":false,\"color\":\"NEUTRAL\"},\n                    {\"card_id\":25,\"word\":\"CLOUD\",\"revealed\":false,\"color\":\"ASSASSIN\"}\n                  ],\n                  \"winner\": null,\n                  \"end_reason\": null,\n                  \"started_at\": \"2026-09-10T08:43:15Z\",\n                  \"finished_at\": null\n                },\n                \"created_at\": \"2026-09-10T08:41:00Z\"\n              }\n            }\n          }\n          ```\n\n          ## Complete Operative-visible `game.started`\n\n          ```json\n          {\n            \"type\": \"game.started\",\n            \"event_id\": \"evt_0137\",\n            \"room_id\": 1001,\n            \"sent_at\": \"2026-09-10T08:43:15Z\",\n            \"payload\": {\n              \"room\": {\n                \"room_id\": 1001,\n                \"status\": \"IN_GAME\",\n                \"host_user_id\": 42,\n                \"player_count\": 4,\n                \"startable\": false,\n                \"players\": [\n                  {\"user_id\":42,\"username\":\"player_one\",\"team\":\"RED\",\"role\":\"SPYMASTER\",\"ready\":true,\"is_host\":true,\"joined_at\":\"2026-09-10T08:41:00Z\"},\n                  {\"user_id\":43,\"username\":\"red_agent\",\"team\":\"RED\",\"role\":\"OPERATIVE\",\"ready\":true,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:20Z\"},\n                  {\"user_id\":44,\"username\":\"blue_master\",\"team\":\"BLUE\",\"role\":\"SPYMASTER\",\"ready\":true,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:30Z\"},\n                  {\"user_id\":45,\"username\":\"blue_agent\",\"team\":\"BLUE\",\"role\":\"OPERATIVE\",\"ready\":true,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:40Z\"}\n                ],\n                \"game\": {\n                  \"game_id\": 5001,\n                  \"starting_team\": \"RED\",\n                  \"current_turn\": {\"team\":\"RED\",\"phase\":\"WAITING_FOR_CLUE\",\"clue\":null,\"guesses_remaining\":null},\n                  \"score\": {\"red\":0,\"blue\":0},\n                  \"board\": [\n                    {\"card_id\":1,\"word\":\"MOON\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":2,\"word\":\"APPLE\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":3,\"word\":\"TRAIN\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":4,\"word\":\"BRIDGE\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":5,\"word\":\"OCEAN\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":6,\"word\":\"KING\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":7,\"word\":\"LASER\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":8,\"word\":\"FOREST\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":9,\"word\":\"DOCTOR\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":10,\"word\":\"GLASS\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":11,\"word\":\"DRAGON\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":12,\"word\":\"TABLE\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":13,\"word\":\"SATURN\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":14,\"word\":\"SNOW\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":15,\"word\":\"PIANO\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":16,\"word\":\"HEART\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":17,\"word\":\"ROME\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":18,\"word\":\"WHALE\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":19,\"word\":\"ROBOT\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":20,\"word\":\"CROWN\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":21,\"word\":\"DESERT\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":22,\"word\":\"SCREEN\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":23,\"word\":\"MOUSE\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":24,\"word\":\"KNIFE\",\"revealed\":false,\"color\":null},\n                    {\"card_id\":25,\"word\":\"CLOUD\",\"revealed\":false,\"color\":null}\n                  ],\n                  \"winner\": null,\n                  \"end_reason\": null,\n                  \"started_at\": \"2026-09-10T08:43:15Z\",\n                  \"finished_at\": null\n                },\n                \"created_at\": \"2026-09-10T08:41:00Z\"\n              }\n            }\n          }\n          ```\n\n          ## Field requirements\n\n          Every nested field follows the room/game schema documented by REST `Get room snapshot`. `ready` is retained as the frozen start confirmation after game start; it has no post-start mutation semantics. `startable=false` outside `WAITING` even though the starting composition remains valid. `current_turn.clue` and `guesses_remaining` are null in `WAITING_FOR_CLUE`.\n\n          ## State changes, events, and errors\n\n          `game.started` follows the zero tick, sets room `IN_GAME`, creates the board once, and begins with the starting team waiting for clue. It is not a client action and has no action error. If an invariant breaks before board creation, the server cancels countdown instead and neither projection is emitted.\n      - info:\n          name: Canonical scenario index\n          type: websocket\n          seq: 2\n          tags:\n            - scenario\n            - reference\n        websocket:\n          url: '{{wsUrl}}/ws/rooms/{{roomId}}'\n        docs: |-\n          # Canonical scenario index\n\n          ## End-to-end reconstruction\n\n          This passive reference maps each required state to its normative example. It sends no message.\n\n          It connects with required positive-integer path `room_id=1001`, authenticated via the `ft_session` cookie alone \u2014 see `00 - Connection & Protocol/connect.yml`.\n\n          | Scenario | Fixture transition | Contract location |\n          | --- | --- | --- |\n          | Newly created room | user `42` creates `1001` | REST `Create room` |\n          | Four joined, unconfigured | users `42..45`, all selections null | REST `Get room snapshot` |\n          | Teams selected, roles incomplete | users `43` and `45` lack roles | REST `Get room snapshot` |\n          | Duplicate Spymaster | user `43` requests RED Spymaster occupied by `42` | WebSocket `Select role` |\n          | Roles valid, some unready | user `45` remains false | REST `Get room snapshot` |\n          | All four ready | `req_0013` changes user `45` | WebSocket `Set ready` |\n          | Countdown | seconds `3`, `2`, `1`, `0` | WebSocket `Countdown event reference` |\n          | Countdown cancelled | user `43` changes true to false | WebSocket `Set ready` |\n          | Game started | room `IN_GAME`, game `5001`, all 25 cards | `Full IN_GAME role projections` |\n          | Clue submitted | RED Spymaster, `ocean / 2`, 3 guesses | WebSocket `Submit clue` |\n          | Correct own guess | RED reveals card `5`, score `3-2`, 2 guesses | WebSocket `Guess card` |\n          | Neutral guess | RED reveals card `18`, BLUE turn | WebSocket `Guess card` |\n          | Opponent guess | RED reveals BLUE card `6`, blue score rises | WebSocket `Guess card` |\n          | Assassin | RED reveals card `25`, BLUE wins | WebSocket `Guess card` |\n          | Normal victory | card `17` completes RED | WebSocket `Guess card` |\n          | Opponent completion | RED reveals card `16`, completes BLUE | WebSocket `Guess card` |\n          | Finished game | room `FINISHED`, phase `GAME_OVER`, result event | below |\n\n          ## Finished game snapshot\n\n          This Spymaster-visible state follows the normal RED victory branch. The nine RED cards and five previously found BLUE cards are revealed. Spymasters continue to see the full map; an Operative projection MUST replace the colors of every remaining unrevealed card with `null`, even after `FINISHED`.\n\n          ```json\n          {\n            \"type\":\"game.state\",\n            \"event_id\":\"evt_0183\",\n            \"room_id\":1001,\n            \"sent_at\":\"2026-09-10T08:50:01Z\",\n            \"payload\":{\"room\":{\n              \"room_id\":1001,\n              \"status\":\"FINISHED\",\n              \"host_user_id\":42,\n              \"player_count\":4,\n              \"startable\":false,\n              \"players\":[\n                {\"user_id\":42,\"username\":\"player_one\",\"team\":\"RED\",\"role\":\"SPYMASTER\",\"ready\":true,\"is_host\":true,\"joined_at\":\"2026-09-10T08:41:00Z\"},\n                {\"user_id\":43,\"username\":\"red_agent\",\"team\":\"RED\",\"role\":\"OPERATIVE\",\"ready\":true,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:20Z\"},\n                {\"user_id\":44,\"username\":\"blue_master\",\"team\":\"BLUE\",\"role\":\"SPYMASTER\",\"ready\":true,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:30Z\"},\n                {\"user_id\":45,\"username\":\"blue_agent\",\"team\":\"BLUE\",\"role\":\"OPERATIVE\",\"ready\":true,\"is_host\":false,\"joined_at\":\"2026-09-10T08:41:40Z\"}\n              ],\n              \"game\":{\n                \"game_id\":5001,\n                \"starting_team\":\"RED\",\n                \"current_turn\":{\"team\":\"RED\",\"phase\":\"GAME_OVER\",\"clue\":{\"word\":\"empire\",\"number\":1},\"guesses_remaining\":null},\n                \"score\":{\"red\":9,\"blue\":5},\n                \"board\":[\n                  {\"card_id\":1,\"word\":\"MOON\",\"revealed\":true,\"color\":\"RED\"},\n                  {\"card_id\":2,\"word\":\"APPLE\",\"revealed\":true,\"color\":\"BLUE\"},\n                  {\"card_id\":3,\"word\":\"TRAIN\",\"revealed\":true,\"color\":\"RED\"},\n                  {\"card_id\":4,\"word\":\"BRIDGE\",\"revealed\":true,\"color\":\"BLUE\"},\n                  {\"card_id\":5,\"word\":\"OCEAN\",\"revealed\":true,\"color\":\"RED\"},\n                  {\"card_id\":6,\"word\":\"KING\",\"revealed\":true,\"color\":\"BLUE\"},\n                  {\"card_id\":7,\"word\":\"LASER\",\"revealed\":true,\"color\":\"RED\"},\n                  {\"card_id\":8,\"word\":\"FOREST\",\"revealed\":true,\"color\":\"BLUE\"},\n                  {\"card_id\":9,\"word\":\"DOCTOR\",\"revealed\":true,\"color\":\"RED\"},\n                  {\"card_id\":10,\"word\":\"GLASS\",\"revealed\":true,\"color\":\"BLUE\"},\n                  {\"card_id\":11,\"word\":\"DRAGON\",\"revealed\":true,\"color\":\"RED\"},\n                  {\"card_id\":12,\"word\":\"TABLE\",\"revealed\":false,\"color\":\"BLUE\"},\n                  {\"card_id\":13,\"word\":\"SATURN\",\"revealed\":true,\"color\":\"RED\"},\n                  {\"card_id\":14,\"word\":\"SNOW\",\"revealed\":false,\"color\":\"BLUE\"},\n                  {\"card_id\":15,\"word\":\"PIANO\",\"revealed\":true,\"color\":\"RED\"},\n                  {\"card_id\":16,\"word\":\"HEART\",\"revealed\":false,\"color\":\"BLUE\"},\n                  {\"card_id\":17,\"word\":\"ROME\",\"revealed\":true,\"color\":\"RED\"},\n                  {\"card_id\":18,\"word\":\"WHALE\",\"revealed\":false,\"color\":\"NEUTRAL\"},\n                  {\"card_id\":19,\"word\":\"ROBOT\",\"revealed\":false,\"color\":\"NEUTRAL\"},\n                  {\"card_id\":20,\"word\":\"CROWN\",\"revealed\":false,\"color\":\"NEUTRAL\"},\n                  {\"card_id\":21,\"word\":\"DESERT\",\"revealed\":false,\"color\":\"NEUTRAL\"},\n                  {\"card_id\":22,\"word\":\"SCREEN\",\"revealed\":false,\"color\":\"NEUTRAL\"},\n                  {\"card_id\":23,\"word\":\"MOUSE\",\"revealed\":false,\"color\":\"NEUTRAL\"},\n                  {\"card_id\":24,\"word\":\"KNIFE\",\"revealed\":false,\"color\":\"NEUTRAL\"},\n                  {\"card_id\":25,\"word\":\"CLOUD\",\"revealed\":false,\"color\":\"ASSASSIN\"}\n                ],\n                \"winner\":\"RED\",\n                \"end_reason\":\"ALL_TEAM_CARDS_REVEALED\",\n                \"started_at\":\"2026-09-10T08:43:15Z\",\n                \"finished_at\":\"2026-09-10T08:50:00Z\"\n              },\n              \"created_at\":\"2026-09-10T08:41:00Z\"\n            }}\n          }\n          ```\n\n          The finished recovery snapshot is paired with the terminal `game.ended` event. Persistent wins/losses update once: users `42,43` gain one win and users `44,45` gain one loss. Team and role remain room-scoped until room lifecycle cleanup. The terminal event reveals card `17`; it never carries unrelated hidden card colors.\n\n          ## Scope boundary\n\n          There is no rematch, spectator, bot, matchmaking, room-password, capacity, kick/ban, custom-board, custom-timer, or chat event protocol in this revision.\n  - info:\n      name: 08 - Chat\n      type: folder\n      seq: 8\n    docs:\n      content: |-\n        # Chat (basic)\n\n        Minimum contract for the mandatory User Interaction module's basic chat (subject: chat/profile/friends). Basic chat only \u2014 Advanced Chat is a separate bonus module, not implemented here, and MUST remain distinguishable from this contract if/when added.\n\n        Permission is not room-only: a friend can be messaged from anywhere, and any room co-member can be messaged without a friend requirement while the room is `WAITING`, `COUNTDOWN`, or `IN_GAME` (any state where the chat widget is mounted, not `IN_GAME` only). Chat is therefore a per-user connection (`/ws/chat`), not a room-scoped one, and the server checks permission (friend OR shared active room) per message. Permission checking and delivery are handled by the Game Session service (`workspace.yml`, Backend Architecture) \u2014 chat is small enough not to warrant its own microservice.\n\n        Authenticated the same way as the room socket (`ft_session` cookie only, Origin-validated) \u2014 see `00 - Connection & Protocol/connect.yml`. A user may hold multiple open `/ws/chat` sockets (multi-tab); an inbound message is delivered to all of them, and delivery status (`DELIVERED`/`RECIPIENT_OFFLINE`) reflects whether at least one was open at send time.\n      type: text/markdown\n    items:\n      - info:\n          name: Connect to chat stream\n          type: websocket\n          seq: 1\n          tags:\n            - connection\n            - chat\n        websocket:\n          url: '{{wsUrl}}/ws/chat'\n        docs: |-\n          # Connect to chat stream\n\n          ## Authentication (secure session cookie)\n\n          Same mechanism as the room socket: the client attaches the HttpOnly `Secure` `ft_session` cookie automatically on the upgrade request; no client-side header code is needed, no header exists. `Origin` is validated the same way as the room socket. See `00 - Connection & Protocol/connect.yml` for the full explanation.\n\n          ## Purpose\n\n          One per-user realtime channel for basic chat, separate from the per-room game socket. Delivers direct messages to/from friends and current room co-members while the shared room is `WAITING`, `COUNTDOWN`, or `IN_GAME`. Opening multiple `/ws/chat` sockets for the same user (multi-tab) is supported \u2014 see `08 - Chat/folder.yml`.\n\n          ## Preconditions and handshake parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `ft_session` cookie | handshake | yes | string | HttpOnly, Secure, active session | no | Sole handshake credential | set by Register/Login |\n\n          ## Success behavior\n\n          `101 Switching Protocols`, then no initial event \u2014 the client sends `chat.message.send` and receives `chat.message.new` for inbound messages.\n\n          ## Failure behavior\n\n          | HTTP status | Code | Condition | Socket opens |\n          | --- | --- | --- | --- |\n          | `401` | `UNAUTHORIZED` | missing, invalid, revoked, or expired token | no |\n      - info:\n          name: Send chat message\n          type: websocket\n          seq: 2\n          tags:\n            - action\n            - chat\n        websocket:\n          url: '{{wsUrl}}/ws/chat'\n          message:\n            - title: Success - Message to friend\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"chat.message.send\",\n                    \"request_id\": \"req_c001\",\n                    \"payload\": {\n                      \"to_user_id\": 43,\n                      \"text\": \"gg, ready?\"\n                    }\n                  }\n            - title: Error - Not permitted\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"chat.message.send\",\n                    \"request_id\": \"req_c002\",\n                    \"payload\": {\n                      \"to_user_id\": 99,\n                      \"text\": \"hi\"\n                    }\n                  }\n        docs: |-\n          # Send chat message\n\n          ## Purpose and preconditions\n\n          Sends one basic-chat message to another user. Server checks permission per `workspace.yml` (Friends, Presence, and Chat Scope): allowed if the sender and `to_user_id` are friends, OR are current members of the same room while that room is `WAITING`, `COUNTDOWN`, or `IN_GAME` (any state where the chat widget is mounted \u2014 not `IN_GAME` only). Otherwise rejected. No message history/persistence is defined by this contract \u2014 basic chat is live-delivery only, and the ack reports honestly whether the recipient actually received it.\n\n          ## Message and payload parameters\n\n          | Parameter | Location | Required | Type | Allowed values/range | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `ft_session` cookie | handshake | yes | string | HttpOnly, Secure, active session | no | Sole handshake credential; automatic on same-origin upgrade | set by Register/Login |\n          | `type` | envelope | yes | string enum | `chat.message.send` | no | Operation | `chat.message.send` |\n          | `request_id` | envelope | yes | string | `1..64` visible ASCII, unique | no | Idempotency key | `req_c001` |\n          | `payload.to_user_id` | payload | yes | integer | positive, existing user | no | Recipient | `43` |\n          | `payload.text` | payload | yes | string | trimmed, `1..500` chars | no | Message body | `gg, ready?` |\n\n          ## Success behavior\n\n          Ack to sender reports actual delivery, not a fire-and-forget assumption. `payload.delivery_status` is `\"DELIVERED\"` when the recipient has at least one open `/ws/chat` socket (delivered to all of them \u2014 multi-tab), or `\"RECIPIENT_OFFLINE\"` when they have none. Either way `ok: true` \u2014 the *send* succeeded; delivery status is separate, informational data, not a command failure.\n\n          ```json\n            {\n              \"type\": \"ack\",\n              \"request_id\": \"req_c001\",\n              \"ok\": true,\n              \"payload\": {\n                \"message_id\": \"msg_001\",\n                \"to_user_id\": 43,\n                \"sent_at\": \"2026-09-17T10:00:00Z\",\n                \"delivery_status\": \"DELIVERED\"\n              }\n            }\n          ```\n\n          Recipient (each open socket) receives:\n\n          ```json\n            {\n              \"type\": \"chat.message.new\",\n              \"event_id\": \"evt_c001\",\n              \"sent_at\": \"2026-09-17T10:00:00Z\",\n              \"payload\": {\n                \"message_id\": \"msg_001\",\n                \"from_user_id\": 42,\n                \"text\": \"gg, ready?\"\n              }\n            }\n          ```\n\n          If `delivery_status` is `RECIPIENT_OFFLINE`, no `chat.message.new` is emitted (there is nowhere to deliver it), and the message is not stored or delivered later \u2014 this remains live-only, just honestly reported.\n\n          ## Errors\n\n          - `NOT_PERMITTED`: neither friends nor sharing an active room in `WAITING`, `COUNTDOWN`, or `IN_GAME`.\n          - `USER_NOT_FOUND`: `to_user_id` does not exist.\n          - `INVALID_PAYLOAD`: missing/empty/over-length text, or non-integer `to_user_id`.\n\n          ```json\n            {\n              \"type\": \"error\",\n              \"request_id\": \"req_c002\",\n              \"error\": {\n                \"code\": \"NOT_PERMITTED\",\n                \"message\": \"You can only message friends or current members of a shared active room.\",\n                \"details\": {\n                  \"to_user_id\": 99\n                }\n              }\n            }\n          ```\n  - info:\n      name: 00 - Connection & Protocol\n      type: folder\n    docs:\n      content: |-\n        # Connection and protocol\n\n        Authenticate the handshake with the HttpOnly `ft_session` cookie only, attached automatically on upgrade, with `Origin` validated against the deployment's single public origin before the cookie is even checked. The URL contains only the integer `roomId`. The user must already be a REST room member. The first frame is a role-safe `room.state`. Reconnect replaces local state from a fresh snapshot; a transport disconnect starts a reconnect grace period rather than immediately changing membership (`workspace.yml`, Reconnect Grace Period and Abandonment). A user may hold several simultaneous sockets to the same room (multi-tab) without creating a second seat.\n      type: text/markdown\n    items:\n      - info:\n          name: Connect to room stream\n          type: websocket\n          seq: 1\n          tags:\n            - connection\n            - smoke\n        websocket:\n          url: '{{wsUrl}}/ws/rooms/{{roomId}}'\n        docs: |-\n          # Connect to room stream\n\n          ## Authentication (secure session cookie)\n\n          Authentication is cookie-only. The handshake authenticates via the HttpOnly, `Secure`, `SameSite=Lax` `ft_session` cookie set by Register/Login/Refresh \u2014 the client attaches it automatically on the upgrade request, same-origin, no client code needed. No authentication header is sent; the server validates the cookie alone.\n\n          **Origin policy:** the server validates the upgrade request's `Origin` header against the deployment's own origin (the single public origin from `workspace.yml`'s Deployment / Same-Origin Model) and rejects the handshake with `403` before checking the cookie if it doesn't match. This is the WebSocket-specific cross-site protection that complements `SameSite=Lax` (which alone does not fully cover WebSocket upgrades in every browser).\n\n          **Multi-tab:** a user may open several authenticated sockets to the same room (e.g. two tabs) without creating a second seat \u2014 see `workspace.yml`, Multi-Tab / Multi-Socket. All of that user's sockets receive the same events; a disconnect only starts the reconnect grace period once the *last* of that user's sockets for this room closes.\n\n          ## Purpose\n\n          Opens the realtime channel for one REST-joined room. No subscription message is needed because `room_id` is in the path.\n\n          ## Preconditions and handshake parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `room_id` | path | yes | integer | positive | no | Existing room already joined by user | `1001` |\n          | `ft_session` cookie | handshake | yes | string | HttpOnly, Secure, active session | no | Sole handshake credential; automatic on same-origin upgrade | set by Register/Login |\n\n          ## Success behavior\n\n          The server upgrades with HTTP `101 Switching Protocols`, then sends a role-safe `room.state`. If the room is `IN_GAME` or `FINISHED`, the snapshot includes the recipient-projected game board.\n\n          Initial event fields:\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `type` | string enum | yes | no | `room.state` | Snapshot event name |\n          | `event_id` | string | yes | no | unique in room stream | Ordering/correlation ID |\n          | `room_id` | integer | yes | no | positive | Subscribed room |\n          | `sent_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Event creation time |\n          | `payload.room` | object | yes | no | canonical room schema | Recipient-safe snapshot |\n\n          ## Failure behavior\n\n          | HTTP status | Code | Condition | Socket opens |\n          | --- | --- | --- | --- |\n          | `403` | (handshake rejected, no code) | `Origin` does not match the deployment's own origin | no |\n          | `401` | `UNAUTHORIZED` | missing, invalid, revoked, or expired token | no |\n          | `404` | `ROOM_NOT_FOUND` | path room does not exist | no |\n          | `403` | `NOT_ROOM_MEMBER` | authenticated user is not a member | no |\n          | `409` | `INVALID_ROOM_STATE` | room is `CLOSED` | no |\n\n          A transport disconnect never changes membership immediately \u2014 it starts the reconnect grace period (`workspace.yml`, Reconnect Grace Period and Abandonment): 30s by default in `WAITING`/`COUNTDOWN`, 60s `IN_GAME`. Reconnecting within that window (same session, new socket) yields a current snapshot with no state loss; missed incremental events need not be replayed, since the snapshot is authoritative. If the grace period expires, the member is removed (`WAITING`/`COUNTDOWN`) or the match ends by `PLAYER_FORFEIT` (`IN_GAME`) \u2014 see `04 - Game` and `workspace.yml`. If the access token expired, the client refreshes over REST (`POST /api/auth/refresh`) first, then reconnects \u2014 the refreshed cookie authenticates the new handshake automatically; this does not consume grace-period time any faster than a normal drop.\n\n          ## Concrete frames\n\n          First frame for the newly created fixture room:\n\n          ```json\n            {\n              \"type\": \"room.state\",\n              \"event_id\": \"evt_0100\",\n              \"room_id\": 1001,\n              \"sent_at\": \"2026-09-10T08:41:01Z\",\n              \"payload\": {\n                \"room\": {\n                  \"room_id\": 1001,\n                  \"status\": \"WAITING\",\n                  \"host_user_id\": 42,\n                  \"player_count\": 1,\n                  \"startable\": false,\n                  \"players\": [\n                    {\n                      \"user_id\": 42,\n                      \"username\": \"player_one\",\n                      \"team\": null,\n                      \"role\": null,\n                      \"ready\": false,\n                      \"is_host\": true,\n                      \"joined_at\": \"2026-09-10T08:41:00Z\"\n                    }\n                  ],\n                  \"game\": null,\n                  \"created_at\": \"2026-09-10T08:41:00Z\"\n                }\n              }\n            }\n          ```\n\n          Failed authentication body before upgrade:\n\n          ```json\n            {\n              \"error\": {\n                \"code\": \"UNAUTHORIZED\",\n                \"message\": \"A valid active session is required.\",\n                \"details\": {}\n              }\n            }\n          ```\ndocs:\n  content: |-\n    # ft_transcendence WebSocket Protocol\n\n    ## Connection\n\n    Connect to `{{wsUrl}}/ws/rooms/{{roomId}}` (room socket) or `{{wsUrl}}/ws/chat` (per-user chat socket, see `08 - Chat`). The session must be active; for the room socket the user must already belong to the room through REST. Authentication is never placed in the URL.\n\n    ## Authentication\n\n    Authentication is cookie-only: the HttpOnly, `Secure`, `SameSite=Lax` `ft_session` cookie set by Register/Login/Refresh is attached automatically on the WebSocket upgrade request, same-origin, by browser and Bruno alike. The cookie is the only handshake credential; no authentication header is sent. The upgrade request's `Origin` is validated against the deployment's single public origin before the cookie is even checked. The backend then validates the cookie and accepts or rejects (`401`) the upgrade. This applies identically to both sockets. A user may hold several simultaneous sockets for the same room/chat (multi-tab); they share one logical membership, not one seat per socket. See `00 - Connection & Protocol/connect.yml` for the full parameter table.\n\n    A successful connection to the room socket first receives a recipient-safe `room.state` snapshot, which embeds `game` when `room.status` is `IN_GAME` or `FINISHED` \u2014 this is the one canonical reconnect/recovery snapshot for the room socket (see Reconnect below); the chat socket sends no initial event.\n\n    Invalid session rejects the handshake with HTTP `401`; missing room uses `404`; an authenticated non-member uses `403`. A transport disconnect never removes room membership immediately \u2014 it starts the reconnect grace period (`workspace.yml`, Reconnect Grace Period and Abandonment: 30s `WAITING`/`COUNTDOWN`, 60s `IN_GAME`). Reconnect with the same session within that window obtains a fresh role-safe snapshot with no state loss. If the grace period expires, membership is removed (`WAITING`/`COUNTDOWN`) or the match ends by `PLAYER_FORFEIT` (`IN_GAME`) \u2014 see `04 - Game`. If the access token has expired, the client refreshes over REST (`POST /api/auth/refresh`) before reconnecting \u2014 the reissued cookie authenticates the new handshake automatically.\n\n    ## Reconnect (canonical snapshot)\n\n    `room.state` is the one authoritative initial/reconnect snapshot for the room socket. It embeds `game` whenever `room.status` is `IN_GAME` or `FINISHED`, so a client never needs a second recovery message type for that case. `game.state` (see the event matrix) is the Game Session-internal payload shape reused inside that embed \u2014 not a separate recovery path a client requests independently; a client that has `room.state` never needs to additionally fetch `game.state`. On reconnect, do not attempt to replay missed incremental events \u2014 apply the fresh snapshot and discard prior local state.\n\n    ## Envelopes and ordering\n\n    Client messages are `{ \"type\", \"request_id\", \"payload\" }`. `request_id` is a client-generated unique string of `1..64` visible ASCII characters (a UUID is a good default generator, but any unique string in that length/charset is valid). The server caches the result of a request ID per session for the room lifetime; an identical retry returns the original ack/error and does not repeat mutation. Reuse with different content returns `INVALID_EVENT`. This dedup cache lives in Redis alongside other ephemeral room state (`workspace.yml`, State Ownership).\n\n    Successful commands receive `{ \"type\": \"ack\", \"request_id\", \"ok\": true, \"payload\": object }`. Events are `{ \"type\", \"event_id\", \"room_id\", \"sent_at\", \"payload\" }`. `event_id` is unique and monotonically increasing within one room stream. Timestamps are ISO 8601 UTC.\n\n    **State mutation source of truth:** an `ack` confirms that the command was received and validated, correlated by `request_id` \u2014 it is not the client's primary mutation source, because the paired server event (`room.player.updated`, `game.card.revealed`, etc.) carries the same authoritative values and a client that applied both would double-apply the change. Apply state from server events and snapshots (`room.state`/embedded `game`), and treat the `ack` payload as confirmation/UI feedback (e.g. \"your command was accepted\") rather than a second write. If a client ever detects a gap in `event_id` ordering, it does not attempt to replay history \u2014 it requests/derives a fresh `room.state` snapshot instead (the same recovery path as an ordinary reconnect).\n\n    ## Message and event matrix\n\n    | Type | Direction | Allowed room/phase | Permission | Purpose |\n    | --- | --- | --- | --- | --- |\n    | `room.team.select` | C to S | `WAITING`, `COUNTDOWN` | member | select team; countdown change cancels |\n    | `room.role.select` | C to S | `WAITING`, `COUNTDOWN` | member with team | select role; countdown change cancels |\n    | `room.ready.set` | C to S | `WAITING`, `COUNTDOWN` for false | configured member | toggle readiness |\n    | `game.clue.submit` | C to S | `IN_GAME / WAITING_FOR_CLUE` | active Spymaster | create clue and guesses |\n    | `game.card.guess` | C to S | `IN_GAME / GUESSING` | active Operative | reveal one card |\n    | `game.turn.pass` | C to S | `IN_GAME / GUESSING` | active Operative | end team turn |\n    | `room.state` | S to C | any non-closed state | recipient projection | full room snapshot |\n    | `room.player.joined` | S to C | `WAITING` | server | membership added |\n    | `room.player.left` | S to C | `WAITING`, `COUNTDOWN`, `FINISHED` | server | membership removed/host transfer |\n    | `room.player.updated` | S to C | `WAITING`, `COUNTDOWN` | server | team, role, ready change |\n    | `room.countdown.started` | S to C | `COUNTDOWN` | server | start at 3 seconds |\n    | `room.countdown.tick` | S to C | `COUNTDOWN` | server | remaining `2`, `1`, `0` |\n    | `room.countdown.cancelled` | S to C | `WAITING` | server | invariant broke |\n    | `game.started` | S to C | `IN_GAME` | recipient projection | complete role-safe game |\n    | `game.state` | S to C | `IN_GAME`, `FINISHED` | recipient projection | recovery snapshot |\n    | `game.clue.submitted` | S to C | `IN_GAME / GUESSING` | server | public clue |\n    | `game.card.revealed` | S to C | `IN_GAME`, `FINISHED` | recipient projection | reveal result |\n    | `game.score.updated` | S to C | `IN_GAME`, `FINISHED` | server | revealed team totals |\n    | `game.turn.changed` | S to C | `IN_GAME` | server | next team waits for clue |\n    | `game.ended` | S to C | `FINISHED / GAME_OVER` | server | terminal result, incl. `PLAYER_FORFEIT` |\n    | `ack` | S to C | command-dependent | requester | command accepted |\n    | `error` | S to C | any open connection | requester | command rejected |\n\n    ## Countdown and authority\n\n    The server rechecks the full start predicate after every join, leave, team, role, and ready change. When it first becomes true, the room enters `COUNTDOWN` and emits start plus concrete ticks. Any invalidation emits cancellation and returns to `WAITING`. Completion while still valid generates the 25-card board and enters `IN_GAME`. There is no host start command.\n\n    ## Privacy projection\n\n    Spymasters receive all 25 colors. Operatives receive `color: null` on unrevealed cards and the true color on revealed cards. The server MUST render events per recipient and MUST NOT broadcast one secret-bearing payload. The full paired examples in `07 - Full State Scenarios` differ only where authorization requires it.\n\n    ## Errors and connection policy\n\n    Action errors retain the connection and never mutate room/game state. `INVALID_EVENT`, `INVALID_PAYLOAD`, `NOT_ROOM_MEMBER`, `INVALID_ROOM_STATE`, `TEAM_REQUIRED`, `ROLE_REQUIRED`, `ROLE_CONFLICT`, `NOT_YOUR_TURN`, `ROLE_FORBIDDEN`, `INVALID_CLUE`, `INVALID_CLUE_NUMBER`, `INVALID_CARD`, `CARD_ALREADY_REVEALED`, `NO_GUESSES_REMAINING`, and `GAME_ALREADY_FINISHED` apply to the room socket; `NOT_PERMITTED` and `USER_NOT_FOUND` apply only to the chat socket. All have concrete examples in the action/error folders (see `06 - Errors/error-catalog.yml`). `UNAUTHORIZED` closes the socket with policy code `4401` when the session becomes explicitly invalid after connection (logout, refresh-token-family revocation) \u2014 ordinary access-token expiry does not by itself close an already-open socket. There is no WebSocket-level `SESSION_EXPIRED` \u2014 refresh credential expiry is a REST-only concept handled by `POST /api/auth/refresh`. The server may close for invalid handshake auth (including `Origin` mismatch), explicit session revocation, or repeated protocol abuse only.\n\n    ## Example index\n\n    `03 - Ready & Countdown` contains minimum valid room, countdown, and cancellation. `07 - Full State Scenarios` contains full Spymaster and Operative boards. `04 - Game` contains clue, own-team continuation, last-guess turn end, own-team victory, opponent turn end, opponent final-card victory, neutral, assassin, pass, and invalid-action cases. `08 - Chat` contains the per-user chat socket's send/receive and permission-error cases.\n  type: text/markdown\nbundled: true\nextensions:\n  bruno:\n    exportedAt: '2026-09-20T12:48:19.351Z'\n    exportedUsing: Bruno/4.1.0\n";
