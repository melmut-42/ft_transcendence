    <div id="opencollection-container"></div>
    <script>
        const collectionData = "opencollection: 1.0.0\ninfo:\n  name: WebSocket\n  version: 1.1.0-dev\nconfig:\n  proxy:\n    inherit: true\n    config:\n      protocol: http\n      hostname: ''\n      port: ''\n      auth:\n        username: ''\n        password: ''\n      bypassProxy: ''\nitems:\n  - info:\n      name: 01 - Room Lobby\n      type: folder\n      seq: 1\n    docs:\n      content: |-\n        # Room lobby\n\n        This folder documents server membership events created by REST join/leave operations. Join is legal only in `WAITING`. Every join or leave causes the server to re-evaluate startability. Host transfer is deterministic by earliest `joined_at` among remaining members.\n      type: text/markdown\n    items:\n      - info:\n          name: Membership event reference\n          type: websocket\n          seq: 1\n          tags:\n            - server-event\n            - room\n        websocket:\n          url: '{{wsUrl}}/ws/rooms/{{roomId}}'\n        docs: |-\n          # Membership event reference\n\n          ## Purpose and trigger\n\n          Observes membership events produced by REST join/leave. This request sends no application message. `room.player.joined` occurs only in `WAITING`; `room.player.left` may occur in `WAITING`, `COUNTDOWN`, or `FINISHED`.\n\n          ## Connection parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `room_id` | WebSocket path | yes | integer | positive | no | Observed room | `1001` |\n          | `ft_session` cookie | handshake | yes | string | HttpOnly, Secure, active session | no | Sole handshake credential; automatic on same-origin upgrade | set by Register/Login |\n\n          ## Event fields\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `type` | string enum | yes | no | `room.player.joined`, `room.player.left` | Membership change |\n          | `event_id` | string | yes | no | room-unique | Ordered event ID |\n          | `room_id` | integer | yes | no | positive | Affected room |\n          | `sent_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Event time |\n          | `payload.player` | object | yes | no | member schema | Joined/left identity and temporary selections at change time |\n          | `payload.player.user_id` | integer | yes | no | positive | Affected member |\n          | `payload.player.username` | string | yes | no | username rule | Affected username |\n          | `payload.player.team` | enum or null | yes | yes | `RED`, `BLUE`, `null` | Temporary team |\n          | `payload.player.role` | enum or null | yes | yes | `SPYMASTER`, `OPERATIVE`, `null` | Temporary role |\n          | `payload.player.ready` | boolean | yes | no | `true`, `false` | Readiness at change time |\n          | `payload.host_user_id` | integer or null | yes | yes | remaining member ID or `null` | Host after change; null only when room closes empty |\n          | `payload.player_count` | integer | yes | no | `>= 0` | Membership after change |\n          | `payload.room_status` | enum | yes | no | `WAITING`, `FINISHED`, `CLOSED` | State after membership processing |\n\n          ## State behavior and ordering\n\n          Join initializes team/role to null and ready false. Leave clears the user's active room. Host leave transfers to the remaining earliest `joined_at`. Countdown leave first produces `room.countdown.cancelled`, then `room.player.left`, then `room.state`.\n\n          ## Concrete events\n\n          ```json\n            {\n              \"type\": \"room.player.joined\",\n              \"event_id\": \"evt_0104\",\n              \"room_id\": 1001,\n              \"sent_at\": \"2026-09-10T08:41:20Z\",\n              \"payload\": {\n                \"player\": {\n                  \"user_id\": 43,\n                  \"username\": \"red_agent\",\n                  \"team\": null,\n                  \"role\": null,\n                  \"ready\": false,\n                  \"is_host\": false,\n                  \"joined_at\": \"2026-09-10T08:41:20Z\"\n                },\n                \"host_user_id\": 42,\n                \"player_count\": 2,\n                \"room_status\": \"WAITING\"\n              }\n            }\n          ```\n\n          ```json\n            {\n              \"type\": \"room.player.left\",\n              \"event_id\": \"evt_0110\",\n              \"room_id\": 1001,\n              \"sent_at\": \"2026-09-10T08:42:05Z\",\n              \"payload\": {\n                \"player\": {\n                  \"user_id\": 42,\n                  \"username\": \"player_one\",\n                  \"team\": \"RED\",\n                  \"role\": \"SPYMASTER\",\n                  \"ready\": false,\n                  \"is_host\": true,\n                  \"joined_at\": \"2026-09-10T08:41:00Z\"\n                },\n                \"host_user_id\": 43,\n                \"player_count\": 3,\n                \"room_status\": \"WAITING\"\n              }\n            }\n          ```\n\n          No client command error applies because the source operation is REST; consult the REST join/leave requests for errors.\n  - info:\n      name: 02 - Team & Role\n      type: folder\n      seq: 2\n    docs:\n      content: |-\n        # Team and role\n\n        Members select exactly one team (`RED | BLUE`) and one room role (`SPYMASTER | OPERATIVE`) during `WAITING`. A team may have exactly one Spymaster. A selection change is also accepted during `COUNTDOWN` specifically so it can cancel the countdown. Changing team or role clears `ready`, emits `room.player.updated`, re-evaluates startability, and returns an active countdown to `WAITING`.\n      type: text/markdown\n    items:\n      - info:\n          name: Select team\n          type: websocket\n          seq: 1\n          tags:\n            - action\n            - room\n        websocket:\n          url: '{{wsUrl}}/ws/rooms/{{roomId}}'\n          message:\n            - title: Success - Select RED\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"room.team.select\",\n                    \"request_id\": \"req_0001\",\n                    \"payload\": {\n                      \"team\": \"RED\"\n                    }\n                  }\n            - title: Success - Select BLUE\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"room.team.select\",\n                    \"request_id\": \"req_0002\",\n                    \"payload\": {\n                      \"team\": \"BLUE\"\n                    }\n                  }\n            - title: Success - Change team resets ready\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"room.team.select\",\n                    \"request_id\": \"req_0003\",\n                    \"payload\": {\n                      \"team\": \"BLUE\"\n                    }\n                  }\n            - title: Error - Invalid team\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"room.team.select\",\n                    \"request_id\": \"req_0004\",\n                    \"payload\": {\n                      \"team\": \"GREEN\"\n                    }\n                  }\n        docs: |-\n          # Select team\n\n          ## Purpose and preconditions\n\n          Selects the authenticated member's temporary team. Allowed in `WAITING`; during `COUNTDOWN`, a change is accepted, clears readiness, cancels countdown, and returns the room to `WAITING`. No host privilege is required.\n\n          ## Message and payload parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `room_id` | WebSocket path | yes | integer | positive | no | Connected room | `1001` |\n          | `ft_session` cookie | handshake | yes | string | HttpOnly, Secure, active session | no | Sole handshake credential; automatic on same-origin upgrade | set by Register/Login |\n          | `type` | envelope | yes | string enum | `room.team.select` | no | Operation | `room.team.select` |\n          | `request_id` | envelope | yes | string | `1..64` visible ASCII, unique per session | no | Idempotency key | `req_0001` |\n          | `payload.team` | payload | yes | string enum | `RED`, `BLUE` | no | New temporary team | `RED` |\n\n          ## Success, state, and emitted events\n\n          The server emits `room.player.updated` then `room.state`. If team changes, the existing role remains only if it does not create a Spymaster conflict on the destination team; otherwise the command is rejected. Every successful team change sets `ready=false` and re-evaluates startability. During `COUNTDOWN`, event order is `room.player.updated`, `room.countdown.cancelled` with reason `TEAM_CHANGED`, then `room.state`.\n\n          **Select RED:**\n\n          ```json\n            {\n              \"type\": \"ack\",\n              \"request_id\": \"req_0001\",\n              \"ok\": true,\n              \"payload\": {\n                \"user_id\": 42,\n                \"team\": \"RED\",\n                \"role\": null,\n                \"ready\": false,\n                \"room_status\": \"WAITING\"\n              }\n            }\n          ```\n\n          **Select BLUE:**\n\n          ```json\n            {\n              \"type\": \"ack\",\n              \"request_id\": \"req_0002\",\n              \"ok\": true,\n              \"payload\": {\n                \"user_id\": 44,\n                \"team\": \"BLUE\",\n                \"role\": null,\n                \"ready\": false,\n                \"room_status\": \"WAITING\"\n              }\n            }\n          ```\n\n          **Change team during `COUNTDOWN`** (cancels it, reason `TEAM_CHANGED`):\n\n          ```json\n            {\n              \"type\": \"ack\",\n              \"request_id\": \"req_0003\",\n              \"ok\": true,\n              \"payload\": {\n                \"user_id\": 46,\n                \"team\": \"BLUE\",\n                \"role\": \"OPERATIVE\",\n                \"ready\": false,\n                \"room_status\": \"WAITING\"\n              }\n            }\n          ```\n\n          Updated event:\n\n          ```json\n            {\n              \"type\": \"room.player.updated\",\n              \"event_id\": \"evt_0111\",\n              \"room_id\": 1001,\n              \"sent_at\": \"2026-09-10T08:42:10Z\",\n              \"payload\": {\n                \"player\": {\n                  \"user_id\": 42,\n                  \"username\": \"player_one\",\n                  \"team\": \"RED\",\n                  \"role\": null,\n                  \"ready\": false,\n                  \"is_host\": true,\n                  \"joined_at\": \"2026-09-10T08:41:00Z\"\n                },\n                \"changed_fields\": [\n                  \"team\"\n                ],\n                \"room_status\": \"WAITING\",\n                \"startable\": false\n              }\n            }\n          ```\n\n          | Result field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `ack.payload.user_id` | integer | yes | no | positive | Updated member |\n          | `ack.payload.team` | enum | yes | no | `RED`, `BLUE` | Accepted team |\n          | `ack.payload.role` | enum or null | yes | yes | `SPYMASTER`, `OPERATIVE`, `null` | Retained role when valid |\n          | `ack.payload.ready` | boolean | yes | no | `false` | Reset confirmation |\n          | `ack.payload.room_status` | enum | yes | no | `WAITING` | Post-command state, including cancelled countdown |\n          | `event.payload.changed_fields[]` | array<string enum> | yes | no | `team`, plus `ready` when it changed | Fields changed atomically |\n          | `event.payload.startable` | boolean | yes | no | `true`, `false` | Full predicate after update |\n\n          ## Errors\n\n          `INVALID_PAYLOAD` for missing/unknown team; `NOT_ROOM_MEMBER`; `INVALID_ROOM_STATE` outside `WAITING` and `COUNTDOWN`; `ROLE_CONFLICT` if moving an existing Spymaster would duplicate the destination Spymaster. Errors preserve all state and keep the socket open.\n\n          ```json\n            {\n              \"type\": \"error\",\n              \"request_id\": \"req_0004\",\n              \"error\": {\n                \"code\": \"INVALID_PAYLOAD\",\n                \"message\": \"payload.team must be RED or BLUE.\",\n                \"details\": {\n                  \"field\": \"payload.team\"\n                }\n              }\n            }\n          ```\n      - info:\n          name: Select role\n          type: websocket\n          seq: 2\n          tags:\n            - action\n            - room\n        websocket:\n          url: '{{wsUrl}}/ws/rooms/{{roomId}}'\n          message:\n            - title: Success - Select RED Spymaster\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"room.role.select\",\n                    \"request_id\": \"req_0005\",\n                    \"payload\": {\n                      \"role\": \"SPYMASTER\"\n                    }\n                  }\n            - title: Success - Select BLUE Operative\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"room.role.select\",\n                    \"request_id\": \"req_0006\",\n                    \"payload\": {\n                      \"role\": \"OPERATIVE\"\n                    }\n                  }\n            - title: Success - Change Operative to Spymaster\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"room.role.select\",\n                    \"request_id\": \"req_0007\",\n                    \"payload\": {\n                      \"role\": \"SPYMASTER\"\n                    }\n                  }\n            - title: Error - Spymaster already occupied\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"room.role.select\",\n                    \"request_id\": \"req_0008\",\n                    \"payload\": {\n                      \"role\": \"SPYMASTER\"\n                    }\n                  }\n            - title: Error - No team selected\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"room.role.select\",\n                    \"request_id\": \"req_0009\",\n                    \"payload\": {\n                      \"role\": \"OPERATIVE\"\n                    }\n                  }\n            - title: Error - Game already started\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"room.role.select\",\n                    \"request_id\": \"req_0010\",\n                    \"payload\": {\n                      \"role\": \"OPERATIVE\"\n                    }\n                  }\n        docs: |-\n          # Select role\n\n          ## Purpose and preconditions\n\n          Selects the member's temporary room role. The member must first choose `RED` or `BLUE`. It is allowed in `WAITING`; during `COUNTDOWN`, a change clears readiness, cancels countdown, and returns the room to `WAITING`.\n\n          ## Message and payload parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `room_id` | WebSocket path | yes | integer | positive | no | Connected room | `1001` |\n          | `ft_session` cookie | handshake | yes | string | HttpOnly, Secure, active session | no | Sole handshake credential; automatic on same-origin upgrade | set by Register/Login |\n          | `type` | envelope | yes | string enum | `room.role.select` | no | Operation | `room.role.select` |\n          | `request_id` | envelope | yes | string | `1..64` visible ASCII, unique | no | Idempotency key | `req_0005` |\n          | `payload.role` | payload | yes | string enum | `SPYMASTER`, `OPERATIVE` | no | New temporary role | `SPYMASTER` |\n\n          ## Success, state, and emitted events\n\n          A role selection sets `ready=false`, re-evaluates startability, sends an ack, emits `room.player.updated`, then `room.state`. During `COUNTDOWN`, `room.countdown.cancelled` with reason `ROLE_CHANGED` is inserted before the state snapshot.\n\n          **Select RED Spymaster:**\n\n          ```json\n            {\n              \"type\": \"ack\",\n              \"request_id\": \"req_0005\",\n              \"ok\": true,\n              \"payload\": {\n                \"user_id\": 42,\n                \"team\": \"RED\",\n                \"role\": \"SPYMASTER\",\n                \"ready\": false,\n                \"room_status\": \"WAITING\"\n              }\n            }\n          ```\n\n          **Select BLUE Operative:**\n\n          ```json\n            {\n              \"type\": \"ack\",\n              \"request_id\": \"req_0006\",\n              \"ok\": true,\n              \"payload\": {\n                \"user_id\": 45,\n                \"team\": \"BLUE\",\n                \"role\": \"OPERATIVE\",\n                \"ready\": false,\n                \"room_status\": \"WAITING\"\n              }\n            }\n          ```\n\n          **Change Operative to Spymaster** (RED's Spymaster slot is vacant):\n\n          ```json\n            {\n              \"type\": \"ack\",\n              \"request_id\": \"req_0007\",\n              \"ok\": true,\n              \"payload\": {\n                \"user_id\": 43,\n                \"team\": \"RED\",\n                \"role\": \"SPYMASTER\",\n                \"ready\": false,\n                \"room_status\": \"WAITING\"\n              }\n            }\n          ```\n\n          | Result field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `ack.payload.user_id` | integer | yes | no | positive | Updated member |\n          | `ack.payload.team` | enum | yes | no | `RED`, `BLUE` | Existing selected team |\n          | `ack.payload.role` | enum | yes | no | `SPYMASTER`, `OPERATIVE` | Accepted role |\n          | `ack.payload.ready` | boolean | yes | no | `false` | Reset confirmation |\n          | `ack.payload.room_status` | enum | yes | no | `WAITING` | Post-command state |\n          | `room.player.updated.payload.changed_fields[]` | array<string enum> | yes | no | `role`, plus `ready` when it changed | Atomic changes |\n\n          ## Duplicate Spymaster error\n\n          Given user `42` already occupies `RED / SPYMASTER`, user `43` attempting the same role receives:\n\n          ```json\n            {\n              \"type\": \"error\",\n              \"request_id\": \"req_0008\",\n              \"error\": {\n                \"code\": \"ROLE_CONFLICT\",\n                \"message\": \"RED already has a Spymaster.\",\n                \"details\": {\n                  \"team\": \"RED\",\n                  \"occupied_by_user_id\": 42\n                }\n              }\n            }\n          ```\n\n          No player field changes and no update event is emitted.\n\n          ## Other errors\n\n          - `TEAM_REQUIRED`: `Select a team before selecting a role.`\n          - `INVALID_PAYLOAD`: role is absent or outside the two-value enum.\n          - `INVALID_ROOM_STATE`: room status is not `WAITING` or `COUNTDOWN`, including `IN_GAME`.\n          - `NOT_ROOM_MEMBER`: session user is outside the room.\n\n          ```json\n            {\n              \"type\": \"error\",\n              \"request_id\": \"req_0009\",\n              \"error\": {\n                \"code\": \"TEAM_REQUIRED\",\n                \"message\": \"Select a team before selecting a role.\",\n                \"details\": {\n                  \"user_id\": 43\n                }\n              }\n            }\n          ```\n\n          ```json\n            {\n              \"type\": \"error\",\n              \"request_id\": \"req_0010\",\n              \"error\": {\n                \"code\": \"INVALID_ROOM_STATE\",\n                \"message\": \"Roles cannot change while room status is IN_GAME.\",\n                \"details\": {\n                  \"status\": \"IN_GAME\"\n                }\n              }\n            }\n          ```\n  - info:\n      name: 03 - Ready & Countdown\n      type: folder\n      seq: 3\n    docs:\n      content: |-\n        # Ready and countdown\n\n        `ready=true` requires both team and role. Readiness is not sufficient by itself: all nine start clauses in workspace documentation must hold. The server automatically starts a three-second countdown when they do. Join, leave, team, role, or ready changes can cancel it and return the room to `WAITING`.\n      type: text/markdown\n    items:\n      - info:\n          name: Set ready\n          type: websocket\n          seq: 1\n          tags:\n            - action\n            - room\n            - countdown\n        websocket:\n          url: '{{wsUrl}}/ws/rooms/{{roomId}}'\n          message:\n            - title: Success - Ready true\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"room.ready.set\",\n                    \"request_id\": \"req_0011\",\n                    \"payload\": {\n                      \"ready\": true\n                    }\n                  }\n            - title: Success - Ready false\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"room.ready.set\",\n                    \"request_id\": \"req_0012\",\n                    \"payload\": {\n                      \"ready\": false\n                    }\n                  }\n            - title: Success - Last player triggers countdown\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"room.ready.set\",\n                    \"request_id\": \"req_0013\",\n                    \"payload\": {\n                      \"ready\": true\n                    }\n                  }\n            - title: Success - Unready cancels countdown\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"room.ready.set\",\n                    \"request_id\": \"req_0014\",\n                    \"payload\": {\n                      \"ready\": false\n                    }\n                  }\n            - title: Error - Team missing\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"room.ready.set\",\n                    \"request_id\": \"req_0015\",\n                    \"payload\": {\n                      \"ready\": true\n                    }\n                  }\n            - title: Error - Role missing\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"room.ready.set\",\n                    \"request_id\": \"req_0016\",\n                    \"payload\": {\n                      \"ready\": true\n                    }\n                  }\n        docs: |-\n          # Set ready\n\n          ## Purpose and preconditions\n\n          Confirms or withdraws the member's current team/role configuration. `ready=true` is legal in `WAITING` only after both selections. `ready=false` is legal in `WAITING` and `COUNTDOWN` and cancels an active countdown.\n\n          ## Message and payload parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `room_id` | WebSocket path | yes | integer | positive | no | Connected room | `1001` |\n          | `ft_session` cookie | handshake | yes | string | HttpOnly, Secure, active session | no | Sole handshake credential; automatic on same-origin upgrade | set by Register/Login |\n          | `type` | envelope | yes | string enum | `room.ready.set` | no | Operation | `room.ready.set` |\n          | `request_id` | envelope | yes | string | `1..64` visible ASCII, unique | no | Idempotency key | `req_0011` |\n          | `payload.ready` | payload | yes | boolean | `true`, `false` | no | Desired readiness | `true` |\n\n          ## Success behavior\n\n          Every accepted change emits `room.player.updated` and `room.state`. The ack reports the post-evaluation state:\n\n          ```json\n            {\n              \"type\": \"ack\",\n              \"request_id\": \"req_0011\",\n              \"ok\": true,\n              \"payload\": {\n                \"user_id\": 42,\n                \"ready\": true,\n                \"room_status\": \"WAITING\",\n                \"startable\": false\n              }\n            }\n          ```\n\n          | Result field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `ack.payload.user_id` | integer | yes | no | positive | Updated member |\n          | `ack.payload.ready` | boolean | yes | no | `true`, `false` | Accepted readiness |\n          | `ack.payload.room_status` | enum | yes | no | `WAITING`, `COUNTDOWN` | State after full predicate evaluation |\n          | `ack.payload.startable` | boolean | yes | no | `true`, `false` | Full predicate result |\n          | `room.player.updated.payload.changed_fields[]` | array<string enum> | yes | no | `ready` | Updated field |\n\n          The ordinary unready example in `WAITING` emits no countdown event:\n\n          ```json\n            {\n              \"type\": \"ack\",\n              \"request_id\": \"req_0012\",\n              \"ok\": true,\n              \"payload\": {\n                \"user_id\": 42,\n                \"ready\": false,\n                \"room_status\": \"WAITING\",\n                \"startable\": false\n              }\n            }\n          ```\n\n          ### Last readiness and automatic countdown\n\n          Immediately before processing user `45`, the server has this pre-request `WAITING` snapshot:\n\n          ```json\n            {\n              \"room_id\": 1001,\n              \"status\": \"WAITING\",\n              \"player_count\": 4,\n              \"startable\": false,\n              \"players\": [\n                {\n                  \"user_id\": 42,\n                  \"team\": \"RED\",\n                  \"role\": \"SPYMASTER\",\n                  \"ready\": true\n                },\n                {\n                  \"user_id\": 43,\n                  \"team\": \"RED\",\n                  \"role\": \"OPERATIVE\",\n                  \"ready\": true\n                },\n                {\n                  \"user_id\": 44,\n                  \"team\": \"BLUE\",\n                  \"role\": \"SPYMASTER\",\n                  \"ready\": true\n                },\n                {\n                  \"user_id\": 45,\n                  \"team\": \"BLUE\",\n                  \"role\": \"OPERATIVE\",\n                  \"ready\": false\n                }\n              ]\n            }\n          ```\n\n          Applying request `req_0013` produces this final all-ready `WAITING` candidate inside the same server transaction, immediately before the lifecycle transition:\n\n          ```json\n            {\n              \"room_id\": 1001,\n              \"status\": \"WAITING\",\n              \"player_count\": 4,\n              \"startable\": true,\n              \"players\": [\n                {\n                  \"user_id\": 42,\n                  \"team\": \"RED\",\n                  \"role\": \"SPYMASTER\",\n                  \"ready\": true\n                },\n                {\n                  \"user_id\": 43,\n                  \"team\": \"RED\",\n                  \"role\": \"OPERATIVE\",\n                  \"ready\": true\n                },\n                {\n                  \"user_id\": 44,\n                  \"team\": \"BLUE\",\n                  \"role\": \"SPYMASTER\",\n                  \"ready\": true\n                },\n                {\n                  \"user_id\": 45,\n                  \"team\": \"BLUE\",\n                  \"role\": \"OPERATIVE\",\n                  \"ready\": true\n                }\n              ]\n            }\n          ```\n\n          The server does not expose that candidate as a durable idle state: all clauses are true, so it atomically enters `COUNTDOWN`. The ack is post-transition:\n\n          ```json\n            {\n              \"type\": \"ack\",\n              \"request_id\": \"req_0013\",\n              \"ok\": true,\n              \"payload\": {\n                \"user_id\": 45,\n                \"ready\": true,\n                \"room_status\": \"COUNTDOWN\",\n                \"startable\": true\n              }\n            }\n          ```\n\n          The server emits `room.player.updated`, `room.countdown.started`, then a `room.state` with `status=COUNTDOWN`.\n\n          ### Countdown cancellation\n\n          Request `req_0014` from user `43` produces:\n\n          ```json\n            {\n              \"type\": \"ack\",\n              \"request_id\": \"req_0014\",\n              \"ok\": true,\n              \"payload\": {\n                \"user_id\": 43,\n                \"ready\": false,\n                \"room_status\": \"WAITING\",\n                \"startable\": false\n              }\n            }\n          ```\n\n          The server emits `room.player.updated`, `room.countdown.cancelled`, then `room.state`. No board is generated.\n\n          ## Errors\n\n          `TEAM_REQUIRED` and `ROLE_REQUIRED` reject `ready=true`; `INVALID_PAYLOAD` rejects non-boolean values; `NOT_ROOM_MEMBER`; `INVALID_ROOM_STATE` rejects `true` in countdown or any mutation in `IN_GAME`, `FINISHED`, `CLOSED`. Errors change no state.\n\n          ```json\n            {\n              \"type\": \"error\",\n              \"request_id\": \"req_0015\",\n              \"error\": {\n                \"code\": \"TEAM_REQUIRED\",\n                \"message\": \"Select a team before becoming ready.\",\n                \"details\": {\n                  \"user_id\": 43\n                }\n              }\n            }\n          ```\n\n          ```json\n            {\n              \"type\": \"error\",\n              \"request_id\": \"req_0016\",\n              \"error\": {\n                \"code\": \"ROLE_REQUIRED\",\n                \"message\": \"Select a role before becoming ready.\",\n                \"details\": {\n                  \"user_id\": 43\n                }\n              }\n            }\n          ```\n\n          ## Invariants\n\n          Ready is tied to the exact current selections. Any later successful team or role change forces it to false. `all ready` is never used as a substitute for the complete start predicate.\n      - info:\n          name: Countdown event reference\n          type: websocket\n          seq: 2\n          tags:\n            - server-event\n            - countdown\n        websocket:\n          url: '{{wsUrl}}/ws/rooms/{{roomId}}'\n        docs: |-\n          # Countdown event reference\n\n          ## Purpose and triggers\n\n          Passive reference for the automatic `WAITING -> COUNTDOWN -> IN_GAME` flow and its cancellation path. It sends no client message. Countdown duration is fixed to three seconds in this contract.\n\n          ## Connection parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `room_id` | WebSocket path | yes | integer | positive | no | Observed room | `1001` |\n          | `ft_session` cookie | handshake | yes | string | HttpOnly, Secure, active session | no | Sole handshake credential; automatic on same-origin upgrade | set by Register/Login |\n\n          ## Event field schema\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `type` | string enum | yes | no | `room.countdown.started`, `room.countdown.tick`, `room.countdown.cancelled` | Countdown event |\n          | `event_id` | string | yes | no | room-unique | Ordered event identifier |\n          | `room_id` | integer | yes | no | positive | Room |\n          | `sent_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Event time |\n          | `payload.seconds_remaining` | integer | start/tick only | no | `0..3` | Whole seconds remaining |\n          | `payload.reason` | string enum | cancel only | no | `PLAYER_UNREADY`, `PLAYER_LEFT`, `TEAM_CHANGED`, `ROLE_CHANGED` | Invariant invalidation cause |\n          | `payload.changed_by_user_id` | integer | cancel only | no | positive | Member whose action invalidated start |\n\n          ## Complete successful sequence\n\n          ```json\n            {\n              \"type\": \"room.countdown.started\",\n              \"event_id\": \"evt_0132\",\n              \"room_id\": 1001,\n              \"sent_at\": \"2026-09-10T08:43:12Z\",\n              \"payload\": {\n                \"seconds_remaining\": 3\n              }\n            }\n          ```\n\n          ```json\n            {\n              \"type\": \"room.state\",\n              \"event_id\": \"evt_0133\",\n              \"room_id\": 1001,\n              \"sent_at\": \"2026-09-10T08:43:12Z\",\n              \"payload\": {\n                \"room\": {\n                  \"room_id\": 1001,\n                  \"status\": \"COUNTDOWN\",\n                  \"host_user_id\": 42,\n                  \"player_count\": 4,\n                  \"startable\": true,\n                  \"countdown\": {\n                    \"seconds_remaining\": 3\n                  },\n                  \"players\": [\n                    {\n                      \"user_id\": 42,\n                      \"username\": \"player_one\",\n                      \"team\": \"RED\",\n                      \"role\": \"SPYMASTER\",\n                      \"ready\": true,\n                      \"is_host\": true,\n                      \"joined_at\": \"2026-09-10T08:41:00Z\"\n                    },\n                    {\n                      \"user_id\": 43,\n                      \"username\": \"red_agent\",\n                      \"team\": \"RED\",\n                      \"role\": \"OPERATIVE\",\n                      \"ready\": true,\n                      \"is_host\": false,\n                      \"joined_at\": \"2026-09-10T08:41:20Z\"\n                    },\n                    {\n                      \"user_id\": 44,\n                      \"username\": \"blue_master\",\n                      \"team\": \"BLUE\",\n                      \"role\": \"SPYMASTER\",\n                      \"ready\": true,\n                      \"is_host\": false,\n                      \"joined_at\": \"2026-09-10T08:41:30Z\"\n                    },\n                    {\n                      \"user_id\": 45,\n                      \"username\": \"blue_agent\",\n                      \"team\": \"BLUE\",\n                      \"role\": \"OPERATIVE\",\n                      \"ready\": true,\n                      \"is_host\": false,\n                      \"joined_at\": \"2026-09-10T08:41:40Z\"\n                    }\n                  ],\n                  \"game\": null,\n                  \"created_at\": \"2026-09-10T08:41:00Z\"\n                }\n              }\n            }\n          ```\n\n          ```json\n            {\n              \"type\": \"room.countdown.tick\",\n              \"event_id\": \"evt_0134\",\n              \"room_id\": 1001,\n              \"sent_at\": \"2026-09-10T08:43:13Z\",\n              \"payload\": {\n                \"seconds_remaining\": 2\n              }\n            }\n          ```\n\n          ```json\n            {\n              \"type\": \"room.countdown.tick\",\n              \"event_id\": \"evt_0135\",\n              \"room_id\": 1001,\n              \"sent_at\": \"2026-09-10T08:43:14Z\",\n              \"payload\": {\n                \"seconds_remaining\": 1\n              }\n            }\n          ```\n\n          ```json\n            {\n              \"type\": \"room.countdown.tick\",\n              \"event_id\": \"evt_0136\",\n              \"room_id\": 1001,\n              \"sent_at\": \"2026-09-10T08:43:15Z\",\n              \"payload\": {\n                \"seconds_remaining\": 0\n              }\n            }\n          ```\n\n          The next event is `game.started` with room status `IN_GAME`, `game_id=5001`, and a recipient-safe board.\n\n          ## Complete cancellation sequence\n\n          If user `43` sets ready false at two seconds:\n\n          ```json\n            {\n              \"type\": \"room.countdown.cancelled\",\n              \"event_id\": \"evt_0140\",\n              \"room_id\": 1001,\n              \"sent_at\": \"2026-09-10T08:44:01Z\",\n              \"payload\": {\n                \"reason\": \"PLAYER_UNREADY\",\n                \"changed_by_user_id\": 43\n              }\n            }\n          ```\n\n          ```json\n            {\n              \"type\": \"room.state\",\n              \"event_id\": \"evt_0141\",\n              \"room_id\": 1001,\n              \"sent_at\": \"2026-09-10T08:44:01Z\",\n              \"payload\": {\n                \"room\": {\n                  \"room_id\": 1001,\n                  \"status\": \"WAITING\",\n                  \"host_user_id\": 42,\n                  \"player_count\": 4,\n                  \"startable\": false,\n                  \"players\": [\n                    {\n                      \"user_id\": 42,\n                      \"username\": \"player_one\",\n                      \"team\": \"RED\",\n                      \"role\": \"SPYMASTER\",\n                      \"ready\": true,\n                      \"is_host\": true,\n                      \"joined_at\": \"2026-09-10T08:41:00Z\"\n                    },\n                    {\n                      \"user_id\": 43,\n                      \"username\": \"red_agent\",\n                      \"team\": \"RED\",\n                      \"role\": \"OPERATIVE\",\n                      \"ready\": false,\n                      \"is_host\": false,\n                      \"joined_at\": \"2026-09-10T08:41:20Z\"\n                    },\n                    {\n                      \"user_id\": 44,\n                      \"username\": \"blue_master\",\n                      \"team\": \"BLUE\",\n                      \"role\": \"SPYMASTER\",\n                      \"ready\": true,\n                      \"is_host\": false,\n                      \"joined_at\": \"2026-09-10T08:41:30Z\"\n                    },\n                    {\n                      \"user_id\": 45,\n                      \"username\": \"blue_agent\",\n                      \"team\": \"BLUE\",\n                      \"role\": \"OPERATIVE\",\n                      \"ready\": true,\n                      \"is_host\": false,\n                      \"joined_at\": \"2026-09-10T08:41:40Z\"\n                    }\n                  ],\n                  \"game\": null,\n                  \"created_at\": \"2026-09-10T08:41:00Z\"\n                }\n              }\n            }\n          ```\n\n          The cancelled snapshot omits `countdown`; remaining scheduled ticks and `game.started` MUST NOT be emitted.\n\n          ## State and errors\n\n          Events are server-generated and have no action-level errors. The server rechecks all invariants immediately before creating the board; stale timer completion cannot start an invalid room.\n  - info:\n      name: 04 - Game\n      type: folder\n      seq: 4\n    docs:\n      content: |-\n        # Game\n\n        Game phase is `WAITING_FOR_CLUE | GUESSING | GAME_OVER`, separate from room status. The active Spymaster submits a clue and integer `N`; the active Operatives receive `N+1` guesses. Own cards may continue, opponent and neutral cards end the turn, assassin ends the game, and any team's last card wins immediately. Passing is voluntary during `GUESSING`. Winner is always decided by a terminal reveal (a full set, the assassin) or a forfeit \u2014 never by comparing `score.red` to `score.blue` (`workspace.yml`, Game Rules).\n\n        Scores count revealed team cards, regardless of which team guessed them; either color's starting-team score ranges `0..9` (either color can start \u2014 `workspace.yml`). Every reveal checks terminal conditions before emitting a turn change.\n\n        A match can also end by `game.ended` with `end_reason: \"PLAYER_FORFEIT\"` \u2014 triggered by the abandonment grace-period timer, an explicit `Leave room` during `IN_GAME`, or logout during `IN_GAME` (`workspace.yml`, Room Abandonment; see `05 - Server Events/server-event-catalog.yml` for the concrete event). No client message causes this directly.\n      type: text/markdown\n    items:\n      - info:\n          name: Submit clue\n          type: websocket\n          seq: 1\n          tags:\n            - action\n            - game\n        websocket:\n          url: '{{wsUrl}}/ws/rooms/{{roomId}}'\n          message:\n            - title: Success - Ocean 2\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"game.clue.submit\",\n                    \"request_id\": \"req_0020\",\n                    \"payload\": {\n                      \"word\": \"ocean\",\n                      \"number\": 2\n                    }\n                  }\n            - title: Success - Space 3\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"game.clue.submit\",\n                    \"request_id\": \"req_0021\",\n                    \"payload\": {\n                      \"word\": \" SPACE \",\n                      \"number\": 3\n                    }\n                  }\n            - title: Error - Operative cannot submit\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"game.clue.submit\",\n                    \"request_id\": \"req_0022\",\n                    \"payload\": {\n                      \"word\": \"ocean\",\n                      \"number\": 2\n                    }\n                  }\n            - title: Error - Wrong team\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"game.clue.submit\",\n                    \"request_id\": \"req_0023\",\n                    \"payload\": {\n                      \"word\": \"space\",\n                      \"number\": 3\n                    }\n                  }\n            - title: Error - Wrong phase\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"game.clue.submit\",\n                    \"request_id\": \"req_0024\",\n                    \"payload\": {\n                      \"word\": \"ocean\",\n                      \"number\": 2\n                    }\n                  }\n            - title: Error - Invalid number\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"game.clue.submit\",\n                    \"request_id\": \"req_0025\",\n                    \"payload\": {\n                      \"word\": \"ocean\",\n                      \"number\": 0\n                    }\n                  }\n            - title: Error - Multiple words\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"game.clue.submit\",\n                    \"request_id\": \"req_0026\",\n                    \"payload\": {\n                      \"word\": \"deep ocean\",\n                      \"number\": 2\n                    }\n                  }\n        docs: |-\n          # Submit clue\n\n          ## Purpose and preconditions\n\n          Moves the active team from `WAITING_FOR_CLUE` to `GUESSING`. Only that team's `SPYMASTER` may submit. The room must be `IN_GAME` and the game unfinished.\n\n          ## Message and payload parameters\n\n          | Parameter | Location | Required | Type | Allowed values/range | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `room_id` | WebSocket path | yes | integer | positive | no | Connected room | `1001` |\n          | `ft_session` cookie | handshake | yes | string | HttpOnly, Secure, active session | no | Sole handshake credential; automatic on same-origin upgrade | set by Register/Login |\n          | `type` | envelope | yes | string enum | `game.clue.submit` | no | Operation | `game.clue.submit` |\n          | `request_id` | envelope | yes | string | `1..64` visible ASCII, unique | no | Idempotency key | `req_0020` |\n          | `payload.word` | payload | yes | string | trim; one non-whitespace word; `1..30` Unicode characters | no | Clue stored in Unicode lowercase | `ocean` |\n          | `payload.number` | payload | yes | integer | `1..9` | no | Base guess count `N` | `2` |\n\n          Deterministic validation adds no word-list, board-word, inflection, or proper-noun restrictions. `\" SPACE \"` normalizes to `\"space\"`; `\"deep ocean\"` is invalid.\n\n          ## Success behavior and response\n\n          Request `req_0020` returns:\n\n          ```json\n            {\n              \"type\": \"ack\",\n              \"request_id\": \"req_0020\",\n              \"ok\": true,\n              \"payload\": {\n                \"game_id\": 5001,\n                \"current_turn\": {\n                  \"team\": \"RED\",\n                  \"phase\": \"GUESSING\",\n                  \"clue\": {\n                    \"word\": \"ocean\",\n                    \"number\": 2\n                  },\n                  \"guesses_remaining\": 3\n                }\n              }\n            }\n          ```\n\n          The server emits exactly one event for a unique request:\n\n          ```json\n            {\n              \"type\": \"game.clue.submitted\",\n              \"event_id\": \"evt_0142\",\n              \"room_id\": 1001,\n              \"sent_at\": \"2026-09-10T08:43:30Z\",\n              \"payload\": {\n                \"game_id\": 5001,\n                \"submitted_by_user_id\": 42,\n                \"team\": \"RED\",\n                \"clue\": {\n                  \"word\": \"ocean\",\n                  \"number\": 2\n                },\n                \"guesses_remaining\": 3,\n                \"current_turn\": {\n                  \"team\": \"RED\",\n                  \"phase\": \"GUESSING\"\n                }\n              }\n            }\n          ```\n\n          Retrying identical `req_0020` returns the original ack without a second event or new turn.\n\n          The normalized Space example returns:\n\n          ```json\n            {\n              \"type\": \"ack\",\n              \"request_id\": \"req_0021\",\n              \"ok\": true,\n              \"payload\": {\n                \"game_id\": 5001,\n                \"current_turn\": {\n                  \"team\": \"RED\",\n                  \"phase\": \"GUESSING\",\n                  \"clue\": {\n                    \"word\": \"space\",\n                    \"number\": 3\n                  },\n                  \"guesses_remaining\": 4\n                }\n              }\n            }\n          ```\n\n          It emits `game.clue.submitted` once with `clue.word=\"space\"`, `clue.number=3`, and `guesses_remaining=4`.\n\n          ## Response/event fields\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `payload.game_id` | integer | yes | no | positive | Match |\n          | `payload.submitted_by_user_id` | integer | event only | no | active Spymaster ID | Actor |\n          | `payload.team` | enum | event only | no | `RED`, `BLUE` | Active team |\n          | `payload.clue.word` | string | yes | no | normalized rule | Public clue |\n          | `payload.clue.number` | integer | yes | no | `1..9` | `N` |\n          | `payload.guesses_remaining` | integer | yes | no | `2..10` | Exactly `N+1` at acceptance |\n          | `payload.current_turn.phase` | enum | yes | no | `GUESSING` | New phase |\n\n          ## Errors and state guarantees\n\n          - `ROLE_FORBIDDEN`: an Operative submits; message `Only the active team's Spymaster may submit a clue.`\n          - `NOT_YOUR_TURN`: inactive-team Spymaster submits.\n          - `INVALID_ROOM_STATE`: room is not `IN_GAME`.\n          - `INVALID_CLUE`: word missing, empty, over 30 characters, or contains whitespace.\n          - `INVALID_CLUE_NUMBER`: number is non-integer or outside `1..9`.\n          - `GAME_ALREADY_FINISHED`: phase is `GAME_OVER`.\n\n          Errors keep `WAITING_FOR_CLUE`, create no clue, and keep the socket open.\n\n          ```json\n            {\n              \"type\": \"error\",\n              \"request_id\": \"req_0022\",\n              \"error\": {\n                \"code\": \"ROLE_FORBIDDEN\",\n                \"message\": \"Only the active team's Spymaster may submit a clue.\",\n                \"details\": {\n                  \"required_role\": \"SPYMASTER\"\n                }\n              }\n            }\n          ```\n\n          ```json\n            {\n              \"type\": \"error\",\n              \"request_id\": \"req_0023\",\n              \"error\": {\n                \"code\": \"NOT_YOUR_TURN\",\n                \"message\": \"BLUE cannot submit a clue while RED is the active team.\",\n                \"details\": {\n                  \"active_team\": \"RED\"\n                }\n              }\n            }\n          ```\n\n          ```json\n            {\n              \"type\": \"error\",\n              \"request_id\": \"req_0024\",\n              \"error\": {\n                \"code\": \"INVALID_ROOM_STATE\",\n                \"message\": \"A clue can be submitted only during WAITING_FOR_CLUE.\",\n                \"details\": {\n                  \"phase\": \"GUESSING\"\n                }\n              }\n            }\n          ```\n\n          ```json\n            {\n              \"type\": \"error\",\n              \"request_id\": \"req_0025\",\n              \"error\": {\n                \"code\": \"INVALID_CLUE_NUMBER\",\n                \"message\": \"payload.number must be an integer from 1 through 9.\",\n                \"details\": {\n                  \"field\": \"payload.number\",\n                  \"min\": 1,\n                  \"max\": 9\n                }\n              }\n            }\n          ```\n\n          ```json\n            {\n              \"type\": \"error\",\n              \"request_id\": \"req_0026\",\n              \"error\": {\n                \"code\": \"INVALID_CLUE\",\n                \"message\": \"payload.word must contain exactly one non-whitespace word.\",\n                \"details\": {\n                  \"field\": \"payload.word\"\n                }\n              }\n            }\n          ```\n      - info:\n          name: Guess card\n          type: websocket\n          seq: 2\n          tags:\n            - action\n            - game\n        websocket:\n          url: '{{wsUrl}}/ws/rooms/{{roomId}}'\n          message:\n            - title: Own team - Continue\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"game.card.guess\",\n                    \"request_id\": \"req_0030\",\n                    \"payload\": {\n                      \"card_id\": 5\n                    }\n                  }\n            - title: Own team - Last guess\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"game.card.guess\",\n                    \"request_id\": \"req_0031\",\n                    \"payload\": {\n                      \"card_id\": 7\n                    }\n                  }\n            - title: Own team - Wins match\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"game.card.guess\",\n                    \"request_id\": \"req_0032\",\n                    \"payload\": {\n                      \"card_id\": 17\n                    }\n                  }\n            - title: Opponent team - Turn ends\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"game.card.guess\",\n                    \"request_id\": \"req_0033\",\n                    \"payload\": {\n                      \"card_id\": 6\n                    }\n                  }\n            - title: Opponent team - Opponent wins\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"game.card.guess\",\n                    \"request_id\": \"req_0034\",\n                    \"payload\": {\n                      \"card_id\": 16\n                    }\n                  }\n            - title: Neutral - Turn ends\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"game.card.guess\",\n                    \"request_id\": \"req_0035\",\n                    \"payload\": {\n                      \"card_id\": 18\n                    }\n                  }\n            - title: Assassin - Instant loss\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"game.card.guess\",\n                    \"request_id\": \"req_0036\",\n                    \"payload\": {\n                      \"card_id\": 25\n                    }\n                  }\n            - title: Already revealed card - Error\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"game.card.guess\",\n                    \"request_id\": \"req_0037\",\n                    \"payload\": {\n                      \"card_id\": 1\n                    }\n                  }\n            - title: Wrong team - Error\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"game.card.guess\",\n                    \"request_id\": \"req_0038\",\n                    \"payload\": {\n                      \"card_id\": 5\n                    }\n                  }\n        docs: |-\n          # Guess card\n\n          ## Purpose and preconditions\n\n          Reveals one unrevealed card for the active team during `GUESSING`. Any active-team `OPERATIVE` may submit; Spymasters and inactive-team members may not. The client submits only `card_id`, never a color or predicted result.\n\n          ## Message and payload parameters\n\n          | Parameter | Location | Required | Type | Allowed values/range | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `room_id` | WebSocket path | yes | integer | positive | no | Connected room | `1001` |\n          | `ft_session` cookie | handshake | yes | string | HttpOnly, Secure, active session | no | Sole handshake credential; automatic on same-origin upgrade | set by Register/Login |\n          | `type` | envelope | yes | string enum | `game.card.guess` | no | Operation | `game.card.guess` |\n          | `request_id` | envelope | yes | string | `1..64` visible ASCII, unique | no | Idempotency key | `req_0030` |\n          | `payload.card_id` | payload | yes | integer | `1..25`, existing in game | no | Unrevealed card | `5` |\n\n          ## Common success fields and ordering\n\n          The ack includes `game_id`, card result, score, current turn, winner, and end reason. The server reveals atomically, checks both teams' completion and assassin, then emits in order: `game.card.revealed`; `game.score.updated` when a team-card score changed; either `game.turn.changed`, no turn event when continuing, or `game.ended` when terminal. Terminal outcomes never emit a later turn change.\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `payload.card.card_id` | integer | yes | no | `1..25` | Revealed card |\n          | `payload.card.word` | string | yes | no | board word | Visible word |\n          | `payload.card.revealed` | boolean | yes | no | `true` | Post-action state |\n          | `payload.card.color` | enum | yes | no | `RED`, `BLUE`, `NEUTRAL`, `ASSASSIN` | Revealed color, now public |\n          | `payload.guessed_by_user_id` | integer | event only | no | active Operative ID | Actor |\n          | `payload.guessing_team` | enum | yes | no | `RED`, `BLUE` | Team taking action |\n          | `payload.score.red` | integer | yes | no | `0..9` | Revealed RED count (starting team owns 9; either color can start) |\n          | `payload.score.blue` | integer | yes | no | `0..9` | Revealed BLUE count (starting team owns 9; either color can start) |\n          | `payload.current_turn.team` | enum | yes | no | `RED`, `BLUE` | Active or terminal guessing team |\n          | `payload.current_turn.phase` | enum | yes | no | `WAITING_FOR_CLUE`, `GUESSING`, `GAME_OVER` | Result phase |\n          | `payload.current_turn.guesses_remaining` | integer or null | yes | yes | `0..10`, `null` | Remaining in `GUESSING`; null otherwise |\n          | `payload.winner` | enum or null | yes | yes | `RED`, `BLUE`, `null` | Terminal winner |\n          | `payload.end_reason` | enum or null | yes | yes | `ALL_TEAM_CARDS_REVEALED`, `ASSASSIN_REVEALED`, `null` | Terminal cause |\n\n          ## Outcome examples\n\n          These are independent branches from the canonical fixed map: RED cards are `1,3,5,7,9,11,13,15,17`; BLUE cards are `2,4,6,8,10,12,14,16`; neutral cards are `18..24`; assassin is `25`.\n\n          ### Own card \u2014 continue\n\n          Baseline is RED guessing with 3 guesses and score `2-2`. Card `5` is RED:\n\n          ```json\n            {\n              \"type\": \"ack\",\n              \"request_id\": \"req_0030\",\n              \"ok\": true,\n              \"payload\": {\n                \"game_id\": 5001,\n                \"card\": {\n                  \"card_id\": 5,\n                  \"word\": \"OCEAN\",\n                  \"revealed\": true,\n                  \"color\": \"RED\"\n                },\n                \"guessing_team\": \"RED\",\n                \"score\": {\n                  \"red\": 3,\n                  \"blue\": 2\n                },\n                \"current_turn\": {\n                  \"team\": \"RED\",\n                  \"phase\": \"GUESSING\",\n                  \"clue\": {\n                    \"word\": \"ocean\",\n                    \"number\": 2\n                  },\n                  \"guesses_remaining\": 2\n                },\n                \"winner\": null,\n                \"end_reason\": null\n              }\n            }\n          ```\n\n          `game.card.revealed` is followed by `game.score.updated`; no turn event occurs.\n\n          ### Own card \u2014 last allowed guess\n\n          Baseline has one guess remaining. Card `7` is RED; score increases and the guess count reaches zero, so BLUE becomes active:\n\n          ```json\n            {\n              \"type\": \"ack\",\n              \"request_id\": \"req_0031\",\n              \"ok\": true,\n              \"payload\": {\n                \"game_id\": 5001,\n                \"card\": {\n                  \"card_id\": 7,\n                  \"word\": \"LASER\",\n                  \"revealed\": true,\n                  \"color\": \"RED\"\n                },\n                \"guessing_team\": \"RED\",\n                \"score\": {\n                  \"red\": 4,\n                  \"blue\": 2\n                },\n                \"current_turn\": {\n                  \"team\": \"BLUE\",\n                  \"phase\": \"WAITING_FOR_CLUE\",\n                  \"clue\": null,\n                  \"guesses_remaining\": null\n                },\n                \"winner\": null,\n                \"end_reason\": null\n              }\n            }\n          ```\n\n          ### Own final card \u2014 RED wins\n\n          With eight RED cards already revealed, card `17` completes RED:\n\n          ```json\n            {\n              \"type\": \"game.ended\",\n              \"event_id\": \"evt_0180\",\n              \"room_id\": 1001,\n              \"sent_at\": \"2026-09-10T08:50:00Z\",\n              \"payload\": {\n                \"game_id\": 5001,\n                \"winner\": \"RED\",\n                \"loser\": \"BLUE\",\n                \"end_reason\": \"ALL_TEAM_CARDS_REVEALED\",\n                \"revealed_card\": {\n                  \"card_id\": 17,\n                  \"word\": \"ROME\",\n                  \"revealed\": true,\n                  \"color\": \"RED\"\n                },\n                \"score\": {\n                  \"red\": 9,\n                  \"blue\": 5\n                },\n                \"room_status\": \"FINISHED\",\n                \"phase\": \"GAME_OVER\",\n                \"finished_at\": \"2026-09-10T08:50:00Z\"\n              }\n            }\n          ```\n\n          ### Opponent card \u2014 turn ends\n\n          RED reveals BLUE card `6`; BLUE score increases and BLUE becomes active:\n\n          ```json\n            {\n              \"type\": \"ack\",\n              \"request_id\": \"req_0033\",\n              \"ok\": true,\n              \"payload\": {\n                \"game_id\": 5001,\n                \"card\": {\n                  \"card_id\": 6,\n                  \"word\": \"KING\",\n                  \"revealed\": true,\n                  \"color\": \"BLUE\"\n                },\n                \"guessing_team\": \"RED\",\n                \"score\": {\n                  \"red\": 2,\n                  \"blue\": 3\n                },\n                \"current_turn\": {\n                  \"team\": \"BLUE\",\n                  \"phase\": \"WAITING_FOR_CLUE\",\n                  \"clue\": null,\n                  \"guesses_remaining\": null\n                },\n                \"winner\": null,\n                \"end_reason\": null\n              }\n            }\n          ```\n\n          ### Opponent final card \u2014 BLUE wins\n\n          With seven BLUE cards already revealed, RED reveals BLUE card `16`:\n\n          ```json\n            {\n              \"type\": \"game.ended\",\n              \"event_id\": \"evt_0181\",\n              \"room_id\": 1001,\n              \"sent_at\": \"2026-09-10T08:51:00Z\",\n              \"payload\": {\n                \"game_id\": 5001,\n                \"winner\": \"BLUE\",\n                \"loser\": \"RED\",\n                \"end_reason\": \"ALL_TEAM_CARDS_REVEALED\",\n                \"revealed_card\": {\n                  \"card_id\": 16,\n                  \"word\": \"HEART\",\n                  \"revealed\": true,\n                  \"color\": \"BLUE\"\n                },\n                \"score\": {\n                  \"red\": 6,\n                  \"blue\": 8\n                },\n                \"room_status\": \"FINISHED\",\n                \"phase\": \"GAME_OVER\",\n                \"finished_at\": \"2026-09-10T08:51:00Z\"\n              }\n            }\n          ```\n\n          ### Neutral \u2014 turn ends\n\n          ```json\n            {\n              \"type\": \"ack\",\n              \"request_id\": \"req_0035\",\n              \"ok\": true,\n              \"payload\": {\n                \"game_id\": 5001,\n                \"card\": {\n                  \"card_id\": 18,\n                  \"word\": \"WHALE\",\n                  \"revealed\": true,\n                  \"color\": \"NEUTRAL\"\n                },\n                \"guessing_team\": \"RED\",\n                \"score\": {\n                  \"red\": 2,\n                  \"blue\": 2\n                },\n                \"current_turn\": {\n                  \"team\": \"BLUE\",\n                  \"phase\": \"WAITING_FOR_CLUE\",\n                  \"clue\": null,\n                  \"guesses_remaining\": null\n                },\n                \"winner\": null,\n                \"end_reason\": null\n              }\n            }\n          ```\n\n          ### Assassin \u2014 instant loss\n\n          RED reveals card `25`, so BLUE wins regardless of score:\n\n          ```json\n            {\n              \"type\": \"game.ended\",\n              \"event_id\": \"evt_0182\",\n              \"room_id\": 1001,\n              \"sent_at\": \"2026-09-10T08:52:00Z\",\n              \"payload\": {\n                \"game_id\": 5001,\n                \"winner\": \"BLUE\",\n                \"loser\": \"RED\",\n                \"end_reason\": \"ASSASSIN_REVEALED\",\n                \"revealed_card\": {\n                  \"card_id\": 25,\n                  \"word\": \"CLOUD\",\n                  \"revealed\": true,\n                  \"color\": \"ASSASSIN\"\n                },\n                \"score\": {\n                  \"red\": 2,\n                  \"blue\": 2\n                },\n                \"room_status\": \"FINISHED\",\n                \"phase\": \"GAME_OVER\",\n                \"finished_at\": \"2026-09-10T08:52:00Z\"\n              }\n            }\n          ```\n\n          ## Errors and state guarantees\n\n          - `ROLE_FORBIDDEN`: Spymaster guesses.\n          - `NOT_YOUR_TURN`: inactive team member guesses.\n          - `INVALID_ROOM_STATE`: room is not `IN_GAME` or phase is not `GUESSING`.\n          - `INVALID_CARD`: ID is missing, non-integer, outside the board, or absent from this game.\n          - `CARD_ALREADY_REVEALED`: card is already public.\n          - `NO_GUESSES_REMAINING`: stale command arrives after count reached zero.\n          - `GAME_ALREADY_FINISHED`: terminal result already exists.\n\n          ```json\n            {\n              \"type\": \"error\",\n              \"request_id\": \"req_0037\",\n              \"error\": {\n                \"code\": \"CARD_ALREADY_REVEALED\",\n                \"message\": \"Card 1 has already been revealed.\",\n                \"details\": {\n                  \"card_id\": 1\n                }\n              }\n            }\n          ```\n\n          ```json\n            {\n              \"type\": \"error\",\n              \"request_id\": \"req_0038\",\n              \"error\": {\n                \"code\": \"NOT_YOUR_TURN\",\n                \"message\": \"BLUE cannot guess while RED is the active team.\",\n                \"details\": {\n                  \"active_team\": \"RED\"\n                }\n              }\n            }\n          ```\n\n          All errors preserve card, score, guesses, phase, and turn and emit no success event.\n      - info:\n          name: Pass turn\n          type: websocket\n          seq: 3\n          tags:\n            - action\n            - game\n        websocket:\n          url: '{{wsUrl}}/ws/rooms/{{roomId}}'\n          message:\n            - title: Success - RED Operative passes\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"game.turn.pass\",\n                    \"request_id\": \"req_0040\",\n                    \"payload\": {}\n                  }\n            - title: Error - Spymaster cannot pass\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"game.turn.pass\",\n                    \"request_id\": \"req_0041\",\n                    \"payload\": {}\n                  }\n            - title: Error - Waiting for clue\n              message:\n                type: json\n                data: |-\n                  {\n                    \"type\": \"game.turn.pass\",\n                    \"request_id\": \"req_0042\",\n                    \"payload\": {}\n                  }\n        docs: |-\n          # Pass turn\n\n          ## Purpose and preconditions\n\n          Lets an active-team Operative voluntarily stop guessing while at least one guess remains. Room must be `IN_GAME`, phase `GUESSING`, and game unfinished.\n\n          ## Message and payload parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `room_id` | WebSocket path | yes | integer | positive | no | Connected room | `1001` |\n          | `ft_session` cookie | handshake | yes | string | HttpOnly, Secure, active session | no | Sole handshake credential; automatic on same-origin upgrade | set by Register/Login |\n          | `type` | envelope | yes | string enum | `game.turn.pass` | no | Operation | `game.turn.pass` |\n          | `request_id` | envelope | yes | string | `1..64` visible ASCII, unique | no | Idempotency key | `req_0040` |\n          | `payload` | payload | yes | object | empty object | no | Pass has no additional inputs | `{}` |\n\n          ## Success behavior and response fields\n\n          The turn changes to the opponent in `WAITING_FOR_CLUE`; clue and guesses become null. Board and score do not change.\n\n          ```json\n            {\n              \"type\": \"ack\",\n              \"request_id\": \"req_0040\",\n              \"ok\": true,\n              \"payload\": {\n                \"game_id\": 5001,\n                \"passed_by_user_id\": 43,\n                \"previous_team\": \"RED\",\n                \"current_turn\": {\n                  \"team\": \"BLUE\",\n                  \"phase\": \"WAITING_FOR_CLUE\",\n                  \"clue\": null,\n                  \"guesses_remaining\": null\n                },\n                \"score\": {\n                  \"red\": 3,\n                  \"blue\": 2\n                }\n              }\n            }\n          ```\n\n          ```json\n            {\n              \"type\": \"game.turn.changed\",\n              \"event_id\": \"evt_0170\",\n              \"room_id\": 1001,\n              \"sent_at\": \"2026-09-10T08:47:00Z\",\n              \"payload\": {\n                \"game_id\": 5001,\n                \"previous_team\": \"RED\",\n                \"reason\": \"PASSED\",\n                \"current_turn\": {\n                  \"team\": \"BLUE\",\n                  \"phase\": \"WAITING_FOR_CLUE\",\n                  \"clue\": null,\n                  \"guesses_remaining\": null\n                },\n                \"score\": {\n                  \"red\": 3,\n                  \"blue\": 2\n                }\n              }\n            }\n          ```\n\n          `reason` is `PASSED | GUESSES_EXHAUSTED | OPPONENT_CARD_REVEALED | NEUTRAL_CARD_REVEALED` across turn-change events.\n\n          | Result field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `payload.game_id` | integer | yes | no | positive | Match |\n          | `payload.passed_by_user_id` | integer | ack only | no | active Operative ID | Actor |\n          | `payload.previous_team` | enum | yes | no | `RED`, `BLUE` | Team that ended guessing |\n          | `payload.reason` | enum | event only | no | `PASSED` | Cause for this command |\n          | `payload.current_turn.team` | enum | yes | no | opponent team | New active team |\n          | `payload.current_turn.phase` | enum | yes | no | `WAITING_FOR_CLUE` | New phase |\n          | `payload.current_turn.clue` | null | yes | yes | `null` | Cleared previous clue |\n          | `payload.current_turn.guesses_remaining` | null | yes | yes | `null` | No guesses before next clue |\n          | `payload.score.red` | integer | yes | no | `0..9` | Unchanged revealed RED count |\n          | `payload.score.blue` | integer | yes | no | `0..8` | Unchanged revealed BLUE count |\n\n          ## Errors and invariants\n\n          `ROLE_FORBIDDEN` for a Spymaster; `NOT_YOUR_TURN` for inactive team; `INVALID_ROOM_STATE` outside `IN_GAME` or `GUESSING`; `NO_GUESSES_REMAINING` for a stale pass; `GAME_ALREADY_FINISHED` after terminal result. Errors preserve turn and socket.\n\n          ```json\n            {\n              \"type\": \"error\",\n              \"request_id\": \"req_0041\",\n              \"error\": {\n                \"code\": \"ROLE_FORBIDDEN\",\n                \"message\": \"Only an active-team Operative may pass the guessing turn.\",\n                \"details\": {\n                  \"required_role\": \"OPERATIVE\"\n                }\n              }\n            }\n          ```\n\n          ```json\n            {\n              \"type\": \"error\",\n              \"request_id\": \"req_0042\",\n              \"error\": {\n                \"code\": \"INVALID_ROOM_STATE\",\n                \"message\": \"A turn can be passed only during GUESSING.\",\n                \"details\": {\n                  \"phase\": \"WAITING_FOR_CLUE\"\n                }\n              }\n            }\n          ```\n  - info:\n      name: 05 - Server Events\n      type: folder\n      seq: 5\n    docs:\n      content: |-\n        # Server events\n\n        Server events carry `type`, monotonic room-scoped `event_id`, integer `room_id`, UTC `sent_at`, and event-specific `payload`. Snapshot and board-bearing events are generated per recipient. Event examples here are server output references and are not client-sendable messages.\n      type: text/markdown\n    items:\n      - info:\n          name: Server event catalog\n          type: websocket\n          seq: 1\n          tags:\n            - server-event\n            - reference\n        websocket:\n          url: '{{wsUrl}}/ws/rooms/{{roomId}}'\n        docs: |-\n          # Server event catalog\n\n          ## Purpose\n\n          Passive observer and schema reference for canonical server event names. It sends no application message. Command acknowledgements/errors are requester-only; domain events go to connected room members using recipient-safe projection.\n\n          ## Connection parameters\n\n          | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |\n          | --- | --- | ---: | --- | --- | ---: | --- | --- |\n          | `room_id` | WebSocket path | yes | integer | positive | no | Observed room | `1001` |\n          | `ft_session` cookie | handshake | yes | string | HttpOnly, Secure, active session | no | Sole handshake credential; automatic on same-origin upgrade | set by Register/Login |\n\n          ## Common envelope fields\n\n          | Field | Type | Required | Nullable | Allowed values | Description |\n          | --- | --- | ---: | ---: | --- | --- |\n          | `type` | string enum | yes | no | event matrix below | Event discriminator |\n          | `event_id` | string | yes | no | unique, monotonically ordered in room | Resume/order marker |\n          | `room_id` | integer | yes | no | positive | Domain room ID |\n          | `sent_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Server emission time |\n          | `payload` | object | yes | no | type-specific | Event data |\n\n          ## Event payload matrix\n\n          | Type | Required payload fields | Trigger | Projection |\n          | --- | --- | --- | --- |\n          | `room.state` | `room` | connect, recovery, room mutation | per recipient when game exists |\n          | `room.player.joined` | `player`, `host_user_id`, `player_count`, `room_status` | REST join | common |\n          | `room.player.left` | same membership fields | REST leave | common |\n          | `room.player.updated` | `player`, `changed_fields`, `room_status`, `startable` | team, role, ready | common |\n          | `room.countdown.started` | `seconds_remaining=3` | full start predicate becomes true | common |\n          | `room.countdown.tick` | `seconds_remaining` | server timer | common |\n          | `room.countdown.cancelled` | `reason`, `changed_by_user_id` | predicate becomes false | common |\n          | `game.started` | `room` containing `game` | valid countdown reaches zero | role-safe board |\n          | `game.state` | `room` containing `game` | internal shape reused inside `room.state.payload.room.game` when `IN_GAME`/`FINISHED` \u2014 not a separate client-requested recovery event; `room.state` is the one canonical reconnect snapshot (`opencollection.yml
